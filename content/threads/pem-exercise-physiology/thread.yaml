en:
  title: Post-Exertional Malaise & Exercise Physiology
  subtitle: A living thread on PEM, repeat CPET, lactate recovery, pacing physiology, wearable monitoring, and exertion-response biomarkers in ME/CFS and Long COVID.
  evidence_label: early clinical and mechanistic validation
  plain_summary: Research increasingly shows that post-exertional malaise (PEM) is a measurable failure to recover properly after physical, mental, or sensory effort—not simple deconditioning or ordinary tiredness. Wearables, exercise tests, and blood-recovery studies point to real metabolic, circulatory, and autonomic disruptions after exertion, while reviews warn that standard graded exercise programs can trigger lasting crashes. No single lab test or exercise metric can diagnose PEM on its own yet, so pacing within personal energy limits remains the safest guiding approach.
  takeaway: 'Post-exertional malaise is increasingly described as a measurable recovery disorder rather than nonspecific fatigue. Wearable monitoring, repeated CPET, lactate kinetics, epigenetic profiling, plasma proteomics, and oxygen-delivery studies all point to delayed or abnormal physiologic recovery after load in at least a subset of ME/CFS and Long COVID cohorts. The strongest signal is not that exercise capacity is always low at baseline, but that recovery after exertion can be biologically distorted in ways standard resting tests miss.


    The practical direction is toward objective phenotyping of exertional limits, pacing thresholds, and molecular recovery patterns rather than universal exercise prescriptions. While some studies and scoping reviews report functional improvements from exercise interventions, they systematically exclude or fail to adequately screen for and monitor post-exertional malaise (PEM). Thus, these reviews do not justify graded exercise recommendations, which carry a high risk of triggering severe, long-term crashes. Position statements and clinical summaries (such as from the Deutsche Gesellschaft für ME/CFS) explicitly warn against activating rehabilitation protocols due to high deterioration risks. In contrast, major clinical trials like RECOVER-ENERGIZE stratify participants by PEM status, using structured pacing supported by wearable trackers to prevent exertional harm. Qualitative studies and multi-day observational data show that heart rate monitor (HRM) and wearable HRV monitoring provide
    valuable biofeedback that helps patients manage energy limits and identify exertion thresholds (such as the first ventilatory threshold, VT1), though tracking fatigue and setup barriers remain.


    This emphasis on safety is reinforced by physiological and molecular findings. Continuous wearable sensor data demonstrates that exertion exceeding individual ventilatory thresholds causes blunted sympathovagal recovery lasting over 24 hours, alongside long-term cardiopulmonary deficits—including reduced heart rate variability (HRV) and decreased daily steps—at a median of 21 months post-infection in high-symptom Long COVID cohorts. Mechanistically, research has proposed a model of "irisin resistance" driven by thrombospondin-1 (TSP-1) antagonism, explaining why physical exertion fails to trigger adaptive metabolic recovery. Furthermore, deep phenotyping initiatives like the BioSig-PEM study and ecological momentary assessment (EMA) protocols highlight distinct lactate clearance, global recovery profiles, and daily activity-fatigue dynamics after exertion, reinforcing that PEM is a distinct physiological dysfunction rather than simple deconditioning. However, physiological reviews caution
    against over-interpreting isolated blood lactate levels as a definitive diagnostic test: peak exercise lactate is heavily work-rate- and protocol-dependent, functioning as an exertional phenotyping parameter alongside ventilatory thresholds and recovery kinetics rather than a standalone biomarker.'
  why_it_matters: 'Exercise physiology is one of the few ways to observe PEM as it unfolds under controlled load. That makes it useful for separating delayed recovery biology from assumptions about inactivity or poor conditioning, and for mapping how symptoms relate to oxygen use, lactate handling, circulatory delivery, and autonomic response.


    The same data stream can serve different clinical questions: actigraphy for day-to-day burden, wearable sensors for crash prediction, CPET for recovery failure, lactate and oxygen-delivery measures for peripheral metabolism, and symptom diaries for delayed worsening after testing. None of these measures yet defines a universal threshold for safety or diagnosis, but together they are shifting the field toward objective characterization of exertion intolerance.'
  state_of_evidence:
  - status: established
    label: Established
    items:
    - PEM is a reproducible clinical phenomenon in ME/CFS and Long COVID, and exertion-sensitive protocols capture abnormal recovery patterns that are not visible at rest. Wearable monitoring shows that high symptom burden correlates with sustained, long-term cardiopulmonary deficits, including reduced heart rate variability (HRV) and lower physical activity levels. Exertion at or above individual first ventilatory thresholds (VT1) triggers blunted sympathovagal and HRV recovery lasting more than 24 hours.
  - status: plausible
    label: Plausible but early
    items:
    - Exertional intolerance and recovery failure may be driven by molecular pathways such as irisin signaling resistance (driven by TSP-1 antagonism) and epigenetic or proteomic shifts during recovery. Wearable-supported activity pacing, continuous HRV biofeedback, digital tracking tools, lactate clearance phenotypes, ecological momentary assessment (EMA) dynamics, and clinical instruments like the Vienna PEM Questionnaire (VPEM)—whose development and initial content validation was published peer-reviewed in *Quality of Life Research* in November 2026—help track thresholds and operationalize PEM. Recent conceptual and experimental work extends this picture across multiple recovery timescales, including cardiometabolic desynchronization, altered immediate post-exercise corticomotor responses, endothelial redox hypotheses, objective activity restriction measured without provocation, and a 2-day submaximal CPET study in Long COVID showing no whole-group acid-base difference but a metabolic acidosis subgroup rising from 17% after day 1 to 33% after day 2 (vs. 6% and 11% in controls); none yet defines a universal marker, safe exertion threshold, or treatment. A conference abstract reports initial psychometric support for the Vienna PEM questionnaire in 1,108 adults. Mixed factor structure, incomplete scoring of crash severity/recovery
      and unreported longitudinal responsiveness prevent treating it as an established trial endpoint.
  - status: not_established
    label: Not established
    items:
    - A single universal biomarker, CPET metric, isolated exercise lactate threshold, or wearable signature that diagnostic trials can rely on; a validated exercise prescription that is safe or effective for individuals experiencing post-exertional malaise.
  - status: limitations
    label: Key limitations
    items:
    - Many exercise studies and reviews fail to screen for or monitor PEM, rely on subjective fatigue scales susceptible to expectation bias, rebrand Graded Exercise Therapy (GET) under alternative names, and omit reporting on dropouts or adverse events. Consequently, these reviews do not justify progressive or graded exercise recommendations for patients with PEM. Qualitative pacing evaluations and observational wearable studies suffer from selection bias and confounding by indication, as patients naturally adjust activity based on daily symptoms, while digital tools require individual threshold calibration and face setup or cognitive tracking burdens. The new Long COVID studies largely excluded bedbound patients, and immediate laboratory responses or passive activity measures cannot substitute for delayed PEM measurement in criteria-defined ME/CFS. Exercise lactate metrics are strongly protocol- and work-rate-dependent, precluding uniform diagnostic cut-offs across centers, while both maximal and repeated submaximal
      CPET protocols carry substantial PEM exacerbation risks and access barriers for severe or bedbound individuals.
  open_questions:
  - How can exercise lactate testing and recovery kinetics be standardized across different work rates and CPET protocols to establish reliable metabolic phenotyping thresholds without provoking severe PEM?
  - What submaximal or wearable exercise protocols can safely evaluate exertional limits and recovery kinetics in severe and bedbound patients for whom maximal CPET is inaccessible and unsafe?
  - How do peripheral oxygen extraction deficits, microvascular perfusion abnormalities, and intrinsic mitochondrial respiration impairments interact to drive early lactate accumulation during submaximal exertion?
de:
  title: Post-Exertional Malaise & Belastungsphysiologie
  subtitle: Ein fortlaufender Themenstrang zu PEM, wiederholter Spiroergometrie (CPET), Laktat-Erholung, Pacing-Physiologie, Wearable-Monitoring und Biomarkern der Belastungsreaktion bei ME/CFS und Long COVID.
  evidence_label: frühe klinische und mechanistische Validierung
  plain_summary: Die Forschung beschreibt Post-Exertional Malaise (PEM) zunehmend als messbare Erholungsstörung nach körperlicher, geistiger oder sensorischer Belastung – und nicht als einfache Dekonditionierung oder normale Müdigkeit. Wearables, Belastungstests und Blutanalysen zeigen reale Störungen von Stoffwechsel, Durchblutung und autonomem Nervensystem nach Anstrengung, während Übersichten davor warnen, dass klassisches Aufbautraining schwere Einbrüche auslösen kann. Ein einzelner Labortest oder Belastungswert reicht für eine PEM-Diagnose bisher nicht aus; im Alltag bleibt daher Pacing innerhalb der persönlichen Belastungsgrenzen der sicherste Rahmen.
  takeaway: 'Post-Exertional Malaise wird zunehmend als messbare Erholungsstörung beschrieben und nicht als unspezifische Müdigkeit. Wearable-Monitoring, wiederholte CPET-Tests, Laktatkinetik, epigenetische Profile, Plasmaproteomik und Studien zur Sauerstoffversorgung weisen allesamt auf eine verzögerte oder gestörte physiologische Erholung nach Belastung bei zumindest einem Teil der ME/CFS- und Long-COVID-Kohorten hin. Das stärkste Signal ist nicht, dass die Belastungsfähigkeit im Ausgangszustand immer niedrig wäre, sondern dass die Erholung nach Anstrengung biologisch auf eine Weise entgleisen kann, die Standardtests in Ruhe übersehen.


    Die praktische Richtung geht hin zu einer objektiven Charakterisierung von Belastungsgrenzen, Pacing-Schwellen und molekularen Erholungsmustern statt pauschaler Trainingsempfehlungen. Zwar berichten einige Studien und Scoping-Reviews über funktionelle Verbesserungen durch Bewegungsprogramme, doch schließen sie PEM systematisch aus oder erfassen und überwachen es nicht ausreichend. Diese Übersichten rechtfertigen daher keine Empfehlungen für gestufte Aktivierungstherapien (GET), die ein hohes Risiko schwerer, langfristiger Einbrüche bergen. Stellungnahmen und Evidenzzusammenfassungen (etwa der Deutschen Gesellschaft für ME/CFS) warnen ausdrücklich vor aktivierenden Rehabilitationsprotokollen wegen hoher Verschlechterungsrisiken. Große klinische Studien wie RECOVER-ENERGIZE schichten Teilnehmende dagegen gezielt nach ihrem PEM-Status und nutzen strukturiertes Pacing mit Wearable-Trackern, um Überlastungsschäden zu vermeiden. Qualitative Studien und mehrtägige Beobachtungsdaten zeigen,
    dass Herzfrequenzmonitore (HRM) und tragbares HRV-Monitoring wertvolles Biofeedback liefern, das Betroffenen hilft, Energiegrenzen einzuhalten und Belastungsschwellen (wie die erste ventilatorische Schwelle, VT1) zu erkennen – auch wenn Erfassungsaufwand und Einrichtungsprobleme Hürden bleiben.


    Dieser Fokus auf Sicherheit wird durch physiologische und molekulare Befunde gestützt. Kontinuierliche Wearable-Sensordaten zeigen, dass Belastung oberhalb der individuellen ventilatorischen Schwelle eine abgeflachte sympathovagale Erholung von über 24 Stunden auslöst; zudem bestehen bei hochsymptomatischen Long-COVID-Kohorten im Median 21 Monate nach Infektion anhaltende kardiopulmonale Defizite wie verringerte Herzfrequenzvariabilität (HRV) und niedrigere tägliche Schrittzahlen. Mechanistisch wurde ein Modell der „Irisin-Resistenz“ durch Thrombospondin-1-(TSP-1)-Antagonismus vorgeschlagen, das erklärt, warum körperliche Belastung keine normale Stoffwechselanpassung auslöst. Darüber hinaus zeigen Tiefenphänotypisierungs-Initiativen wie die BioSig-PEM-Studie und Ecological-Momentary-Assessment-(EMA)-Protokolle unterschiedliche Muster bei Laktatabbau, Gesamterholung und Alltagsdynamik von Aktivität und Fatigue – was untermauert, dass PEM eine eigenständige physiologische Funktionsstörung
    ist und keine bloße Dekonditionierung. Physiologische Übersichten mahnen jedoch zur Vorsicht, isolierte Blutlaktatwerte als definitiven Diagnosetest überzuinterpretieren: Das Belastungslaktat hängt stark von Leistung und Testprotokoll ab und dient eher als Parameter der Belastungsphänotypisierung neben ventilatorischen Schwellen und Erholungskinetik denn als eigenständiger Biomarker.'
  why_it_matters: 'Die Belastungsphysiologie ist eine der wenigen Möglichkeiten, PEM unter kontrollierter Last im Verlauf zu beobachten. Damit lässt sich verzögerte Erholungsbiologie von Annahmen über Inaktivität oder Trainingsmangel abgrenzen und nachvollziehen, wie Symptome mit Sauerstoffverwertung, Laktatverarbeitung, Durchblutung und autonomer Regulation zusammenhängen.


    Dieselben Datenströme können unterschiedliche klinische Fragen beantworten: Aktigraphie für die Alltagsbelastung, Wearable-Sensoren zur Crash-Vorhersage, CPET für Erholungsversagen, Laktat- und Sauerstoffabgabe-Messungen für den peripheren Stoffwechsel sowie Symptomtagebücher für verzögerte Verschlechterungen nach dem Test. Noch definiert keines dieser Verfahren einen universellen Grenzwert für Sicherheit oder Diagnose, doch zusammen verschieben sie das Feld hin zu einer objektiven Beschreibung von Belastungsintoleranz.'
  state_of_evidence:
  - status: established
    label: Etabliert
    items:
    - PEM ist bei ME/CFS und Long COVID ein reproduzierbares klinisches Phänomen, und belastungssensitive Protokolle erfassen abnorme Erholungsmuster, die in Ruhe nicht sichtbar sind. Wearable-Monitoring zeigt, dass eine hohe Symptomlast mit anhaltenden kardiopulmonalen Einschränkungen einhergeht, darunter verringerte Herzfrequenzvariabilität (HRV) und niedrigere körperliche Aktivität. Belastungen an oder oberhalb der individuellen ersten ventilatorischen Schwelle (VT1) lösen eine über mehr als 24 Stunden anhaltende Dämpfung der sympathovagalen Erholung und der HRV aus.
  - status: plausible
    label: Plausibel, aber noch früh
    items:
    - Belastungsintoleranz und Erholungsversagen könnten durch molekulare Signalwege wie eine Irisin-Signalresistenz (vermittelt durch TSP-1-Antagonismus) sowie epigenetische oder proteomische Verschiebungen während der Erholungsphase angetrieben werden. Wearable-gestütztes Aktivitäts-Pacing, kontinuierliches HRV-Biofeedback, digitale Tracking-Werkzeuge, Phänotypen des Laktatabbaus, EMA-Alltagsdynamiken und klinische Fragebögen wie der Wiener PEM-Fragebogen (VPEM) – dessen Entwicklungs- und Inhaltsvalidierungsstudie im November 2026 nach Peer-Review in *Quality of Life Research* erschien – helfen, Schwellenwerte zu erfassen und PEM zu operationalisieren. Neuere konzeptionelle und experimentelle Arbeiten erweitern dieses Bild über mehrere Zeitskalen hinweg, darunter kardiometabolische Desynchronisation, veränderte unmittelbare kortikomotorische Reaktionen nach Belastung, endotheliale Redox-Hypothesen, objektiv gemessene Aktivitätseinschränkung ohne Provokation sowie eine zweitägige submaximale CPET-Studie bei Long COVID ohne Gesamtgruppenunterschied im Säure-Basen-Haushalt, aber mit einer metabolischen Azidose-Untergruppe von 17 % nach Tag 1 auf 33 % nach Tag 2 (gegenüber 6 % und 11 % bei Kontrollen); nichts davon definiert bislang einen universellen Marker, eine sichere Belastungsschwelle oder eine Therapie. Ein Konferenz-Abstract berichtet über erste psychometrische Unterstützung
      für den Wiener PEM-Fragebogen bei 1.108 Erwachsenen; eine gemischte Faktorenstruktur, eine unvollständige Abbildung von Crash-Schweregrad und Erholungsdauer sowie fehlende Daten zur Änderungssensitivität verhindern jedoch, ihn bereits als etablierten Studienendpunkt einzusetzen.
  - status: not_established
    label: Nicht belegt
    items:
    - Ein einzelner universeller Biomarker, CPET-Messwert, isolierter Belastungslaktat-Grenzwert oder eine Wearable-Signatur, auf die sich diagnostische Studien verlassen könnten; eine validierte Trainingsempfehlung, die für Menschen mit Post-Exertional Malaise sicher oder wirksam ist.
  - status: limitations
    label: Wichtige Einschränkungen
    items:
    - Viele Bewegungsstudien und Übersichtsarbeiten prüfen und überwachen PEM nicht, stützen sich auf subjektive Fatigueskalen mit Erwartungsverzerrung, benennen Graded Exercise Therapy (GET) lediglich um und verschweigen Abbruchraten oder unerwünschte Ereignisse. Folglich rechtfertigen diese Übersichten keine progressiven oder gestuften Trainingsempfehlungen für Betroffene mit PEM. Qualitative Pacing-Auswertungen und beobachtende Wearable-Studien unterliegen Selektionsbias und Confounding by Indication, weil Patientinnen und Patienten ihre Aktivität natürlich an die Tagesform anpassen; digitale Hilfsmittel erfordern eine individuelle Schwellenkalibrierung und bringen Einrichtungs- oder kognitive Erfassungslasten mit sich. Die neueren Long-COVID-Studien schlossen bettlägerige Betroffene weitgehend aus, und sofortige Laborreaktionen oder passive Aktivitätsmessungen können eine verzögerte PEM-Erfassung bei kriterienbasiertem ME/CFS nicht ersetzen. Belastungslaktat-Werte hängen stark vom Protokoll
      und der erbrachten Leistung ab, was einheitliche diagnostische Grenzwerte über Zentren hinweg verhindert; zugleich bergen sowohl maximale als auch wiederholte submaximale CPET-Protokolle erhebliche PEM-Verschlechterungsrisiken sowie Zugangsbarrieren für schwer oder bettlägerig Erkrankte.
  open_questions:
  - Wie lassen sich Belastungslaktat-Tests und Erholungskinetik über verschiedene Leistungsstufen und CPET-Protokolle hinweg standardisieren, um verlässliche Schwellen für die metabolische Phänotypisierung ohne Auslösen von schwerem PEM festzulegen?
  - Welche submaximalen oder Wearable-basierten Belastungsprotokolle können Belastungsgrenzen und Erholungskinetik bei schwer und bettlägerig Erkrankten sicher erfassen, für die ein maximaler CPET unzugänglich und unsicher ist?
  - Wie wirken periphere Sauerstoffextraktions-Defizite, Störungen der mikrovaskulären Perfusion und intrinsische Beeinträchtigungen der mitochondrialen Atmung zusammen, um eine frühe Laktatakkumulation bei submaximaler Belastung auszulösen?
