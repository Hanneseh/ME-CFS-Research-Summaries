en:
  title: Landmark NIH deep-phenotyping study links post-infectious ME/CFS to chronic immune activation and neuro-immune dysfunction
  plain_summary: An intensive NIH inpatient study of 17 people with post-infectious ME/CFS found biological differences across immune cells, autonomic heart regulation, metabolism, and brain effort-processing circuits. While it strongly reinforces ME/CFS as a multi-system physical illness, its small size and exclusion of severely ill, non-ambulatory patients limit how widely it applies.
  detail: An intensive, multi-disciplinary inpatient study of post-infectious ME/CFS (n = 17) identified chronic immune activation (altered B-cell subsets), autonomic dysfunction (low heart rate variability), and metabolic alterations. The study linked these peripheral changes to central neurovascular coupling defects and a dysfunction in the right temporoparietal junction affecting effort preference. This deep phenotyping provides a unified biological framework showing that ME/CFS is a multi-system physical illness rooted in immune-mediated brain dysfunction rather than a psychological condition. However, due to the small sample size and strict exclusion criteria (excluding severe, non-ambulatory patients), these findings may not generalize across the broader, heterogeneous ME/CFS patient population.
de:
  title: Wegweisende NIH-Tiefenphänotypisierungs-Studie verknüpft postinfektiöses ME/CFS mit chronischer Immunaktivierung und neuro-immuner Fehlregulation
  plain_summary: Eine sehr gründliche stationäre NIH-Studie an 17 Menschen mit postinfektiösem ME/CFS fand körperliche Auffälligkeiten bei Immunzellen, vegetativer Herzsteuerung, Stoffwechsel und Belastungsverarbeitung im Gehirn. Das unterstreicht ME/CFS als körperliche Multisystemerkrankung, gilt wegen der kleinen Gruppe und des Ausschlusses schwerstbetroffener Menschen aber nicht automatisch für alle.
  detail: Eine intensive, multidisziplinäre stationäre Untersuchung von postinfektiösem ME/CFS (n = 17) fand Zeichen chronischer Immunaktivierung (veränderte B-Zell-Untergruppen), autonome Fehlregulation (niedrige Herzratenvariabilität) und Stoffwechselveränderungen. Die Studie verknüpfte diese peripheren Befunde mit zentralen Störungen der neurovaskulären Kopplung sowie einer veränderten Aktivität im rechten temporoparietalen Übergang, die die Anstrengungspräferenz beeinflusst. Diese Tiefenphänotypisierung liefert ein zusammenhängendes biologisches Bild dafür, dass ME/CFS eine körperliche Multisystemerkrankung mit immunvermittelter Hirnfunktionsstörung und keine psychische Störung ist. Aufgrund der kleinen Stichprobe und strenger Ausschlusskriterien (schwere, nicht gehfähige Betroffene waren ausgeschlossen) lassen sich die Ergebnisse jedoch nicht ohne Weiteres auf die gesamte, vielfältige ME/CFS-Population übertragen.
