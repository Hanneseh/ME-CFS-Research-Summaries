  kind: paper
en:
  title: Sonlicromanol Phase 2b program shows long-term improvement in mitochondrial symptoms
  plain_summary: In adults with an inherited mitochondrial disease, the experimental drug sonlicromanol missed its main 28-day trial goal, though symptoms improved in a year-long unblinded extension. Because it missed its controlled primary endpoint and has not been tested in ME/CFS or Long COVID, its value for post-viral illness remains unproven.
  detail: A Phase 2b trial program evaluating the mitochondrial-targeted drug sonlicromanol in adults with genetically confirmed m.3243A>G mitochondrial disease demonstrated significant long-term improvements in fatigue, pain, physical quality of life, and balance during a 52-week open-label extension. Although the initial 28-day randomized, placebo-controlled portion of the study failed to meet its primary cognitive endpoint, post-hoc analyses and the subsequent year-long extension showed clinical benefits, particularly in patients who were more severely affected at baseline. This trial provides supportive evidence that modulating cellular oxidative stress and inflammatory distress pathways can alleviate systemic symptoms associated with mitochondrial dysfunction, which is hypothesized to play a major role in ME/CFS. However, because the primary endpoint of the randomized portion was not met, the short-term efficacy of sonlicromanol remains unproven. Furthermore, the 52-week extension lacked
    a control group, and the drug has not yet been directly tested in patients diagnosed with ME/CFS or Long COVID.
de:
  title: Phase-2b-Programm zu Sonlicromanol zeigt langfristige Verbesserungen bei mitochondrialen Symptomen
  plain_summary: Bei Erwachsenen mit einer angeborenen Mitochondrienerkrankung verfehlte der Wirkstoff Sonlicromanol das Hauptziel der 28-tägigen Kontrollstudie, zeigte aber in einer einjährigen offenen Verlängerung Symptomverbesserungen. Da der kontrollierte Primärendpunkt verfehlt wurde und noch keine Studien bei ME/CFS oder Long COVID vorliegen, bleibt ein Nutzen bei postviralen Erkrankungen unbewiesen.
  detail: Ein Phase-2b-Studienprogramm zur Prüfung des auf Mitochondrien abzielenden Wirkstoffs Sonlicromanol bei Erwachsenen mit genetisch bestätigter m.3243A>G-Mitochondrienerkrankung zeigte während einer 52-wöchigen offenen Verlängerungsphase signifikante langfristige Verbesserungen bei Fatigue, Schmerzen, körperlicher Lebensqualität und Gleichgewicht. Zwar verfehlte der ursprüngliche 28-tägige randomisierte, placebokontrollierte Studienabschnitt seinen primären kognitiven Endpunkt, doch zeigten Post-hoc-Analysen und die anschließende einjährige Verlängerung klinische Besserungen, insbesondere bei zu Beginn stärker betroffenen Personen. Die Studie liefert unterstützende Hinweise darauf, dass eine Modulation von zellulärem oxidativem Stress und Entzündungssignalen systemische Symptome mitochondrialer Dysfunktion lindern kann, wie sie auch bei ME/CFS vermutet wird. Da der primäre Endpunkt im randomisierten Teil jedoch verfehlt wurde, bleibt die kurzfristige Wirksamkeit unbewiesen; zudem
    fehlte der 52-wöchigen Verlängerung eine Kontrollgruppe, und der Wirkstoff wurde noch nicht direkt bei ME/CFS oder Long COVID geprüft.
