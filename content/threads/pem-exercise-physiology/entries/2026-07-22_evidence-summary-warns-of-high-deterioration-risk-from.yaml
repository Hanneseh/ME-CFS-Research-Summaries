en:
  title: Evidence summary warns of high deterioration risk from exercise-based rehabilitation in ME/CFS
  plain_summary: The German ME/CFS society synthesized international guidelines and survey data warning that standard activating rehab programs trigger lasting worsening in up to 80% of ME/CFS patients with PEM. It is a clinical policy report rather than a new trial, urging rehab centers and insurers to screen for PEM and use pacing instead.
  detail: A clinical evidence synthesis published by the Deutsche Gesellschaft für ME/CFS synthesized international guidelines and patient survey data to warn against standard exercise-based inpatient rehabilitation protocols in ME/CFS. The report highlights that activating rehabilitation regimens—such as graded exercise therapy (GET)—trigger severe, long-term functional deterioration in up to 80% of affected individuals due to post-exertional malaise and exertion-induced neuro-immune breakdown. The synthesis urges disability insurers, medical evaluators, and rehabilitation centers to abandon mandatory activation protocols and replace them with PEM screening and pacing-based care frameworks. As an organizational evidence summary and advocacy report rather than a primary empirical trial, the document provides clinical policy guidance rather than new experimental data. Clinically, it underscores the essential safety requirement to screen for PEM before making rehabilitation referrals or prescribing
    activity programs.
de:
  title: Evidenzpapier warnt vor hohem Verschlechterungsrisiko durch bewegungsbasierte Rehabilitation bei ME/CFS
  plain_summary: Eine Evidenzzusammenfassung der Deutschen Gesellschaft für ME/CFS warnt anhand internationaler Leitlinien und Umfragedaten davor, dass aktivierende Reha-Programme bei bis zu 80 % der ME/CFS-Betroffenen anhaltende Verschlechterungen auslösen. Als klinisches Positionspapier fordert es Reha-Zentren und Kostenträger auf, vorab auf PEM zu prüfen und stattdessen Pacing einzusetzen.
  detail: Eine klinische Evidenzsynthese der Deutschen Gesellschaft für ME/CFS fasste internationale Leitlinien und Patientenumfragedaten zusammen, um vor standardmäßigen bewegungsbasierten stationären Rehabilitationsprotokollen bei ME/CFS zu warnen. Der Bericht hebt hervor, dass aktivierende Reha-Konzepte – wie Graded Exercise Therapy (GET) – aufgrund von Post-Exertional Malaise und belastungsinduzierter neuro-immunologischer Verschlechterung bei bis zu 80 % der Betroffenen schwere, langfristige Funktionseinbußen auslösen. Die Synthese fordert Renten- und Krankenversicherungen, Gutachter sowie Reha-Kliniken auf, verpflichtende Aktivierungsprogramme aufzugeben und durch PEM-Screening sowie pacingbasierte Konzepte zu ersetzen. Da es sich um eine Evidenzzusammenfassung einer Fachorganisation und nicht um eine neue Primärstudie handelt, liefert das Dokument klinische Handlungsorientierung und unterstreicht die zwingende Sicherheitsregel, vor jeder Reha-Zuweisung auf PEM zu screenen.
