en:
  title: Medical perspective paper rejects psychogenic misattribution and defines supportive care role
  plain_summary: A peer-reviewed medical perspective affirmed that ME/CFS and Long COVID are physical illnesses and argued that mental-health care should support coping rather than claim to cure them. It is an ethical and clinical viewpoint rather than new trial data.
  detail: A peer-reviewed perspective article published in PubMed evaluated the role of psychiatry and psychotherapy in ME/CFS and Long COVID, establishing that somatic biomedical pathology is primary and firmly rejecting historical psychogenic or psychosomatic misattributions. The authors argued that mental health support must be strictly evidence-based, patient-centered, and restricted to helping individuals cope with severe chronic illness burden, rather than claiming curative potential or assuming psychological perpetuation. Clinically, this paper provides an important conceptual benchmark for protecting patients from harmful exertional therapies and diagnostic stigma while supporting legitimate psychological care for chronic illness burden. As an ethical and clinical perspective paper, it presents theoretical analysis rather than empirical clinical trial data or biological cohort measurements.
de:
  title: Medizinisches Perspektivpapier weist psychogene Fehldeutungen zurück und definiert Rolle unterstützender Versorgung
  plain_summary: Ein begutachtetes Fachpapier bekräftigt, dass ME/CFS und Long COVID körperliche Erkrankungen sind, und ordnet psychologische Begleitung auf Krankheitsbewältigung statt Heilungsversprechen ein. Es bietet eine klinisch-ethische Einordnung, liefert aber keine neuen Studiendaten.
  detail: Ein in PubMed gelisteter begutachteter Perspektivartikel untersuchte die Rolle von Psychiatrie und Psychotherapie bei ME/CFS und Long COVID, hielt fest, dass somatische biomedizinische Pathologie im Vordergrund steht, und wies historische psychogene oder psychosomatische Fehldeutungen entschieden zurück. Die Autorinnen und Autoren argumentierten, dass psychosoziale Unterstützung strikt evidenzbasiert, patientenzentriert und darauf beschränkt sein müsse, Betroffene bei der Bewältigung einer schweren chronischen Erkrankung zu unterstützen – statt Heilung zu versprechen oder psychische Aufrechterhaltung zu unterstellen. Klinisch setzt das Papier einen wichtigen Schutzrahmen gegen schädliche Belastungstherapien und diagnostisches Stigma, während es legitime Unterstützung bei chronischer Krankheitslast stärkt; als theoretisch-ethische Analyse liefert es keine neuen klinischen Studiendaten oder Labormessungen.
