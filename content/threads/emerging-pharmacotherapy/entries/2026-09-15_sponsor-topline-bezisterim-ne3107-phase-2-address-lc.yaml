en:
  title: 'Sponsor topline: bezisterim (NE3107) phase 2 ADDRESS-LC finds no significant endpoint in the full Long COVID population'
  plain_summary: In a company press release, BioVie reported that its 203-person placebo-controlled trial of oral bezisterim in Long COVID failed to reach statistical significance on any endpoint across the full study population. Company-highlighted subgroup results lack full peer-reviewed statistics and excluded people with pre-COVID ME/CFS, so efficacy remains unproven.
  detail: In a sponsor-reported topline press release that has not been peer reviewed, BioVie reported that its randomized, double-blind, placebo-controlled phase 2 ADDRESS-LC trial of oral bezisterim 20 mg twice daily reached statistical significance on no individual endpoint in the full intent-to-treat population of 203 adults with Long COVID. According to the registry, treatment lasted 84 days. The exploratory design assessed 22 outcomes, covering cognition, fatigue, sleep, quality of life and post-exertional malaise (PEM), without a single primary endpoint; 21 numerically favoured bezisterim. The company reports significant results in prespecified high-fatigue, high-PEM and objective-cognitive-impairment subgroups. With no confidence intervals and no described multiplicity correction, these are hypothesis-generating only. Treatment-emergent adverse events occurred in 41.6% on bezisterim vs 55.9% on placebo. The registry excluded chronic fatigue syndrome, fibromyalgia or POTS predating
    the index COVID-19 infection. ME/CFS status, severity and bedbound inclusion were not reported, and the fatigue entry threshold was low. A phase 3 trial is planned, with no timeline given.
de:
  title: 'Sponsor-Topline: Phase-2-Studie ADDRESS-LC zu Bezisterim (NE3107) verfehlt signifikanten Endpunkt in der gesamten Long-COVID-Population'
  plain_summary: In einer Unternehmensmeldung berichtete BioVie, dass die placebokontrollierte Phase-2-Studie mit 203 Long-COVID-Betroffenen zu oralem Bezisterim in der Gesamtgruppe keinen einzigen Endpunkt statistisch signifikant erreichte. Vom Hersteller hervorgehobene Untergruppen-Signale sind nicht begutachtet, und Personen mit ME/CFS vor COVID-19 waren ausgeschlossen.
  detail: In einer noch nicht peer-reviewten Topline-Pressemitteilung des Sponsors berichtete BioVie, dass die randomisierte, doppelt verblindete, placebokontrollierte Phase-2-Studie ADDRESS-LC zu oralem Bezisterim (20 mg zweimal täglich) in der gesamten Intent-to-Treat-Population von 203 Erwachsenen mit Long COVID bei keinem einzelnen Endpunkt statistische Signifikanz erreichte. Laut Studienregister dauerte die Behandlung 84 Tage. Das explorative Design prüfte 22 Endpunkte zu Kognition, Fatigue, Schlaf, Lebensqualität und Post-Exertional Malaise (PEM) ohne einzelnen primären Endpunkt; 21 fielen numerisch zugunsten von Bezisterim aus. Das Unternehmen berichtet signifikante Ergebnisse in vorab definierten Untergruppen mit hoher Fatigue, starker PEM und objektiver kognitiver Beeinträchtigung; ohne Konfidenzintervalle und ohne beschriebene Multiplizitätskorrektur sind diese jedoch rein hypothesengenerierend. Therapiebedingte unerwünschte Ereignisse traten bei 41,6 % unter Bezisterim gegenüber
    55,9 % unter Placebo auf. Das Register schloss vor der Index-COVID-19-Infektion bestehendes CFS, Fibromyalgie oder POTS aus; ME/CFS-Status, Schweregrad und Beteiligung Bettlägeriger wurden nicht berichtet, und die Einstiegsschwelle für Fatigue war niedrig. Eine Phase-3-Studie ist ohne Zeitplan angekündigt.
