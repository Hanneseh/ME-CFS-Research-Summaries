en:
  title: New NIH/NINDS-funded 5-year low-dose naltrexone clinical trial announced for ME/CFS
  plain_summary: The US NIH funded a five-year clinical trial of LDN for ME/CFS designed to run remotely so housebound and bedbound patients can participate, starting with dose-finding before a 200-person placebo-controlled phase. Because the randomized phase will not begin until year three and the formal trial protocol is not yet registered, definitive answers are still years away.
  detail: 'Dr. Jarred Younger announced that the National Institute of Neurological Disorders and Stroke (NINDS) of the National Institutes of Health (NIH) has funded a new five-year clinical trial of low-dose naltrexone (LDN) for ME/CFS, with Younger serving as the Principal Investigator. Younger reports that the study features a remote design to enable nationwide recruitment across the United States, specifically seeking to include severely affected housebound and bedbound patients. According to the investigator''s announcement, the trial is structured in two stages: a two-year dose-finding phase with approximately 100 participants, followed by a three-year randomized, double-blind, placebo-controlled parallel-group phase involving about 200 participants. Additionally, a local subgroup of participants will undergo brain scanning to investigate whether LDN responders demonstrate a reduction in brain neuroinflammation through microglial modulation, directly linking the study''s scientific
    objectives to the [neuroinflammation-brain-changes](thread:neuroinflammation-brain-changes) thread. The trial is projected to begin in September 2026, with recruitment starting locally before expanding nationwide. However, key limitations of the study include its long five-year timeline—where the randomized controlled phase does not start until year three—and that the informal announcement is not yet a registered clinical trial protocol.'
de:
  title: Neue NIH/NINDS-geförderte 5-Jahres-Studie zu niedrigdosiertem Naltrexon bei ME/CFS angekündigt
  plain_summary: Das US-Forschungsinstitut NIH fördert eine fünfjährige klinische LDN-Studie bei ME/CFS mit dezentralem Design, damit auch hausgebundene und bettlägerige Betroffene teilnehmen können – zunächst zur Dosisfindung, danach mit 200 Personen placebokontrolliert. Da die randomisierte Phase erst im dritten Jahr startet und das Studienprotokoll noch nicht registriert ist, stehen belastbare Ergebnisse erst in einigen Jahren an.
  detail: 'Dr. Jarred Younger gab bekannt, dass das National Institute of Neurological Disorders and Stroke (NINDS) der US-amerikanischen National Institutes of Health (NIH) eine neue fünfjährige klinische Studie zu niedrigdosiertem Naltrexon (LDN) bei ME/CFS bewilligt hat, die er als leitender Prüfarzt verantwortet. Nach Youngers Angaben nutzt die Studie ein dezentrales Remote-Design für eine landesweite Rekrutierung in den USA, um gezielt auch schwer betroffene hausgebundene und bettlägerige Patientinnen und Patienten einzuschließen. Laut Ankündigung gliedert sich die Studie in zwei Phasen: eine zweijährige Dosisfindungsphase mit rund 100 Teilnehmenden sowie eine anschließende dreijährige randomisierte, doppelt verblindete, placebokontrollierte Parallelgruppen-Phase mit etwa 200 Teilnehmenden. Zudem soll eine lokale Untergruppe mittels Hirnscans untersucht werden, um zu prüfen, ob bei LDN-Ansprechenden eine Abnahme der Neuroinflammation über Mikroglia-Modulation sichtbar wird – was das
    Studienziel direkt mit dem Themenstrang [Neuroinflammation & Gehirnveränderungen](thread:neuroinflammation-brain-changes) verknüpft. Der Studienbeginn ist für September 2026 zunächst lokal und dann landesweit geplant. Wichtige Einschränkungen sind jedoch die lange fünfjährige Laufzeit – wobei die randomisierte kontrollierte Phase erst im dritten Jahr beginnt – sowie die Tatsache, dass zu dieser informellen Ankündigung noch kein registriertes Studienprotokoll vorliegt.'
