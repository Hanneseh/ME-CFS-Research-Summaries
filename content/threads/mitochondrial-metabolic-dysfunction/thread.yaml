en:
  title: Mitochondrial & Metabolic Dysfunction
  subtitle: A living thread on cellular bioenergetics, mitochondrial respiration, Complex V inefficiency, metabolomic and lipidomic profiles, and skeletal muscle energy failure in ME/CFS and Long COVID.
  evidence_label: early clinical and mechanistic validation
  plain_summary: Studies consistently find that cells in people with ME/CFS and Long COVID struggle to produce and replenish energy, especially after physical effort. Muscle biopsies also show real cellular and small-vessel changes that are fundamentally different from simple lack of fitness or bed rest. However, no single energy test can diagnose the illness yet, and treatments targeting cell energy are still experimental.
  takeaway: 'Mitochondrial and metabolic dysfunction remain one of the strongest biological frameworks for understanding exertional intolerance in ME/CFS and related post-COVID illness. The picture is becoming more coherent across tissues: newer studies connect metabolomic abnormalities, direct skeletal muscle biopsy histology, and in vivo evidence of impaired brain energy buffering rather than relying on a single blood marker or isolated pathway. Landmark comparative biopsy evidence demonstrates that structural mitochondrial defects, capillary alterations, and metabolic failure in ME/CFS and Long COVID are intrinsic cellular pathologies fundamentally distinct from physical deconditioning caused by prolonged bed rest.


    Recent additions significantly advance tissue-level understanding while highlighting specific regenerative and vascular mechanisms. Skeletal muscle biopsy analyses reveal profound depletion of Pax7+ satellite cells at baseline and post-exertion, pointing to impaired muscle regenerative signaling alongside post-exertional metabolic shifts. In parallel, cellular respiration work in non-hospitalized Long COVID cohorts confirms coupled mitochondrial energy failure and microvascular endothelial dysfunction, proving that severe bioenergetic impairment occurs even after mild initial viral infections. Additional narrative modeling explores radiation-like bystander signaling cascades, identifying CD38-mediated NAD+ depletion as a candidate pathway driving metabolic stress.


    Important uncertainty remains. Satellite cell depletion data currently originate from conference abstracts awaiting full peer-reviewed manuscript publication, and functional mitochondrial assays in non-hospitalized cohorts rely on circulating blood cells rather than routine tissue biopsies. In addition, conceptual models mapping low-dose radiation bystander effects to ME/CFS reflect theoretical synthesis rather than direct clinical trial evidence. Overall, these findings solidify mitochondrial myopathy as an organic cellular disease process while highlighting the need for targeted therapies addressing bioenergetic restoration and microvascular perfusion.'
  why_it_matters: Elucidating the molecular pathways of mitochondrial and metabolic failure provides a physical, measurable basis for the profound weakness and post-exertional malaise reported by patients. By shifting the clinical explanation from subjective fatigue to specific enzymatic defects (such as Complex V or respiratory supercomplex disruption), research identifies concrete biological targets for drug repurposing and therapeutic development. Furthermore, tracing these cellular energy blocks explains the failure of standard aerobic training protocols, which can exacerbate the intracellular ion imbalances and mitochondrial damage seen in skeletal muscle. Understanding the interactions between immune mediators (like sIL2R), vascular perfusion defects, and mitochondrial respiration guides the development of multi-system treatment strategies, such as combining vasoactive agents with mitochondrial cofactors and cellular stress inhibitors.
  state_of_evidence:
  - status: established
    label: Established
    items:
    - ME/CFS and Long COVID cohorts repeatedly show abnormalities in energy metabolism, including post-exertional recovery failure, altered lipid and amino-acid handling, and objective peripheral muscle dysfunction. Comparative muscle biopsy studies establish that structural mitochondrial defects, capillary-to-fiber ratio changes, and bioenergetic failure are intrinsic cellular disease processes fundamentally distinct from bed-rest deconditioning.
  - status: plausible
    label: Plausible but early
    items:
    - Newer 2026 studies suggest that muscle satellite cell (Pax7+) depletion impairs tissue regeneration post-exertion, non-hospitalized post-COVID cohorts exhibit coupled mitochondrial energy failure and microvascular endothelial dysfunction, male ME/CFS cohorts show arginine-NO pathway imbalance, dried blood spot metabolomics recovers pathway-level convergence at scale, and low-dose radiation bystander modeling links CD38-mediated NAD+ depletion to cellular bioenergetic stress. Preclinical cell models also demonstrate that specific SARS-CoV-2 accessory proteins (such as ORF7a) suppress oxidative phosphorylation via PDK4 activation and direct Complex I supercomplex disruption, complementing viral envelope-protein cardiolipin findings while remaining in vitro evidence. WASF3 experiments connect brain energy metabolism to learning in mice, not human treatment response. Small Long COVID biobank cohorts show lipid-mediator differences, without validated symptom-defined subgroups or evidence
      that changing those mediators helps patients.
  - status: not_established
    label: Not established
    items:
    - No single mitochondrial or metabolomic signature has been shown to define all patients, separate ME/CFS cleanly from overlapping post-viral syndromes, or prove one causal entry point. Drug-repurposing outputs derived from transcriptomic datasets remain hypothesis-generating, including LINCS2-ranked compounds from iPSC-derived myotubes, none of which were reported as tested experimentally; in vitro cell line findings from Long COVID cohorts have not been established as direct ME/CFS pathomechanisms, and recovery-failure models of PEM based on incomplete mitophagy remain untested hypotheses without human validation.
  - status: limitations
    label: Key limitations
    items:
    - Satellite cell biopsy findings are published in conference abstract format ahead of full peer-reviewed journal papers. Invasive muscle biopsy methods restrict routine bedside clinical utility. Circulating blood cell mitochondrial assays offer accessible markers but require ongoing tissue validation, and theoretical radiation bystander models lack direct clinical trial validation in human cohorts.
  open_questions:
  - What is the primary cellular initiator of the acquired tissue hypoperfusion that leads to skeletal muscle mitochondrial damage and calcium-sodium overload?
  - What molecular mechanisms drive Pax7+ muscle satellite cell depletion and impaired regenerative signaling following exertion in ME/CFS and Long COVID?
  - Can therapeutic targeting of CD38-mediated NAD+ depletion or ER stress restore mitochondrial respiratory capacity and muscle stem cell function?
  - How do microvascular endothelial dysfunction and intrinsic muscle mitochondrial defects interact to cause exertional oxidative phosphorylation failure in non-hospitalized post-viral patients?
  - If circulating blood factors are not universal drivers of myoblast mitochondrial respiration defects, what localized or tissue-resident immune signals trigger cellular energy stress in patients?
  - Does B-cell lipid accumulation and PTDSS1 enzyme hyperactivity directly contribute to B-cell dysfunction or autoimmune antibody production?
de:
  title: Mitochondriale & metabolische Dysfunktion
  subtitle: Ein fortlaufender Forschungsstrang zu Zellbioenergetik, mitochondrialer Atmung, Komplex-V-Ineffizienz, Metabolom- und Lipidom-Profilen sowie dem Energieversagen der Skelettmuskulatur bei ME/CFS und Long COVID.
  evidence_label: Frühe klinische und mechanistische Hinweise
  plain_summary: Studien zeigen wiederholt, dass Zellen bei ME/CFS und Long COVID Energie schlechter herstellen und nach Belastung langsamer nachliefern können. Muskelbiopsien belegen zudem echte Veränderungen in Zellen und kleinsten Blutgefäßen, die sich grundlegend von bloßer Dekonditionierung durch Bettruhe unterscheiden. Einen einzelnen Routinetest oder eine gesicherte Therapie für den Zellstoffwechsel gibt es bislang aber nicht.
  takeaway: 'Störungen der Mitochondrien und des Zellstoffwechsels gehören weiterhin zu den tragfähigsten biologischen Erklärungsmodellen für die Belastungsintoleranz bei ME/CFS und postviralen Erkrankungen wie Long COVID. Das Gesamtbild über verschiedene Gewebe hinweg wird zunehmend stimmiger: Neuere Arbeiten verbinden auffällige Stoffwechselprofile im Blut, direkte Befunde aus Muskelbiopsien und Messungen einer gestörten Energiepufferung im Gehirn, statt sich auf einen einzelnen Blutwert oder Signalweg zu stützen. Wegweisende vergleichende Biopsiestudien zeigen, dass strukturelle Defekte der Mitochondrien, Veränderungen der Kapillaren und das metabolische Versagen bei ME/CFS und Long COVID eigenständige zelluläre Krankheitsprozesse sind, die sich grundlegend von körperlicher Dekonditionierung durch lange Bettruhe unterscheiden.


    Neuere Ergänzungen vertiefen das Verständnis auf Gewebeebene und lenken den Blick auf konkrete Regenerations- und Gefäßmechanismen. Analysen von Muskelbiopsien zeigen sowohl im Ruhezustand als auch nach Belastung eine deutliche Verarmung an Pax7+-Satellitenzellen, was auf eine gestörte Regenerationsfähigkeit der Muskulatur neben post-exertionellen Stoffwechselverschiebungen hinweist. Parallel bestätigen Untersuchungen zur Zellatmung bei nicht-hospitalisierten Long-COVID-Kohorten ein gekoppeltes Versagen der mitochondrialen Energiegewinnung und der mikrovaskulären Endothelfunktion – ein Hinweis darauf, dass schwere bioenergetische Störungen auch nach mildem akutem Infekt auftreten. Ergänzende theoretische Modelle übertragen strahlenähnliche Bystander-Signalkaskaden auf ME/CFS und benennen einen CD38-vermittelten NAD+-Abbau als möglichen Treiber von zellulärem Energiestress.


    Wichtige Unsicherheiten bleiben bestehen. Die Daten zur Verarmung von Satellitenzellen stammen bislang aus Konferenz-Abstracts vor einer vollständigen Peer-Review-Publikation, und funktionelle Messungen der Zellatmung in nicht-hospitalisierten Kohorten beruhen oft auf Blutzellen statt auf Muskelbiopsien. Konzeptionelle Modelle zu Bystander-Effekten liefern zudem theoretische Synthesen ohne direkte Belege aus klinischen Studien. Insgesamt festigen diese Befunde die Einordnung der mitochondrialen Myopathie als organischen Krankheitsprozess und unterstreichen den Bedarf an gezielten Therapien für Energiehaushalt und Mikrozirkulation.'
  why_it_matters: Die Aufklärung molekularer Störungen von Mitochondrien und Stoffwechsel liefert eine objektive, messbare Grundlage für die ausgeprägte Muskelschwäche und Post-Exertional Malaise (PEM). Indem der Fokus von subjektiver Erschöpfung auf konkrete enzymatische Engpässe (etwa bei Komplex V oder mitochondrialen Superkomplexen) rückt, entstehen greifbare Ansatzpunkte für Medikamente und Drug-Repurposing. Zudem erklären diese zellulären Energieblockaden, warum klassisches Ausdauertraining scheitert und intrazelluläre Ionenungleichgewichte sowie Muskelschäden sogar verschlimmern kann. Das Zusammenspiel aus Immunbotenstoffen (wie sIL2R), Durchblutungsstörungen und Zellatmung weist den Weg zu kombinierten Behandlungsstrategien.
  state_of_evidence:
  - status: established
    label: Gesichert
    items:
    - Kohorten mit ME/CFS und Long COVID zeigen wiederholt Störungen im Energiestoffwechsel, darunter eine ausbleibende Erholung nach Belastung, veränderte Fett- und Aminosäure-Umsätze sowie eine objektiv messbare Muskelfunktionsstörung. Vergleichende Muskelbiopsien belegen, dass strukturelle Mitochondriendefekte, veränderte Kapillar-zu-Faser-Verhältnisse und bioenergetisches Versagen eigenständige zelluläre Krankheitsprozesse sind, die sich grundlegend von Bettruhe-Dekonditionierung unterscheiden.
  - status: plausible
    label: Plausibel, aber noch früh
    items:
    - Neuere Studien aus 2026 deuten darauf hin, dass ein Verlust von Pax7+-Satellitenzellen die Muskelregeneration nach Belastung hemmt, dass nicht-hospitalisierte Long-COVID-Betroffene ein gekoppeltes Versagen von Mitochondrien und kleinen Gefäßen aufweisen, dass männliche ME/CFS-Patienten ein Ungleichgewicht im Arginin-NO-Stoffwechsel zeigen, dass Trockenblut-Metabolomik bekannte Signalwege im größeren Maßstab abbildet und dass strahlenähnliche Bystander-Modelle CD38-vermittelten NAD+-Verlust mit Energiestress verknüpfen. Zellmodelle zeigen zudem, dass SARS-CoV-2-Proteine wie ORF7a über PDK4 und Komplex-I-Superkomplexe die Zellatmung hemmen können; dies ergänzt Befunde zum Hüllprotein-Cardiolipin, bleibt aber In-vitro-Evidenz. WASF3-Mausversuche verbinden Hirnenergiestoffwechsel mit Lernleistung, nicht mit Therapieansprechen beim Menschen. Kleine Biobank-Kohorten zeigen Unterschiede bei Lipidmediatoren ohne validierte klinische Subgruppen.
  - status: not_established
    label: Nicht gesichert
    items:
    - Keine einzelne mitochondriale oder metabolomische Signatur definiert bislang alle Betroffenen, grenzt ME/CFS sauber von ähnlichen postviralen Syndromen ab oder beweist einen einzigen gemeinsamen Auslöser. Vorhersagen für Medikamente aus Transkriptom-Datenbanken – einschließlich 14 per LINCS2 priorisierter Wirkstoffe aus iPSC-abgeleiteten Myotuben – bleiben reine Arbeitshypothesen ohne experimentelle Prüfung; In-vitro-Befunde aus Long-COVID-Zelllinien sind nicht als gesicherte ME/CFS-Mechanismen belegt, und PEM-Modelle auf Basis einer unvollständigen Mitophagie sind bislang ungetestete Hypothesen ohne Humandaten.
  - status: limitations
    label: Wesentliche Einschränkungen
    items:
    - Daten zu Satellitenzellen in Muskelbiopsien liegen teils erst als Konferenz-Abstracts vor der vollständigen Peer-Review-Publikation vor. Invasive Muskelbiopsien eignen sich nicht für die breite Routinediagnostik. Mitochondrienmessungen an Blutzellen sind leichter zugänglich, bedürfen aber weiterer Validierung am Zielgewebe, und theoretische Bystander-Modelle wurden noch nicht in klinischen Studien am Menschen geprüft.
  open_questions:
  - Was ist der primäre zelluläre Auslöser der erworbenen Gewebeminderdurchblutung, die zu mitochondrialen Schäden und Kalzium-Natrium-Überladung in der Skelettmuskulatur führt?
  - Welche molekularen Mechanismen verursachen den Verlust von Pax7+-Satellitenzellen und die gestörte Regenerationssignalgebung nach Belastung bei ME/CFS und Long COVID?
  - Lässt sich durch gezieltes Eingreifen bei CD38-vermitteltem NAD+-Abbau oder ER-Stress die mitochondriale Atemkapazität und Muskelstammzellfunktion wiederherstellen?
  - Wie wirken mikrovaskuläre Endotheldysfunktion und intrinsische Muskelmitochondrien-Defekte bei nicht-hospitalisierten postviralen Patientinnen und Patienten zusammen, um ein belastungsabhängiges Versagen der oxidativen Phosphorylierung auszulösen?
  - Wenn zirkulierende Blutfaktoren keine universellen Treiber von Atmungsdefekten in Myoblasten sind, welche lokalen oder gewebeansässigen Immunsignale lösen dann den zellulären Energiestress aus?
  - Tragen Lipidansammlungen in B-Zellen und eine Überaktivität des Enzyms PTDSS1 direkt zu B-Zell-Funktionsstörungen oder Autoantikörperbildung bei?
