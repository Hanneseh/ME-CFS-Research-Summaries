en:
  title: Autonomic Dysfunction & POTS
  subtitle: A living thread on postural orthostatic tachycardia syndrome (POTS), orthostatic intolerance, heart rate variability (HRV), and central or peripheral autonomic nervous system dysfunction in ME/CFS and Long COVID.
  evidence_label: clinical and physiological validation
  plain_summary: Many people with ME/CFS and Long COVID have problems with the body's automatic control of heart rate, blood pressure, and blood flow to the brain, often showing up as POTS or dizziness when upright. Studies link these symptoms to reduced blood flow to the brain, tiny nerve fiber damage, and poor blood return to the heart rather than simple anxiety or deconditioning. Standard POTS exercise advice can trigger severe PEM crashes in ME/CFS, and specific medication trials for people with both conditions are still missing.
  takeaway: 'Autonomic nervous system dysfunction (dysautonomia), particularly manifesting as postural orthostatic tachycardia syndrome (POTS) and orthostatic intolerance (OI), is a central biological feature of Myalgic Encephalomyelitis/Chronic Fatigue Syndrome (ME/CFS) and Long COVID. In these conditions, upright posture or metabolic stress triggers cardiorespiratory and cerebrovascular instability, causing symptoms such as severe lightheadedness, heart rate spikes, blood pressure fluctuations, cognitive impairment ("brain fog"), and post-exertional malaise. Emerging evidence demonstrates that these symptoms are driven by quantifiable physiological impairments, including reduced cerebral blood flow, peripheral small fiber neuropathy (SFN), and preload failure, which is the inadequate return of blood to the heart during exertion.


    Recent clinical comparisons and large-scale reviews confirm that ME/CFS and Long COVID share a near-identical autonomic phenotype. High-throughput diagnostics, transcutaneous Doppler, and head-up tilt testing show that over 89% of patients in both groups experience impaired cerebral autoregulation and hemodynamic failure. Additionally, empirical cytokine profiling demonstrates that pre-COVID POTS and Long COVID-associated POTS exhibit indistinguishable circulating inflammatory cytokine profiles, reinforcing that post-viral dysautonomia shares a common immune-mediated substrate with pre-pandemic POTS. However, physiological differences under specific metabolic stressors—such as distinct cerebrovascular resistance changes under hypercapnia in ME/CFS versus oxygenation deficits under head-up tilt in Long COVID—indicate that different underlying pathways might drive these similar symptoms. Additionally, new neuroimaging suggests that neuroinflammation localized in the brainstem''s dorsolateral
    medulla may act as a central driver of these autonomic and cognitive symptoms by disrupting the brain-immune axis. Recent validation of the 10-minute NASA Lean Test in chronic post-COVID cohorts confirms its utility as an accessible clinical screening tool, though it reveals a significant dissociation where 83% of hemodynamically negative patients still report severe orthostatic symptoms. Furthermore, long-term post-COVID ocular symptoms have been linked to corneal small-fiber neuropathy and pupillary autonomic dysfunction, with new diagnostic models developed using ophthalmic tools and tear-fluid proteins; however, these ocular findings are specific to post-COVID cohorts and have not been validated in general ME/CFS populations.


    Although the physical basis of dysautonomia in post-infectious syndromes is increasingly established, significant uncertainties remain. Current therapeutic interventions, including compression garments, ivabradine, and beta-blockers, are supported only by low-certainty evidence, and no clinical trials have evaluated these treatments specifically within the comorbid ME/CFS population. This represents a critical knowledge gap, particularly because standard POTS recommendations like progressive physical training can cause severe post-exertional crashes in ME/CFS patients due to post-exertional malaise. Further research is required to determine the molecular triggers of post-infectious dysautonomia, standardize functional vascular diagnostics, and validate targeted immunomodulatory and hemodynamic therapies in well-stratified clinical cohorts.'
  why_it_matters: Understanding autonomic dysfunction and POTS is essential for establishing objective, measurable markers of disease severity in post-infectious syndromes. By identifying physical pathology such as preload failure, reduced cerebral blood flow, and small fiber neuropathy, this research shifts the clinical understanding of ME/CFS and Long COVID from subjective symptom checklists to objective, quantifiable vascular and neurological deficits. Pinpointing downstream mechanisms, such as impaired cerebrovascular autoregulation or brainstem neuroinflammation, provides clear pathways for therapeutic development and drug repurposing. Furthermore, demonstrating the high prevalence of orthostatic intolerance and the potential harm of standard POTS exercise protocols in patients with post-exertional malaise directly shapes clinical guidelines, emphasizing the need for pacing-aware, individualized care models.
  state_of_evidence:
  - status: established
    label: Established
    items:
    - Postural orthostatic tachycardia syndrome (POTS) and orthostatic intolerance (OI) are highly prevalent in ME/CFS and Long COVID, affecting the vast majority of patients. Cerebral blood flow is significantly reduced during orthostatic challenges in these cohorts compared to healthy controls, and comorbid ME/CFS and orthostatic intolerance leads to cumulative deficits in cerebral perfusion. Autonomic symptom burden directly correlates with overall clinical severity, functional impairment, fatigue, and pain.
  - status: plausible
    label: Plausible but early
    items:
    - ME/CFS and Long COVID share a near-identical autonomic phenotype characterized by preload failure during exercise, small fiber neuropathy, and reduced cerebral blood flow. Sensory small fiber neuropathy (SFN) in these populations is non-length-dependent and patchy, indicating widespread peripheral nerve damage rather than typical distal-to-proximal degeneration. Pre-COVID POTS and Long COVID-associated POTS share indistinguishable circulating inflammatory cytokine profiles, pointing toward a common neuroinflammatory and immune-mediated substrate across post-viral and non-viral dysautonomia. Autonomic dysfunction can be directly triggered by acute bacterial infections (such as _Coxiella burnetii_ in Q fever), leading to immediate impairment of parasympathetic regulation and baroreflex control. Advanced neuroimaging (7T MRI) reveals localized neuroinflammation in the brainstem's dorsolateral medulla, which may serve as the central driver for autonomic and cognitive symptoms. Under metabolic
      stressors like hypercapnia, ME/CFS and Long COVID exhibit distinct cerebrovascular autoregulation and peripheral oxygenation profiles. In post-COVID syndrome, the 10-minute NASA Lean Test is an effective screening tool for POTS, although subjective orthostatic symptoms often dissociate from objective hemodynamic thresholds. Persistent post-COVID ocular symptoms are linked to localized corneal small-fiber neuropathy, local immune dysregulation, and impaired pupillary autonomic control (with diagnostic models developed using clinical ophthalmic tools or tear proteins). Non-tachycardic mechanisms—including reduced left ventricular chamber dimensions (small heart syndrome), paradoxically downregulated renin-angiotensin-aldosterone and antidiuretic hormone (ADH) signaling, central vestibular disequilibrium, non-POTS dysautonomia, and possible glucose-triggered autonomic episodes—are proposed contributors to orthostatic intolerance beyond standard heart-rate criteria, based on expert consensus,
      single-clinic observational evidence, or hypothesis-level work. A 2026 physiological study also found that orthostatic abnormalities were not explained by static blood-volume categories alone, pointing toward dynamic autonomic, respiratory, and neurovascular mechanisms.
  - status: not_established
    label: Not established
    items:
    - Standardized, universally accepted biomarkers that distinguish post-infectious dysautonomia from other forms of primary POTS. The long-term efficacy and safety of pharmacotherapies (such as ivabradine, beta-blockers, midodrine, or pyridostigmine) specifically in patients with comorbid ME/CFS and POTS.
  - status: limitations
    label: Key limitations
    items:
    - 'Most treatment studies for POTS are small, have a high risk of bias, and completely exclude or fail to stratify patients with comorbid ME/CFS. Severely ill, bedbound patients are underrepresented in hemodynamic and tilt-table research due to their inability to tolerate orthostatic challenges. Methodological differences in measuring cerebral blood flow (TCD, MRI, SPECT) prevent direct meta-analysis of perfusion deficits. Current studies frequently rely on self-reported questionnaires or subjective autonomic symptom scores rather than standardized functional and objective testing. Cross-sectional cytokine profiling studies cannot determine whether inflammatory marker elevations cause autonomic dysregulation or result secondary to vascular impairment. The diagnostic models for post-COVID ocular autonomic dysfunction require specialized instruments (like corneal confocal microscopy) or tear-fluid assays that are not widely accessible, and these findings have not been evaluated in non-COVID
      ME/CFS cohorts. Additionally, the utility and diagnostic thresholds of the NASA Lean Test require further longitudinal validation in broader, non-COVID ME/CFS populations. Protocol selection between active standing, passive standing, and tilt-table testing materially influences which physiological deficits and patient subsets are identified, and diagnostic thresholds for pediatric PoTS remain unsettled. The new consensus and blood-volume study do not solve the central severe-patient access problem: the consensus is expert guidance rather than outcome evidence, and the physiological cohort excluded people unable to travel and stand for testing.'
  open_questions:
  - What specific molecular mechanisms link post-infectious immune activation or autoantibodies to the development of non-length-dependent small fiber neuropathy?
  - How does localized brainstem neuroinflammation, particularly in the dorsolateral medulla, disrupt central baroreflex control and sympathovagal balance?
  - What are the primary physiological drivers of preload failure in post-infectious cohorts, and how do they relate to endothelial dysfunction, microclots, and blood volume depletion?
  - Which clinical biomarkers or functional tests can reliably predict whether a patient with comorbid ME/CFS and POTS will benefit from ivabradine, beta-blockers, or volume expansion therapies without triggering post-exertional malaise?
  - What explaining factors cause ME/CFS and Long COVID patients to exhibit distinct cerebrovascular and peripheral oxygenation responses under specific stress challenges despite showing near-identical resting autonomic function?
de:
  title: Autonome Dysfunktion & POTS
  subtitle: Ein fortlaufender Forschungsstrang zu posturalem Tachykardiesyndrom (POTS), orthostatischer Intoleranz (OI), Herzratenvariabilität (HRV) sowie zentralen und peripheren Störungen des autonomen Nervensystems bei ME/CFS und Long COVID.
  evidence_label: Klinische und physiologische Belege
  plain_summary: Bei vielen Menschen mit ME/CFS und Long COVID ist die automatische Steuerung von Puls, Blutdruck und Hirndurchblutung gestört, was sich oft als POTS oder Schwindel im Stehen äußert. Studien verbinden diese Beschwerden objektiv mit verminderter Hirndurchblutung, Schäden an feinsten Nervenfasern und unzureichendem Blutrückfluss zum Herzen. Gängige Trainingsprogramme für POTS können bei ME/CFS jedoch schwere PEM-Einbrüche auslösen, und gezielte Medikamentenstudien speziell für Betroffene mit beiden Erkrankungen fehlen noch.
  takeaway: 'Eine Fehlfunktion des autonomen Nervensystems (Dysautonomie) – insbesondere als posturales Tachykardiesyndrom (POTS) und orthostatische Intoleranz (OI) – ist ein zentrales biologisches Merkmal von ME/CFS und Long COVID. Aufrechte Körperhaltung oder körperliche Belastung lösen dabei Kreislauf- und Hirndurchblutungsstörungen aus, die zu starker Benommenheit, Pulssprüngen, Blutdruckschwankungen, Brain Fog und Post-Exertional Malaise (PEM) führen. Wachsende Evidenz zeigt hinter diesen Beschwerden messbare physiologische Störungen wie eine verminderte Hirndurchblutung, eine Small-Fiber-Neuropathie (SFN) sowie ein sogenanntes Preload-Versagen, also einen unzureichenden venösen Blutrückfluss zum Herzen bei Belastung.


    Neuere klinische Vergleiche und große Übersichtsarbeiten bestätigen, dass ME/CFS und Long COVID ein nahezu identisches autonomes Profil teilen. Messungen mittels Doppler und Kipptisch zeigen bei über 89 % der Betroffenen in beiden Gruppen eine gestörte zerebrale Autoregulation und hämodynamische Instabilität. Zudem weisen Patientinnen und Patienten mit POTS von vor der Pandemie und mit Long-COVID-POTS ununterscheidbare Entzündungszytokin-Profile im Blut auf. Unter bestimmten Stressreizen zeigen sich dennoch feine Unterschiede – etwa bei der Gefäßreaktion auf Kohlendioxid bei ME/CFS versus Sauerstoffabfall im Kipptischtest bei Long COVID –, und erste 7T-MRT-Daten deuten auf lokale Neuroinflammation im Hirnstamm (dorsolaterale Medulla) hin. Eine Validierung des 10-minütigen NASA-Lean-Tests bei Long COVID bestätigt seinen Nutzen als praxistaugliches Screening, zeigt aber auch, dass 83 % der Testpersonen ohne formale POTS-Pulskriterien dennoch starke orthostatische Beschwerden hatten. Bei
    anhaltenden Augenbeschwerden nach COVID-19 fanden sich zudem Hinweise auf eine Small-Fiber-Neuropathie der Hornhaut und eine gestörte Pupillensteuerung; diese Augenbefunde sind bislang jedoch nur für Post-COVID-Kohorten und noch nicht allgemein für ME/CFS geprüft.


    Trotz immer klarerer objektiver Befunde bleiben zentrale Lücken. Gängige Behandlungen wie Kompressionskleidung, Ivabradin oder Betablocker stützen sich bislang nur auf Evidenz geringer Sicherheit, und klinische Studien speziell für Betroffene mit komorbidem ME/CFS fehlen vollständig. Das ist besonders kritisch, weil klassische POTS-Empfehlungen wie schrittweises Ausdauertraining bei ME/CFS wegen PEM schwere Rückfälle auslösen können. Weitere Forschung muss die molekularen Auslöser klären, Gefäßtests standardisieren und sichere Therapien in klar abgegrenzten Kohorten prüfen.'
  why_it_matters: Das Verständnis von autonomer Dysfunktion und POTS liefert objektive, messbare Marker für die Krankheitsschwere postinfektiöser Syndrome. Indem Befunde wie Preload-Versagen, verminderte Hirndurchblutung und Small-Fiber-Neuropathie nachgewiesen werden, verlagert sich der Blick von subjektiven Symptomlisten hin zu konkreten vaskulären und neurologischen Störungen. Die Aufdeckung nachgeschalteter Mechanismen wie gestörter zerebraler Autoregulation oder Neuroinflammation im Hirnstamm eröffnet gezielte Wege für Therapiestudien. Zudem fließt das Wissen über die Gefahren klassischer POTS-Trainingsprotokolle bei PEM direkt in sicherere, pacing-orientierte Behandlungsempfehlungen ein.
  state_of_evidence:
  - status: established
    label: Gesichert
    items:
    - POTS und orthostatische Intoleranz sind bei ME/CFS und Long COVID sehr häufig und betreffen einen Großteil der Patientinnen und Patienten. Die Hirndurchblutung sinkt bei orthostatischer Belastung deutlich stärker als bei gesunden Kontrollpersonen, und das Zusammentreffen von ME/CFS und orthostatischer Intoleranz führt zu besonders ausgeprägten Durchblutungsdefiziten. Die Stärke der autonomen Beschwerden korreliert direkt mit allgemeiner Krankheitsschwere, Funktionseinschränkung, Fatigue und Schmerzen.
  - status: plausible
    label: Plausibel, aber noch früh
    items:
    - ME/CFS und Long COVID teilen ein nahezu identisches autonomes Muster aus Preload-Versagen unter Belastung, Small-Fiber-Neuropathie und verminderter Hirndurchblutung. Die sensorische SFN ist dabei fleckförmig und nicht längenabhängig verteilt. Vor-pandemisches POTS und Long-COVID-POTS zeigen kaum unterscheidbare Entzündungszytokin-Profile. Auch akute bakterielle Infektionen (wie Coxiella burnetii bei Q-Fieber) können Baroreflex und Parasympathikus rasch beeinträchtigen. Hochauflösende 7T-MRT-Daten weisen auf lokale Neuroinflammation im Hirnstamm hin. Unter metabolischen Reizen wie Hyperkapnie unterscheiden sich zerebrovaskuläre Regulation und periphere Sauerstoffversorgung teils zwischen ME/CFS und Long COVID. Der 10-Minuten-NASA-Lean-Test eignet sich zum Screening, doch trennen sich subjektive Beschwerden oft von starren Pulsgrenzwerten. Anhaltende Augenbeschwerden nach COVID-19 stehen mit kornealer SFN und Pupillendysfunktion in Verbindung. Zudem werden nicht-tachykarde Mechanismen
      wie ein verkleinertes Herz (Small-Heart-Syndrom), eine paradox herunterregulierte RAAS-/ADH-Hormonachse, zentrale Gleichgewichtsstörungen sowie mögliche Glukoseschwankungen diskutiert; eine physiologische Studie von 2026 fand zudem, dass statische Blutvolumenwerte orthostatische Auffälligkeiten allein nicht erklären.
  - status: not_established
    label: Nicht gesichert
    items:
    - Es fehlen standardisierte, allgemein anerkannte Biomarker zur Abgrenzung postinfektiöser Dysautonomie von anderen Formen des primären POTS. Langfristige Wirksamkeit und Sicherheit von Medikamenten (wie Ivabradin, Betablockern, Midodrin oder Pyridostigmin) speziell bei komorbidem ME/CFS und POTS sind nicht durch kontrollierte Studien belegt.
  - status: limitations
    label: Wesentliche Einschränkungen
    items:
    - Die meisten POTS-Therapiestudien sind klein, verzerrungsanfällig und schließen Betroffene mit ME/CFS aus oder werten sie nicht getrennt aus. Schwer erkrankte, bettlägerige Menschen sind in Steh- und Kipptischstudien unterrepräsentiert, weil sie die Tests nicht vertragen. Unterschiedliche Messmethoden für die Hirndurchblutung (TCD, MRT, SPECT) verhindern direkte Meta-Analysen. Viele Arbeiten stützen sich auf Fragebögen statt auf einheitliche Funktionstests, und Querschnittsmessungen von Zytokinen klären keine Ursache-Wirkungs-Beziehung. Ophthalmologische Modelle setzen Spezialgeräte voraus und sind außerhalb von Post-COVID noch nicht für ME/CFS geprüft. Auch die Wahl zwischen aktivem Stehen, passivem Anlehnen und Kipptisch beeinflusst die Befunde stark, und diagnostische Grenzwerte für jugendliches POTS sind noch nicht abschließend geklärt.
  open_questions:
  - Welche molekularen Mechanismen verbinden postinfektiöse Immunaktivierung oder Autoantikörper mit der Entstehung einer nicht-längenabhängigen Small-Fiber-Neuropathie?
  - Wie stört lokale Neuroinflammation im Hirnstamm – insbesondere in der dorsolateralen Medulla – die zentrale Baroreflex-Steuerung und das Gleichgewicht von Sympathikus und Parasympathikus?
  - Was sind die wichtigsten physiologischen Treiber des Preload-Versagens in postinfektiösen Kohorten, und wie hängen sie mit Endotheldysfunktion, Mikrogerinnseln und Blutvolumenmangel zusammen?
  - Welche Biomarker oder Funktionstests sagen zuverlässig voraus, ob Betroffene mit ME/CFS und POTS von Ivabradin, Betablockern oder Volumenexpansion profitieren, ohne eine PEM auszulösen?
  - Warum zeigen ME/CFS- und Long-COVID-Kohorten unter gezielten Stresstests teils unterschiedliche zerebrovaskuläre und periphere Sauerstoffreaktionen bei ähnlicher Ruhe-Autonomiefunktion?
