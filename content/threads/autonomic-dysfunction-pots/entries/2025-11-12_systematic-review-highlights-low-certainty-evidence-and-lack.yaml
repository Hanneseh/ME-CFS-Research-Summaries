en:
  title: Systematic review highlights low-certainty evidence and lack of trials for ME/CFS-comorbid POTS
  plain_summary: A review of 45 POTS treatment studies found low-certainty evidence overall and zero clinical trials testing POTS treatments specifically in people with ME/CFS. This matters because standard POTS exercise programs can trigger severe PEM crashes in ME/CFS.
  detail: A systematic review of 45 POTS treatment studies highlighted a significant lack of high-quality evidence, with the certainty of evidence for most interventions rated as low or very low. The review found that non-pharmacological options like compression garments and salt supplementation, along with drugs like ivabradine and beta-blockers, show some efficacy in general POTS cohorts. Most critically, the authors identified a complete absence of clinical trials specifically evaluating POTS therapies in patients with comorbid ME/CFS. This highlights the risk of applying standard POTS recommendations, such as progressive physical exercise, which can cause severe crashes in ME/CFS patients due to post-exertional malaise. However, the review is limited by the small sample sizes and high risk of bias in the analyzed studies, and it does not establish new treatment protocols.
de:
  title: Systematische Übersichtsarbeit zeigt geringe Evidenzsicherheit und fehlende Studien für komorbides POTS bei ME/CFS
  plain_summary: Eine Auswertung von 45 POTS-Therapiestudien fand meist nur schwache Belege und keine einzige klinische Studie speziell für Menschen mit ME/CFS und POTS. Das ist bedeutsam, weil übliches POTS-Aufbautraining bei ME/CFS schwere PEM-Einbrüche auslösen kann.
  detail: Eine systematische Übersichtsarbeit von 45 POTS-Therapiestudien zeigte einen erheblichen Mangel an hochwertiger Evidenz; die Vertrauenswürdigkeit der Belege für die meisten Maßnahmen wurde als niedrig oder sehr niedrig eingestuft. Die Auswertung fand für nicht-medikamentöse Maßnahmen wie Kompressionskleidung und Salzzufuhr sowie Medikamente wie Ivabradin und Betablocker gewisse Wirksamkeitshinweise in allgemeinen POTS-Kohorten. Entscheidend ist jedoch das völlige Fehlen klinischer Studien, die POTS-Therapien gezielt bei Betroffenen mit komorbidem ME/CFS prüfen. Das verdeutlicht das Risiko pauschaler POTS-Empfehlungen wie eines schrittweisen körperlichen Trainings, da dieses bei ME/CFS durch Post-Exertional Malaise schwere Zustandsverschlechterungen auslösen kann. Die Übersichtsarbeit ist zudem durch kleine Fallzahlen und ein hohes Verzerrungsrisiko der Einzelstudien begrenzt und legt keine neuen Behandlungsprotokolle fest.
