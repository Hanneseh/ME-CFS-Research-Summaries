en:
  title: Brain autopsies reveal hypothalamic alterations and altered microglial states
  plain_summary: Early conference findings from the first 10 donated brains in a Dutch ME/CFS brain bank showed changes in hormone-regulating brain cells and brain immune cells rather than widespread inflammation. With only 10 donors and post-mortem tissue limits, these early clues cannot yet be generalized.
  detail: A post-mortem study analyzing brain tissue from the first ten donors of the Dutch ME/CFS Brain Bank, presented at the ZonMw Dutch ME/CFS Research Program meeting, identified specific structural and molecular changes in key regulatory brain regions rather than widespread chronic neuroinflammation. Histological and single-cell transcriptomic analyses revealed significant alterations in hypothalamic neurons responsible for producing corticotropin-releasing hormone (CRH) and vasopressin, alongside altered microglial activation states and mitochondrial protein signatures. These findings provide a cellular and neuroendocrine basis for the HPA-axis dysfunction and autonomic symptoms characteristic of the disease. However, the small initial sample size of ten cases and the complexity of interpreting post-mortem tissue in chronic, long-term illness limit the immediate generalizability of these findings.
de:
  title: Hirnautopsien zeigen Veränderungen im Hypothalamus und veränderte Mikroglia-Zustände
  plain_summary: Frühe Konferenzdaten aus den ersten zehn Gehirnspenden einer niederländischen ME/CFS-Hirnbank zeigten Veränderungen in hormonsteuernden Nervenzellen und Hirn-Immunzellen statt einer flächendeckenden Entzündung. Bei nur zehn Fällen und den Grenzen von Autopsiegewebe lassen sich diese Hinweise noch nicht verallgemeinern.
  detail: Eine Post-mortem-Studie an Hirngewebe der ersten zehn Spenderinnen und Spender der niederländischen ME/CFS-Hirnbank, vorgestellt beim Treffen des ZonMw Dutch ME/CFS Research Program, identifizierte eher spezifische strukturelle und molekulare Veränderungen in wichtigen regulatorischen Hirnregionen als eine weitreichende chronische Neuroinflammation. Histologische und Einzelzell-Transkriptomanalysen zeigten deutliche Veränderungen in hypothalamischen Neuronen, die Corticotropin-releasing Hormone (CRH) und Vasopressin produzieren, neben veränderten Aktivierungszuständen der Mikroglia und mitochondrialen Proteinsignaturen. Diese Befunde liefern eine zelluläre und neuroendokrine Grundlage für die für die Erkrankung charakteristische Dysfunktion der HPA-Achse und autonomen Symptome. Allerdings schränken die kleine Anfangsfallzahl von zehn Fällen und die komplexe Interpretation von Post-mortem-Gewebe bei langer, chronischer Erkrankung die unmittelbare Übertragbarkeit dieser Ergebnisse
    ein.
