en:
  title: Hertfordshire 12-month observational study reports feasibility of tailored community physical activity in Long COVID amid 48% attrition
  plain_summary: A 12-month UK observational study of 62 adults with Long COVID found that a tailored community physical activity program was feasible for participants who stayed enrolled, with improvements in self-rated health, fatigue, and brain fog. However, nearly half dropped out over the year and there was no control group or PEM-stratified safety analysis, so it does not show exercise is safe for people with post-exertional malaise or ME/CFS.
  detail: |-
    Investigators from the Herts Sports & Physical Activity Partnership and local NHS Covid Rehabilitation Services evaluated a 12-month, lived-experience-informed community physical activity program in 62 adults with Long COVID in Hertfordshire, UK, using self-report measures (EQ-5D-5L, EQ-VAS, SBQ-LC, and pain VAS). Initial follow-up completion was 89%, declining to 52% retention by follow-up 4. Across retained respondents, average physical activity minutes remained stable while the share classified as inactive dropped from 37% to 25%, alongside statistically significant improvements in self-rated health (EQ-VAS), breathing difficulties, fatigue, and brain fog, and weak correlations between higher activity and lower mobility, self-care, and musculoskeletal pain scores; anxiety and depression did not change significantly. Critical limitations prevent generalizing these findings to ME/CFS or severe post-viral illness: the study had no control group (unable to separate program effects from natural recovery), experienced 48% attrition by the final follow-up (creating strong selection bias if participants who flared stopped participating), did not stratify outcomes or harms by post-exertional malaise (PEM) or ME/CFS criteria in the reported findings, and recruited ambulatory community participants rather than housebound or bedbound patients. The authors themselves conclude that rigorous controlled trials are required.
de:
  title: 12-monatige Beobachtungsstudie in Hertfordshire berichtet Machbarkeit eines angepassten Bewegungsprogramms bei Long COVID trotz 48 % Abbruchrate
  plain_summary: Eine zwölfmonatige britische Beobachtungsstudie mit 62 Erwachsenen mit Long COVID stufte ein angepasstes Bewegungsprogramm für die verbliebenen Teilnehmenden als machbar ein und fand Verbesserungen bei selbsteingeschätzter Gesundheit, Fatigue und Brain Fog. Da jedoch fast die Hälfte im Jahresverlauf ausschied und weder eine Kontrollgruppe noch eine PEM-stratifizierte Sicherheitsanalyse vorlagen, belegt die Arbeit nicht, dass Bewegung bei Post-Exertional Malaise oder ME/CFS sicher ist.
  detail: |-
    Forschende der Herts Sports & Physical Activity Partnership und lokaler NHS-Long-COVID-Rehabilitationsdienste begleiteten 62 Erwachsene mit Long COVID in Hertfordshire (Großbritannien) zwölf Monate lang in einem gemeinschaftsbasierten, an den Erfahrungen von Long-COVID-Betroffenen ausgerichteten Bewegungsprogramm und erhoben Selbstberichte per EQ-5D-5L, EQ-VAS, SBQ-LC und Schmerz-VAS. Während 89 % die erste Nachbefragung abschlossen, blieben bis zur vierten Erhebung noch 52 % im Programm. Unter den verbliebenen Teilnehmenden blieben die durchschnittlichen Bewegungsminuten stabil, während der Anteil Inaktiver von 37 % auf 25 % sank; gleichzeitig zeigten sich statistisch signifikante Verbesserungen bei selbsteingeschätzter Gesundheit (EQ-VAS), Atembeschwerden, Fatigue und Brain Fog sowie schwache Korrelationen zwischen höherer Aktivität und geringeren Beschwerden bei Mobilität, Selbstversorgung und Muskelschmerzen, ohne Veränderung bei Angst oder Depression. Wesentliche Grenzen verbieten eine Übertragung auf ME/CFS oder schwere postvirale Verläufe: Es fehlte eine Kontrollgruppe zur Abgrenzung von Spontanverläufen, die Abbruchrate von 48 % birgt erheblichen Selektionsbias (falls Personen mit Verschlechterungen ausschieden), die berichteten Ergebnisse schichteten weder Nutzen noch Schäden nach Post-Exertional Malaise (PEM) oder ME/CFS-Kriterien, und das ambulante Gemeindeprogramm schloss hausgebundene oder bettlägerige Betroffene faktisch aus. Die Autorinnen und Autoren betonen selbst, dass strengere kontrollierte Studien nötig sind.
