en:
  title: Conference presentation highlights gut-brain-immune axis metabolites and brainstem serotonin regulation
  plain_summary: At a 2026 Berlin conference, researchers reported gut-related metabolic shifts in post-COVID patients and found that brainstem blood-vessel cells, rather than neurons, expressed serotonin-processing enzymes. Spinal-fluid serotonin itself was not low, pointing toward complex vascular-metabolic pathways that still require clinical validation.
  detail: At the Internationale ME/CFS-Konferenz 2026 in Berlin, Dr. Helena Radbruch presented SERIMM consortium findings linking cognitive and autonomic symptoms to dysregulation of the gut-brain-immune axis. The research demonstrated that Post-COVID patients exhibit elevated levels of the gut metabolite trimethylamine N-oxide (TMAO) and kynurenine pathway activation, patterns similar to inflammatory disease controls like multiple sclerosis. In contrast, serotonin levels in the cerebrospinal fluid were not reduced, although the peripheral serotonin-to-tryptophan ratio was decreased. Spatial sequencing of brainstem tissue suggested that endothelial cells, rather than neurons, are the primary site of serotonin-metabolizing enzyme expression. These findings highlight that neurocognitive symptoms are driven by complex metabolic and endothelial pathways rather than a simple central serotonin deficiency, though translating these animal and tissue-level models to live patient clinical outcomes
    remains a key challenge.
de:
  title: Konferenzvortrag hebt Metabolite der Darm-Hirn-Immun-Achse und Serotonin-Regulation im Hirnstamm hervor
  plain_summary: Auf einer Berliner Konferenz 2026 berichteten Forschende über darmbezogene Stoffwechselverschiebungen bei Post-COVID und zeigten, dass eher Gefäßzellen als Nervenzellen im Hirnstamm Serotonin-Enzyme exprimieren. Im Nervenwasser war Serotonin nicht erniedrigt, was auf komplexe Gefäß- und Stoffwechselpfade hinweist, deren Übertragung auf Patientinnen und Patienten noch aussteht.
  detail: Auf der Internationalen ME/CFS-Konferenz 2026 in Berlin stellte Dr. Helena Radbruch Ergebnisse des SERIMM-Konsortiums vor, die kognitive und autonome Symptome mit einer Fehlregulation der Darm-Hirn-Immun-Achse verknüpfen. Die Forschung zeigte, dass Post-COVID-Patientinnen und -Patienten erhöhte Spiegel des Darmmetaboliten Trimethylamin-N-oxid (TMAO) sowie eine Aktivierung des Kynurenin-Signalwegs aufweisen – Muster ähnlich denen entzündlicher Kontrollgruppen wie Multipler Sklerose. Im Gegensatz dazu waren die Serotoninspiegel im Liquor nicht erniedrigt, obwohl das periphere Verhältnis von Serotonin zu Tryptophan verringert war. Räumliche Sequenzierungen von Hirnstammgewebe legten nahe, dass eher Endothelzellen als Neuronen der Hauptort der Expression Serotonin-metabolisierender Enzyme sind. Diese Befunde unterstreichen, dass neurokognitive Symptome durch komplexe metabolische und endotheliale Signalwege statt durch einen einfachen zentralen Serotoninmangel angetrieben werden, wobei
    die Übertragung dieser Tier- und Gewebemodelle auf klinische Ergebnisse bei lebenden Betroffenen eine zentrale Herausforderung bleibt.
