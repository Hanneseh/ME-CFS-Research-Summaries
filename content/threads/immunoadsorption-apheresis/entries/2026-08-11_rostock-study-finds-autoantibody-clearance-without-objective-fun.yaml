en:
  title: Rostock study finds autoantibody clearance without objective functional improvement in post-COVID patients
  plain_summary: A prospective German study of 18 post-COVID patients with elevated autoantibodies found that immunoadsorption sharply lowered antibody levels, yet walking distance, grip strength, lung function, and daily step counts did not improve. Most participants needed central venous catheters and experienced temporary severe antibody depletion, showing high procedural burden without measurable functional gains.
  detail: A prospective exploratory study evaluated five consecutive immunoadsorption sessions using Miltenyi Biotec columns in 18 adult post-COVID syndrome patients selected for elevated autoantibodies against adrenergic and muscarinic receptors. The procedure achieved profound immediate depletion of total IgG (<3 g/L) and targeted G-protein-coupled receptor (GPCR) autoantibodies, but antibody titers returned to baseline within 3 to 6 months. Crucially, objective functional performance endpoints—including 6-minute walk test distance, handgrip dynamometry, spirometry, and continuous smartwatch daily step counts—showed no statistically significant improvement at any follow-up point, even at the autoantibody nadir. While patients reported slight descriptive reductions in subjective fatigue and pain diaries, correlation analyses confirmed that autoantibody reduction was decoupled from symptomatic change. These findings directly converge with the sham-controlled IAMPOCO trial results, demonstrating
    that clearing circulating autoantibodies does not translate into measurable functional recovery in unstratified post-COVID cohorts. The study carried substantial procedural burden and safety signals, requiring central venous catheterization in 17 of 18 participants and causing transient profound hypogammaglobulinemia. Limitations include the small open-label sample size without a parallel sham arm, recruitment based on WHO post-COVID criteria rather than formal ME/CFS consensus definitions, and the exclusion of severely ill, bedbound patients.
de:
  title: Rostocker Studie zeigt Autoantikörper-Entfernung ohne objektive Funktionsverbesserung bei Post-COVID
  plain_summary: Eine prospektive deutsche Studie mit 18 Post-COVID-Betroffenen und erhöhten Autoantikörpern zeigte nach Immunadsorption zwar eine starke Absenkung der Antikörper, jedoch keine Besserung bei Gehstrecke, Greifkraft, Lungenfunktion oder täglichen Schrittzahlen. Fast alle Teilnehmenden benötigten einen zentralen Venenkatheter und erlitten einen vorübergehenden starken IgG-Abfall – eine hohe Belastung ohne messbaren Funktionsgewinn.
  detail: Eine prospektive explorative Studie untersuchte fünf aufeinanderfolgende Immunadsorptions-Sitzungen mit Säulen von Miltenyi Biotec bei 18 erwachsenen Post-COVID-Patientinnen und -Patienten, die wegen erhöhter Autoantikörper gegen adrenerge und muskarinische Rezeptoren ausgewählt wurden. Das Verfahren erzielte eine ausgeprägte unmittelbare Senkung des Gesamt-IgG (<3 g/L) und der gezielten GPCR-Autoantikörper, doch die Titer kehrten innerhalb von 3 bis 6 Monaten auf das Ausgangsniveau zurück. Entscheidend war, dass objektive Leistungsmaße – darunter 6-Minuten-Gehtest, Handgreif-Dynamometrie, Spirometrie und kontinuierliche Smartwatch-Schrittzahlen – zu keinem Nachbeobachtungszeitpunkt eine statistisch signifikante Verbesserung zeigten, selbst am Tiefpunkt der Autoantikörper nicht. Zwar berichteten Behandelte leichte deskriptive Rückgänge in Fatigue- und Schmerztagebüchern, doch Korrelationsanalysen bestätigten, dass die Antikörperabsenkung vom Symptomverlauf entkoppelt war. Diese
    Befunde decken sich direkt mit der schein-kontrollierten IAMPOCO-Studie und zeigen, dass das Auswaschen zirkulierender Autoantikörper in unstratifizierten Post-COVID-Kohorten nicht zu messbarer funktioneller Erholung führt. Das Verfahren ging mit erheblichen Belastungen und Sicherheitssignalen einher, erforderte bei 17 von 18 Teilnehmenden einen zentralen Venenkatheter und verursachte eine vorübergehende ausgeprägte Hypogammaglobulinämie. Einschränkungen umfassen die kleine offene Stichprobe ohne Scheinarm, die Rekrutierung nach WHO-Post-COVID-Kriterien statt formaler ME/CFS-Definitionen und den Ausschluss schwer kranker, bettlägeriger Personen.
