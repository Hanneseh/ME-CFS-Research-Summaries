en:
  title: INIM seminar reviews validated outcome measures for ME/CFS trials
  plain_summary: In a research seminar, a leading specialist explained why ME/CFS trials must use validated questionnaires that specifically capture PEM instead of generic fatigue scales. It is an expert talk offering guidance on study design, not new patient data.
  detail: In an invited presentation for the Nova Southeastern University Institute for Neuro-Immune Medicine (INIM) 2026 Research Seminar Series, Dr. Leonard A. Jason reviewed methodological standards for outcome measures and symptom assessment in ME/CFS research. The seminar emphasized the critical necessity of psychometrically validated instruments, such as the DePaul Symptom Questionnaire, to distinguish core features like post-exertional malaise and cognitive impairment from nonspecific fatigue. Jason outlined how unvalidated symptom checklists introduce substantial measurement error into clinical trials and observational cohorts, obscuring subgroup differences and treatment signals. As an expert seminar and conceptual review rather than a new empirical dataset, the presentation provides methodological trial-infrastructure guidance rather than testing a novel intervention. The presentation is accessible as a recorded video via Nova Southeastern University's SharkMedia repository, though
    timestamped transcripts are not formally indexed.
de:
  title: INIM-Seminar gibt Überblick über validierte Endpunkt-Messinstrumente für ME/CFS-Studien
  plain_summary: In einem Forschungsseminar erläuterte ein führender Experte, warum ME/CFS-Studien geprüfte Fragebögen nutzen müssen, die gezielt PEM erfassen statt bloß allgemeine Müdigkeit. Der Vortrag bietet methodische Orientierung für das Studiendesign, liefert aber keine neuen Patientendaten.
  detail: In einem eingeladenen Vortrag im Rahmen der Research Seminar Series 2026 des Institute for Neuro-Immune Medicine (INIM) der Nova Southeastern University gab Dr. Leonard A. Jason einen Überblick über methodische Standards für Zielgrößen und Symptommessung in der ME/CFS-Forschung. Das Seminar betonte die Notwendigkeit psychometrisch validierter Instrumente wie des DePaul Symptom Questionnaire, um Kernmerkmale wie Post-Exertional Malaise und kognitive Beeinträchtigungen von unspezifischer Fatigue abzugrenzen. Jason legte dar, wie unvalidierte Symptom-Checklisten erhebliche Messfehler in klinische Studien und Beobachtungskohorten einführen und dadurch Subgruppenunterschiede sowie Therapiesignale verdecken. Als Expertenvortrag und konzeptionelle Übersicht statt eines neuen empirischen Datensatzes liefert die Präsentation methodische Leitlinien für Studieninfrastruktur und prüft keine neue Therapie. Die Aufzeichnung ist als Video im SharkMedia-Repositorium der Nova Southeastern University
    abrufbar, allerdings ohne formal indexierte zeitgestempelte Transkripte.
