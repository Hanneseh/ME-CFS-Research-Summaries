en:
  title: Pilot study identifies distinct cerebrovascular and peripheral oxygenation responses under stress
  plain_summary: A small pilot study saw different brain-vessel and oxygen patterns during stress tests in 12 ME/CFS patients versus 9 Long COVID patients. The sample is too small to draw firm conclusions, and illness duration or viral variants could play a role.
  detail: A physiological pilot study comparing 12 ME/CFS patients, 9 Long COVID patients, and 10 healthy controls revealed distinct vascular phenotypes under metabolic and orthostatic stress. When exposed to high carbon dioxide levels (hypercapnia), ME/CFS patients demonstrated a significantly greater reduction in cerebrovascular resistance and impaired cerebral autoregulation, which correlated directly with impaired cognitive-motor integration. In contrast, Long COVID patients during a head-up tilt test exhibited lower peripheral and end-tidal oxygen levels along with reduced parasympathetic vagal withdrawal. This suggests that distinct physiological mechanisms may drive the shared symptoms of fatigue and brain fog in these two patient groups. However, these findings are preliminary due to the small sample size and do not rule out the influence of illness duration or specific viral variants.
de:
  title: Pilotstudie erkennt unterschiedliche zerebrovaskuläre und periphere Sauerstoffreaktionen unter Belastung
  plain_summary: Eine kleine Pilotstudie fand bei Stress- und Kipptischtests teils unterschiedliche Hirngefäß- und Sauerstoffreaktionen zwischen 12 ME/CFS- und 9 Long-COVID-Betroffenen. Für sichere Schlüsse ist die kleine Stichprobe aber noch zu vorläufig.
  detail: Eine physiologische Pilotstudie, die 12 ME/CFS-Betroffene, 9 Long-COVID-Betroffene und 10 gesunde Kontrollpersonen verglich, zeigte unter metabolischem und orthostatischem Stress unterschiedliche Gefäßprofile. Bei erhöhten Kohlendioxidwerten (Hyperkapnie) zeigten ME/CFS-Patientinnen und -Patienten eine deutlich stärkere Abnahme des zerebrovaskulären Widerstands und eine gestörte zerebrale Autoregulation, was direkt mit einer schlechteren kognitiv-motorischen Integration korrelierte. Dagegen wiesen Long-COVID-Betroffene im Kipptischtest niedrigere periphere und endtidale Sauerstoffwerte sowie eine abgeschwächte parasympathische Vagus-Rücknahme auf. Dies deutet darauf hin, dass teils unterschiedliche physiologische Mechanismen ähnliche Symptome wie Fatigue und Brain Fog auslösen können. Wegen der sehr kleinen Stichprobe sind diese Befunde jedoch vorläufig und schließen Einflüsse von Krankheitsdauer oder Virusvarianten nicht aus.
