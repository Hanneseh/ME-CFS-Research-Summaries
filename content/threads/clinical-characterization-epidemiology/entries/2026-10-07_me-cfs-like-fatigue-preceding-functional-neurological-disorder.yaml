en:
  title: UK clinic chart review finds ME/CFS-like fatigue with PEM frequently precedes functional neurological disorder and cautions against routine exercise rehab
  plain_summary: A retrospective review of 76 patients at a UK clinic found that over 80% of people with functional neurological disorder reported significant fatigue worsened by exertion, and in half it began months or years before neurological symptoms. The authors argue that routine exercise-based rehabilitation may be inappropriate for this fatigue-predominant group, though larger prospective studies are needed.
  detail: |-
    Clinicians at an integrated community ME/CFS and functional neurological disorder (FND) service in Wigan, UK, retrospectively reviewed clinical records from 89 patients assessed between March 2022 and March 2025, with complete data for 76 adults (mean age 39 years, 17% male). Significant fatigue was documented in 62 of 76 patients (81.5%): in 39 (51%), debilitating ME/CFS-like fatigue with [post-exertional malaise](thread:pem-exercise-physiology), pain, cognitive dysfunction, and immune-like symptoms preceded FND onset by months to years (following one or more stressful life events in all 39 cases), while in 23 (30%) fatigue with post-exertional worsening emerged concurrently with or after FND onset. The remaining 14 patients (18.5%) without significant fatigue generally presented with isolated focal symptoms and minimal fluctuation or primary psychiatric or pain comorbidities. Citing the 2021 NICE ME/CFS guidelines, the authors argue that routine incremental exercise-based FND rehabilitation may be inappropriate for fatigue- and PEM-predominant patients, who instead warrant individualized pacing and fatigue-centered management. Important limitations include the small single-center retrospective chart design, strong referral bias from a jointly managed ME/CFS–FND clinic, inconsistent application of formal ME/CFS diagnostic criteria (with "ME/CFS-like" used descriptively), absence of objective physiological testing or bedbound severity breakdown, and inability to establish causality.
de:
  title: Britische Aktenauswertung zeigt häufige ME/CFS-ähnliche Fatigue mit PEM vor funktioneller neurologischer Störung und warnt vor pauschaler Bewegungsreha
  plain_summary: Eine rückblickende Aktenanalyse von 76 Patientinnen und Patienten einer britischen Ambulanz fand bei über 80 % der Menschen mit funktioneller neurologischer Störung eine ausgeprägte, belastungsverschlechterte Fatigue – bei der Hälfte schon Monate bis Jahre vor den neurologischen Symptomen. Die Autorinnen und Autoren warnen davor, dieser Gruppe routinemäßig aufbauende Bewegungstherapie zu verordnen, weisen aber auf den vorläufigen Charakter der Daten hin.
  detail: |-
    Klinikerinnen und Kliniker eines gemeinsam geführten ambulanten ME/CFS- und FND-Dienstes (Functional Neurological Disorder) in Wigan, Großbritannien, werteten rückblickend Krankenakten von 89 zwischen März 2022 und März 2025 untersuchten Personen aus; für 76 Erwachsene lagen vollständige Daten vor (Durchschnittsalter 39 Jahre, 17 % männlich). Bei 62 von 76 Personen (81,5 %) war eine ausgeprägte Fatigue dokumentiert: Bei 39 (51 %) ging eine stark einschränkende, ME/CFS-ähnliche Fatigue mit [Post-Exertional Malaise](thread:pem-exercise-physiology), Schmerzen, kognitiven Störungen und immunologisch anmutenden Beschwerden dem Beginn der FND-Symptome um Monate bis Jahre voraus (bei allen 39 nach mindestens einem belastenden Lebensereignis), während bei 23 (30 %) eine belastungsverschlechterte Fatigue gleichzeitig mit oder nach der FND auftrat. Die übrigen 14 Personen (18,5 %) ohne ausgeprägte Fatigue zeigten meist isolierte fokale Symptome mit geringer Schwankung oder vorrangige psychiatrische oder Schmerzkomorbiditäten. Unter Verweis auf die britische NICE-ME/CFS-Leitlinie von 2021 plädieren die Autorinnen und Autoren dafür, bei fatigue- und PEM-betonter FND keine pauschale aufbauende Bewegungsrehabilitation einzusetzen, sondern individuell angepasstes Pacing und Energiemanagement zu priorisieren. Zentrale Einschränkungen sind das kleine, monozentrische retrospektive Design, ein deutlicher Zuweisungsbias durch die gemeinsame ME/CFS-FND-Struktur, fehlende konsequente Anwendung formaler ME/CFS-Diagnosekriterien („ME/CFS-ähnlich“ rein deskriptiv), fehlende objektive physiologische Messungen oder Angaben zu Schwerbetroffenen sowie fehlende Kausalitätsnachweise.
