en:
  title: ME/CFS Research Foundation announces €2.4 million in funding for seven new studies
  plain_summary: The ME/CFS Research Foundation announced €2.4 million in grants for seven new projects starting in summer 2026 on mechanisms, biomarkers, and treatments. It is a funding press release with no project details or results yet.
  detail: The ME/CFS Research Foundation announced €2.4 million in funding for seven new research projects under its Research Funding Programme 2026, scheduled to begin in the summer of 2026. Selected from approximately 30 submissions by an international expert jury and advisory board, the projects will focus on investigating new treatment approaches, disease mechanisms, and biomarkers. As this is a brief funding press release rather than a peer-reviewed scientific study, it does not provide clinical data, patient outcomes, or specific study methodologies, and the exact details of the individual projects are not disclosed.
de:
  title: ME/CFS Research Foundation kündigt 2,4 Millionen Euro Förderung für sieben neue Studien an
  plain_summary: Die ME/CFS Research Foundation hat 2,4 Millionen Euro für sieben ab Sommer 2026 startende Forschungsprojekte zu Mechanismen, Biomarkern und Therapien zugesagt. Es handelt sich um eine kurze Fördermitteilung ohne Projektdetails oder Forschungsergebnisse.
  detail: Die ME/CFS Research Foundation gab im Rahmen ihres Research Funding Programme 2026 die Förderung von sieben neuen Forschungsprojekten im Umfang von 2,4 Millionen Euro bekannt, die im Sommer 2026 starten sollen. Aus rund 30 Einreichungen von einer internationalen Fachjury und einem wissenschaftlichen Beirat ausgewählt, sollen die Projekte neue Therapieansätze, Krankheitsmechanismen und Biomarker untersuchen. Da es sich um eine knappe Förderpressemitteilung und keine begutachtete Fachstudie handelt, liefert sie keine klinischen Daten, Patientenergebnisse oder konkreten Studiendesigns und nennt noch keine Einzelheiten der geförderten Vorhaben.
