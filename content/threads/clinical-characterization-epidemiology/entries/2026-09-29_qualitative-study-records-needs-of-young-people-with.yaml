en:
  title: Qualitative study records needs of young people with ME/CFS and their parents in Bavaria
  plain_summary: Interviews with 14 young people with ME/CFS and 18 parents in Bavaria highlighted a shared need not to be left alone, alongside respectful care and practical school and medical support. Because it was a small, single-center qualitative study, it informs youth care design rather than measuring general rates.
  detail: Kircher, Behrends, and colleagues interviewed 14 patients aged 12–24 (median 18.5) and 18 parents within the ME/CFS Kids Bavaria study at the Munich Chronic Fatigue Center for Young People, recruiting between July 2022 and December 2023. To limit exertion, they used online focus groups capped at one hour and an asynchronous audio or text diary completed at participants' own pace (see [Severe ME/CFS Care](thread:severe-mecfs-care) for low-burden methods); the median Bell score was 20 (range 10–50). Patients and parents shared a core need of "not being left alone"; patients wanted flexible, understanding providers and authorities and less need to justify themselves, while parents wanted ME/CFS-adapted care, knowledge, and acceptance of the illness. The study comes from the same centre as PEDNET-LC (2026-06-21) but is a separate project. It is a small, preselected single-centre sample, some researchers knew participants clinically, and very severe or bedbound status was not reported.
de:
  title: Qualitative Studie erfasst Bedürfnisse junger Menschen mit ME/CFS und ihrer Eltern in Bayern
  plain_summary: Interviews mit 14 jungen ME/CFS-Betroffenen und 18 Eltern in Bayern zeigten als zentrales Anliegen, „nicht allein gelassen zu werden“, sowie den Wunsch nach verständnisvoller, krankheitsangepasster Versorgung. Als kleine qualitative Einzelzentrums-Studie liefert sie Hinweise für die Gestaltung der Jugendversorgung, keine allgemeinen Häufigkeiten.
  detail: Kircher, Behrends und Kolleginnen und Kollegen befragten zwischen Juli 2022 und Dezember 2023 im Rahmen der Studie ME/CFS Kids Bavaria am Chronischen Fatigue Centrum für junge Menschen in München 14 Patientinnen und Patienten im Alter von 12–24 Jahren (Median 18,5) und 18 Eltern. Um Überlastung zu vermeiden, nutzten sie einstündige Online-Fokusgruppen sowie ein asynchrones Audio- oder Texttagebuch im eigenen Tempo (siehe [Versorgung bei schwerem ME/CFS](thread:severe-mecfs-care) zu belastungsarmen Methoden); der mediane Bell-Score lag bei 20 (Spanne 10–50). Jugendliche und Eltern teilten das Kernbedürfnis, „nicht allein gelassen zu werden“; Betroffene wünschten sich flexible, verständnisvolle Fachkräfte und Behörden sowie weniger Rechtfertigungsdruck, während Eltern ME/CFS-angepasste Versorgung, Fachwissen und Akzeptanz der Erkrankung einforderten. Die Studie stammt aus demselben Zentrum wie PEDNET-LC (21.06.2026), ist aber ein eigenes Projekt; Einschränkungen sind die kleine,
    vorselektierte Einzelzentrums-Stichprobe, klinische Bekanntschaft einzelner Forschender sowie fehlende Angaben zu sehr schwer Betroffenen oder Bettlägerigen.
