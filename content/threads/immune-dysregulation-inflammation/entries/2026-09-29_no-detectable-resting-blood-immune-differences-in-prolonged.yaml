en:
  title: No detectable resting blood immune differences in prolonged severe Long COVID versus convalescent controls
  plain_summary: A Dutch study checking resting blood samples from people with severe Long COVID about three years after infection found no statistically significant differences in standard immune-cell counts or cytokines compared to recovered controls. This suggests those routine resting blood markers lose diagnostic value years later, though exertion-triggered or tissue-level immune problems were not tested.
  detail: In an early-access case-control study from Erasmus MC funded by the Netherlands ME/CFS Cohort and Biobank consortium (IMMUNESTRATIFY), Humer, Berentschot, and colleagues compared individuals with prolonged severe Long COVID (median illness duration about three years) against convalescent controls. Across resting peripheral-blood assays—including immune-subset counts and frequencies, interferon-pathway activation, monocyte transcriptional profiles, and serum cytokines—no markers showed statistically significant differences after multiple-testing correction, and none correlated with illness duration or patient-reported outcomes such as fatigue, post-exertional malaise, or orthostatic intolerance. The authors contrasted these null resting findings with subtle inflammatory abnormalities reported closer to initial infection, suggesting these blood immune markers have limited diagnostic or stratification utility years after onset. The available abstract does not establish cohort size,
    severity criteria, or whether participants met ME/CFS criteria, and resting blood cannot capture exertion-triggered or tissue-resident processes. The findings indicate an absence of detectable differences in the specific resting blood markers evaluated rather than lack of immune involvement, and the study comes from the same Erasmus MC group as the 2026-09-08 NETosis report in [Vascular, Endothelial & Microclots](thread:vascular-endothelial-microclots) and a 2025 interferon-response study in [Viral Persistence & Reactivation](thread:viral-persistence-reactivation); participant overlap has not been established.
de:
  title: Keine nachweisbaren Immununterschiede im Ruheblut bei langjährigem schwerem Long COVID gegenüber genesenen Kontrollen
  plain_summary: Eine niederländische Studie untersuchte Ruheblut von Menschen mit schwerem Long COVID rund drei Jahre nach Infektion und fand bei den geprüften Immunzell- und Zytokinwerten keine signifikanten Unterschiede zu genesenen Kontrollen. Das schränkt den Nutzen dieser Ruheblut-Marker Jahre nach Krankheitsbeginn ein, schließt aber belastungsabhängige oder im Gewebe ablaufende Immunprozesse nicht aus.
  detail: In einer Early-Access-Fall-Kontroll-Studie des Erasmus MC, gefördert durch das niederländische ME/CFS-Kohorten- und Biobank-Konsortium (IMMUNESTRATIFY), verglichen Humer, Berentschot und Kolleginnen bzw. Kollegen Menschen mit langjährigem schwerem Long COVID (mediane Krankheitsdauer rund drei Jahre) mit genesenen Kontrollen. Über die untersuchten Ruheblut-Messungen hinweg – darunter Immunzell-Zahlen und -Anteile, Interferon-Signalweg-Aktivierung, Monozyten-Transkriptionsprofile und Serumzytokine – zeigten nach Korrektur für multiples Testen keine Marker statistisch signifikante Unterschiede und korrelierten auch nicht mit Krankheitsdauer oder Beschwerden wie Erschöpfung, PEM oder orthostatischer Intoleranz. Die Autorinnen und Autoren stellten diese Nullbefunde im Ruheblut den subtileren Entzündungsauffälligkeiten näher am Infektionszeitpunkt gegenüber und schlossen auf einen begrenzten diagnostischen Nutzen dieser Blutmarker Jahre nach Beginn; allerdings nennt das Abstract weder
    Kohortengröße noch ME/CFS-Kriterien, und Ruheblut erfasst weder belastungsausgelöste noch gewebsständige Prozesse. Die Ergebnisse belegen das Ausbleiben nachweisbarer Unterschiede in den konkret geprüften Ruheblut-Markern, nicht aber das Fehlen jeglicher Immunbeteiligung; die Studie stammt aus derselben Erasmus-MC-Gruppe wie der NETose-Bericht vom 2026-09-08 in [Gefäße, Endothel & Mikrogerinnsel](thread:vascular-endothelial-microclots) und eine Interferon-Studie von 2025 in [Viruspersistenz & Reaktivierung](thread:viral-persistence-reactivation), wobei eine Überschneidung der Teilnehmenden nicht geklärt ist.
