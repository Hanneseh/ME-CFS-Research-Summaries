en:
  title: Younger Lab announces planned brain ATP imaging study using custom Phosphorus-31 spectroscopy
  plain_summary: The Younger Lab announced plans for a pilot brain-scan study to directly measure brain ATP energy levels using a custom head coil expected in late 2026. No participants have been enrolled or data collected yet.
  detail: In a Younger Lab video presentation, Dr. Jarred Younger outlined a planned pilot study to directly measure brain adenosine triphosphate (ATP) levels in ME/CFS patients and healthy controls using a custom-built Phosphorus-31 Magnetic Resonance Spectroscopy (31P-MRS) head coil. The lab has secured an equipment grant for the custom coil (with Dr. Vinitra Meshram as principal investigator), which is expected in October 2026, and is actively writing a grant proposal for approximately $200,000 USD to fund participant recruitment. Because this is an upcoming, currently unfunded pilot study with no participants recruited or data collected yet, it represents a limited, early-stage plan rather than a completed clinical trial. The study aims to combine these bioenergetic measurements with neuroinflammatory scans to investigate central nervous system energy deficits in post-viral illness.
de:
  title: Younger Lab kündigt geplante Hirn-ATP-Bildgebungsstudie mit spezieller Phosphor-31-Spektroskopie an
  plain_summary: Das Younger Lab kündigte eine geplante Pilotstudie zur direkten Messung von Hirn-ATP mittels spezieller 31P-MRT-Kopfspule an. Bislang wurden noch keine Teilnehmenden aufgenommen oder Daten erhoben.
  detail: In einer Videopräsentation des Younger Lab skizzierte Dr. Jarred Younger eine geplante Pilotstudie zur direkten Messung von Adenosintriphosphat (ATP) im Gehirn von ME/CFS-Patientinnen und -Patienten sowie gesunden Kontrollpersonen mithilfe einer maßgefertigten Phosphor-31-Magnetresonanzspektroskopie-(31P-MRS-)Kopfspule. Das Labor hat eine Geräteförderung für die Spezialspule (mit Dr. Vinitra Meshram als Studienleiterin) erhalten, deren Lieferung für Oktober 2026 erwartet wird, und beantragt rund 200.000 US-Dollar für die Rekrutierung der Teilnehmenden. Da es sich um eine bevorstehende, bislang nicht ausfinanzierte Pilotstudie ohne aufgenommene Teilnehmende oder erhobene Daten handelt, stellt dies ein frühes Planungsstadium und noch keine abgeschlossene Studie dar. Die Untersuchung soll bioenergetische Messungen mit Neuroinflammations-Scans kombinieren, um Energiemängel im zentralen Nervensystem bei postviralen Erkrankungen zu erforschen.
