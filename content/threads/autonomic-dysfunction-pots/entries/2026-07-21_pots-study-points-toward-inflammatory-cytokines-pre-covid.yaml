en:
  title: POTS study points toward inflammatory cytokines; pre-COVID and Long COVID POTS indistinguishable
  plain_summary: Comparing blood samples from pre-pandemic POTS and Long COVID POTS patients showed virtually identical elevations in inflammatory cytokines. While this points to a shared immune substrate, a single-time-point study cannot tell whether cytokines cause POTS or result from it.
  detail: An empirical study published in MDPI Biomedicines analyzed circulating inflammatory cytokine profiles in patients with Postural Orthostatic Tachycardia Syndrome (POTS), comparing pre-COVID POTS cohorts with Long COVID-associated POTS. The researchers found that circulating cytokine abnormalities in pre-COVID POTS and Long COVID POTS were statistically indistinguishable, showing shared elevations in key pro-inflammatory mediators. This indicates a common neuroinflammatory and immune-mediated pathophysiology driving dysautonomia across both post-viral and non-viral POTS etiologies. For patients, these findings validate that post-COVID POTS shares the same underlying inflammatory substrate as pre-pandemic POTS, supporting unified diagnostic and management approaches. However, the study's cross-sectional design cannot establish whether cytokine elevations are causative drivers of autonomic dysregulation or secondary consequences of cardiovagal and vascular dysregulation.
de:
  title: POTS-Studie weist auf Entzündungszytokine hin; Vor-COVID- und Long-COVID-POTS ununterscheidbar
  plain_summary: Ein Blutvergleich zeigte zwischen POTS von vor der Pandemie und Long-COVID-POTS nahezu identisch erhöhte Entzündungszytokine. Ob diese Botenstoffe die Kreislaufstörung verursachen oder eine Folge davon sind, lässt sich im Querschnitt aber noch nicht klären.
  detail: Eine empirische Studie in *MDPI Biomedicines* analysierte zirkulierende Entzündungszytokin-Profile bei Patientinnen und Patienten mit POTS und verglich vor der COVID-19-Pandemie erkrankte Kohorten mit Long-COVID-assoziiertem POTS. Die Forschenden fanden statistisch ununterscheidbare Zytokin-Auffälligkeiten in beiden Gruppen mit übereinstimmenden Erhöhungen wichtiger entzündungsfördernder Botenstoffe. Dies deutet auf eine gemeinsame neuroinflammatorische und immunvermittelte Pathophysiologie sowohl bei postviralen als auch bei älteren, nicht durch SARS-CoV-2 ausgelösten POTS-Verläufen hin. Für Betroffene stützen die Daten ein einheitliches Verständnis sowie gemeinsame Diagnose- und Behandlungsansätze. Das Querschnittsdesign kann jedoch nicht klären, ob erhöhte Zytokine die autonome Fehlregulation auslösen oder sekundär durch vaskuläre und kardiovagale Belastung entstehen.
