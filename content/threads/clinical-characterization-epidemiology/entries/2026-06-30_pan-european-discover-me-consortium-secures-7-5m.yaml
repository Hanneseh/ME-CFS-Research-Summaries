en:
  title: Pan-European DISCOVER-ME consortium secures €7.5M to build biomarker-guided clinical networks
  plain_summary: The pan-European DISCOVER-ME network secured €7.5 million to align biobank protocols across over 20 centers in Europe and Canada for future biomarker testing. It builds research infrastructure over the coming years and does not yet offer tests or treatments.
  detail: The European ME Research Group (EMERG) consortium secured a €7.5 million Horizon Europe grant to launch the "DISCOVER-ME" project, led by Prof. Eva Untersmayr-Elsenhuber and Prof. Simon Carding. Connecting over 20 institutions across Europe and Canada, the project aims to establish standardized clinical and laboratory protocols across multiple European biobanks. The ultimate goal is to validate biomarkers across genetic, immune, metabolic, neuroendocrine, and vascular domains while embedding patient-led organizations to inform stratification and future trial designs. This builds large-scale, standardized research infrastructure across European biobanks, establishing a unified foundation for biomarker validation and patient stratification in future clinical trials. As a research infrastructure initiative, it does not directly test new treatments or provide immediate diagnostic tools for clinical use. The timeline for translating these standardized biobank findings into clinical
    trials and approved diagnostics will span several years.
de:
  title: Gesamteuropäisches Konsortium DISCOVER-ME sichert 7,5 Millionen Euro für biomarkergestützte klinische Netzwerke
  plain_summary: Das Konsortium DISCOVER-ME hat 7,5 Millionen Euro erhalten, um Biobank-Protokolle an über 20 Zentren in Europa und Kanada für künftige Biomarker-Prüfungen zu vereinheitlichen. Es schafft mehrjährige Forschungsinfrastruktur, liefert aber noch keine verfügbaren Tests oder Therapien.
  detail: Das Konsortium European ME Research Group (EMERG) erhielt eine Horizon-Europe-Förderung von 7,5 Millionen Euro zum Start des Projekts „DISCOVER-ME“ unter Leitung von Prof. Eva Untersmayr-Elsenhuber und Prof. Simon Carding. Über mehr als 20 Einrichtungen in Europa und Kanada hinweg sollen standardisierte klinische und Laborprotokolle für europäische Biobanken aufgebaut werden. Ziel ist es, Biomarker über genetische, immunologische, metabolische, neuroendokrine und vaskuläre Bereiche hinweg zu validieren und zugleich Patientenorganisationen einzubinden, um Stratifizierung und künftige Studiendesigns zu gestalten. Damit entsteht eine breite, standardisierte Forschungsinfrastruktur als gemeinsame Grundlage für Biomarker-Validierung und Patientenstratifizierung. Als Infrastrukturinitiative prüft das Projekt weder unmittelbar neue Medikamente noch liefert es sofort nutzbare Praxistests; die Übertragung in klinische Studien und zugelassene Diagnostik wird mehrere Jahre beanspruchen.
