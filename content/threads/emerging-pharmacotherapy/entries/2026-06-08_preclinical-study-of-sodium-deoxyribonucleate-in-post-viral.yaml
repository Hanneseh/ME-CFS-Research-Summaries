en:
  title: Preclinical study of sodium deoxyribonucleate in post-viral chronic fatigue syndrome model
  plain_summary: In a rat model of post-viral fatigue, a single early injection of sodium deoxyribonucleate improved activity, anxiety-like behavior, and blood lactate after exercise, though muscle weakness did not improve. Because this was an acute animal experiment, it does not establish safety or benefit for chronic human ME/CFS.
  detail: In an animal study published in the *Medical academic journal*, Filatenkova et al. evaluated the nucleotide-based drug sodium deoxyribonucleate in a Poly I:C Wistar rat model of post-viral chronic fatigue syndrome. A single administration of the drug on day 1 post-induction improved exploratory activity, reduced anxiety-like behaviors, normalized splenic lymphocyte activities, and normalized post-exercise plasma lactate levels, although muscle weakness was not resolved. Hypothalamic cytokine gene expression was also restored. As a preclinical study in a rodent model, these findings demonstrate early biological pathways and do not represent evidence of clinical efficacy or safety in humans. Furthermore, the drug was administered immediately after induction, representing acute protection/prevention rather than treatment of long-standing chronic illness.
de:
  title: Präklinische Studie zu Natriumdesoxyribonukleat im postviralen CFS-Tiermodell
  plain_summary: In einem Rattenmodell für postvirale Erschöpfung verbesserte eine einmalige frühe Gabe von Natriumdesoxyribonukleat Aktivität, Angstverhalten und Belastungslaktat, während Muskelschwäche bestehen blieb. Als akuter Tierversuch belegt dies weder Sicherheit noch Wirksamkeit bei chronischem ME/CFS am Menschen.
  detail: In einer im *Medical academic journal* veröffentlichten Tierstudie untersuchten Filatenkova et al. den nukleotidbasierten Wirkstoff Natriumdesoxyribonukleat in einem Poly-I:C-Wistar-Rattenmodell des postviralen chronischen Fatigue-Syndroms. Eine einmalige Gabe an Tag 1 nach Auslösung verbesserte das Erkundungsverhalten, verringerte angstähnliche Verhaltensweisen, normalisierte Milzlymphozyten-Aktivitäten und normalisierte Plasmalaktatwerte nach Belastung, obwohl die Muskelschwäche nicht behoben wurde; zudem normalisierte sich die hypothalamische Zytokin-Genexpression. Als präklinische Studie an einem Nagermodell zeigen diese Befunde frühe biologische Signalwege auf, stellen aber keinen Beleg für klinische Wirksamkeit oder Sicherheit beim Menschen dar. Zudem erfolgte die Gabe unmittelbar nach Auslösung des Modells, was eher akuten Schutz bzw. Prävention abbildet als die Behandlung einer langjährigen chronischen Erkrankung.
