en:
  title: Brain phosphorus-MRS links reduced ATP-to-phosphocreatine ratios to cognitive impairment in post-COVID illness
  plain_summary: Conference brain-scan results in 27 post-COVID patients found lower ATP energy-buffer ratios in a key thinking region, matching worse cognitive test scores. This is an early single-center conference finding using specialized scanners that are not widely available.
  detail: Also presented at the International ME/CFS Conference 2026, Gabriele Ende reported whole-brain phosphorus-MRS findings in 27 people with Post-COVID Syndrome and 23 recovered controls, including 11 participants who also met Canadian Consensus Criteria for ME/CFS. The study found reduced ATP-to-phosphocreatine ratios in the cingulate region, and those lower ratios tracked with worse performance on cognitive testing. Functional MRI from the same project showed overlap between the low-energy region and failed anterior cingulate deactivation during a working-memory task, which strengthens the case that the signal reflects a functionally relevant energy-buffering problem rather than an incidental imaging difference. This is important because it moves the metabolic model into direct in vivo brain measurements. It remains an early conference-stage result from a single center using specialized equipment that is not yet widely available.
de:
  title: Phosphor-MRS des Gehirns verknüpft verringerte ATP-zu-Phosphokreatin-Verhältnisse mit kognitiven Einschränkungen bei Post-COVID
  plain_summary: Konferenzdaten aus speziellen Hirnscans bei 27 Post-COVID-Betroffenen zeigten geringere ATP-Energiepuffer in einer wichtigen Hirnregion, passend zu schlechteren Kognitionstests. Es handelt sich noch um einen frühen Einzelzentrums-Befund mit seltener Spezialtechnik.
  detail: Ebenfalls auf der International ME/CFS Conference 2026 stellte Gabriele Ende Befunde der Ganzhirn-Phosphor-MR-Spektroskopie (31P-MRS) bei 27 Menschen mit Post-COVID-Syndrom und 23 genesenen Kontrollpersonen vor, darunter 11 Teilnehmende, die zudem die Kanadischen Konsenskriterien für ME/CFS erfüllten. Die Studie fand verringerte ATP-zu-Phosphokreatin-Verhältnisse im Cingulum, wobei niedrigere Werte mit schlechteren Ergebnissen in kognitiven Tests einhergingen. Funktionelle MRT-Aufnahmen desselben Projekts zeigten eine Überlappung zwischen der energiearmen Region und einer ausbleibenden Deaktivierung des anterioren Cingulums bei einer Arbeitsgedächtnisaufgabe, was dafür spricht, dass das Signal ein funktionell relevantes Energiepufferproblem statt eines Zufallsbefunds widerspiegelt. Dies ist bedeutsam, weil es das Stoffwechselmodell in direkte In-vivo-Messungen des Gehirns überführt. Es bleibt jedoch ein frühes Konferenzergebnis eines einzelnen Zentrums mit hochspezialisierter,
    noch nicht breit verfügbarer Technik.
