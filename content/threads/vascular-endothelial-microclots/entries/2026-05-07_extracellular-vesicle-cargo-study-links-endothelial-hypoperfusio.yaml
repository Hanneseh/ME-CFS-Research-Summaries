en:
  title: Extracellular-vesicle cargo study links endothelial hypoperfusion signals to symptom severity
  plain_summary: Conference data from female ME/CFS patients found altered protein and RNA cargo inside tiny blood-borne cell vesicles, including one microRNA tied to worse fatigue and pain. These are early findings from small female-only groups and are not yet disease-specific.
  detail: Also at the International ME/CFS Conference 2026, Martina Seifert presented extracellular-vesicle profiling from female post-COVID ME/CFS, other post-infectious ME/CFS, and control groups. Basic vesicle size and concentration were not markedly different, but cargo analysis identified altered proteins and lower EV-derived hsa-let-7b-5p in post-COVID ME/CFS, with lower levels correlating with worse fatigue, pain, immune symptoms, and physical functioning. The project also framed these vesicle findings within broader endothelial and glycocalyx injury mechanisms involving autoantibodies, NETs, and prothrombotic factors. This matters because it offers a possible bridge between symptom severity and endothelial signaling rather than treating hypoperfusion as purely structural. It is still early biomarker work from small female cohorts and does not yet establish disease specificity.
de:
  title: Studie zur Fracht extrazellulärer Vesikel verknüpft endotheliale Minderdurchblutungssignale mit Symptomschwere
  plain_summary: Konferenzdaten von Frauen mit ME/CFS fanden veränderte Proteine und Mikro-RNAs in winzigen Transportbläschen im Blut, die mit stärkerer Fatigue und Schmerzen zusammenhingen. Es sind frühe Befunde aus kleinen Frauengruppen ohne nachgewiesene Krankheitsspezifität.
  detail: Ebenfalls auf der International ME/CFS Conference 2026 stellte Martina Seifert Analysen extrazellulärer Vesikel (EVs) bei Frauen mit Post-COVID-ME/CFS, anderem postinfektiösem ME/CFS und Kontrollgruppen vor. Grundlegende Vesikelgröße und -konzentration unterschieden sich kaum, doch die Frachtanalyse zeigte veränderte Proteine und geringere EV-Spiegel von hsa-let-7b-5p bei Post-COVID-ME/CFS; niedrigere Werte korrelierten mit stärkerer Fatigue, Schmerzen, Immunbeschwerden und schlechterer körperlicher Funktion. Das Projekt ordnete diese Befunde zudem in breitere Schädigungsmechanismen von Endothel und Glykokalyx unter Beteiligung von Autoantikörpern, NETs und prothrombotischen Faktoren ein. Die Ergebnisse sind relevant, weil sie eine mögliche Brücke zwischen Symptomschwere und Endothelsignalen schlagen, statt Minderdurchblutung rein strukturell zu erklären. Es handelt sich jedoch noch um frühe Biomarker-Arbeit aus kleinen weiblichen Kohorten ohne Beleg für Krankheitsspezifität.
