en:
  title: Sex- and menopause-related differences in symptom architecture highlight distinct hormonal influences
  plain_summary: A preprint of 748 adults with ME/CFS found that immune and gut symptoms clustered separately in women—with flu-like symptoms more common before menopause—while merging in men. Because it is an unreviewed preprint based on self-reports with far fewer men, it needs peer review and lab confirmation.
  detail: A sex-stratified structural equation modeling and factor analysis preprint involving 748 adults (608 women, 137 men) with ME/CFS examined immune and gastrointestinal symptom architectures. In women, immune symptoms (flu-like symptoms and infection susceptibility) and gut symptoms (gastrointestinal complaints and food intolerances) formed two distinct, separable clusters, whereas in men, all immune and gut symptoms loaded onto a single integrated factor. Furthermore, premenopausal women reported significantly more frequent flu-like symptoms than postmenopausal women, while gastrointestinal symptoms remained stable across menopausal status. This suggests that ME/CFS manifests with different biological and symptom structures between sexes, and that female hormones may dynamically modulate immune pathways, highlighting the necessity of sex-stratified trial designs. As a preprint, these findings remain preliminary and have not yet undergone peer review. Additionally, the study relies
    on self-reported dichotomous symptom coding and features a female-skewed sample that reduces comparative statistical power for men.
de:
  title: Geschlechts- und menopausebezogene Unterschiede in der Symptomarchitektur zeigen hormonelle Einflüsse
  plain_summary: Ein Preprint mit 748 Erwachsenen mit ME/CFS fand, dass Immun- und Magen-Darm-Beschwerden bei Frauen getrennte Gruppen bildeten – wobei grippeähnliche Symptome vor den Wechseljahren häufiger waren –, während sie bei Männern zusammenfielen. Da es ein unbegutachteter Preprint auf Selbstberichtsbasis mit deutlich weniger Männern ist, stehen Peer-Review und Laborbestätigung noch aus.
  detail: Ein Preprint mit geschlechtsstratifizierter Strukturgleichungsmodellierung und Faktorenanalyse bei 748 Erwachsenen (608 Frauen, 137 Männer) mit ME/CFS untersuchte immunologische und gastrointestinale Symptomstrukturen. Bei Frauen bildeten Immunbeschwerden (grippeähnliche Symptome und Infektanfälligkeit) sowie Darmbeschwerden (gastrointestinale Probleme und Nahrungsmittelunverträglichkeiten) zwei trennbare Cluster, während bei Männern sämtliche Immun- und Darmsymptome auf einen gemeinsamen Faktor luden. Zudem berichteten prämenopausale Frauen signifikant häufiger über grippeähnliche Symptome als postmenopausale Frauen, während gastrointestinale Beschwerden über den Menopausenstatus hinweg stabil blieben. Das deutet darauf hin, dass sich ME/CFS zwischen den Geschlechtern strukturell unterscheidet und weibliche Sexualhormone Immunpfade dynamisch modulieren – ein Argument für geschlechtsstratifizierte Studiendesigns. Als Preprint sind die Befunde vorläufig und noch nicht begutachtet;
    zudem stützt sich die Arbeit auf selbstberichtete binäre Symptomangaben und eine stark weiblich geprägte Stichprobe mit geringerer statistischer Aussagekraft für Männer.
