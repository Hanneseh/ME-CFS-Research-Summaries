en:
  title: Endothelial senescence framework links immune clearance failure to chronic tissue perfusion deficits
  plain_summary: A theoretical paper suggested that if worn-out immune cells fail to clear damaged blood-vessel lining cells ('zombie cells'), those lingering cells could promote clotting and poor blood flow. It connects immune and vascular ideas nicely on paper, but has not yet been tested with actual patient measurements.
  detail: A theoretical model proposed that virus-induced endothelial senescence ("zombie cells") is a primary driver of ME/CFS and Long COVID. In this model, impaired immune clearance allows senescent cells to persist and release SASP factors, promoting microvascular clotting and restricting regional blood flow. This provides a mechanistic bridge connecting cellular immune dysfunction (impaired NK and CD8+ T cell cytotoxicity) to vascular perfusion deficits, explaining symptoms like post-exertional malaise and brain fog. However, as a theoretical framework, this model requires empirical validation in clinical cohorts using specific senescent endothelial cell biomarkers.
de:
  title: Modell der Endothelseneszenz verknüpft gestörte Immunbeseitigung mit chronischen Durchblutungsdefiziten
  plain_summary: Eine theoretische Arbeit schlägt vor, dass geschwächte Abwehrzellen gealterte Gefäßwandzellen („Zombie-Zellen“) nicht mehr abräumen, die dann Mikrogerinnsel und Durchblutungsstörungen fördern könnten. Das verbindet Immun- und Gefäßhypothesen schlüssig auf dem Papier, muss aber erst direkt an Patientenproben geprüft werden.
  detail: Ein theoretisches Modell schlug vor, dass eine virusinduzierte Seneszenz der Gefäßinnenhaut („Zombie-Zellen“) ein wesentlicher Treiber von ME/CFS und Long COVID sein könnte. In diesem Modell führt eine geschwächte Immunbeseitigung dazu, dass seneszente Endothelzellen bestehen bleiben und entzündungsfördernde SASP-Faktoren freisetzen, die Mikrogerinnsel begünstigen und die regionale Durchblutung einschränken. Dies schlägt eine mechanistische Brücke von der zellulären Immundysfunktion (eingeschränkte NK- und CD8+-T-Zell-Zytotoxizität) zu vaskulären Durchblutungsdefiziten und Beschwerden wie PEM und Brain Fog. Als rein theoretischer Entwurf erfordert das Modell jedoch erst eine empirische Überprüfung in klinischen Kohorten anhand spezifischer Biomarker für seneszente Endothelzellen.
