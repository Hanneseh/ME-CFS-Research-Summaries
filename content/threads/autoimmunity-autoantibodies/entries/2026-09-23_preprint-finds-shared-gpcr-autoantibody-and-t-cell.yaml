en:
  title: Preprint finds shared GPCR autoantibody and T-cell features in post-COVID and post-vaccination syndromes
  plain_summary: In a small, non-peer-reviewed preprint, people with post-COVID syndrome and post-vaccination syndrome showed similar elevations in certain GPCR antibodies and T cells compared with controls. Because the groups were small and measured at one timepoint, these findings cannot establish a diagnostic test or prove spike protein causes symptoms.
  detail: In an un-peer-reviewed medRxiv preprint, Dinser et al. compared 28 individuals with post-acute COVID-19 syndrome (PACS), 29 with post-acute COVID-19 vaccination syndrome (PACVS), and 16 convalescent controls in a cross-sectional immunophenotyping study from Ruhr-University Bochum. The two post-exposure cohorts showed substantial clinical overlap, with β2-adrenergic receptor autoantibodies elevated above controls in both groups and parallel increases in CD4 T cells reactive to β1/β2-adrenergic and M3/M4 muscarinic receptors alongside detectable circulating spike protein, while conventional immunophenotyping differed between the PACS and PACVS groups on only 3 of 57 parameters (unadjusted). The study is limited by small cohort sizes, cross-sectional design without multi-testing adjustment, reliance on abstract-level data, and unclear ME/CFS case-definition application despite the collection of Canadian Consensus Criteria questionnaires and Bell disability scores. These findings do
    not establish GPCR autoantibodies as diagnostic markers, nor do they prove that circulating spike protein is causally driving post-vaccination or post-COVID symptoms, making therapeutic extrapolation speculative. The report connects thematically to the post-vaccination findings discussed under [Diagnostics & Biomarkers](thread:diagnostics-biomarkers) and to monoclonal antibody work from the same Bochum group in [Antivirals & Monoclonal Antibodies](thread:antivirals-monoclonals), although cohort overlap between the studies is unestablished.
de:
  title: Preprint findet gemeinsame GPCR-Autoantikörper- und T-Zell-Merkmale bei Post-COVID- und Post-Vakzin-Syndromen
  plain_summary: In einem kleinen, noch nicht begutachteten Preprint zeigten Personen mit Post-COVID- und Post-Vakzin-Syndrom im Vergleich zu Kontrollen ähnliche Erhöhungen bestimmter GPCR-Antikörper und T-Zellen. Wegen kleiner Gruppengrößen und Querschnittsdesign belegen die Befunde weder einen Diagnosetest noch eine ursächliche Rolle des Spike-Proteins.
  detail: 'In einem nicht begutachteten medRxiv-Preprint verglichen Dinser et al. von der Ruhr-Universität Bochum in einer Querschnitts-Immunphänotypisierungsstudie 28 Personen mit postakutem COVID-19-Syndrom (PACS), 29 mit postakutem COVID-19-Vakzin-Syndrom (PACVS) und 16 rekonvaleszente Kontrollen. Die beiden Gruppen nach Exposition zeigten eine deutliche klinische Überschneidung: Autoantikörper gegen den β2-adrenergen Rezeptor waren in beiden Gruppen gegenüber Kontrollen erhöht, begleitet von parallelen Anstiegen von CD4-T-Zellen mit Reaktivität gegen β1/β2-adrenerge sowie M3/M4-muskarinische Rezeptoren und nachweisbarem zirkulierendem Spike-Protein, während sich die konventionelle Immunphänotypisierung zwischen PACS und PACVS nur in 3 von 57 Parametern (unadjustiert) unterschied. Die Studie ist durch kleine Kohortengrößen, ein Querschnittsdesign ohne Adjustierung für multiples Testen, die Auswertung auf Abstract-Ebene sowie eine unklare Anwendung von ME/CFS-Falldefinitionen trotz Erhebung
    von Kanadischen Konsenskriterien-Fragebögen und Bell-Skalenwerten eingeschränkt. Diese Befunde etablieren GPCR-Autoantikörper nicht als diagnostische Marker und beweisen auch nicht, dass zirkulierendes Spike-Protein ursächlich Post-Vakzin- oder Post-COVID-Symptome auslöst, sodass therapeutische Ableitungen spekulativ bleiben. Der Bericht knüpft thematisch an die Post-Vakzin-Befunde unter [Diagnostik & Biomarker](thread:diagnostics-biomarkers) und an Arbeiten zu monoklonalen Antikörpern derselben Bochumer Gruppe unter [Antivirale Therapien & monoklonale Antikörper](thread:antivirals-monoclonals) an, wobei eine Kohortenüberschneidung zwischen den Studien nicht geklärt ist.'
