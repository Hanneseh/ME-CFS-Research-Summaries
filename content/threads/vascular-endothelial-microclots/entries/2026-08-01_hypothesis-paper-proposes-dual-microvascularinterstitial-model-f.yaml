en:
  title: Hypothesis paper proposes dual microvascular–interstitial model for peripheral Long COVID symptoms
  plain_summary: A hypothesis paper proposes that tiny clots inside capillaries combine with thickened gel-like tissue fluid outside them to block oxygen from reaching muscle cells. It presents a theoretical idea without new patient or lab data.
  detail: A hypothesis article in the Journal of Bodywork & Movement Therapies proposes a dual-compartment pathophysiological model combining capillary microclot obstruction with accumulation of viscous extracellular material (such as hyaluronan) in the interstitial and fascial spaces. The model argues that microvascular perfusion failure and tissue-side matrix thickening jointly restrict oxygen transfer and alter mechanotransduction, contributing to persistent muscular pain, tissue stiffness, and fatigue in Long COVID and related conditions including ME/CFS. Therapeutically, it suggests that both microvascular clot clearance and restoration of extracellular matrix compliance may need to be addressed. The paper synthesizes existing concepts and does not present new experimental data; direct tissue biopsy and interstitial fluid measurements would be needed to confirm the proposed mechanism.
de:
  title: Hypothesenpapier schlägt duales mikrovaskulär-interstitielles Modell für periphere Long-COVID-Beschwerden vor
  plain_summary: Ein theoretisches Papier schlägt vor, dass Mikrogerinnsel in Kapillaren gemeinsam mit einer verdickten Gewebsflüssigkeit außerhalb der Gefäße die Sauerstoffabgabe bremsen. Neue Labor- oder Patientendaten liefert der Artikel nicht.
  detail: Ein Hypothesenartikel im *Journal of Bodywork & Movement Therapies* schlägt ein Zwei-Kompartiment-Krankheitsmodell vor, das eine Verstopfung von Kapillaren durch Mikrogerinnsel mit der Ansammlung zäher extrazellulärer Substanzen (wie Hyaluronan) in den Zwischenzell- und Faszienräumen kombiniert. Nach diesem Modell schränken mikrovaskuläre Durchblutungsstörungen und eine gewebeseitige Matrixverdickung gemeinsam den Sauerstoffübertritt ein und verändern die Mechanotransduktion, was zu anhaltenden Muskelschmerzen, Gewebesteifigkeit und Fatigue bei Long COVID und verwandten Erkrankungen wie ME/CFS beitragen könnte. Therapeutisch legt der Ansatz nahe, sowohl die Beseitigung mikrovaskulärer Gerinnsel als auch die Wiederherstellung der Geschmeidigkeit der extrazellulären Matrix anzugehen. Die Arbeit führt bestehende Konzepte zusammen und präsentiert keine neuen experimentellen Daten; zur Überprüfung wären direkte Gewebebiopsien und Messungen der Zwischenzellflüssigkeit nötig.
