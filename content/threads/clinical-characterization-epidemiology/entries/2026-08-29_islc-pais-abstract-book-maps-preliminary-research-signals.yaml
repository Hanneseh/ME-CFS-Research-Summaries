en:
  title: ISLC-PAIS abstract book maps preliminary research signals and PEM-safe methods
  plain_summary: The 2026 ISLC-PAIS conference abstract book gathers early studies across Long COVID and ME/CFS, highlighting blood-vessel, immune, metabolic, and low-burden testing ideas. Because conference abstracts are preliminary and uneven, they cannot prove treatment safety or effectiveness.
  detail: The official ISLC-PAIS 2026 abstract book compiles preliminary observational, mechanistic, diagnostic, and interventional reports across Long COVID, ME/CFS, POTS, and related syndromes. It highlights converging vascular, metabolic, immune, and CNS hypotheses and the need for passive or lower-burden alternatives to maximal CPET, but it is a heterogeneous compendium rather than one study and provides no single denominator or pooled effect. Severe and bedbound inclusion is not consistent across abstracts, and treatment methods, adverse events, and follow-up are incomplete; the conference material therefore cannot establish efficacy or safety. Its value here is as a map of active research and study-design concerns, not as a clinical recommendation.
de:
  title: ISLC-PAIS-Abstractband kartiert vorläufige Forschungssignale und PEM-schonende Methoden
  plain_summary: Der Abstractband zur ISLC-PAIS-Konferenz 2026 bündelt frühe Beiträge zu Long COVID und ME/CFS rund um Gefäß-, Immun-, Stoffwechsel- und belastungsarme Testansätze. Da Konferenzabstracts vorläufig und uneinheitlich sind, belegen sie weder Wirksamkeit noch Sicherheit von Therapien.
  detail: Der offizielle Abstractband der ISLC-PAIS 2026 fasst vorläufige beobachtende, mechanistische, diagnostische und interventionelle Berichte zu Long COVID, ME/CFS, POTS und verwandten Syndromen zusammen. Hervorgehoben werden konvergierende vaskuläre, metabolische, immunologische und zentralnervöse Hypothesen sowie der Bedarf an passiven oder belastungsärmeren Alternativen zur maximalen Spiroergometrie (CPET); allerdings handelt es sich um eine heterogene Sammlung statt einer Einzelstudie ohne gemeinsame Grundgesamtheit oder gepoolte Effekte. Der Einbezug schwer Betroffener und Bettlägeriger ist uneinheitlich, und Angaben zu Behandlungsmethoden, Nebenwirkungen und Nachbeobachtung bleiben unvollständig. Das Konferenzmaterial dient als Landkarte aktiver Forschung und Studiendesign-Fragen, nicht als klinische Empfehlung.
