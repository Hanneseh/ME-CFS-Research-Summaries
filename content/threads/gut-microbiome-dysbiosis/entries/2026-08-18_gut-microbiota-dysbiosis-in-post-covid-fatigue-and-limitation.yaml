en:
  title: Pilot study finds unadjusted gut taxon shifts in ME/CFS-like Post-COVID subgroup despite similar overall diversity
  plain_summary: A small Spanish pilot study of 50 people found no overall drop in gut microbiome diversity in Post-COVID Condition, though certain bacteria—most notably *Escherichia/Shigella*—were higher in patients with ME/CFS-like symptoms. Because those differences vanished after accounting for digestive symptoms and vaccine doses, the results are purely exploratory.
  detail: "In a cross-sectional pilot study published in *BMC Microbiology*, Carpallo-Porcar, García-Martínez, Jiménez-Sánchez, and colleagues examined gut microbiota composition and predicted functional pathways in 50 participants from Aragón, Spain (30 with Post-COVID Condition [PCC] and 20 healthy controls). PCC participants were stratified by the presence of ME/CFS-like symptoms (PCC-CFS vs. PCC-NCFS) and functional limitation measured via the 6-Minute Walking Test (see [Clinical Characterization & Epidemiology](thread:clinical-characterization-epidemiology)). Overall alpha and beta diversity did not differ significantly across groups, yet unadjusted differential-abundance testing identified taxon-level differences: *Escherichia/Shigella* was enriched in the ME/CFS-like PCC subgroup relative to controls (both overall and among those without walking-test limitation), while controls carried higher *Streptococcus* and *Veillonella* and the non-CFS PCC subgroup showed higher *Flavonifractor* and *Hungatella*. Crucially, once the analysis was adjusted for digestive symptoms and COVID-19 vaccine doses, these taxonomic associations attenuated and none remained statistically significant, indicating that confounding factors may explain part or all of the raw differences. Similarly, PICRUSt2 computational predictions pointing to nucleotide and amino acid metabolism pathways did not survive multiple-testing correction. Given the small subgroup sample sizes, cross-sectional observational design, indirect 16S-based functional inference, and reliance on an ambulatory 6-Minute Walking Test that excludes housebound and bedbound individuals, the authors emphasize that the findings remain strictly hypothesis-generating."
de:
  title: Pilotstudie findet unbereinigte Darmbakterien-Verschiebungen in ME/CFS-ähnlicher Post-COVID-Untergruppe trotz ähnlicher Gesamtdiversität
  plain_summary: Eine kleine spanische Pilotstudie mit 50 Personen fand bei Post-COVID insgesamt keinen Verlust der Darmmikrobiom-Vielfalt, wohl aber höhere Werte bestimmter Bakterien – vor allem *Escherichia/Shigella* – bei Betroffenen mit ME/CFS-ähnlichen Beschwerden. Da diese Unterschiede nach Berücksichtigung von Verdauungssymptomen und Impfdosen verschwanden, sind die Befunde rein explorativ.
  detail: In einer Querschnitts-Pilotstudie in *BMC Microbiology* untersuchten Carpallo-Porcar, García-Martínez, Jiménez-Sánchez und Kolleginnen die Zusammensetzung der Darmmikrobiota sowie rechnerisch vorhergesagte Stoffwechselwege bei 50 Teilnehmenden aus Aragón in Spanien (30 mit Post-COVID-Zustand [PCC] und 20 gesunde Kontrollen). Die PCC-Gruppe wurde nach dem Vorliegen ME/CFS-ähnlicher Symptome (PCC-CFS vs. PCC-NCFS) sowie nach funktioneller Einschränkung im 6-Minuten-Gehtest unterteilt (siehe [Klinische Charakterisierung & Epidemiologie](thread:clinical-characterization-epidemiology)). Die gesamte Alpha- und Beta-Diversität unterschied sich nicht signifikant zwischen den Gruppen; unbereinigte Analysen einzelner Taxa zeigten jedoch eine Anreicherung von *Escherichia/Shigella* in der ME/CFS-ähnlichen PCC-Untergruppe gegenüber Kontrollen (sowohl insgesamt als auch ohne Gehtest-Einschränkung), höhere Anteile von *Streptococcus* und *Veillonella* bei Kontrollen sowie mehr *Flavonifractor* und *Hungatella* in der PCC-Gruppe ohne ME/CFS-Symptome. Entscheidend war, dass sich diese Zusammenhänge nach Bereinigung um Verdauungsbeschwerden und Impfdosen abschwächten und keiner mehr statistisch signifikant blieb – ein Hinweis auf mögliche Störfaktoren. Auch mittels PICRUSt2 abgeleitete Unterschiede im Nukleotid- und Aminosäurestoffwechsel hielten einer Korrektur für multiples Testen nicht stand. Angesichts der kleinen Untergruppen, des beobachtenden Querschnittsdesigns, indirekter rechnerischer Funktionsableitungen und des ambulanten 6-Minuten-Gehtests, der hausgebundene und bettlägerige Betroffene ausschließt, stufen die Autorinnen die Ergebnisse ausdrücklich als rein hypothesengenerierend ein.
