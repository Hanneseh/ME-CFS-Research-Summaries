sources:
- label: 'Initial evidence for mind body retraining intervention ''The Switch'' for those with idiopathic chronic fatigue (Fatigue: Biomedicine, Health & Behavior 2026)'
  url: https://tandfonline.com/doi/pdf/10.1080/21641846.2026.2694949
