en:
  title: Regulatory T-cell and oxidative/nitrosative stress biomarker profiles differ across ME/CFS, Long COVID, and controls
  plain_summary: A blood study of 294 people found that combining regulatory T-cell measurements with oxidative and nitrosative stress markers separated ME/CFS patients from healthy controls well (AUC 0.91–0.92), but separated Long COVID from controls only modestly. Because these are exploratory group comparisons without external validation and did not track symptom severity directly, they do not constitute a clinical diagnostic test.
  detail: In a cross-sectional case-control study published in the *International Journal of Molecular Sciences*, Todorova, Dimitrova, Kalfova, and colleagues profiled peripheral blood regulatory and effector T-cell subsets via multiparameter flow cytometry alongside 12 serum ELISA markers of oxidative/nitrosative stress and chronic immune activation in 125 ME/CFS patients, 89 Long COVID patients, and 80 healthy controls (n = 294). A five-marker immune-serum signature—including Th17 cells, CD15s+CD161− effector Tregs, and CD161+ Tregs—distinguished the three groups and remained significant after adjusting for age, BMI, and sex. Altered T-cell subsets correlated strongly with markers of oxidative stress (GPX1) and nitrosative stress (NOS3), though not directly with clinical symptom severity scores (see [Immune Dysregulation & Inflammation](thread:immune-dysregulation-inflammation)). Classification models showed strong internal separation of ME/CFS from healthy controls (Random Forest AUC 0.907; logistic regression AUC 0.924) but only modest separation of Long COVID from controls (AUC 0.727 and 0.577), with malondialdehyde (MDA) emerging as an independent predictor across patient-versus-control comparisons and GPX1 distinguishing ME/CFS from Long COVID. The authors suggest that while ME/CFS and Long COVID share oxidative-stress and T-cell dysregulation signals, they may differ in cellular damage burden or exhaustion of compensatory pathways—yet they also note that cohort differences such as illness duration, vaccination history, and Long COVID endotypic diversity could contribute. As an exploratory, single-study cross-sectional analysis lacking external validation, non-post-infectious disease controls, and reporting on severe or bedbound patient inclusion, this panel is not ready for clinical diagnostic use.
de:
  title: Profile regulatorischer T-Zellen und oxidativer/nitrosativer Stressmarker unterscheiden sich zwischen ME/CFS, Long COVID und Kontrollen
  plain_summary: Eine Blutstudie mit 294 Teilnehmenden zeigte, dass eine Kombination aus regulatorischen T-Zell-Messungen und Markern für oxidativen sowie nitrosativen Stress ME/CFS-Betroffene gut von gesunden Kontrollen trennte (AUC 0,91–0,92), Long COVID jedoch nur mäßig. Da es sich um explorative Gruppenvergleiche ohne externe Validierung handelt und die Marker nicht direkt mit der Symptomschwere zusammenhingen, ergibt sich daraus noch kein klinischer Diagnosetest.
  detail: In einer Querschnitts-Fall-Kontroll-Studie im *International Journal of Molecular Sciences* untersuchten Todorova, Dimitrova, Kalfova und Kolleginnen per Multiparameter-Durchflusszytometrie regulatorische und Effektor-T-Zell-Untergruppen aus dem Blut sowie 12 Serum-ELISA-Marker für oxidativen/nitrosativen Stress und chronische Immunaktivierung bei 125 Menschen mit ME/CFS, 89 mit Long COVID und 80 gesunden Kontrollen (n = 294). Eine Fünf-Marker-Signatur aus Immun- und Serumwerten – darunter Th17-Zellen, CD15s+CD161−-Effektor-Tregs und CD161+-Tregs – unterschied die drei Gruppen und blieb nach Bereinigung um Alter, BMI und Geschlecht signifikant. Die veränderten T-Zell-Untergruppen korrelierten stark mit Markern für oxidativen Stress (GPX1) und nitrosativen Stress (NOS3), jedoch nicht direkt mit klinischen Symptomscores (siehe [Immundysregulation & Entzündung](thread:immune-dysregulation-inflammation)). Klassifikationsmodelle trennten ME/CFS intern deutlich von gesunden Kontrollen (Random Forest AUC 0,907; logistische Regression AUC 0,924), Long COVID hingegen nur schwach bis mäßig (AUC 0,727 bzw. 0,577); Malondialdehyd (MDA) war ein unabhängiger Prädiktor für Patienten-Kontroll-Vergleiche, während GPX1 zwischen ME/CFS und Long COVID unterschied. Die Autorinnen vermuten, dass sich ME/CFS und Long COVID trotz geteilter Signale bei oxidativem Stress und T-Zell-Dysregulation im Ausmaß zellulärer Schädigung oder erschöpfter Gegenregulation unterscheiden könnten, weisen aber selbst darauf hin, dass auch Kohortenunterschiede wie Krankheitsdauer, Impfstatus und biologische Untergruppen bei Long COVID dazu beitragen können. Als explorative, einmalige Querschnittsanalyse ohne externe Validierung, ohne andere chronische Krankheitskontrollen und ohne Angaben zum Einschluss schwer oder bettlägerig Betroffener ist dieses Panel kein klinischer Diagnosetest.
