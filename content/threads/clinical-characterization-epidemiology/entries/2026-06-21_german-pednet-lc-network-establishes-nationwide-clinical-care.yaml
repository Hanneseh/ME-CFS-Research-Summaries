en:
  title: German PEDNET-LC network establishes nationwide clinical care and registry infrastructure for pediatric syndromes
  plain_summary: Germany's €41–45 million PEDNET-LC network links 20 pediatric centers to standardize care and build a national registry for children with Long COVID and ME/CFS. As a conference overview of new infrastructure, it does not report clinical outcomes yet.
  detail: In a presentation at the Internationale ME/CFS-Konferenz 2026, the structure and objectives of the new PEDNET-LC network were outlined. Funded with approximately €41-45 million by the German Federal Ministry of Health (BMG), this initiative connects 20 specialized care centers, pain clinics, rehabilitation facilities, and research institutes across Germany. The network aims to standardize pediatric diagnostic tools, establish clinical care pathways, and build a centralized registry to collect longitudinal clinical and biological data for children and adolescents suffering from Long COVID, post-vaccination syndromes, and ME/CFS. This builds substantial national clinical and research infrastructure specifically tailored to pediatric cohorts, a population historically facing severe care shortages, and creates a structured dataset to support future clinical trials. As a conference presentation, it focused on infrastructure and registry design rather than final clinical outcomes or
    mechanistic discoveries. Furthermore, the registry and care pathways are currently restricted to the German healthcare system.
de:
  title: Deutsches Netzwerk PEDNET-LC baut bundesweite Versorgungs- und Registerstruktur für pädiatrische Syndrome auf
  plain_summary: Das mit rund 41–45 Millionen Euro geförderte deutsche Netzwerk PEDNET-LC vernetzt 20 Kinderzentren, um Versorgungspfade zu vereinheitlichen und ein zentrales Register für Kinder mit Long COVID und ME/CFS aufzubauen. Da es sich um einen Konferenzbericht zur neuen Infrastruktur handelt, liegen noch keine Behandlungsergebnisse vor.
  detail: In einem Vortrag auf der Internationalen ME/CFS-Konferenz 2026 wurden Struktur und Ziele des neuen Netzwerks PEDNET-LC vorgestellt. Gefördert mit rund 41–45 Millionen Euro durch das Bundesministerium für Gesundheit (BMG) verbindet diese Initiative 20 spezialisierte Versorgungszentren, Schmerzkliniken, Rehabilitationseinrichtungen und Forschungsinstitute in ganz Deutschland. Ziel des Netzwerks ist es, pädiatrische Diagnoseinstrumente zu standardisieren, klinische Versorgungspfade zu etablieren und ein zentrales Register aufzubauen, das klinische und biologische Verlaufsdaten von Kindern und Jugendlichen mit Long COVID, Post-Vakzin-Syndromen und ME/CFS sammelt. Damit entsteht eine breite nationale Versorgungs- und Forschungsinfrastruktur speziell für junge Betroffene, die bislang besonders unter Versorgungsmangel litten, sowie eine strukturierte Datengrundlage für künftige Studien. Als Konferenzbeitrag standen Infrastruktur und Registerdesign im Fokus, noch keine klinischen Endpunkte
    oder mechanistischen Befunde; zudem beschränken sich Register und Pfade derzeit auf das deutsche Gesundheitssystem.
