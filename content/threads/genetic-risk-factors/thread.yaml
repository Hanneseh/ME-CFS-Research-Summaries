en:
  title: Genetic Risk Factors
  subtitle: A living thread on GWAS, whole-genome sequencing, Mendelian randomization, genetic correlations, rare monogenic variation, combinatorial genetic analysis, and gene-prioritization studies in ME/CFS.
  evidence_label: early replication, landmark GWAS published
  plain_summary: Large DNA studies show that inherited genetic differences play a real role in who develops ME/CFS, pointing toward immune, pain, brain, and cellular energy pathways—and showing no genetic overlap with depression or anxiety. While landmark projects like DecodeME have found the first clear genetic signals, different studies still disagree on specific regions depending on how patients were diagnosed. These genetic clues help map the biology of the illness, though they cannot yet be used for diagnosis or to guide treatment.
  takeaway: 'Genetic research into ME/CFS has moved from underpowered candidate-gene studies to large-scale genome-wide findings. The DecodeME genome-wide association study—the largest ME/CFS genetic study to date, comparing 15,579 cases against 259,909 controls—identified eight genome-wide significant loci pointing to immune response genes (BTN2A2, OLFM4, RABGAP1L) and a neurological pain signal (CA10). Critically, the genetic risk profile did not overlap with depression or anxiety, providing objective biological evidence that distinguishes ME/CFS from psychiatric conditions. Complementary methods including Mendelian randomization, combinatorial analytics, epigenetic profiling, protein quantitative trait loci (pQTL) analysis, and whole-genome sequencing (WGS) have independently converged on immune dysregulation, neurological dysfunction, energy metabolism, and calcium signaling as biologically grounded disease pathways.


    The picture emerging across studies is of a polygenic, highly heterogeneous condition in which both common variants with small individual effects and rare variants with large individual effects contribute to risk. Combinatorial analysis of the DecodeME cohort identified over 22,000 reproducible multi-SNP signatures across 2,311 unique genes, and WGS of 31 participants from 25 families found pathogenic or likely pathogenic variants in 39% of affected individuals—predominantly affecting ATP generation and oxidative phosphorylation. Salivary epigenetic profiling has also linked DNA hypomethylation of the *PTPRN2* gene body and associated mitochondrial inner membrane protein (PHB2) interactions to cognitive symptoms like brain fog, though in a small cohort. A meta-GWAS combining DecodeME and the Million Veteran Program (MVP) found significant enrichment in brain regions (cerebellum, frontal cortex) and glutamatergic synapse gene sets, whereas no peripheral tissue reached significance, pointing
    toward a central neurobiological dimension of risk. A biobank GWAS preprint, by contrast, reported loci replicated across cohorts that do not overlap DecodeME, leaving cross-study replication unresolved; differences in case definition may contribute. Recent work has expanded host genomic analysis to non-European admixed cohorts and identified peripheral whole-blood DNA methylation shifts at NMDA receptor genes linked to biological aging in post-COVID cohorts. Across all approaches, evidence is early; causal pathways are plausible but not yet clinically actionable, and findings in post-COVID or Long COVID cohorts require validation in strictly phenotyped ME/CFS populations with confirmed post-exertional malaise.'
  why_it_matters: Establishing the genetic architecture of ME/CFS provides an objective biological anchor for a disease that has been historically contested. Identifying heritable risk loci enables mechanistic hypothesis generation, drug-target discovery, and patient stratification—essential preconditions for designing treatments that address root causes rather than symptoms. The finding of shared genetic risk with Long COVID supports the hypothesis that post-viral illness has a genetically predisposed substrate, opening the possibility that findings in one condition may accelerate research in the other. Mendelian randomization adds causal inference beyond association, identifying higher mitochondrial DNA copy number as protective and increased mean platelet volume as a risk factor—biomarker candidates that could eventually support stratified trial design.
  state_of_evidence:
  - status: established
    label: Established
    items:
    - ME/CFS has a heritable component. The DecodeME GWAS produced the first genome-wide significant loci with stringent case definitions requiring post-exertional malaise. These loci cluster around immune and neurological function, and the risk profile does not overlap genetically with depression or anxiety.
  - status: plausible
    label: Plausible but early
    items:
    - Peer-reviewed combinatorial multi-SNP signatures (neurological dysregulation, cellular stress, calcium signaling) are reproducible across independent patient subgroups within the DecodeME cohort and show genetic overlap with Long COVID. Rare monogenic variants in energy metabolism and synaptic signaling pathways are found in a substantial minority of affected families in small WGS studies. Mendelian randomization implicates mitochondrial DNA copy number and platelet characteristics as potential causal factors. Genetic variants affecting metabolite levels (HSD11B1, SCGN) suggest a partly heritable metabolic phenotype. Glutamatergic synapse enrichment in a two-dataset meta-GWAS converges with rare WGS variant signals in the same neuronal gene sets. Salivary epigenetic hypomethylation of the *PTPRN2* gene body and associated mitochondrial *PHB2* regulation correlate with cognitive symptom severity in small cohorts. Whole-blood DNA methylation alterations at NMDA receptor genes in post-COVID
      cohorts link glutamatergic pathway shifts and accelerated biological aging to cognitive sequelae. Exome-wide machine learning genetic association studies in admixed populations (e.g., Brazilian Long COVID cohorts) identify host risk signatures, extending genomic research into non-European populations. A UK Biobank/All of Us GWAS preprint reports seven loci replicated across cohorts (none significant in all three), which the authors describe as the first cross-cohort replication of ME/CFS risk loci. A Swedish register twin-sibling study (6.1 million relatives) reports modest genetic correlations with immune-mediated diseases across register-diagnosed ME/CFS, IBS, or depression (rA range 0.19–0.29 across these conditions); ICD-coded phenotype without PEM verification.
  - status: not_established
    label: Not established
    items:
    - Causal genetic mechanisms sufficient to diagnose ME/CFS or predict treatment response. Replication of DecodeME GWAS hits in non-European or less strictly defined cohorts. Whether rare monogenic findings in small WGS cohorts generalise to the broader ME/CFS population. Clinical actionability of any identified genetic risk profile. Whether salivary or whole-blood epigenetic changes represent a primary causal mechanism or downstream disease consequence. How biobank-defined and PEM-defined GWAS signals relate, since they have so far not overlapped.
  - status: limitations
    label: Key limitations
    items:
    - Most historical GWAS datasets rely on European-ancestry samples, limiting generalisability, though initial exome-wide machine learning studies in admixed Brazilian cohorts begin addressing demographic gaps. UK Biobank cohorts used as controls or case sources depend on self-reported diagnoses, introducing misclassification risk. Small pQTL, WGS, and epigenetic cohorts require larger external validation. The DecodeME GWAS was not replicated in looser-phenotype biobanks, which the authors attribute to case-definition differences; conversely, loci replicated across biobank cohorts in a 2026 preprint did not overlap DecodeME, and this remains unresolved. Epigenetic findings are limited by small cohorts, cross-sectional design, and peripheral tissue sampling (saliva or whole blood vs. central nervous system tissue). Several recent genomic and epigenetic signatures derive from post-COVID/Long COVID cohorts without confirmed post-exertional malaise, necessitating cautious extrapolation to
      classic ME/CFS. Proprietary combinatorial analytics methods (PrecisionLife) may limit independent replication. A small, women-only TSPO-genotype preprint chiefly cautions that genotype affects PET-tracer binding. Its exploratory association does not establish a disease-risk variant or a diagnostic test.
  open_questions:
  - Do the eight DecodeME GWAS loci replicate in strictly-defined ME/CFS cohorts outside European-ancestry UK populations?
  - What proportion of ME/CFS cases carry rare monogenic variants with large individual effects, as opposed to polygenic common-variant burden alone?
  - Do the convergent neuronal and glutamatergic enrichment signals in meta-GWAS reflect primary CNS pathology, or downstream gene-expression consequences of peripheral immune and metabolic dysfunction?
  - Can the 76 genes shared between ME/CFS and Long COVID genetic profiles identify patient subgroups who are most likely to benefit from common therapeutic strategies?
  - How do heritable metabolic perturbations (HSD11B1, cortisol regeneration, lipid profiles) interact with environmental post-viral triggers in determining who develops ME/CFS after infection?
  - Are host genetic signatures identified in admixed Long COVID cohorts replicated in strictly phenotyped ME/CFS cohorts across diverse ancestral backgrounds?
  - Do peripheral whole-blood DNA methylation alterations at NMDA receptor genes correlate with central nervous system glutamatergic dysregulation or neuroinflammation in post-viral illness?
  - How can non-overlapping signals from PEM-defined (DecodeME) and biobank-defined GWAS be reconciled?
  - Does a sex-dependent effect of depression polygenic risk on post-infective fatigue replicate in adequately powered cohorts?
de:
  title: Genetische Risikofaktoren
  subtitle: Ein fortlaufender Überblick zu GWAS, Gesamtgenom-Sequenzierung, Mendelscher Randomisierung, genetischen Korrelationen, seltenen monogenen Varianten, kombinatorischen Genanalysen und Gen-Priorisierungsstudien bei ME/CFS.
  evidence_label: Frühe Replikation, wegweisende GWAS veröffentlicht
  plain_summary: Große DNA-Studien zeigen, dass erbliche Veranlagungen bei der Entstehung von ME/CFS eine echte Rolle spielen – mit Hinweisen auf Immunsystem, Schmerzverarbeitung, Gehirn und Zellenergie sowie ohne genetische Überschneidung mit Depressionen oder Angststörungen. Während Großprojekte wie DecodeME erste klare Risikosignale gefunden haben, stimmen verschiedene Studien je nach Diagnosekriterien noch nicht in allen Genorten überein. Für einen Diagnosetest oder konkrete Therapien reichen diese Befunde noch nicht aus, sie liefern aber wichtige biologische Anhaltspunkte.
  takeaway: 'Die Genforschung zu ME/CFS hat sich von zu kleinen Einzelgen-Studien zu groß angelegten genomweiten Analysen weiterentwickelt. Die genomweite Assoziationsstudie DecodeME – die bislang größte Genetikstudie zu ME/CFS mit 15.579 Betroffenen und 259.909 Kontrollpersonen – identifizierte acht genomweit signifikante Genorte, die auf Immunantwort-Gene (BTN2A2, OLFM4, RABGAP1L) und ein Signal für chronische Schmerzen (CA10) verweisen. Entscheidend ist, dass sich das genetische Risikoprofil nicht mit Depression oder Angststörungen überschnitt – ein objektiver biologischer Beleg zur Abgrenzung von psychiatrischen Erkrankungen. Ergänzende Verfahren wie Mendelsche Randomisierung, kombinatorische Analytik, Epigenetik, Protein-QTL-Analysen (pQTL) und Gesamtgenom-Sequenzierung (WGS) laufen unabhängig auf Immundysregulation, neurologische Störungen, Energiestoffwechsel und Kalzium-Signalwege als biologisch fundierte Krankheitsmechanismen zu.


    Über alle Studien hinweg entsteht das Bild einer polygenen, stark heterogenen Erkrankung, bei der sowohl häufige Varianten mit kleinem Einzeleffekt als auch seltene Varianten mit großem Effekt zum Risiko beitragen. Eine kombinatorische Analyse der DecodeME-Kohorte fand über 22.000 reproduzierbare Multi-SNP-Signaturen in 2.311 Genen, und eine WGS-Untersuchung von 31 Teilnehmenden aus 25 Familien entdeckte bei 39 % der Betroffenen pathogene oder wahrscheinlich pathogene Varianten – vorwiegend in Genen für ATP-Bildung und oxidative Phosphorylierung. Epigenetische Speichelanalysen verknüpften zudem eine DNA-Hypomethylierung im Genkörper von *PTPRN2* und zugehörige Wechselwirkungen mit dem mitochondrialen Innenmembranprotein PHB2 mit kognitiven Symptomen wie Brain Fog, allerdings in einer kleinen Kohorte. Eine Meta-GWAS aus DecodeME und dem Million Veteran Program (MVP) zeigte eine signifikante Anreicherung in Hirnregionen (Kleinhirn, Frontalkortex) sowie in Gensätzen glutamaterger Synapsen,
    während kein peripheres Gewebe Signifikanz erreichte – ein Hinweis auf eine zentrale neurobiologische Komponente. Ein Preprint zu einer Biobank-GWAS berichtete dagegen über kohortenübergreifend replizierte Genorte ohne Überschneidung mit DecodeME, sodass die studieübergreifende Replikation ungeklärt bleibt; Unterschiede bei der Falldefinition könnten mitwirken. Neuere Arbeiten weiten genomische Analysen zudem auf nicht-europäische gemischte Kohorten aus und identifizieren bei Post-COVID-Betroffenen veränderte DNA-Methylierungsmuster in Vollblut an NMDA-Rezeptor-Genen im Zusammenhang mit biologischer Alterung. Über alle Ansätze hinweg steht die Evidenz noch am Anfang: Kausale Pfade sind plausibel, aber klinisch noch nicht nutzbar, und Befunde aus Post-COVID- oder Long-COVID-Kohorten müssen in streng phänotypisierten ME/CFS-Gruppen mit bestätigter PEM überprüft werden.'
  why_it_matters: Die Aufklärung der genetischen Architektur von ME/CFS schafft einen objektiven biologischen Anker für eine historisch oft angezweifelte Erkrankung. Die Entdeckung erblicher Risiko-Loci ermöglicht mechanistische Hypothesen, die Suche nach Wirkstoffzielen und eine gezielte Patientenstratifizierung – wesentliche Voraussetzungen für Therapien, die Ursachen statt nur Symptome angehen. Der Befund geteilter genetischer Risiken mit Long COVID stützt die Annahme einer gemeinsamen genetischen Empfänglichkeit für postvirale Erkrankungen, sodass Fortschritte bei einer Erkrankung auch die Forschung zur anderen beschleunigen können. Die Mendelsche Randomisierung erlaubt zudem kausale Rückschlüsse über reine Korrelationen hinaus und benennt eine höhere mitochondriale DNA-Kopienzahl als schützend sowie ein erhöhtes mittleres Thrombozytenvolumen als Risikofaktor – mögliche Biomarker-Kandidaten für künftige stratifizierte Studien.
  state_of_evidence:
  - status: established
    label: Gesichert
    items:
    - ME/CFS besitzt eine erbliche Komponente. Die DecodeME-GWAS lieferte die ersten genomweit signifikanten Genorte auf Basis strenger Diagnosekriterien mit verpflichtender Post-Exertional Malaise. Diese Genorte gruppieren sich um Immun- und Nervenfunktionen, und das genetische Risikoprofil überschneidet sich nicht mit Depression oder Angststörungen.
  - status: plausible
    label: Plausibel, aber noch früh
    items:
    - Begutachtete kombinatorische Multi-SNP-Signaturen (neurologische Fehlregulation, Zellstress, Kalzium-Signalgebung) sind über unabhängige Untergruppen innerhalb von DecodeME hinweg reproduzierbar und zeigen genetische Überschneidungen mit Long COVID. Seltene monogene Varianten in Energiestoffwechsel- und Synapsen-Signalwegen finden sich in kleinen WGS-Studien bei einer beträchtlichen Minderheit betroffener Familien. Mendelsche Randomisierung bringt mitochondriale DNA-Kopienzahl und Thrombozyten-Merkmale als mögliche kausale Faktoren ins Spiel. Genvarianten mit Einfluss auf Stoffwechselwerte (HSD11B1, SCGN) deuten auf einen teils erblichen Stoffwechsel-Phänotyp hin. Eine Anreicherung glutamaterger Synapsen in einer Meta-GWAS aus zwei Datensätzen deckt sich mit seltenen WGS-Variantensignalen in denselben neuronalen Gensätzen. Epigenetische Hypomethylierung im Genkörper von *PTPRN2* im Speichel und zugehörige mitochondriale *PHB2*-Regulation korrelieren in kleinen Kohorten mit kognitiven
      Symptomen. DNA-Methylierungsänderungen an NMDA-Rezeptor-Genen im Vollblut von Post-COVID-Kohorten verknüpfen Veränderungen im Glutamat-Signalweg und beschleunigte biologische Alterung mit kognitiven Spätfolgen. Exomweite Machine-Learning-Assoziationsstudien in gemischten Populationen (z. B. brasilianische Long-COVID-Kohorten) finden Wirts-Risikosignaturen und weiten die Genomforschung auf nicht-europäische Gruppen aus. Ein Preprint aus UK Biobank und All of Us berichtet über sieben über Kohorten hinweg replizierte Genorte (keiner in allen drei Gruppen signifikant), was die Autoren als erste kohortenübergreifende Replikation von ME/CFS-Risiko-Loci beschreiben. Eine schwedische Registerstudie an Zwillingen und Geschwistern (6,1 Millionen Verwandte) berichtet über moderate genetische Korrelationen mit immunvermittelten Erkrankungen bei im Register kodiertem ME/CFS, Reizdarmsyndrom oder Depression (rA 0,19–0,29 über diese Diagnosen hinweg) – basierend auf ICD-Codes ohne PEM-Prüfung.
  - status: not_established
    label: Nicht gesichert
    items:
    - Kausale genetische Mechanismen, mit denen sich ME/CFS diagnostizieren oder das Ansprechen auf eine Therapie vorhersagen ließe. Eine Replikation der DecodeME-GWAS-Treffer in nicht-europäischen oder weniger streng definierten Kohorten. Ob seltene monogene Befunde aus kleinen WGS-Gruppen auf die breitere ME/CFS-Population übertragbar sind. Eine direkte klinische Nutzbarkeit der bislang identifizierten genetischen Risikoprofile. Ob epigenetische Veränderungen in Speichel oder Vollblut eine primäre Krankheitsursache oder eine nachgelagerte Krankheitsfolge sind. Wie sich Signale aus Biobank-definierten und PEM-definierten GWAS zueinander verhalten, da sie sich bislang nicht überschneiden.
  - status: limitations
    label: Wichtige Einschränkungen
    items:
    - Die meisten bisherigen GWAS-Datensätze beruhen auf Stichproben europäischer Abstammung, was die Übertragbarkeit begrenzt, auch wenn erste exomweite Machine-Learning-Studien in gemischten brasilianischen Kohorten beginnen, diese Lücke zu schließen. Kontroll- und Fallgruppen in der UK Biobank stützen sich oft auf Selbstauskünfte, was Fehlklassifikationen begünstigt. Kleine pQTL-, WGS- und Epigenetik-Kohorten erfordern größere externe Validierungen. Die DecodeME-GWAS ließ sich in weiter gefassten Biobanken nicht replizieren, was die Autoren auf Unterschiede bei den Falldefinitionen zurückführen; umgekehrt überschnitten sich in einem Preprint von 2026 zwischen Biobanken replizierte Loci nicht mit DecodeME, was bislang ungeklärt ist. Epigenetische Befunde sind durch kleine Gruppen, Querschnittsdesigns und periphere Proben (Speichel oder Vollblut statt Nervengewebe) eingeschränkt. Mehrere neuere genomische und epigenetische Signaturen stammen aus Post-COVID-/Long-COVID-Kohorten ohne gesicherte
      PEM und lassen sich nur vorsichtig auf klassisches ME/CFS übertragen. Proprietäre kombinatorische Analyseverfahren (PrecisionLife) erschweren unabhängige Nachprüfungen. Ein kleiner, rein weiblicher TSPO-Genotyp-Preprint weist vor allem darauf hin, dass der Genotyp die Bindung von PET-Tracern beeinflusst; seine explorative Assoziation belegt weder eine krankheitsrelevante Risikovariante noch einen Diagnosetest.
  open_questions:
  - Lassen sich die acht DecodeME-GWAS-Loci in streng definierten ME/CFS-Kohorten außerhalb britischer Stichproben europäischer Abstammung replizieren?
  - Welcher Anteil der ME/CFS-Betroffenen trägt seltene monogene Varianten mit großem Einzeleffekt im Vergleich zur rein polygenen Last häufiger Varianten?
  - Spiegeln die übereinstimmenden neuronalen und glutamatergen Anreicherungssignale in Meta-GWAS eine primäre Pathologie im zentralen Nervensystem wider oder nachgelagerte Genexpressionsfolgen peripherer Immun- und Stoffwechselstörungen?
  - Können die 76 zwischen ME/CFS und Long COVID geteilten Gene helfen, Patientengruppen abzugrenzen, die am ehesten von gemeinsamen Therapiestrategien profitieren?
  - Wie wirken erbliche Stoffwechselveränderungen (HSD11B1, Cortisol-Regeneration, Lipidprofile) mit postviralen Umweltauslösern zusammen und bestimmen mit, wer nach einer Infektion an ME/CFS erkrankt?
  - Lassen sich die in gemischten Long-COVID-Kohorten gefundenen genetischen Wirts-Signaturen in streng phänotypisierten ME/CFS-Kohorten verschiedener Abstammungen replizieren?
  - Hängen veränderte DNA-Methylierungsmuster an NMDA-Rezeptor-Genen im Vollblut direkt mit glutamaterger Fehlregulation oder Neuroinflammation im zentralen Nervensystem bei postviralen Erkrankungen zusammen?
  - Wie lassen sich die nicht überlappenden Signale aus PEM-definierten (DecodeME) und Biobank-definierten GWAS miteinander vereinbaren?
  - Repliziert sich ein geschlechtsabhängiger Effekt des polygenen Risikoscores für Depression auf postinfektiöse Erschöpfung in ausreichend großen Kohorten?
