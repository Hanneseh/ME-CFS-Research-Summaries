en:
  title: REenergizeME protocol published for a sham-controlled trial of intermittent hypoxia-hyperoxia treatment
  plain_summary: Researchers published the protocol for REenergizeME, a sham-controlled trial testing 8 weeks of alternating low- and high-oxygen breathing (IHHT) in 104 women with ME/CFS. This paper describes only the planned study without results yet, excludes bedbound patients due to frequent clinic visits, and notes low-oxygen challenges carry a theoretical risk of triggering PEM.
  detail: A clinical trial protocol published in *BMJ Open* by Nochi et al. outlines the design of the REenergizeME study, a prospective, randomized, double-blind, sham-controlled trial (NCT07317401) evaluating intermittent hypoxia-hyperoxia treatment (IHHT) in ME/CFS. The trial investigates whether 8 weeks of IHHT—which repeatedly cycles brief intervals of normobaric hypoxia (10–14% O2) and hyperoxia (30–36% O2) to activate hypoxia-inducible factor (HIF) and cellular redox adaptations—can improve mitochondrial bioenergetics and microvascular oxygen extraction. The protocol plans to enroll 104 female participants aged 20–59 meeting the 2011 International Consensus Criteria (ICC), randomizing patients to active IHHT or sham gas and comparing them with a separate, non-randomized healthy-control group. The primary outcome is health-related quality of life measured by the SF-36 vitality subscale, alongside multi-system secondary assessments including near-infrared spectroscopy (NIRS) tissue
    oxygenation, skin biopsy intraepidermal nerve fiber density, corneal confocal microscopy, and autonomic testing over 12 months of follow-up. As a trial protocol, this publication outlines study methodology and mechanistic rationale only and does not report clinical efficacy, tolerability, or safety results. Severely affected and bedbound individuals are explicitly excluded due to the requirement for frequent in-clinic visits over eight weeks, and hypoxic gas challenges carry a theoretical risk of provoking post-exertional malaise in susceptible patients while posing practical challenges for maintaining effective sham blinding.
de:
  title: REenergizeME-Protokoll für eine schein-kontrollierte Studie zur intermittierenden Hypoxie-Hyperoxie-Therapie veröffentlicht
  plain_summary: Forschende veröffentlichten das Studienprotokoll für REenergizeME, eine schein-kontrollierte Studie zu 8 Wochen wechselnder Sauerstoff-Atemtherapie (IHHT) bei 104 Frauen mit ME/CFS. Es liegen noch keine Ergebnisse vor; bettlägerige Betroffene sind wegen häufiger Kliniktermine ausgeschlossen, und Hypoxie-Reize bergen theoretisch ein Risiko, PEM auszulösen.
  detail: Ein in *BMJ Open* von Nochi et al. veröffentlichtes Studienprotokoll beschreibt das Design der REenergizeME-Studie, einer prospektiven, randomisierten, doppelt verblindeten, schein-kontrollierten Studie (NCT07317401) zur intermittierenden Hypoxie-Hyperoxie-Therapie (IHHT) bei ME/CFS. Die Studie untersucht, ob 8 Wochen IHHT – bei der kurze Intervalle normobarer Hypoxie (10–14 % O2) und Hyperoxie (30–36 % O2) zur Aktivierung von HIF und zellulärer Redox-Anpassung wechseln – mitochondriale Bioenergetik und mikrovaskuläre Sauerstoffausschöpfung verbessern können. Geplant ist der Einschluss von 104 weiblichen Teilnehmenden im Alter von 20–59 Jahren nach den International Consensus Criteria (ICC) von 2011, randomisiert zu aktiver IHHT oder Scheingas sowie verglichen mit einer nicht-randomisierten gesunden Kontrollgruppe. Primärer Endpunkt ist die gesundheitsbezogene Lebensqualität auf der SF-36-Vitalitätssubskala, ergänzt durch Nahinfrarotspektroskopie (NIRS), Hautbiopsie-Nervenfaserdichte,
    konfokale Hornhautmikroskopie und autonome Tests über 12 Monate. Als Studienprotokoll enthält die Publikation noch keine Wirksamkeits- oder Sicherheitsdaten; schwer Betroffene und Bettlägerige sind wegen häufiger Klinikbesuche explizit ausgeschlossen, und hypoxische Gasreize bergen ein theoretisches PEM-Risiko sowie praktische Herausforderungen für eine sichere Verblindung.
