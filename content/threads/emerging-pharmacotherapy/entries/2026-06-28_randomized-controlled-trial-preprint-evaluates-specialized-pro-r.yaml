en:
  title: Randomized controlled trial preprint evaluates specialized pro-resolving mediators and telerehabilitation in Post-COVID Condition
  plain_summary: In a 144-person preprint trial of Long COVID patients doing online rehabilitation, adding a marine-oil supplement showed no clear overall difference from placebo after 12 weeks, though shortness of breath improved in the supplement group. Because it has not yet been peer-reviewed and missed its main comparison, effectiveness remains unproven.
  detail: The ARACOV-02 double-blind randomized controlled trial (n=144), published as a preprint, evaluated the combination of a specialized pro-resolving mediator (SPM)-enriched marine oil supplement and a 12-week telerehabilitation program in individuals with Post-COVID-19 Condition. Although no statistically significant between-group differences were observed after 12 weeks, both the treatment and placebo groups showed significant within-group improvements in quality of life, fatigue, and functional capacity (partly due to the active rehabilitation program in both arms). The SPM group demonstrated significant improvements in dyspnea that were absent in the placebo group, and high supplement compliance was associated with broader clinical improvements. As a preprint, this work has not yet undergone formal peer review to validate the findings.
de:
  title: Randomisierte Kontrollstudie als Preprint prüft spezialisierte pro-resolvierende Mediatoren und Telerehabilitation bei Post-COVID-Syndrom
  plain_summary: In einer Preprint-Studie mit 144 Long-COVID-Betroffenen in der Telerehabilitation zeigte ein ergänzendes Fischöl-Präparat nach 12 Wochen insgesamt keinen klaren Unterschied gegenüber Placebo, wobei sich Kurzatmigkeit in der Verumgruppe besserte. Da die Arbeit noch nicht begutachtet ist und der Gesamtvergleich negativ ausfiel, ist eine Wirksamkeit nicht belegt.
  detail: Die als Preprint veröffentlichte doppelt verblindete randomisierte kontrollierte Studie ARACOV-02 (n=144) prüfte die Kombination aus einem mit spezialisierten pro-resolvierenden Mediatoren (SPM) angereicherten Marine-Oil-Präparat und einem 12-wöchigen Telerehabilitations-Programm bei Menschen mit Post-COVID-19-Syndrom. Nach 12 Wochen zeigten sich keine statistisch signifikanten Unterschiede zwischen den Gruppen; sowohl die Verum- als auch die Placebogruppe verzeichneten deutliche Verbesserungen bei Lebensqualität, Fatigue und Belastbarkeit (teilweise bedingt durch die aktive Rehabilitation in beiden Armen). Die SPM-Gruppe zeigte signifikante Besserungen bei Atemnot (Dyspnoe), die in der Placebogruppe ausblieben, und eine hohe Einnahmetreue war mit breiteren Besserungen verknüpft. Als Preprint hat diese Arbeit noch kein formales Peer-Review zur Validierung der Befunde durchlaufen.
