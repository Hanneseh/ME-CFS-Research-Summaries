en:
  title: Conference report surfaces lactate recovery phenotypes
  plain_summary: A conference update from the Bio-SIG PEM project reported distinct blood-lactate clearance patterns after exertion, pointing to possible biological subgroups. Because these findings come from a conference talk, they remain preliminary until published and independently replicated.
  detail: The Bio-SIG PEM presentation reported distinct lactate recovery trajectories in ME/CFS and post-infectious syndromes. The change is a move toward subtyping PEM by metabolic recovery pattern rather than by symptoms alone. That supports the idea that earlier anaerobic shift and slower lactate normalization may help define biologically different phenotypes. Because the source is conference-level reporting, the findings remain preliminary until full peer review and external replication.
de:
  title: Konferenzbericht zeigt unterschiedliche Phänotypen der Laktat-Erholung
  plain_summary: Ein Konferenzbericht aus dem BioSig-PEM-Projekt beschrieb unterschiedliche Verläufe beim Laktatabbau nach Belastung und deutete damit auf mögliche biologische Untergruppen hin. Da es sich um vorläufige Tagungsdaten handelt, stehen Begutachtung und unabhängige Bestätigung noch aus.
  detail: Die Präsentation zu Bio-SIG PEM berichtete über unterschiedliche Verläufe der Laktat-Erholung bei ME/CFS und postinfektiösen Syndromen. Dies markiert eine Bewegung hin zur Subtypisierung von PEM anhand metabolischer Erholungsmuster statt allein nach Symptomen. Das stützt die Vorstellung, dass ein früherer Wechsel in den anaeroben Bereich und ein langsamerer Laktatabbau biologisch unterschiedliche Phänotypen abgrenzen könnten. Da die Quelle ein Konferenzbericht ist, bleiben die Befunde bis zur vollständigen Peer-Review-Publikation und externen Replikation vorläufig.
