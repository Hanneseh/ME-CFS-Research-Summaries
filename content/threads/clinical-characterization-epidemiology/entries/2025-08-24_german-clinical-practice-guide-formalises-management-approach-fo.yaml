en:
  title: German clinical practice guide formalises management approach for primary care
  plain_summary: A German medical society published a practical primary-care guide centered on pacing, symptom-targeted medications, and treating related conditions like POTS. It does not report new trial data, but gives family doctors clear guidance and warns against graded exercise therapy.
  detail: 'The Deutsche Gesellschaft für ME/CFS published a comprehensive practice guide for German-speaking clinicians, synthesizing international diagnostic criteria—IOM, Canadian Consensus Criteria, NICE 2021—into a practical framework for general practitioners. The guide explicitly codes ME/CFS as a severe neuroimmunological disease with typical diagnostic delays of six to seven years in Germany, and notes that 10 to 20 percent of patients with post-COVID syndrome develop ME/CFS. It organises management around three pillars: energy management through pacing to prevent PEM, symptomatic off-label pharmacotherapy for the most burdensome symptoms, and diagnosis and treatment of common comorbidities including POTS, MCAS, and small-fiber neuropathy. Graded exercise therapy is explicitly listed as contraindicated due to risk of severe deterioration. The guide does not introduce new primary data but reflects the consolidation of expert consensus at the level of national specialty societies,
    which is significant for how quickly guideline-consistent care diffuses into routine clinical encounters.'
de:
  title: Deutscher Praxisleitfaden formalisiert die hausärztliche Versorgung bei ME/CFS
  plain_summary: Die Deutsche Gesellschaft für ME/CFS hat einen Praxisleitfaden für Hausärztinnen und Hausärzte vorgelegt, der auf Pacing, gezielte Symptombehandlung und die Abklärung von Begleiterkrankungen wie POTS setzt. Er liefert keine neuen Studiendaten, bündelt aber den Fachkonsens und warnt ausdrücklich vor Aktivierungstherapien.
  detail: 'Die Deutsche Gesellschaft für ME/CFS veröffentlichte einen umfassenden Praxisleitfaden für Ärztinnen und Ärzte im deutschsprachigen Raum, der internationale Diagnosekriterien – IOM, Kanadische Konsenskriterien und NICE 2021 – in ein alltagstaugliches Konzept für die hausärztliche Versorgung übersetzt. Der Leitfaden ordnet ME/CFS ausdrücklich als schwere neuroimmunologische Erkrankung mit typischen Diagnoseverzögerungen von sechs bis sieben Jahren in Deutschland ein und verweist darauf, dass 10 bis 20 Prozent der Menschen mit Post-COVID-Syndrom ein ME/CFS entwickeln. Die Versorgung gliedert sich in drei Säulen: Energiemanagement durch Pacing zur Vermeidung von PEM, symptomatische Off-Label-Pharmakotherapie gegen besonders belastende Beschwerden sowie Diagnostik und Behandlung häufiger Begleiterkrankungen wie POTS, MCAS und Small-Fiber-Neuropathie. Eine abgestufte Aktivierungstherapie (Graded Exercise Therapy) wird wegen des Risikos schwerer Zustandsverschlechterungen ausdrücklich
    als kontraindiziert eingestuft. Der Leitfaden präsentiert keine neuen Primärdaten, spiegelt aber die Festigung des Expertenkonsenses auf Ebene nationaler Fachgesellschaften wider – ein wichtiger Faktor dafür, wie schnell leitliniengerechte Versorgung im Praxisalltag ankommt.'
