en:
  title: Narrative review frames mast cell activation as a unifying mechanism for Long COVID neuropathy
  plain_summary: A review paper suggests that SARS-CoV-2 may activate mast cells sitting near nerves and blood vessels, releasing chemicals that irritate small nerve fibers and trigger neuropathic pain or POTS. It offers a plausible biological explanation, but as a review without new trial data, it does not prove that mast-cell treatments work.
  detail: Morcos and Theoharides published a narrative review in the Journal of Neuropathology & Experimental Neurology examining mast cells as the primary mechanism connecting SARS-CoV-2 exposure to persistent neuropathic pain and autonomic dysfunction in Long COVID. Mast cells are positioned in close anatomical proximity to peripheral nerves and vascular walls throughout the body; the review synthesises preclinical models and clinical case reports showing that the SARS-CoV-2 spike protein can bind to mast cell surface receptors including ACE2 and TLR4, triggering degranulation and the release of tryptase, interleukin-6, and other pro-inflammatory mediators. Tryptase directly sensitises peripheral nociceptors (including small-calibre Aδ and C fibres) and can degrade the extracellular matrix near nerve endings; interleukin-6 amplifies systemic inflammation and contributes to blood-brain-barrier disruption. The authors note that this pathological pattern closely mirrors what is found in skin-biopsy-confirmed
    SFN, and that clinical observations of symptom improvement with mast cell stabilisers and antihistamines are consistent with the proposed mechanism — though no controlled trial data are cited. Because the review is a narrative synthesis without systematic methods, it should be read as a mechanistic framework rather than evidence of treatment efficacy. The biological rationale is coherent and links well to the non-length-dependent SFN signal found in the Azcue cohort, but the mast-cell mechanism remains unvalidated in ME/CFS-specific controlled studies.
de:
  title: Narrative Übersichtsarbeit beschreibt Mastzellaktivierung als verbindenden Mechanismus für Long-COVID-Neuropathie
  plain_summary: Eine Übersichtsarbeit schlägt vor, dass SARS-CoV-2 Mastzellen in direkter Nähe zu Nerven und Blutgefäßen aktivieren kann, die daraufhin Botenstoffe freisetzen und dünne Nervenfasern reizen. Das liefert eine schlüssige biologische Erklärung, beweist mangels neuer Studiendaten aber noch nicht, dass mastzellgerichtete Therapien wirksam sind.
  detail: Morcos und Theoharides veröffentlichten im *Journal of Neuropathology & Experimental Neurology* eine narrative Übersichtsarbeit, die Mastzellen als zentralen Mechanismus zwischen einer SARS-CoV-2-Exposition und anhaltenden neuropathischen Schmerzen sowie autonomer Dysfunktion bei Long COVID untersucht. Mastzellen liegen im gesamten Körper in enger anatomischer Nachbarschaft zu peripheren Nerven und Gefäßwänden; die Arbeit fasst präklinische Modelle und klinische Fallberichte zusammen, die zeigen, dass das Spike-Protein von SARS-CoV-2 an Oberflächenrezeptoren von Mastzellen – darunter ACE2 und TLR4 – binden und dadurch eine Degranulation mit Freisetzung von Tryptase, Interleukin-6 und weiteren entzündungsfördernden Mediatoren auslösen kann. Tryptase sensibilisiert periphere Schmerzrezeptoren (einschließlich dünnkalibriger Aδ- und C-Fasern) direkt und kann die extrazelluläre Matrix nahe den Nervenenden angreifen; Interleukin-6 verstärkt die systemische Entzündung und trägt zur Störung
    der Blut-Hirn-Schranke bei. Die Autoren weisen darauf hin, dass dieses Schädigungsmuster eng dem Bild bei per Hautbiopsie gesicherter SFN entspricht und dass klinische Beobachtungen einer Symptombesserung unter Mastzellstabilisatoren und Antihistaminika zum vorgeschlagenen Mechanismus passen – auch wenn keine kontrollierten Studiendaten zitiert werden. Da es sich um eine narrative Synthese ohne systematische Suchmethodik handelt, sollte die Arbeit als mechanistischer Rahmen und nicht als Wirksamkeitsbeleg gelesen werden. Die biologische Begründung ist schlüssig und knüpft gut an das nicht-längenabhängige SFN-Signal aus der Azcue-Kohorte an, doch bleibt der Mastzell-Mechanismus in ME/CFS-spezifischen kontrollierten Studien bislang unbestätigt.
