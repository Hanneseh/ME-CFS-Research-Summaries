en:
  title: ME/CFS Research Foundation report maps the top 100 interventional PAIS trials
  plain_summary: A foundation report reviewed 100 clinical trials across ME/CFS, Long COVID, and related conditions, showing most are small academic studies with limited drug-industry funding. As a registry summary, it does not judge whether any trial works.
  detail: A research landscape white paper authored by Dr. Fred Dejonckheere and published by the ME/CFS Research Foundation mapped and categorized the top 100 interventional clinical trials across Post-Acute Infection Syndromes (PAIS). Covering ME/CFS, Long COVID, POTS, fibromyalgia, and post-treatment Lyme disease, the report classified ongoing and completed trials by targeted mechanisms, including viral persistence, autoimmunity, metabolic failure, and vascular dysfunction. The analysis documented that the vast majority of active trials remain investigator-initiated academic studies, highlighting a severe deficit in commercial biopharmaceutical investment relative to disease burden. It also emphasized the urgent infrastructural need for biomarker-driven patient stratification and standardized clinical endpoints to facilitate regulatory drug approval across post-viral conditions. As a non-peer-reviewed foundation report compiling registry listings, the publication does not independently
    audit trial conduct or efficacy outcomes, encompasses broad PAIS cohorts lacking ME/CFS-specific stratification, and claims no direct therapeutic validation.
de:
  title: Bericht der ME/CFS Research Foundation kartiert die 100 wichtigsten interventionellen PAIS-Studien
  plain_summary: Ein Übersichtsbericht der ME/CFS Research Foundation wertete 100 klinische Studien zu ME/CFS, Long COVID und verwandten Syndromen aus und zeigte, dass die meisten kleine akademische Projekte mit geringer Beteiligung der Pharmaindustrie sind. Als Registerauswertung bewertet er keine Wirksamkeit.
  detail: Ein von Dr. Fred Dejonckheere verfasstes und von der ME/CFS Research Foundation herausgegebenes White Paper zur Forschungslandschaft kartierte und kategorisierte die 100 wichtigsten interventionellen klinischen Studien zu postakuten Infektionssyndromen (PAIS), darunter ME/CFS, Long COVID, POTS, Fibromyalgie und Post-Treatment-Lyme-Syndrom. Laufende und abgeschlossene Studien wurden nach Zielmechanismen wie Viruspersistenz, Autoimmunität, Stoffwechselstörungen und Gefäßdysfunktion geordnet. Die Auswertung belegte, dass der überwiegende Teil aktiver Studien akademisch initiiert ist und im Verhältnis zur Krankheitslast ein erhebliches Defizit bei industrieller Pharmafinanzierung besteht; zudem betonte sie den Bedarf an biomarkergestützter Patientenstratifizierung und einheitlichen Endpunkten für künftige Zulassungen. Als nicht peer-reviewter Stiftungsbericht aus Registereinträgen prüft das Dokument Studienqualität oder Wirksamkeit nicht unabhängig und liefert keinen Therapienachweis.
