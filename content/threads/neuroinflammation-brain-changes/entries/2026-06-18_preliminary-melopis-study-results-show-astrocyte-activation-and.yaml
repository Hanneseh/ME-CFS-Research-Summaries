en:
  title: Preliminary MELOPIS study results show astrocyte activation and default mode network inefficiency
  plain_summary: A preliminary study update reported signs of activated astrocyte support cells in resting-state brain networks and broader, less energy-efficient brain recruitment during mental tasks in ME/CFS. These findings come from an early project update and still need full completion and peer review.
  detail: In a study update for the MELOPIS project (supported by Open Medicine Foundation Australia), Dr. Chris Armstrong and Jamie Elliott reported preliminary multimodal imaging findings in ME/CFS patients. Using a novel PET tracer that targets activated astrocytes, they observed chronic astrocyte activation concentrated in the default mode network (DMN), providing a potential mechanistic reason for the DMN dysfunction and difficulty switching out of resting states. Additionally, task fMRI showed that patients activate wider, less directed brain regions and expend more metabolic energy than healthy controls to perform the same task, reflecting cellular adaptation and energetic inefficiency. The study involves two visits for 7T MRI and PET scans at the Melbourne Brain Centre. As a study update presentation, these findings are preliminary and subject to completion and peer-reviewed publication of the full trial.
de:
  title: Vorläufige Ergebnisse der MELOPIS-Studie zeigen Astrozytenaktivierung und Ineffizienz des Default Mode Network
  plain_summary: Ein vorläufiges Projekt-Update berichtete bei ME/CFS Hinweise auf aktivierte Astrozyten in Ruhenetzwerken sowie einen breiteren, energieintensiveren Hirneinsatz bei Denkaufgaben. Da es sich um Zwischenergebnisse handelt, stehen Abschluss der Studie und Begutachtung im Peer-Review noch aus.
  detail: In einem Studien-Update zum MELOPIS-Projekt (unterstützt von der Open Medicine Foundation Australia) berichteten Dr. Chris Armstrong und Jamie Elliott vorläufige multimodale Bildgebungsbefunde bei ME/CFS-Patientinnen und -Patienten. Mithilfe eines neuartigen PET-Tracers, der auf aktivierte Astrozyten abzielt, beobachteten sie eine chronische Astrozytenaktivierung mit Schwerpunkt im Default Mode Network (DMN), was eine mögliche mechanistische Erklärung für die DMN-Dysfunktion und Schwierigkeiten beim Umschalten aus Ruhezuständen liefert. Zudem zeigte die Aufgaben-fMRT, dass Betroffene breitere, weniger zielgerichtete Hirnregionen aktivieren und mehr Stoffwechselenergie als gesunde Kontrollen aufwenden, um dieselbe Aufgabe zu erfüllen – Ausdruck zellulärer Anpassung und energetischer Ineffizienz. Die Studie umfasst zwei Termine für 7T-MRT- und PET-Scans am Melbourne Brain Centre. Als Präsentation eines Zwischenstands sind diese Befunde vorläufig und stehen unter dem Vorbehalt des
    Studienabschlusses und einer begutachteten Vollpublikation.
