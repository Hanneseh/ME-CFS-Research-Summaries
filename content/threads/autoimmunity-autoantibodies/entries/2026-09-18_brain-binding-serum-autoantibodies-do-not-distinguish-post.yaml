en:
  title: Brain-binding serum autoantibodies do not distinguish post-COVID syndrome from recovery in 703 people
  plain_summary: In 703 people after COVID-19, blood autoantibodies that bind brain targets were no more common in those with ongoing symptoms than in those who fully recovered. This argues against standard blood brain-antibody panels as an explanation or test for post-COVID syndrome, though it does not rule out spinal fluid or subgroup effects.
  detail: Faraj et al. tested serum from 703 individuals after SARS-CoV-2 infection—comprising 455 participants with retrospectively diagnosed post-COVID syndrome (PCS) and 248 recovered individuals—for 44 brain-epitope autoantibodies using tissue cryosections and cell-based biochip assays. Autoantibodies targeting NMDAR1 were the most frequent finding across both groups (16.5%, predominantly IgM, approximately double published pre-pandemic rates), but overall autoantibody prevalence did not differ between PCS and recovered cohorts and there was no consistent link with acute infection or persistent symptoms; nominal symptom associations were not corrected for multiple comparisons. The findings represent observational seroprevalence in serum rather than cerebrospinal fluid (CSF), lack healthy non-COVID controls, rely on self-reported symptoms, and did not assess formal ME/CFS criteria or bedbound severity. These neutral serum findings contrast with previous reports of astrocyte and neuron
    binding in cultured cells and CSF screenings, though assays, sample compartments, and targets differ, as they also do from the serum peptide autoantibody work described in [Mitochondrial & Metabolic Dysfunction](thread:mitochondrial-metabolic-dysfunction). The authors interpret the elevated seroprevalence as post-infectious immune dysregulation rather than a direct mechanism of PCS, without validating a clinical autoantibody test or an immunotherapy indication.
de:
  title: Hirnbindende Serum-Autoantikörper unterscheiden bei 703 Personen nicht zwischen Post-COVID-Syndrom und Genesung
  plain_summary: Bei 703 Menschen nach COVID-19 waren hirnbindende Autoantikörper im Blut bei anhaltenden Beschwerden nicht häufiger als bei vollständig Genesenen. Das spricht gegen gängige Bluttests auf Hirn-Autoantikörper als Erklärung oder Nachweis für das Post-COVID-Syndrom, schließt aber Effekte im Nervenwasser oder in Untergruppen nicht aus.
  detail: Faraj et al. untersuchten Serum von 703 Personen nach einer SARS-CoV-2-Infektion – darunter 455 Teilnehmende mit retrospektiv diagnostiziertem Post-COVID-Syndrom (PCS) und 248 genesene Personen – mittels Gewebekryoschnitten und zellbasierten Biochip-Assays auf 44 Autoantikörper gegen Hirnepitope. Autoantikörper gegen NMDAR1 waren in beiden Gruppen der häufigste Befund (16,5 %, überwiegend IgM, etwa doppelt so hoch wie veröffentlichte Vor-Pandemie-Raten), doch unterschied sich die gesamte Autoantikörperprävalenz nicht zwischen PCS- und Genesenen-Kohorte, und es zeigte sich kein konsistenter Zusammenhang mit der akuten Infektion oder anhaltenden Symptomen; nominale Symptomassoziationen waren nicht für multiples Testen korrigiert. Die Befunde bilden eine beobachtete Seroprävalenz im Serum und nicht im Liquor (CSF) ab, es fehlen gesunde Nicht-COVID-Kontrollen, die Angaben beruhen auf selbstberichteten Symptomen, und weder formale ME/CFS-Kriterien noch Bettlägerigkeit wurden erhoben.
    Diese neutralen Serumbefunde stehen im Kontrast zu früheren Berichten über Astrozyten- und Neuronenbindung in kultivierten Zellen sowie Liquor-Screenings, wobei sich Assays, Probenkompartimente und Zielstrukturen unterscheiden – ebenso wie bei den Serum-Peptid-Autoantikörperarbeiten in [Mitochondrien & Zellstoffwechsel](thread:mitochondrial-metabolic-dysfunction). Die Autorinnen und Autoren deuten die erhöhte Seroprävalenz als postinfektiöse Immundysregulation und nicht als direkten Mechanismus des PCS, ohne einen klinischen Autoantikörpertest oder eine Indikation für eine Immuntherapie zu validieren.
