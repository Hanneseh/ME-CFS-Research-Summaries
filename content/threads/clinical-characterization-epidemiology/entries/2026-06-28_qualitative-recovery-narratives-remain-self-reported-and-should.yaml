en:
  title: Qualitative recovery narratives remain self-reported and should not be treated as proof of cure
  plain_summary: A qualitative study of women reporting recovery from ME/CFS outside clinics describes their personal experiences and self-management strategies, without medical verification or relapse tracking. It cannot prove cure rates or show that behavioral changes alone resolve ME/CFS.
  detail: A qualitative study on women who described recovery from ME/CFS outside formal clinical settings is relevant to lived-experience research, but it must be framed narrowly. The study can describe perceived pathways, social supports, self-management strategies, and how people make sense of improvement, but it does not objectively verify recovery with physiological testing, diagnostic re-evaluation, or long-term relapse monitoring. That distinction matters because ME/CFS fluctuates and because recovery narratives can be misused to imply that most patients can recover through behavioral change alone. The useful clinical characterization point is that patients' accounts of improvement deserve study, while claims about cure or general recovery expectations require much stronger evidence.
de:
  title: Qualitative Genesungsberichte bleiben Selbstauskünfte und sind kein Beleg für Heilung
  plain_summary: Eine qualitative Studie mit Frauen, die außerhalb von Kliniken über eine Genesung von ME/CFS berichteten, beschreibt deren persönliche Erfahrungen ohne ärztliche Überprüfung oder langfristige Rückfallkontrolle. Sie belegt keine Heilungsraten und zeigt auch nicht, dass Verhaltensänderungen allein ME/CFS beenden.
  detail: 'Eine qualitative Studie zu Frauen, die außerhalb regulärer klinischer Versorgung über eine Genesung von ME/CFS berichteten, ist für die Erforschung gelebter Erfahrung aufschlussreich, muss aber eng eingeordnet werden. Die Arbeit kann wahrgenommene Wege, soziale Unterstützung, Selbstmanagement-Strategien und die persönliche Deutung von Besserung beschreiben, überprüft Genesung jedoch nicht objektiv mittels physiologischer Tests, erneuter Diagnoseprüfung oder langfristiger Rückfallbeobachtung. Diese Unterscheidung ist wichtig, weil ME/CFS schwankt und Genesungserzählungen leicht missbraucht werden, um zu suggerieren, die Mehrheit könne allein durch Verhaltensänderung gesunden. Für die klinische Charakterisierung zeigt sich: Erfahrungsberichte über Besserung verdienen wissenschaftliche Betrachtung, während Aussagen zu Heilung oder allgemeinen Genesungsaussichten weitaus stärkere Belege erfordern.'
