en:
  title: Muscle sodium overload confirmed post-exercise via sodium-MRI
  plain_summary: Specialized sodium MRI scans in 6 female patients found higher muscle sodium at rest and slower clearing after brief exercise, linked to weaker grip strength. The pilot study is very small and cannot tell whether sodium sits inside or outside muscle cells.
  detail: '- **What changed:** A pilot study utilizing specialized ${}^{23}Na$-magnetic resonance imaging in 6 female patients and 6 controls showed significantly elevated muscle tissue sodium content at rest and an exaggerated sodium increase with delayed clearance after brief exercise, correlating with reduced handgrip strength.

    - **Why it matters:** This supports the hypothesis of muscle sodium overload, suggesting that tissue hypoperfusion and cellular energy deficits impair membrane ion pumps, leading to muscle weakness, fatigue, and pain.

    - **What it does not prove yet:** The small pilot sample size limits generalizability, and the MRI protocol was unable to distinguish between extracellular and intracellular sodium accumulation.'
de:
  title: Natrium-Überladung im Muskel nach Belastung mittels Natrium-MRT bestätigt
  plain_summary: Spezielle Natrium-MRT-Aufnahmen bei 6 Patientinnen zeigten schon in Ruhe erhöhte Natriumwerte im Muskel und einen verzögerten Abbau nach kurzer Belastung, passend zu geringerer Handkraft. Die Pilotstudie ist sehr klein und unterscheidet nicht zwischen intra- und extrazellulärem Natrium.
  detail: '- **Was sich gezeigt hat:** Eine Pilotstudie mit spezialisierter ${}^{23}Na$-Magnetresonanztomographie bei 6 Patientinnen und 6 Kontrollpersonen zeigte bereits in Ruhe einen deutlich erhöhten Natriumgehalt im Muskelgewebe sowie nach kurzer Belastung einen überschießenden Natriumanstieg mit verzögertem Abbau, was mit geringerer Handgriffkraft korrelierte.

    - **Warum das wichtig ist:** Dies stützt die Hypothese der muskulären Natriumüberladung, wonach Gewebeminderdurchblutung und zellulärer Energiemangel Membran-Ionenpumpen schwächen und so Muskelschwäche, Fatigue und Schmerzen begünstigen.

    - **Was damit noch nicht belegt ist:** Die sehr kleine Pilotstichprobe begrenzt die Verallgemeinerbarkeit, und das MRT-Protokoll konnte nicht zwischen extrazellulärer und intrazellulärer Natriumansammlung unterscheiden.'
