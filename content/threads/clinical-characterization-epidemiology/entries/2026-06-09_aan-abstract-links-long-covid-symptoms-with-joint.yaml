en:
  title: AAN abstract links Long COVID symptoms with joint hypermobility in a small specialty-clinic cohort
  plain_summary: A small conference abstract of 20 Long COVID patients seen in specialty clinics noted frequent fatigue, brain fog, and PEM alongside joint hypermobility. Because it is a tiny, highly selected abstract, it only flags a connection worth studying more carefully.
  detail: 'An AAN conference abstract reported a retrospective cohort of 20 Long COVID patients seen in post-COVID and hypermobility clinics, all with Beighton scores of at least 5. Fatigue, brain fog, and PEM were common, and younger patients were more likely to show more severe hypermobility. The abstract is relevant because connective-tissue traits and dysautonomia often cluster clinically with ME/CFS-like post-viral illness. It is not strong evidence of prevalence or causality: the cohort is tiny, highly selected, and available only as a conference abstract. Its best use is as a prompt for better-designed studies on hypermobility, orthostatic intolerance, and post-infectious symptom persistence.'
de:
  title: AAN-Abstract verknüpft Long-COVID-Symptome in kleiner Spezialambulanz-Kohorte mit Gelenkhypermobilität
  plain_summary: Ein kleiner Konferenzbeitrag zu 20 Long-COVID-Patientinnen und -Patienten aus Spezialambulanzen berichtete häufige Fatigue, Brain Fog und PEM zusammen mit überbeweglichen Gelenken. Da die Gruppe winzig und stark vorselektiert ist und nur als Abstract vorliegt, liefert sie lediglich einen Anstoß für genauere Studien.
  detail: 'Ein AAN-Konferenzabstract berichtete über eine retrospektive Kohorte von 20 Long-COVID-Patientinnen und -Patienten aus Post-COVID- und Hypermobilitätsambulanzen, die alle Beighton-Scores von mindestens 5 aufwiesen. Fatigue, Brain Fog und PEM traten häufig auf, und jüngere Betroffene zeigten tendenziell eine stärker ausgeprägte Hypermobilität. Das Abstract ist relevant, weil Bindegewebsmerkmale und Dysautonomie klinisch oft gemeinsam mit ME/CFS-ähnlichen postviralen Erkrankungen auftreten. Starke Evidenz für Häufigkeit oder Kausalität bietet es jedoch nicht: Die Kohorte ist sehr klein, stark selektiert und nur als Tagungsabstract verfügbar. Am ehesten dient der Bericht als Anstoß für methodisch sauberere Studien zu Hypermobilität, orthostatischer Intoleranz und anhaltenden postinfektiösen Beschwerden.'
