en:
  title: CDC MCAM analysis characterises adolescent ME/CFS against adults
  plain_summary: A CDC study comparing 40 adolescents with ME/CFS to 595 adults found high school disruption and slightly better physical functioning in teens, though differences were small and partly tied to shorter illness duration. The small specialist-clinic sample limits broader generalization.
  detail: Weaver, Unger, and colleagues at the CDC analysed baseline cross-sectional data from 40 adolescents aged 10–17 (mean 15.3) with ME/CFS in the Multi-Site Clinical Assessment of ME/CFS (MCAM), compared with 595 adults, using the SF-36v2, CDC Symptom Inventory, MFI-20, and DePaul questionnaire domains. Mean illness duration was 4.0 years, and 64% of adolescents received homebound or homeschool instruction, which reflects educational disruption rather than confirmed housebound status. PEM, unrefreshing sleep, fatigue, and neurocognitive symptoms were common, though the abstract gives no PEM prevalence. Adolescents had better physical, vitality, and social functioning than adults and similar mental health, but many differences were small and confounded by shorter illness duration (compare the 2026-09-20 Melbourne adolescent entry). The pediatric sample is small and drawn from specialist clinics; MCAM biospecimens are also among those listed in the searchMECFS entry below.
de:
  title: CDC-MCAM-Analyse charakterisiert jugendliches ME/CFS im Vergleich zu Erwachsenen
  plain_summary: Eine CDC-Auswertung von 40 Jugendlichen mit ME/CFS im Vergleich zu 595 Erwachsenen zeigte starke Beeinträchtigungen im Schulbesuch und etwas bessere körperliche Funktionswerte bei Jugendlichen, wobei die Unterschiede klein waren und teils an kürzerer Krankheitsdauer hingen. Die kleine Stichprobe aus Spezialambulanzen begrenzt die Übertragbarkeit.
  detail: Weaver, Unger und Kolleginnen und Kollegen bei den CDC werteten Querschnitts-Basisdaten von 40 Jugendlichen im Alter von 10–17 Jahren (Mittelwert 15,3) mit ME/CFS aus der Studie Multi-Site Clinical Assessment of ME/CFS (MCAM) im Vergleich zu 595 Erwachsenen anhand von SF-36v2, CDC Symptom Inventory, MFI-20 und DePaul-Fragebogen-Domänen aus. Die mittlere Krankheitsdauer betrug 4,0 Jahre, und 64 % der Jugendlichen erhielten Unterricht zu Hause oder krankheitsbedingten Hausunterricht – was schulische Beeinträchtigung abbildet und keinen bestätigten Hausgebundenen-Status. PEM, nicht erholsamer Schlaf, Fatigue und neurokognitive Symptome waren häufig, wobei das Abstract keine genaue PEM-Prävalenz nennt. Jugendliche zeigten bessere körperliche Funktion, Vitalität und soziale Funktion als Erwachsene bei ähnlicher psychischer Gesundheit, doch waren viele Unterschiede klein und durch kürzere Krankheitsdauer verzerrt (vgl. den Melbourner Jugendlichen-Eintrag vom 20.09.2026). Die pädiatrische
    Stichprobe ist klein und stammt aus Spezialkliniken; MCAM-Bioproben sind auch im nachfolgenden Eintrag zu searchMECFS aufgeführt.
