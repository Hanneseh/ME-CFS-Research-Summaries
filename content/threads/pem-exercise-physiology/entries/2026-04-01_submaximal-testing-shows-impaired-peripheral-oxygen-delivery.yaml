en:
  title: Submaximal testing shows impaired peripheral oxygen delivery
  plain_summary: Using gentle two-day exercise tests with muscle-oxygen sensors in Long COVID, researchers found poorer muscle oxygen delivery and shorter oxygen stability on day two. This points to muscle-level blood or oxygen issues, though it needs replication in larger groups and in ME/CFS patients.
  detail: This study used a two-day submaximal CPET with near-infrared spectroscopy to measure muscle oxygenation in Long COVID. The main change was worse tissue oxygenation and shorter maintenance of saturation on day 2, which points to impaired peripheral oxygen delivery rather than isolated cardiopulmonary failure. That supports a muscle-level physiology model for post-exertional symptom exacerbation. The findings still need replication in larger cohorts and in ME/CFS-specific samples.
de:
  title: Submaximale Testung zeigt beeinträchtigte periphere Sauerstoffversorgung
  plain_summary: Bei zweitägigen submaximalen Belastungstests mit Muskelsauerstoff-Sensoren zeigten Long-COVID-Betroffene am zweiten Tag eine schlechtere Gewebeoxygenierung und kürzer stabile Werte. Das deutet auf Probleme bei der Sauerstoffversorgung der Muskulatur hin, muss aber noch in größeren Gruppen und bei ME/CFS überprüft werden.
  detail: Diese Studie nutzte einen zweitägigen submaximalen CPET mit Nahinfrarotspektroskopie, um die Sauerstoffversorgung der Muskulatur bei Long COVID zu messen. Die zentrale Veränderung war eine schlechtere Gewebeoxygenierung und eine kürzere Aufrechterhaltung der Sättigung an Tag 2, was eher auf eine gestörte periphere Sauerstoffabgabe als auf ein isoliertes Herz-Lungen-Versagen hinweist. Das stützt ein muskelbezogenes physiologisches Modell für post-exertionelle Symptomverschlechterung. Die Befunde bedürfen jedoch noch der Replikation in größeren Kohorten sowie in spezifischen ME/CFS-Stichproben.
