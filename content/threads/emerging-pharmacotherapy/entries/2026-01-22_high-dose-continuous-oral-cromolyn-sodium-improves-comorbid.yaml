en:
  title: High-dose continuous oral cromolyn sodium improves comorbid MCAS symptoms
  plain_summary: A retrospective report on five patients with ME/CFS or Long COVID and mast cell symptoms described improved fatigue, brain fog, and heart rate when sipping high-dose cromolyn sodium in water throughout the day. With just five patients and no control group, safety and effectiveness of this high-dose regimen remain unproven.
  detail: A retrospective case series of five patients with ME/CFS or Long COVID and comorbid Mast Cell Activation Syndrome (MCAS) showed that a continuous sipping regimen of high-dose oral cromolyn sodium (1,600 to 2,400 mg daily) significantly improved fatigue, cognitive function, and heart rate control. By spreading the total dose throughout the day in a water bottle rather than using discrete bolus doses, the protocol aims to maintain stable plasma concentrations of the drug and improve patient tolerance. This provides a practical dosing strategy for patients who fail standard low-dose regimens. However, the retrospective case series design lacks a control group, and the very small number of patients (five) means the efficacy and safety of this high-dose protocol are not proven. Systematic prospective trials are required to validate these findings and to monitor for potential adverse effects of long-term high-dose cromolyn exposure.
de:
  title: Kontinuierliche hochdosierte orale Gabe von Cromoglicinsäure-Natrium bessert begleitende MCAS-Symptome
  plain_summary: Ein rückblickender Bericht über fünf Betroffene mit ME/CFS oder Long COVID und begleitendem Mastzellaktivierungssyndrom (MCAS) beschrieb Verbesserungen bei Fatigue, Kognition und Puls durch über den Tag verteiltes schluckweises Trinken von hochdosiertem Cromolyn. Bei nur fünf Fällen ohne Kontrollgruppe bleiben Wirksamkeit und Langzeitsicherheit dieses Hochdosis-Schemas unbewiesen.
  detail: Eine retrospektive Fallserie von fünf Patientinnen und Patienten mit ME/CFS oder Long COVID und begleitendem Mastzellaktivierungssyndrom (MCAS) zeigte, dass ein kontinuierliches schluckweises Trinken von hochdosiertem oralem Cromoglicinsäure-Natrium (1.600 bis 2.400 mg täglich) Fatigue, kognitive Funktion und Herzfrequenzkontrolle deutlich verbesserte. Durch Verteilung der Gesamtdosis über den Tag in einer Trinkflasche statt einzelner Bolusgaben zielt das Protokoll auf gleichmäßigere Wirkspiegel und bessere Verträglichkeit, was eine praktische Strategie für Personen bietet, die auf Standard-Niedrigdosen nicht ansprechen. Aufgrund des retrospektiven Fallserien-Designs ohne Kontrollgruppe und der winzigen Fallzahl von fünf Personen sind Wirksamkeit und Sicherheit dieses Hochdosis-Protokolls jedoch nicht bewiesen; systematische prospektive Studien sind nötig, um die Beobachtungen zu prüfen und mögliche Langzeitnebenwirkungen zu überwachen.
