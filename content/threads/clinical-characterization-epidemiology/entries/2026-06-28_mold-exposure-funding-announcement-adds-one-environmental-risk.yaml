en:
  title: Mold-exposure funding announcement adds one environmental-risk research thread, but no results yet
  plain_summary: Nova Southeastern University received NIH funding to test whether mold-toxin exposure links to biological changes in over 200 ME/CFS participants. This is an early project announcement with no results yet, not proof that mold causes ME/CFS.
  detail: Nova Southeastern University announced NIH funding to study possible links between mold exposure and ME/CFS. The planned study will collect biological samples from more than 200 participants, measure mycotoxin exposure, and test whether specific exposures map onto biological changes associated with ME/CFS. This is relevant because environmental exposures are often discussed by patients but are rarely studied in adequately characterized cohorts. At this stage it is a funding and project announcement only, without enrollment results, exposure-response findings, or validated mechanisms. It should be tracked as research infrastructure rather than evidence that mold exposure is a proven ME/CFS cause.
de:
  title: Förderankündigung zu Schimmelpilz-Exposition ergänzt Umweltfaktor-Forschung, liefert aber noch keine Ergebnisse
  plain_summary: Die Nova Southeastern University hat NIH-Mittel erhalten, um bei über 200 Teilnehmenden zu prüfen, ob Schimmelpilzgifte mit biologischen Veränderungen bei ME/CFS zusammenhängen. Es handelt sich um eine reine Projektankündigung ohne Ergebnisse und keinen Beleg dafür, dass Schimmel ME/CFS auslöst.
  detail: Die Nova Southeastern University gab eine NIH-Förderung bekannt, um mögliche Zusammenhänge zwischen Schimmelpilz-Exposition und ME/CFS zu untersuchen. Die geplante Studie soll Bioproben von mehr als 200 Teilnehmenden sammeln, die Mykotoxin-Belastung messen und prüfen, ob bestimmte Expositionen mit ME/CFS-typischen biologischen Veränderungen einhergehen. Dies ist relevant, weil Umweltexpositionen von Betroffenen häufig diskutiert werden, bislang aber selten in sauber charakterisierten Kohorten untersucht wurden. Zum jetzigen Zeitpunkt handelt es sich lediglich um eine Förder- und Projektankündigung ohne Einschlusszahlen, Expositions-Wirkungs-Daten oder validierte Mechanismen. Das Vorhaben sollte als Forschungsinfrastruktur verfolgt werden und nicht als Beleg dafür, dass Schimmelpilze eine gesicherte Ursache von ME/CFS sind.
