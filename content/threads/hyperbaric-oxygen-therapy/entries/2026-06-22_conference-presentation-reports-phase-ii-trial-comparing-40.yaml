en:
  title: Conference presentation reports Phase II trial comparing 40 vs. 20 sessions of HBOT in ME/CFS
  plain_summary: At a 2026 conference, researchers compared 40 versus 20 hyperbaric oxygen sessions in post-infectious ME/CFS and reported longer-lasting gains in pain, grip strength, and MRI brain connectivity with 40 sessions. These findings remain preliminary because there was no sham-control arm, dropout was high in the 20-session group, and results are not yet peer-reviewed.
  detail: At the Internationale ME/CFS-Konferenz 2026, Dr. Claudia Kedor presented findings from a Phase II observational two-cohort trial comparing 40 versus 20 sessions of Hyperbaric Oxygen Therapy (HBOT) (90-minute sessions of 100% oxygen at 2.0 ATA, 3–5 times weekly) in post-infectious ME/CFS patients. Both groups showed significant improvements in fatigue and cognitive processing speed at month 3, with the 40-session cohort showing more sustained benefits up to 11 months. Furthermore, only the 40-session cohort achieved significant, long-term improvements in pain, hand grip strength, and 1-minute sit-to-stand performance, which correlated with the normalization of thalamic functional connectivity on MRI. These preliminary findings suggest that a full 40-session course may be superior to a shorter 20-session protocol for sustained symptomatic relief, though clinical responses remain heterogeneous. However, these results are preliminary as the trial was observational, lacked a randomized
    sham-control group to rule out placebo effects, and was limited by high dropout rates in the 20-session cohort.
de:
  title: 'Konferenzbericht zur Phase-II-Studie: Vergleich von 40 vs. 20 HBOT-Sitzungen bei ME/CFS'
  plain_summary: Auf einer Fachkonferenz 2026 verglichen Forschende 40 mit 20 HBOT-Sitzungen bei postinfektiösem ME/CFS und berichteten nach 40 Sitzungen anhaltendere Verbesserungen bei Schmerzen, Greifkraft und MRT-Hirnkonnektivität. Die Daten sind vorläufig, da keine Scheinkontrolle vorlag, die Abbruchrate in der 20-Sitzungen-Gruppe hoch war und noch keine Fachbegutachtung erfolgt ist.
  detail: Auf der Internationalen ME/CFS-Konferenz 2026 präsentierte Dr. Claudia Kedor Ergebnisse einer beobachtenden Zwei-Kohorten-Phase-II-Studie zum Vergleich von 40 gegenüber 20 Sitzungen hyperbarer Sauerstofftherapie (HBOT; jeweils 90 Minuten 100 % Sauerstoff bei 2,0 ATA, 3–5-mal pro Woche) bei postinfektiösem ME/CFS. Beide Gruppen zeigten nach drei Monaten signifikante Verbesserungen bei Fatigue und kognitiver Verarbeitungsgeschwindigkeit, wobei die 40-Sitzungen-Kohorte bis zu 11 Monate anhaltendere Vorteile aufwies. Zudem erreichte nur die 40-Sitzungen-Gruppe signifikante Langzeitverbesserungen bei Schmerzen, Handgreifkraft und im 1-Minuten-Sit-to-Stand-Test, was mit einer Normalisierung der thalamischen funktionellen Konnektivität im MRT korrelierte. Diese vorläufigen Befunde deuten darauf hin, dass ein voller 40-Sitzungen-Zyklus einem kürzeren 20-Sitzungen-Protokoll für eine anhaltende Linderung überlegen sein könnte, wenngleich das Ansprechen heterogen bleibt. Da die Studie jedoch
    beobachtend war, keine randomisierte Scheinkontrollgruppe zum Ausschluss von Placeboeffekten enthielt und in der 20-Sitzungen-Kohorte hohe Abbruchraten auftraten, bleiben die Ergebnisse vorläufig.
