en:
  title: Charité cohort updates and upcoming trial designs presented at German symposium
  plain_summary: At a 2026 German symposium, Charité researchers reported temporary 3–6 month improvements in subsets of patients after open-label immunoadsorption and announced the Impact study to look for responder markers. Because these updates came from uncontrolled cohorts, results from ongoing randomized sham-controlled trials are needed to know if the procedure truly works.
  detail: |-
    At the ME/CFS Symposium 2026, Elisa Stein presented clinical updates from Charité's open-label, uncontrolled immunoadsorption studies. In an initial cohort of 20 Post-COVID patients with elevated beta-2 adrenergic receptor autoantibodies, immunoadsorption using a Miltenyi column achieved a two-thirds responder rate at four weeks, showing improvements in physical function, fatigue, pain, PEM, and autonomic symptoms. A subsequent cohort of 15 patients evaluated at week 8 (to allow recovery from treatment-induced crashes) showed seven responders, with improvements lasting 3–6 months before returning to baseline as autoantibodies re-accumulated. Stein announced the launch of the Impact study (n=50) to validate responder immunophenotypes, which will help select candidates for a future B-cell depletion trial. She also summarized three ongoing or completed German randomized sham-controlled trials, including the Berlin study and the Mainz tryptophan adsorber trial, which will provide essential controlled validation.

    *Note: An English presentation of these findings is scheduled to premiere at the International ME/CFS Conference on 2026-07-08 (Stein 2026, YouTube).*
de:
  title: Charité-Kohorten-Updates und kommende Studiendesigns auf deutschem Symposium vorgestellt
  plain_summary: Auf einem deutschen Symposium 2026 berichteten Charité-Forschende über vorübergehende 3–6-monatige Besserungen bei einem Teil offener Immunadsorptions-Kohorten und kündigten die Impact-Studie zur Suche nach Biomarkern an. Da die Daten aus unkontrollierten Kohorten stammen, bleiben randomisierte schein-kontrollierte Studien zur Klärung der echten Wirksamkeit entscheidend.
  detail: |-
    Auf dem ME/CFS-Symposium 2026 stellte Elisa Stein klinische Updates aus den offenen, unkontrollierten Immunadsorptions-Studien der Charité vor. In einer ersten Kohorte von 20 Post-COVID-Betroffenen mit erhöhten Beta-2-adrenergen Rezeptor-Autoantikörpern erreichte die Immunadsorption mit einer Miltenyi-Säule nach vier Wochen bei zwei Dritteln ein Ansprechen mit Verbesserungen bei körperlicher Funktion, Fatigue, Schmerzen, PEM und autonomen Symptomen. Eine nachfolgende Kohorte von 15 Patientinnen und Patienten, die erst in Woche 8 ausgewertet wurde (um Erholung von behandlungsbedingten Crashes zu ermöglichen), zeigte sieben Ansprechende, deren Verbesserungen 3–6 Monate anhielten, bevor die Werte mit dem Wiederanstieg der Autoantikörper auf das Ausgangsniveau zurückfielen. Stein kündigte den Start der Impact-Studie (n=50) an, um Immunphänotypen von Ansprechenden zu validieren und so Kandidatinnen und Kandidaten für eine künftige B-Zell-Depletionsstudie auszuwählen. Zudem fasste sie drei laufende oder abgeschlossene deutsche randomisierte schein-kontrollierte Studien zusammen, darunter die Berliner Studie und die Mainzer Tryptophan-Adsorber-Studie, die eine dringend benötigte kontrollierte Überprüfung liefern.

    *Hinweis: Eine englischsprachige Präsentation dieser Ergebnisse ist auf der Internationalen ME/CFS-Konferenz am 2026-07-08 vorgesehen (Stein 2026, YouTube).*
