en:
  title: Qualitative preprint documents how unadapted healthcare puts severe and very severe ME/CFS patients out of reach
  plain_summary: A qualitative preprint from Austria interviewed people with severe and very severe ME/CFS, family caregivers, and clinicians, showing that transport barriers, sensory overload, and clinician knowledge gaps restrict access to care and can even trigger deterioration. Because it is a qualitative preprint from a single national system, it maps urgent structural gaps rather than testing the effectiveness of a specific care program.
  detail: In a qualitative preprint posted on Research Square, Hackl, Hainzl, Wojczewski, and colleagues examined healthcare experiences, unmet needs, and access barriers among people with severe and very severe ME/CFS, their family and lay caregivers, and healthcare professionals in Austria. Using adapted narrative and semi-structured interviews alongside focus groups and expert interviews analyzed via qualitative thematic analysis, the study documents how limited or absent transportability, clinician knowledge gaps, and routine or emergency healthcare environments that are not adapted for sensory overload and [post-exertional malaise](thread:pem-exercise-physiology) restrict access to necessary medical care. Crucially, participants reported that unadapted healthcare encounters themselves—including acute and emergency care—can act as a direct risk for clinical deterioration, leaving severely affected homebound and bedbound individuals effectively invisible to the medical system. In the absence of accessible professional support, family and lay caregivers frequently assume coordinative, nursing, and medical duties. The authors outline priority requirements for capacity-adapted care—including home-based and outreach services, telemedicine, multidisciplinary coordination, adapted routine and emergency pathways, and ME/CFS-specific professional training—alongside better research inclusion for people with very severe ME/CFS. Key caveats are that the manuscript is a preprint not yet peer-reviewed, reflects the Austrian healthcare context without exact sample counts reported in the abstract, and captures qualitative lived-experience barriers rather than controlled outcome data for care interventions.
de:
  title: Qualitativer Preprint dokumentiert, wie unangepasste Versorgung Menschen mit schwerem und sehr schwerem ME/CFS unerreichbar macht
  plain_summary: Ein qualitativer Preprint aus Österreich befragte Menschen mit schwerem und sehr schwerem ME/CFS, pflegende Angehörige und Fachkräfte und zeigt, dass fehlende Transportfähigkeit, Reizüberflutung und Wissenslücken den Zugang zur Versorgung blockieren und sogar Verschlechterungen auslösen können. Da es sich um einen qualitativen Preprint aus einem einzelnen Gesundheitssystem handelt, macht er dringende Versorgungslücken sichtbar, prüft aber noch keine konkrete Versorgungsintervention.
  detail: In einem auf Research Square veröffentlichten qualitativen Preprint untersuchten Hackl, Hainzl, Wojczewski und Kolleginnen Versorgungserfahrungen, ungedeckte Bedarfe und Zugangsbarrieren von Menschen mit schwerem und sehr schwerem ME/CFS, ihren pflegenden Angehörigen und medizinischen Fachkräften in Österreich. Anhand angepasster narrativer und halbstrukturierter Interviews sowie Fokusgruppen und Experteninterviews, ausgewertet mittels qualitativer thematischer Analyse, dokumentiert die Studie, wie fehlende oder stark eingeschränkte Transportfähigkeit, Wissenslücken bei Behandlerinnen und Behandlern sowie nicht an Reizempfindlichkeit und [Post-Exertional Malaise](thread:pem-exercise-physiology) angepasste Regel- und Notfallstrukturen den Zugang zu notwendiger medizinischer Versorgung versperren. Entscheidend ist der Befund, dass unangepasste Arzt- oder Notaufnahmekontakte selbst zu einem unmittelbaren Risiko für klinische Verschlechterungen werden können, sodass hausgebundene und bettlägerige Betroffene für das Gesundheitssystem weitgehend unsichtbar bleiben. Mangels erreichbarer professioneller Unterstützung übernehmen Angehörige und Laienpflegende häufig koordinative, pflegerische und medizinische Aufgaben. Die Autorinnen formulieren zentrale Anforderungen an bedarfsgerechte Versorgungsmodelle – darunter Hausbesuchs- und aufsuchende Angebote, Telemedizin, multidisziplinäre Koordination, angepasste Routine- und Notfallabläufe sowie ME/CFS-spezifische Fortbildungen – und fordern eine bessere Forschungseinbindung sehr schwer Betroffener. Einschränkungen sind der noch nicht begutachtete Preprint-Status, der Bezug auf das österreichische Versorgungssystem ohne genaue Stichprobenzahlen im Abstract sowie das qualitative Design, das reale Zugangsbarrieren beschreibt, aber keine kontrollierten Wirksamkeitsdaten für Versorgungsmodelle liefert.
