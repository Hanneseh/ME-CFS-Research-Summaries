en:
  title: Solriamfetol trial reports reduction in fatigue severity and improved executive function in ME/CFS
  plain_summary: An 8-week placebo-controlled trial of 38 ME/CFS patients found that the wakefulness drug solriamfetol lowered self-reported fatigue severity and improved planning/memory scores, though anxiety and sleep disruption occurred during fast dose increases. Because it was small and did not reduce how much fatigue interfered with daily life, larger studies are needed.
  detail: An 8-week, double-blind, randomized, placebo-controlled Phase 4 trial involving 38 adults with ME/CFS showed that the dual norepinephrine-dopamine reuptake inhibitor solriamfetol significantly reduced self-reported fatigue severity and improved overall executive function, particularly metacognitive skills like planning and memory. This trial indicates that targeting central monoamine pathways can alleviate cognitive and fatigue symptoms, offering a wakefulness-promoting therapeutic option. However, the trial was small and conducted at a single site, which limits the generalizability of the findings. The study did not find a significant improvement in the _interference_ of fatigue on daily life activities, and the rapid dose titration caused side effects such as anxiety and sleep loss in several participants, leaving optimal dosing and long-term tolerability unproven.
de:
  title: Solriamfetol-Studie berichtet Rückgang der Fatigue-Schwere und bessere Exekutivfunktionen bei ME/CFS
  plain_summary: Eine 8-wöchige placebokontrollierte Studie mit 38 ME/CFS-Betroffenen zeigte unter dem Wachheits-Medikament Solriamfetol geringere selbstberichtete Fatigue-Schwere und bessere Planungs- und Gedächtnisscores, wobei bei rascher Dosissteigerung teils Angst und Schlafstörungen auftraten. Da die Studie klein war und die Alltagsbeeinträchtigung durch Fatigue nicht signifikant senkte, sind größere Prüfungen nötig.
  detail: Eine 8-wöchige, doppelt verblindete, randomisierte, placebokontrollierte Phase-4-Studie mit 38 Erwachsenen mit ME/CFS zeigte, dass der duale Noradrenalin-Dopamin-Wiederaufnahmehemmer Solriamfetol die selbstberichtete Fatigue-Schwere signifikant senkte und die allgemeine exekutive Funktion – insbesondere metakognitive Fähigkeiten wie Planen und Gedächtnis – verbesserte. Diese Studie deutet darauf hin, dass eine Beeinflussung zentraler Monoamin-Signalwege kognitive und Fatigue-Symptome als wachheitsfördernde Option mildern kann. Allerdings war die Studie klein und monozentrisch, was die Übertragbarkeit einschränkt. Eine signifikante Verringerung der tatsächlichen Beeinträchtigung von Alltagsaktivitäten durch Fatigue wurde nicht erreicht, und die schnelle Dosissteigerung löste bei mehreren Teilnehmenden Nebenwirkungen wie Angst und Schlafverlust aus, sodass optimale Dosierung und Langzeitverträglichkeit unbewiesen bleiben.
