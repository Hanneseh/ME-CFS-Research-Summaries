en:
  title: Cerebrospinal fluid opening pressure and craniocervical anatomy evaluated in ME/CFS
  plain_summary: In 34 ME/CFS patients, researchers measured spinal fluid pressure via lumbar puncture and checked craniocervical anatomy and symptom relief afterward. Because there were no healthy controls and key statistical outcomes were missing from the available summary, the clinical significance cannot yet be judged.
  detail: A case-control study of 34 patients with ME/CFS (65% of whom had moderate disease severity) investigated cerebrospinal fluid (CSF) opening pressure, clinical symptoms, and craniocervical anatomy. Lumbar punctures were performed to measure opening pressure—utilizing a 20 cmH2O cut point for patient stratification—and evaluate symptomatic relief post-procedure. However, this study is limited by a small cohort size and the lack of healthy controls undergoing lumbar punctures, and specific statistical outcomes or radiological correlations were not fully detailed in the available summary.
de:
  title: Liquor-Eröffnungsdruck und kraniozervikale Anatomie bei ME/CFS untersucht
  plain_summary: Bei 34 ME/CFS-Betroffenen maßen Forschende den Druck des Nervenwassers per Lumbalpunktion sowie die Anatomie am Schädel-Hals-Übergang und prüften eine etwaige Linderung nach dem Eingriff. Ohne gesunde Kontrollgruppe und ohne vollständige statistische Ergebnisse in der Zusammenfassung lässt sich die klinische Bedeutung noch nicht bewerten.
  detail: Eine Fall-Kontroll-Studie mit 34 Patientinnen und Patienten mit ME/CFS (65 % davon mit moderatem Schweregrad) untersuchte den Liquor-Eröffnungsdruck, klinische Symptome und die kraniozervikale Anatomie. Es wurden Lumbalpunktionen durchgeführt, um den Eröffnungsdruck – unter Verwendung eines Grenzwerts von 20 cmH2O zur Patientenstratifizierung – zu messen und eine symptomatische Entlastung nach dem Eingriff zu bewerten. Diese Studie ist jedoch durch eine kleine Kohortengröße und das Fehlen gesunder Kontrollen mit Lumbalpunktion eingeschränkt, und spezifische statistische Ergebnisse oder radiologische Korrelationen waren in der verfügbaren Zusammenfassung nicht vollständig aufgeführt.
