en:
  title: Preprint introduces Rasch-validated Post Activity Symptom Scale (PASS) to measure PEM in ME/CFS
  plain_summary: Researchers and patient advisors co-produced a new questionnaire, the Post Activity Symptom Scale (PASS), to measure post-exertional malaise in adults with ME/CFS, showing strong two-week reliability in an online Rasch validation study. Because it is a preprint tested mainly in online adult respondents with moderate illness, it still needs peer review and validation in severe and bedbound patients.
  detail: Horton, Tyson, and Fleming (University of Manchester), working within the ME Association Clinical Assessment Toolkit (MEA-CAT) project, co-produced the Post Activity Symptom Scale (PASS) with patient and clinician advisory groups to measure PEM triggers, symptoms, frequency, delayed onset, duration, and daily-life impact. Adults with ME/CFS in the UK—recruited via support groups, the ME Association, and the 25% ME Group—completed PASS online and repeated it two weeks later for Rasch analysis and psychometric testing (medRxiv v1 posted 2026-11-08, revised 2026-11-10). Rasch modeling showed that the delayed-onset item was a consistent under-discriminating misfit anomaly across cross-validation sub-samples; once removed, PASS formed a unidimensional scale with moderate criterion-related validity against physical health/severity measures (r = 0.58, p < 0.001), strong discriminant validity across self-rated mild, moderate, and severe ME/CFS (p < 0.001), excellent test-retest reliability (ICC = 0.81), and a minimal detectable difference of 1.93/100 (see [Post-Exertional Malaise & Exercise Physiology](thread:pem-exercise-physiology)). Participants rated PASS as easy to complete, comprehensive, and relevant, but respondents were predominantly middle-aged women with moderate ME/CFS of long duration. Key limitations include preprint status without peer review, reliance on a UK online adult sample where severely ill and bedbound people remain harder to represent despite alternative formats, and the removal of delayed symptom onset—meaning timing of PEM onset must still be documented outside the core PASS score.
de:
  title: Preprint stellt Rasch-validierte Post Activity Symptom Scale (PASS) zur Messung von PEM bei ME/CFS vor
  plain_summary: Forschende und Betroffenenbeiräte haben mit der Post Activity Symptom Scale (PASS) einen neuen Fragebogen zur Messung von Post-Exertional Malaise bei Erwachsenen mit ME/CFS entwickelt, der in einer Online-Rasch-Analyse eine hohe Zwei-Wochen-Zuverlässigkeit zeigte. Da es sich um ein Preprint mit überwiegend moderat betroffenen Online-Teilnehmenden handelt, stehen Peer-Review und eine Prüfung bei schwerstbetroffenen und bettlägerigen Menschen noch aus.
  detail: Horton, Tyson und Fleming (University of Manchester) entwickelten im Rahmen des Projekts ME Association Clinical Assessment Toolkit (MEA-CAT) gemeinsam mit Betroffenen- und Fachbeiräten die Post Activity Symptom Scale (PASS), um Auslöser, Symptome, Häufigkeit, verzögerten Beginn, Dauer und Alltagsauswirkungen von PEM zu erfassen. Erwachsene mit ME/CFS im Vereinigten Königreich – rekrutiert über Selbsthilfegruppen, die ME Association und die 25% ME Group – füllten die PASS online aus und wiederholten sie nach zwei Wochen für Rasch-Analysen und psychometrische Prüfungen (medRxiv v1 vom 08.11.2026, Version 2 vom 10.11.2026). In der Rasch-Modellierung fiel das Item zur Verzögerung des PEM-Beginns über Kreuzvalidierungs-Teilstichproben hinweg als schlecht trennender Ausreißer auf; nach dessen Entfernung ergab sich eine eindimensionale Skala mit moderater Kriteriumsvalidität gegenüber Funktions- und Schweregradmaßen (r = 0,58; p < 0,001), deutlicher Trennschärfe zwischen selbst eingestuftem mildem, moderatem und schwerem ME/CFS (p < 0,001), sehr guter Test-Retest-Reliabilität (ICC = 0,81) und einer kleinsten nachweisbaren Veränderung von 1,93 von 100 Punkten (siehe [Post-Exertional Malaise & Belastungsphysiologie](thread:pem-exercise-physiology)). Teilnehmende bewerteten die Skala als leicht verständlich, umfassend und relevant, doch bestanden die Stichproben überwiegend aus Frauen mittleren Alters mit länger bestehendem, moderatem ME/CFS. Wesentliche Einschränkungen sind der Preprint-Status ohne Peer-Review, die begrenzte Abbildbarkeit sehr schwer betroffener und bettlägeriger Patientinnen und Patienten in einer Online-Erhebung trotz alternativer Formate sowie die Streichung des Items zum verzögerten Beginn, sodass der zeitliche Verlauf von PEM weiterhin separat erfasst werden muss.
