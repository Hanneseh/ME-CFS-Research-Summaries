en:
  title: Two-day submaximal exercise testing suggests a possible metabolic-acidosis subgroup in Long COVID despite null whole-group results
  plain_summary: Across two submaximal exercise tests 24 hours apart, 30 people with Long COVID did not differ as a whole group from healthy controls in blood acid-base balance, but an exploratory subgroup developed metabolic acidosis—rising from 17% on day one to 33% on day two (versus 6% and 11% in controls, reported as 1/18 and 2/18 although the abstract lists 15 controls). This points to possible biological subgrouping under repeated exertion rather than a universal biomarker, and repeated exercise testing still carries PEM risk and excludes bedbound patients.
  detail: In a controlled exercise-physiology study published in *Experimental Physiology*, Faghy, Thomas, Owen, and colleagues examined day-to-day acid-base regulation in 30 individuals with confirmed Long COVID (19 female) and 15 healthy controls (8 female) across three study visits. Participants performed two submaximal cardiopulmonary exercise tests (CPETs) separated by 24 hours, with pre- and post-exercise fingertip capillary blood samples analyzed for pH, bicarbonate (HCO3−), anion gap, electrolytes (K+, Na+, Cl−, ionized calcium), and lactate. Whole-group comparisons revealed no statistically significant differences between Long COVID and healthy controls in acid-base balance or CPET variables (p > 0.05). However, an exploratory subgroup analysis found that 17% (5/30) of Long COVID participants developed metabolic acidosis after CPET1, doubling to 33% (10/30) after CPET2, compared with 6% (1/18) on day 1 and 11% (2/18) on day 2 as reported in controls (although the abstract lists 15 controls in the methods), with small-to-large effect sizes (0.20 to 0.80) across acid-base and lactate parameters. The findings support the hypothesis that repeated submaximal exertion can unmask metabolic and acid-base vulnerability in a biological subset of Long COVID patients (see [Mitochondrial & Metabolic Dysfunction](thread:mitochondrial-metabolic-dysfunction)), rather than establishing a universal diagnostic marker. Key limitations include the small cohort, exploratory subgroup design awaiting independent replication, lack of ME/CFS case stratification or multi-day PEM symptom tracking in the abstract, and the reality that even submaximal repeat exercise protocols over three clinic visits carry PEM deterioration risks and systematically exclude severely ill, bedbound patients.
de:
  title: Zweitägiger submaximaler Belastungstest deutet auf mögliche metabolische Azidose-Untergruppe bei Long COVID trotz neutralem Gesamtergebnis hin
  plain_summary: Bei zwei submaximalen Belastungstests im Abstand von 24 Stunden unterschieden sich 30 Menschen mit Long COVID als Gesamtgruppe im Säure-Basen-Haushalt nicht signifikant von gesunden Kontrollen, doch entwickelte eine explorative Untergruppe eine metabolische Azidose – von 17 % nach Tag eins auf 33 % nach Tag zwei (gegenüber 6 % bzw. 11 % bei Kontrollen, im Abstract als 1/18 und 2/18 bei 15 angegebenen Kontrollen berichtet). Das deutet eher auf biologische Untergruppen bei wiederholter Belastung als auf einen universellen Marker hin; zugleich bergen auch submaximale Mehrfachtests ein PEM-Risiko und schließen Bettlägerige aus.
  detail: In einer kontrollierten belastungsphysiologischen Studie in *Experimental Physiology* untersuchten Faghy, Thomas, Owen und Kolleginnen die tagesabhängige Säure-Basen-Regulation bei 30 Personen mit bestätigtem Long COVID (19 weiblich) und 15 gesunden Kontrollen (8 weiblich) über drei Studientermine hinweg. Die Teilnehmenden absolvierten zwei submaximale Spiroergometrien (CPET) im Abstand von 24 Stunden; vor und nach der Belastung wurden kapillare Blutproben aus der Fingerbeere auf pH-Wert, Bikarbonat (HCO3−), Anionenlücke, Elektrolyte (K+, Na+, Cl−, ionisiertes Kalzium) und Laktat untersucht. Im Gesamtgruppenvergleich zeigten sich keine statistisch signifikanten Unterschiede zwischen Long COVID und Kontrollen bei Säure-Basen-Parametern oder CPET-Werten (p > 0,05). Eine explorative Untergruppenanalyse ergab jedoch, dass 17 % (5/30) der Long-COVID-Betroffenen nach dem ersten Test eine metabolische Azidose entwickelten und dieser Anteil nach dem zweiten Test auf 33 % (10/30) anstieg – verglichen mit 6 % (1/18) an Tag 1 und 11 % (2/18) an Tag 2 laut Abstract bei Kontrollen (obwohl im Methodenteil 15 Kontrollen genannt werden), mit kleinen bis großen Effektstärken (0,20 bis 0,80) über Säure-Basen- und Laktatwerte hinweg. Dies stützt die Hypothese, dass wiederholte submaximale Belastung bei einer biologischen Teilgruppe metabolische und Säure-Basen-Störungen demaskieren kann (siehe [Mitochondriale & metabolische Dysfunktion](thread:mitochondrial-metabolic-dysfunction)), belegt aber keinen universellen Biomarker. Einschränkungen sind die kleine Kohorte, der explorative Charakter der noch unreplizierten Untergruppenanalyse, fehlende ME/CFS-Fallstratifizierung oder mehrtägige PEM-Symptomverfolgung im Abstract sowie die Tatsache, dass auch submaximale Mehrfachbelastungen über drei Klinikbesuche ein PEM-Verschlechterungsrisiko tragen und schwer sowie bettlägerig Erkrankte systematisch ausschließen.
