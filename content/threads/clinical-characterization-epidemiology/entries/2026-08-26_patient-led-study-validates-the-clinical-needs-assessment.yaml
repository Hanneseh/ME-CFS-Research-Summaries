en:
  title: Patient-led study validates the Clinical Needs Assessment for ME (CNAME)
  plain_summary: Patients and clinicians co-created and tested a 21-item checklist (CNAME) to help document practical and medical support needs in ME/CFS, including in 18.5% severely affected survey respondents. It is an open-access assessment tool rather than a treatment or severity score.
  detail: Tyson and Fleming co-produced and validated the 21-item CNAME with people living with ME/CFS and NHS specialist clinicians using COSMIN-informed methods. The work included an advisory group of 15 patients, a 400-person Great Britain validation survey, and a 124-person revision survey; 18.5% of the main survey respondents were reported as severely or very severely affected, and flexible completion modes and carer support were used to reduce burden. CNAME creates an actionable profile of clinical and practical needs rather than a summated severity score, with no exercise challenge and no treatment validation; even so, very severe participants with screen intolerance remained difficult to include. The open-access tool is available through the ME Association Clinical Assessment Toolkit and Autonom-E app.
de:
  title: Patientengeführte Studie validiert das Bedarfserhebungsinstrument Clinical Needs Assessment for ME (CNAME)
  plain_summary: Betroffene und Fachkräfte haben gemeinsam eine 21-Punkte-Checkliste (CNAME) entwickelt und getestet, um medizinische und alltagspraktische Unterstützungsbedarfe bei ME/CFS strukturiert zu erfassen – einschließlich 18,5 % schwer Betroffener in der Hauptbefragung. Es ist ein frei zugängliches Bedarfserfassungs-Werkzeug und kein Therapie- oder Summen-Schweregrad-Test.
  detail: Tyson und Fleming entwickelten und validierten gemeinsam mit ME/CFS-Betroffenen und NHS-Fachkräften nach COSMIN-orientierten Methoden das 21-Item-Instrument CNAME. Die Arbeit umfasste einen 15-köpfigen Patientenbeirat, eine britische Validierungsbefragung mit 400 Personen sowie eine Überarbeitungsbefragung mit 124 Teilnehmenden; 18,5 % der Befragten in der Haupterhebung wurden als schwer oder sehr schwer betroffen eingestuft, und flexible Ausfüllwege sowie Unterstützung durch Angehörige senkten die Belastung. CNAME erstellt ein handlungsorientiertes Profil klinischer und praktischer Bedürfnisse statt eines addierten Schweregrad-Scores, ohne Belastungstest und ohne Therapievalidierung; dennoch blieben sehr schwer Betroffene mit Bildschirmintoleranz schwer erreichbar. Das frei zugängliche Instrument steht über das Clinical Assessment Toolkit der ME Association und die Autonom-E-App bereit.
