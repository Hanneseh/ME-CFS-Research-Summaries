en:
  title: National US cohort of 19 million patients links hypermobile Ehlers-Danlos syndrome and overlapping comorbidities to nearly triple Long COVID risk
  plain_summary: A US health-record study of over 19 million patients found hypermobile Ehlers-Danlos syndrome (hEDS) to be more common than often assumed and linked to nearly triple the odds of a Long COVID diagnosis, especially alongside POTS, MCAS, and ME/CFS. Because the study relies on electronic billing codes and broad Long COVID diagnoses, it does not prove causation or measure criteria-defined ME/CFS directly.
  detail: |-
    Pearson and colleagues analyzed electronic health records from over 19 million US patients in the N3C Enclave, identifying 25,152 individuals with hEDS or unspecified EDS (0.127%, or roughly 1 in 788; specified hEDS alone accounted for 7,786 patients, or 1 in 2,549), predominantly female (84.2%) and White (88.3%). Although documented SARS-CoV-2 infection rates were similar or slightly lower than in propensity-matched controls (38.4% vs. 41.2%; OR = 0.89), hEDS patients had nearly three times the odds of receiving a Long COVID diagnosis (4.0% vs. 1.4%; OR = 2.88, 95% CI 2.55–3.26) or attending a Long COVID specialty clinic (OR = 2.98, 95% CI 2.18–4.08). This elevated risk concentrated among hEDS patients who also carried overlapping post-viral comorbidities—specifically autonomic dysfunction (POTS), mast cell activation (MCAS), and chronic fatigue (ME/CFS)—while a subgroup diagnosed with hEDS only after COVID-19 or Long COVID was heavily enriched for POTS and MCAS multimorbidity (see [Autonomic Dysfunction & POTS](thread:autonomic-dysfunction-pots) and [Immune Dysregulation & Inflammation](thread:immune-dysregulation-inflammation)). Patients with hEDS also had higher odds of Paxlovid prescriptions (OR = 2.05) alongside lower odds of post-COVID pneumonia (OR = 0.66) and Remdesivir use. Important limitations apply: retrospective EHR cohorts depend on ICD/OMOP coding and clinician recognition—which can inflate comorbidity clusters through diagnostic surveillance—the primary cohort pooled specified hEDS with unspecified EDS codes, and broad EHR-coded Long COVID does not equate to criteria-defined ME/CFS with standardized PEM verification.
de:
  title: Nationale US-Kohorte mit 19 Millionen Patientendaten verknüpft hypermobiles Ehlers-Danlos-Syndrom und Begleiterkrankungen mit fast dreifachem Long-COVID-Risiko
  plain_summary: Eine US-Auswertung elektronischer Gesundheitsakten von über 19 Millionen Menschen fand eine höhere Häufigkeit des hypermobilen Ehlers-Danlos-Syndroms (hEDS) als bisher angenommen und fast dreifach erhöhte Chancen für eine Long-COVID-Diagnose, besonders zusammen mit POTS, MCAS und ME/CFS. Da die Studie auf Abrechnungscodes und breiten Long-COVID-Diagnosen beruht, beweist sie keinen ursächlichen Zusammenhang und erfasst kein kriterienbasiertes ME/CFS.
  detail: |-
    Pearson und Kolleginnen und Kollegen werteten elektronische Gesundheitsakten von über 19 Millionen US-Patientinnen und -Patienten im N3C-Enclave-Datensatz aus und identifizierten 25.152 Personen mit hEDS oder nicht näher bezeichnetem EDS (0,127 % bzw. rund 1 von 788; spezifisch codiertes hEDS allein: 7.786 Personen bzw. 1 von 2.549), überwiegend weiblich (84,2 %) und weiß (88,3 %). Trotz ähnlicher oder leicht geringerer dokumentierter SARS-CoV-2-Infektionsraten im Vergleich zu per Propensity-Score gematchten Kontrollen (38,4 % gegenüber 41,2 %; OR = 0,89) hatten hEDS-Betroffene fast dreimal so hohe Chancen auf eine Long-COVID-Diagnose (4,0 % gegenüber 1,4 %; OR = 2,88; 95-%-KI 2,55–3,26) oder den Besuch einer Long-COVID-Spezialambulanz (OR = 2,98; 95-%-KI 2,18–4,08). Dieses erhöhte Risiko konzentrierte sich auf hEDS-Betroffene mit typischen überschneidenden Begleiterkrankungen wie autonomer Dysfunktion (POTS), Mastzellaktivierung (MCAS) und chronischer Fatigue (ME/CFS); zudem wies eine Untergruppe, die erst nach COVID-19 oder Long COVID eine hEDS-Diagnose erhielt, eine besonders hohe Multimorbidität mit POTS und MCAS auf (siehe [Autonome Dysfunktion & POTS](thread:autonomic-dysfunction-pots) und [Immundysregulation & Entzündung](thread:immune-dysregulation-inflammation)). Gleichzeitig erhielten hEDS-Betroffene häufiger Paxlovid (OR = 2,05) und hatten geringere Chancen für eine Post-COVID-Pneumonie (OR = 0,66) oder Remdesivir-Gabe. Zentrale Einschränkungen sind die Abhängigkeit retrospektiver Aktenstudien von ICD-/OMOP-Diagnosecodes und ärztlicher Aufmerksamkeit (Surveillance-Verzerrung), die Zusammenfassung von spezifischem hEDS und unspezifischem EDS in der Hauptkohorte sowie der Umstand, dass codiertes Long COVID nicht mit kriterienbasiertem ME/CFS samt standardisierter PEM-Prüfung gleichzusetzen ist.
