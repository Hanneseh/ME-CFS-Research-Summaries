  kind: other
en:
  title: Research initiative launches to investigate GPCR autoantibodies and vascular endothelial damage
  plain_summary: A Frankfurt research group announced a newly funded project to test how GPCR autoantibodies might damage blood vessels in post-COVID ME/CFS. This is a study launch announcement, so no patient results are available yet.
  detail: The German Centre for Cardiovascular Research (DZHK) partner institution at Goethe University Frankfurt announced a dedicated research project funded by the ME/CFS Research Foundation 2026 Programme to investigate the functional role of G-protein coupled receptor (GPCR) autoantibodies in Post-COVID ME/CFS. The study focuses on molecular mechanisms by which functional GPCR autoantibodies induce vascular endothelial injury, impaired microvascular perfusion, and exertional intolerance. By combining established cardiovascular research infrastructure with targeted post-viral disease funding, the initiative aims to clarify how post-infectious autoantibodies impair vascular tone and endothelial integrity. However, this is an institutional research announcement detailing study launch and methodological design rather than completed empirical trial findings. As such, it does not yet provide new patient cohort data or validate therapeutic targeting of these autoantibodies in clinical settings.
de:
  title: Forschungsinitiative gestartet zur Untersuchung von GPCR-Autoantikörpern und Gefäßendothelschäden
  plain_summary: Eine Frankfurter Forschungsgruppe kündigte ein neu gefördertes Projekt an, das untersuchen soll, wie GPCR-Autoantikörper bei Post-COVID-ME/CFS Blutgefäße schädigen könnten. Es handelt sich um die Ankündigung eines Studienstarts; eigene Patientenergebnisse liegen daher noch nicht vor.
  detail: Der Partnerstandort des Deutschen Zentrums für Herz-Kreislauf-Forschung (DZHK) an der Goethe-Universität Frankfurt kündigte ein gezieltes Forschungsprojekt an, das vom Förderprogramm 2026 der ME/CFS Research Foundation finanziert wird, um die funktionelle Rolle von Autoantikörpern gegen G-Protein-gekoppelte Rezeptoren (GPCR) bei Post-COVID-ME/CFS zu untersuchen. Die Studie konzentriert sich auf molekulare Mechanismen, über die funktionelle GPCR-Autoantikörper Gefäßendothelschäden, eine beeinträchtigte mikrovaskuläre Perfusion und Belastungsintoleranz hervorrufen. Durch die Verbindung etablierter Herz-Kreislauf-Forschungsinfrastruktur mit gezielter Förderung postviraler Erkrankungen will die Initiative klären, wie postinfektiöse Autoantikörper den Gefäßtonus und die Endothelintegrität beeinträchtigen. Allerdings handelt es sich um eine institutionelle Forschungsankündigung zum Projektstart und zum methodischen Design und nicht um abgeschlossene empirische Studienergebnisse. Sie
    liefert daher noch keine neuen Patientendaten und validiert keine gezielte Behandlung dieser Autoantikörper im klinischen Alltag.
