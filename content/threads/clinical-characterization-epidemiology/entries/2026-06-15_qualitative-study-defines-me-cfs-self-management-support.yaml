en:
  title: Qualitative study defines ME/CFS self-management support needs for patients and next of kin
  plain_summary: Interviews with 12 Norwegian ME/CFS patients and 4 relatives showed that self-management programs need pacing tools, flexible pacing of delivery, and family involvement. While the small group reflects one local setting, it highlights practical gaps in how pacing advice is delivered.
  detail: A Norwegian qualitative study interviewed 12 people with ME/CFS and 4 next of kin about self-management support. Participants described a need for individualized timing, flexible digital or hybrid formats, continuity, validation, peer support, pacing tools, and family-inclusive guidance. The study also found that existing support is often poorly aligned with cognitive and physical limitations, and that patients receive inconsistent activity-management advice. This belongs in clinical characterization because support design determines whether evidence-based concepts like pacing are actually usable for patients. The sample is small and context-specific, so it should guide care-model design rather than define universal preferences.
de:
  title: Qualitative Studie beschreibt Unterstützungsbedarf beim Selbstmanagement für ME/CFS-Betroffene und Angehörige
  plain_summary: Interviews mit 12 ME/CFS-Betroffenen und 4 Angehörigen in Norwegen zeigten, dass Unterstützungsangebote Pacing-Werkzeuge, flexible Formate und den Einbezug von Familien brauchen. Die kleine Stichprobe spiegelt einen lokalen Kontext wider, macht aber typische Hürden bei bisherigen Angeboten sichtbar.
  detail: Eine norwegische qualitative Studie befragte 12 Menschen mit ME/CFS und 4 Angehörige zu ihren Bedürfnissen beim Selbstmanagement. Die Teilnehmenden beschrieben den Bedarf an individueller zeitlicher Taktung, flexiblen digitalen oder hybriden Formaten, Kontinuität, Anerkennung, Austausch unter Betroffenen, Pacing-Werkzeugen sowie einer Beratung, die das familiäre Umfeld einbezieht. Zudem zeigte die Studie, dass bestehende Unterstützungsangebote oft schlecht an kognitive und körperliche Grenzen angepasst sind und Betroffene widersprüchliche Empfehlungen zum Aktivitätsmanagement erhalten. Dies gehört zur klinischen Charakterisierung, weil die Ausgestaltung von Angeboten darüber entscheidet, ob evidenzbasierte Konzepte wie Pacing im Alltag tatsächlich nutzbar sind. Da die Stichprobe klein und kontextgebunden ist, sollte sie Versorgungsmodelle inspirieren, aber nicht als allgemeingültig verallgemeinert werden.
