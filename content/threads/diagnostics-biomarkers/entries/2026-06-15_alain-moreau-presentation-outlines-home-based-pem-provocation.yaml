en:
  title: Alain Moreau presentation outlines home-based PEM provocation and cognitive trajectories
  plain_summary: At a 2026 conference, Alain Moreau reported early pilot data using an inflatable cuff at home to provoke post-exertional responses and spot three distinct cognitive patterns linked to brain oxygen use and haptoglobin genetics. These are preliminary conference findings requiring larger validation, and any provocation test carries a risk of worsening symptoms.
  detail: 'In a conference presentation at the Internationale ME/CFS-Konferenz 2026, Alain Moreau presented early pilot data detailing a deep phenotyping and post-exertional malaise (PEM) provocation protocol. The protocol utilizes a home-based inflatable cuff massage to safely and standardly trigger post-exertional responses in severely affected patients, followed by multi-omics analysis. Post-provocation, researchers identified three distinct cognitive trajectories using a 10-minute tablet-based BrainCheck test, which were indistinguishable at baseline: memory decline (Cluster A), resilience (Cluster B), and severe multi-domain decline (Cluster C). The severe decline group correlated with reduced cerebral oxygen extraction via near-infrared spectroscopy (NIRS) and a sudden drop in circulating brain-derived neurotrophic factor (BDNF). Vulnerability in Cluster C was linked to the HP2-1 haptoglobin phenotype and elevated soluble LRP1, which acts as a decoy blocking hemoglobin detoxification.
    While offering therapeutic leads like recombinant haptoglobin, pentoxifylline, and mitapivat, these findings represent early pilot data requiring validation in larger cohorts, and active provocation carries risk of clinical worsening.'
de:
  title: Vortrag von Alain Moreau skizziert häusliche PEM-Provokation und kognitive Verlaufsmuster
  plain_summary: Auf einer Konferenz 2026 stellte Alain Moreau erste Pilotdaten mit einer aufblasbaren Armmanschette zu Hause vor, nach deren Reizung sich drei unterschiedliche kognitive Verlaufsmuster passend zu Hirnsauerstoffwerten und Haptoglobin-Genetik abzeichneten. Es handelt sich um frühe Konferenzdaten, die größere Prüfungen erfordern; zudem birgt jede gezielte Belastungsprovokation das Risiko einer Symptomverschlechterung.
  detail: 'In einem Konferenzvortrag auf der Internationalen ME/CFS-Konferenz 2026 präsentierte Alain Moreau frühe Pilotdaten zu einem Tiefenphänotypisierungs- und PEM-Provokationsprotokoll. Das Protokoll nutzt eine zu Hause anwendbare aufblasbare Manschettenmassage, um bei schwer betroffenen Patientinnen und Patienten schonend und standardisiert post-exertionelle Reaktionen auszulösen, gefolgt von Multi-Omics-Analysen. Nach der Provokation zeigten sich mit dem zehnminütigen Tablet-Test BrainCheck drei unterschiedliche kognitive Verläufe, die im Ausgangszustand nicht unterscheidbar waren: Gedächtnisabfall (Cluster A), Belastbarkeit (Cluster B) und ein schwerer Abfall über mehrere Bereiche hinweg (Cluster C). Die Gruppe mit schwerem Abfall korrelierte mit einer verringerten zerebralen Sauerstoffextraktion in der Nahinfrarotspektroskopie (NIRS) und einem plötzlichen Abfall von zirkulierendem BDNF. Die Anfälligkeit in Cluster C war mit dem Haptoglobin-Phänotyp HP2-1 und erhöhtem löslichem LRP1
    verknüpft, das als Köderrezeptor die Hämoglobin-Entgiftung blockiert. Obwohl sich daraus Therapieansätze wie rekombinantes Haptoglobin, Pentoxifyllin oder Mitapivat ableiten lassen, handelt es sich um frühe Pilotdaten, die in größeren Kohorten bestätigt werden müssen, und eine aktive Provokation birgt das Risiko einer klinischen Verschlechterung.'
