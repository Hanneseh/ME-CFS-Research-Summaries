en:
  title: Narrative review consolidates ME/CFS criteria, evidence gaps, and severe-care priorities
  plain_summary: A broad review summarized current ME/CFS criteria, underlined PEM as central, warned that clinic studies miss housebound patients, and reiterated that graded exercise is contraindicated. As a narrative overview, it offers orientation rather than new trial data.
  detail: Jeyaraman et al. published a broad, non-registered narrative review covering diagnostic criteria, epidemiology, multi-system mechanisms, biomarkers, treatment research, and prognosis in ME/CFS and overlapping Long COVID. It emphasizes PEM as central, documents that clinic-based research systematically misses many housebound or bedbound patients, and calls for decentralized trials and home monitoring; it also reiterates that graded exercise therapy is contraindicated and that proposed biomarkers and treatments remain unvalidated or early-stage. As a review it imposed no patient burden or exertion challenge, but its underlying literature is heterogeneous and the narrative method did not provide systematic risk-of-bias appraisal or meta-analytic estimates. The paper is useful orientation, not new primary evidence or a treatment recommendation.
de:
  title: Narrative Übersichtsarbeit bündelt ME/CFS-Kriterien, Evidenzlücken und Prioritäten für Schwerbetroffene
  plain_summary: Eine breite Übersichtsarbeit fasst aktuelle ME/CFS-Kriterien zusammen, stellt PEM ins Zentrum, weist auf das Fehlen Hausgebundener in Klinikstudien hin und bekräftigt die Kontraindikation von abgestufter Aktivierung. Als narrative Übersicht bietet sie Orientierung, keine neuen Primärdaten.
  detail: Jeyaraman et al. veröffentlichten eine breite, nicht registrierte narrative Übersichtsarbeit zu Diagnosekriterien, Epidemiologie, Multisystem-Mechanismen, Biomarkern, Therapieforschung und Prognose bei ME/CFS sowie überlappendem Long COVID. Sie stellt PEM in den Mittelpunkt, dokumentiert, dass klinikbasierte Forschung viele hausgebundene oder bettlägerige Patientinnen und Patienten systematisch verfehlt, und fordert dezentrale Studien sowie häusliches Monitoring; zudem bekräftigt sie, dass abgestufte Aktivierungstherapie kontraindiziert ist und vorgeschlagene Biomarker sowie Therapien bislang unvalidiert oder frühphasig bleiben. Als Übersichtsarbeit belastete sie keine Teilnehmenden, beruht aber auf heterogener Literatur ohne systematische Verzerrungsbewertung oder Metaanalyse und liefert weder neue Primärevidenz noch Therapieempfehlungen.
