en:
  title: Swedish twin-sibling register study reports modest shared genetic risk between ME/CFS and immune-mediated diseases
  plain_summary: A Swedish register study of over six million relatives found modest shared family genetic risk between recorded ME/CFS and immune-mediated diseases, as well as irritable bowel syndrome and depression. Because it relied on routine diagnostic codes rather than PEM-verified criteria, it gives only a broad population view and does not pinpoint specific genes.
  detail: Steen et al. analysed a Swedish national register cohort of 6,097,372 twins, full siblings, and half-siblings to evaluate shared familial and genetic liability across immune-mediated diseases, conditions grouped by the authors as "functional somatic syndromes," and internalizing disorders. Phenotypes were derived from ICD codes across Swedish inpatient, outpatient, and primary-care registers, with heritability estimates ranging from 15% to 44% across the evaluated conditions. Fibromyalgia exhibited the strongest genetic correlation with immune-mediated conditions, whereas register-diagnosed ME/CFS, irritable bowel syndrome, and major depression displayed modest correlations spanning an rA range of 0.19–0.29 across the three diagnoses, compared to a near-zero correlation for anxiety disorders. The analysis is limited by its reliance on administrative register coding without clinical post-exertional malaise verification, probable under-diagnosis, and the absence of a disease-specific
    heritability estimate for ME/CFS in the abstract. Because the design estimates quantitative family-level correlation rather than identifying molecular loci, the findings complement but remain distinct from molecular GWAS such as DecodeME and the prospective Dubbo polygenic-score cohort of Ruseva et al. (see the 2026-09-23 entry), with severe or bedbound representation unaddressed in register records.
de:
  title: Schwedische Zwillings- und Geschwister-Registerstudie berichtet moderat geteiltes genetisches Risiko zwischen ME/CFS und immunvermittelten Erkrankungen
  plain_summary: Eine schwedische Registerstudie mit über sechs Millionen Verwandten fand ein leichtes gemeinsames familiäres Risiko zwischen dokumentiertem ME/CFS und immunvermittelten Erkrankungen sowie Reizdarm und Depression. Da sie sich nur auf Abrechnungs- und Registercodes ohne PEM-Prüfung stützt, liefert sie lediglich ein grobes Bevölkerungsbild und benennt keine konkreten Gene.
  detail: Steen et al. analysierten eine schwedische nationale Registerkohorte von 6.097.372 Zwillingen, Vollgeschwistern und Halbgeschwistern, um gemeinsame familiäre und genetische Belastungen zwischen immunvermittelten Erkrankungen, von den Autoren als „funktionelle somatische Syndrome“ zusammengefassten Diagnosen sowie internalisierenden Störungen zu prüfen. Die Phänotypen stammten aus ICD-Codes schwedischer stationärer, ambulanter und hausärztlicher Register, mit Heritabilitätsschätzungen zwischen 15 % und 44 % über die betrachteten Erkrankungen hinweg. Fibromyalgie zeigte die stärkste genetische Korrelation mit immunvermittelten Erkrankungen, während im Register erfasstes ME/CFS, Reizdarmsyndrom und schwere Depression moderate Korrelationen im rA-Bereich von 0,19–0,29 über diese drei Diagnosen hinweg aufwiesen (gegenüber nahe null bei Angststörungen). Eingeschränkt wird die Aussagekraft durch die Abhängigkeit von administrativen Registercodes ohne klinische Prüfung auf Post-Exertional
    Malaise, wahrscheinliche Unterdiagnose sowie das Fehlen einer krankheitsspezifischen Heritabilitätsschätzung für ME/CFS im Abstract. Da das Studiendesign quantitative familiäre Korrelationen statt einzelner Genorte schätzt, ergänzt es molekulare GWAS wie DecodeME und die prospektive Dubbo-Polygenic-Score-Kohorte von Ruseva et al. (siehe Eintrag vom 2026-09-23), lässt schwere oder bettlägerige Betroffene in Registerdaten jedoch unberücksichtigt.
