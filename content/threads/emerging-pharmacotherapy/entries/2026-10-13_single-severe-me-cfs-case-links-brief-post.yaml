en:
  title: Single severe ME/CFS case links brief post-vaccination remission with immune changes
  plain_summary: A case report described a woman with severe ME/CFS who experienced brief symptom improvements after two shingles vaccine doses alongside temporary blood immune shifts, before relapsing each time. A single uncontrolled case with temporary changes does not explain causation or support using vaccination as an ME/CFS treatment.
  detail: A peer-reviewed case report describes a woman in her 60s with long-standing severe ME/CFS who reported brief improvement in sleep, cognition, pain and mobility after each of two recombinant zoster vaccine doses, followed by relapse; after the first dose, symptoms were briefly worse than baseline before returning to baseline. Blood immune profiling around the second dose showed changes in monocytes, exhaustion-associated T-cell markers and NK-cell degranulation, compared with one healthy control. She used a cane or walker on most days, and the report does not name a specific diagnostic case definition or establish applicability to continuously bedbound disease. This is a direct severe-ME/CFS observation, but a single uncontrolled case with self-reported symptoms cannot establish causation or predict who might respond. There was no sustained recovery, standardized functional outcome or adequate longitudinal safety/PEM assessment. Fever and body aches accompanied the doses, and the
    temporary remissions do not support using vaccination as an ME/CFS treatment. The research question is whether serial sampling in larger cohorts can connect reversible immune changes to independently measured function.
de:
  title: Einzelner schwerer ME/CFS-Fall verknüpft kurze Besserung nach Impfung mit Immunveränderungen
  plain_summary: Ein Fallbericht beschreibt eine Frau mit schwerem ME/CFS, die nach zwei Gürtelrose-Impfdosen jeweils kurzzeitig Besserungen zusammen mit vorübergehenden Veränderungen von Immunmarkern im Blut erlebte, bevor ein Rückfall eintrat. Ein einzelner unkontrollierter Fall ohne anhaltende Erholung belegt keinen ursächlichen Zusammenhang und stützt Impfungen nicht als Therapie.
  detail: Ein begutachteter Fallbericht beschreibt eine Frau in ihren 60ern mit langjährigem schwerem ME/CFS, die nach jeder von zwei Dosen eines rekombinanten Zoster-Impfstoffs eine kurze Besserung von Schlaf, Kognition, Schmerzen und Mobilität berichtete, gefolgt von einem Rückfall; nach der ersten Dosis waren die Beschwerden vorübergehend schlechter als zu Beginn, bevor sie auf das Ausgangsniveau zurückkehrten. Immunprofile im Blut rund um die zweite Dosis zeigten Veränderungen bei Monozyten, mit T-Zell-Erschöpfung assoziierten Markern und NK-Zell-Degranulation im Vergleich zu einer gesunden Kontrolle. Sie nutzte an den meisten Tagen einen Gehstock oder Rollator; der Bericht nennt keine spezifische diagnostische Falldefinition und belegt keine Übertragbarkeit auf dauerhaft bettlägerige Verläufe. Dies ist eine direkte Beobachtung bei schwerem ME/CFS, doch ein einzelner unkontrollierter Fall mit selbstberichteten Symptomen kann weder Kausalität belegen noch vorhersagen, wer ansprechen könnte.
    Es gab keine anhaltende Erholung, kein standardisiertes Funktionsmaß und keine ausreichende längsschnittliche Sicherheits-/PEM-Bewertung; Fieber und Gliederschmerzen begleiteten die Impfungen, und die vorübergehenden Remissionen sprechen nicht für Impfungen als ME/CFS-Therapie. Offen bleibt, ob serielle Messungen in größeren Kohorten reversible Immunveränderungen mit unabhängig gemessener Funktion verknüpfen können.
