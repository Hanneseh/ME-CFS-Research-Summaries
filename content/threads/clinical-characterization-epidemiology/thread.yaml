de:
  title: Klinische Charakterisierung & Epidemiologie
  subtitle: Ein fortlaufender Überblick zu ME/CFS-Falldefinitionen, klinischen Leitlinien, Epidemiologie, Kohortendesign, Symptommessung, Forschungsinfrastruktur sowie Förderentwicklungen bei ME/CFS und Long COVID.
  evidence_label: etablierter klinischer Konsens mit laufender Verfeinerung
  plain_summary: ME/CFS ist als schwere, körperliche Multisystemerkrankung anerkannt, die durch anhaltende Erschöpfung, nicht erholsamen Schlaf und eine oft verzögerte Verschlechterung nach geringer Belastung (Post-Exertional Malaise) gekennzeichnet ist. Große Befragungen und nationale Register zeigen ausgeprägte Einschränkungen im Alltag, niedrige Erwerbsquoten, lange Wartezeiten bis zur Diagnose, in einer norwegischen Registerstudie fast dreimal so hohe direkte Gesundheitskosten sowie Überschneidungen mit Bindegewebs- und autonomen Erkrankungen, während neue, mit Betroffenen entwickelte Skalen PEM und Schweregrad verlässlicher messen sollen. Einen einzelnen Labortest zur Diagnose gibt es bislang jedoch nicht, Studienendpunkte und Sicherheitsberichte bleiben uneinheitlich, und neue Förderaufrufe beginnen erst, große Lücken in Grundlagen- und Therapieforschung zu schließen.
  takeaway: |-
    ME/CFS ist als schwere, biologisch fundierte Multisystemerkrankung etabliert. Seit der IOM-Bericht von 2015 eine geschärfte klinische Falldefinition rund um Post-Exertional Malaise (PEM), nicht erholsamen Schlaf sowie kognitive oder orthostatische Symptome verankert hat, haben große epidemiologische Studien und Register die enorme sozioökonomische Krankheitslast und anhaltende Versorgungslücken deutlich gemacht. US-Umfragedaten zufolge haben 1,5 % der Erwachsenen eine Diagnose erhalten – mit der wichtigen Einschränkung, dass fast die Hälfte derer, die eine „frühere“ Diagnose angeben, weiterhin aktive Symptome und funktionelle Einschränkungen erlebt. Landesweite Registerdaten aus Neuseeland belegen erhebliche sozioökonomische Benachteiligungen, darunter Erwerbsquoten unter 20 % und große Hürden beim Zugang zu Behinderten- und Unterstützungsleistungen, während eine landesweite norwegische Registerstudie von 2026 fast dreimal so hohe direkte Gesundheitskosten bei diagnostiziertem ME/CFS gegenüber einer Bevölkerungskontrollgruppe dokumentiert – stark getrieben durch Krankenhausbehandlungen trotz fehlender etablierter Therapie. Verschärft wird dies durch eine fragmentierte Versorgung und „statistische Unsichtbarkeit“ aufgrund fehlender Diagnosecodes, wie Versorgungsanalysen zeigen – was Nachverfolgung und Kapazitätsplanung erschwert.

    Neuere große Symptom-Cluster-, Komorbiditäts- und Faktorenanalysen haben Betroffene genauer in Untergruppen und überlappende Risikogruppen eingeteilt. Eine Auswertung der britischen DecodeME-Kohorte mit über 19.000 Teilnehmenden identifizierte Untergruppen mit hoher und niedriger Symptomlast und verknüpfte einen infektiösen Beginn mit höherer Langzeitschwere, fand jedoch keine genomweit signifikanten genetischen Prädiktoren. Vergleichende Kohortendaten mit einer prospektiv begleiteten Post-Mononukleose-Gruppe deuten zudem darauf hin, dass die Funktions- und Symptomlast bei Long COVID zwischen operational definiertem moderatem und schwerem Post-Mononukleose-ME/CFS liegen kann; dies stützt phänotypische Überschneidungen postviraler Erkrankungen, grenzt aber Schweregrad-Einteilungen aus Universitätskohorten klar von bettlägerigen Verläufen ab. In einer US-Gesundheitsaktenkohorte von über 19 Millionen Menschen erwies sich das hypermobile Ehlers-Danlos-Syndrom (hEDS) als häufiger als bisher erfasst (rund 1 von 788) und ging mit fast dreifach erhöhten Chancen auf eine Long-COVID-Diagnose einher (OR 2,88), konzentriert bei Betroffenen mit POTS, MCAS und ME/CFS – wobei Abrechnungscodes breites Long COVID und kein kriterienbasiertes ME/CFS abbilden. Weitere Faktorenanalysen bestätigen, dass sich selbstberichtete Symptome zu konsistenten biologischen Dimensionen bündeln (Gehirn, autonomes Nervensystem, Darm-Immun-Achse), wobei geschlechtsstratifizierte Modelle zeigen, dass weibliche Sexualhormone Immunbeschwerden (etwa grippeähnliche Symptome bei prämenopausalen Frauen) dynamisch modulieren, nicht aber gastrointestinale Signalwege. Die standardisierte Symptommessung ist mit der Rasch-validierten TIMES-Skala – die eine hohe kumulative Multisystemlast abbildet, bei der kognitive Symptome als besonders belastend eingestuft wurden – sowie Preprints vom November 2026 zur patientenmitentwickelten Post Activity Symptom Scale (PASS) für PEM und den Kurzskalen zu Schweregrad (SoMES) und Erwerbsstatus (MEOSS) vorangekommen, wobei PASS, SoMES und MEOSS noch Peer-Review und unabhängige Prüfungen bei Schwerbetroffenen benötigen.

    Die nationale Forschungs- und Versorgungsinfrastruktur ist durch neue Förderinitiativen gewachsen, doch bleiben strukturelle Lücken groß. In Europa zielt das mit 7,5 Millionen Euro gestartete Konsortium DISCOVER-ME darauf ab, Biobank-Protokolle über mehr als 20 Einrichtungen hinweg zu standardisieren, um Multisystem-Biomarker zu validieren. In Deutschland hat das vom BMG geförderte Netzwerk PEDNET-LC Versorgungspfade und ein zentrales pädiatrisches Register aufgebaut und ergänzt damit Kinderkohorten, die zeigen, dass anhaltende Post-COVID-Symptome bei Kindern schrittweise mit der Schwere der Akutinfektion korrelieren. Ein Förderbericht der ME/CFS Research Foundation vom November 2026 zu 259 öffentlich geförderten deutschen Projekten (292 Millionen Euro für 2020–2029) zeigt jedoch, dass nur 7 % interventionelle Studien sind, nur 5 % medikamentöse Therapien prüfen und lediglich 39 % ME/CFS einbeziehen (gegenüber 84 % bei Long COVID); kurz darauf startete das BMFTR im Rahmen der Nationalen Dekade eine interdisziplinäre Pathomechanismus-Fördermaßnahme (Skizzenfrist Januar 2027), die ausdrücklich zur Einbeziehung hausgebundener Schwerstbetroffener aufruft. Die therapeutische Evidenz bleibt vorläufig: Die begutachtete Publikation der Cohen-Center-Pilotstudie zur häuslichen Magnetfeldtherapie stützt zwar Machbarkeit und Verträglichkeit, zeigt nach Korrektur für multiples Testen (False Discovery Rate) aber keinen kognitiven Nutzen; die antiviralen Daten des Cohen Centers bleiben eine offene Fallserie; und eine begutachtete, nicht randomisierte kontrollierte Studie der Charité fand nach 12 Monaten keinen statistisch signifikanten Vorteil bei der körperlichen Funktion durch integrierte multidisziplinäre Versorgung mit stationärer Rehabilitation gegenüber einer einmaligen Spezialsprechstunde. Nationale und regionale Stellen haben zudem Versorgungslücken und geplante Kapazitäten dokumentiert: der Abschlussbericht des deutschen Registers MECFS-R (724 Patientinnen und Patienten, 54 % des Rekrutierungsziels, keine Prognoseanalyse möglich), der belgische KCE-Bericht zum Versorgungsbedarf, die Stellungnahme der Leopoldina zu postinfektiösen Erkrankungen sowie das geplante PAIS-Zentrum in Wien (gestufte Versorgung ab Sommer 2027, Vollbetrieb ab Mitte 2028). Dabei handelt es sich um Pläne, Analysen und Bestandsaufnahmen, nicht um Wirksamkeitsnachweise.

    Neuere Arbeiten machen die praktischen und methodischen Lücken zudem schwerer übersehbar. Bevölkerungskohorten zeigen, dass stark belastende Long-COVID-Verläufe und anhaltende Post-COVID-Symptome eher auf einem Plateau verharren als rasch abzuklingen, während patientengeführte Messinstrumente und ein internationaler Diagnosekonsens auf belastungsärmere, PEM-bewusste Untersuchungen hinwirken. Befragungen dokumentieren medizinische und behördliche Entwertung als strukturelle Hürden, und eine Übersichtsarbeit von 2026 zu 397 Endpunkten aus 105 biomedizinischen Long-COVID- und ME/CFS-Studien bestätigt fehlenden Endpunktkonsens sowie erhebliche Lücken bei PEM-, Dysautonomie-, Mastzell- und Sicherheitsdaten. Diese Entwicklungen verbessern Orientierung und Studiendesign, ersetzen aber keine validierten Biomarker oder belegten krankheitsmodifizierenden Therapien.
  why_it_matters: |-
    Die Genauigkeit einer Falldefinition prägt jede nachfolgende Studie. Kohorten, die nach den Fukuda-Kriterien von 1994, den Kanadischen Konsenskriterien oder den IOM-Kriterien von 2015 rekrutiert werden, unterscheiden sich erheblich in Symptomschwere und biologischen Signalen – das erschwert den Vergleich zwischen Studien und Förderprogrammen. Epidemiologische Forschung ist aus demselben Grund zentral: Wenn Register vor allem Menschen mit gutem Zugang zu Fachdiagnostik erfassen, unterschätzen Prävalenzschätzungen die tatsächliche Krankheitslast, und Ressourcen fließen an verzerrten Zahlen entlang.

    Messinstrumente entscheiden unmittelbar darüber, ob klinische Studien echte Veränderungen erkennen können. Das Fehlen einer validierten, psychometrisch geprüften Symptomskala hat es lange erschwert, Studienarme zu vergleichen oder Daten standortübergreifend zusammenzuführen. Neue, gemeinsam mit Betroffenen entwickelte Instrumente wie die TIMES-Skala sowie methodische Rahmenwerke, die Chronobiologie und Hormonzyklen berücksichtigen, stellen substanzielle Infrastrukturfortschritte dar – auch wenn sie für sich genommen noch keine Therapieergebnisse liefern.
  state_of_evidence:
  - status: established
    label: Etabliert
    items:
    - 'ME/CFS erfüllt die klinischen Kriterien einer schweren, chronischen Multisystemerkrankung. PEM, nicht erholsamer Schlaf sowie kognitive oder autonome Symptome bilden den Kern aller wichtigen Falldefinitionen. Internationale medizinische Fachgesellschaften und klinische Konsensleitlinien (IDSA, ERJ) definieren infektionsassoziierte chronische Erkrankungen (IACCs), schreiben Pacing als Kernstrategie vor und stufen abgestufte Aktivierungstherapie (GET) als kontraindiziert ein. Die erheblichen sozioökonomischen Folgen – einschließlich extrem niedriger Erwerbsquoten und ausgeprägter Polypharmazie – sind auf nationaler Registerebene dokumentiert, und eine norwegische Registerstudie von 2026 berichtet fast dreimal so hohe direkte Gesundheitskosten mit hohem Krankenhausanteil. Klinische Symptomprofile bündeln sich über große Kohorten hinweg konsistent in statistisch abgrenzbaren biologischen Faktoren (Gehirn, Darm, Immunsystem, autonomes Nervensystem), während Übersichten zur Studienlandschaft uneinheitliche Endpunkte (insgesamt 397 in 105 biomedizinischen Studien) mit deutlichen Lücken bei PEM, Dysautonomie und Sicherheitsdaten belegen. Gastrointestinale Begleiterkrankungen sind quantitativ erhöht: Metaanalysen zeigen für das Reizdarmsyndrom (IBS) bei ME/CFS eine gepoolte Prävalenz von 37 % und ein siebenfach
      erhöhtes Chancenverhältnis (OR 7,20; 95-%-KI 2,77–18,76), wobei die Richtung des Zusammenhangs ungeklärt bleibt.'
  - status: plausible
    label: Plausibel, aber noch früh
    items:
    - Die Symptomschwere bei ME/CFS lässt sich in abgrenzbare Untergruppen mit hoher und niedriger Symptomlast einteilen, die mit infektiösen Auslösern zusammenhängen. Vergleichende Daten von 55 Teilnehmenden mit Post-Mononukleose-ME/CFS und 55 gematchten Personen mit Long COVID zeigen, dass die Symptomlast bei Long COVID zwischen operational definiertem moderatem und schwerem ME/CFS lag; dies spricht für phänotypische Überschneidungen, beweist aber weder identische Biologie noch eine gemeinsame Verlaufsbasis. Nationale US-Gesundheitsakten (>19 Millionen Patientinnen und Patienten) verknüpfen zudem das hypermobile Ehlers-Danlos-Syndrom (hEDS) mit fast dreifach erhöhten Chancen auf eine Long-COVID-Diagnose (OR 2,88), gebündelt bei Betroffenen mit POTS, MCAS und ME/CFS, ohne jedoch kausale Zusammenhänge für kriterienbasiertes ME/CFS zu belegen. Strukturgleichungsmodelle belegen geschlechts- und menopausespezifische latente Symptomstrukturen, wobei weibliche Sexualhormone Immunbeschwerden (grippeähnliche Symptome) dynamisch modulieren, nicht aber gastrointestinale Signalwege. Große epidemiologische Erhebungen zeigen, dass die CFS-Prävalenz bei Jugendlichen mit der Schulstufe und Einbußen der körperlichen Ausdauer korreliert, während partizipative Forschungsansätze (CureME, Deutsche Gesellschaft für ME/CFS) Biobanking und gemeinsames
      Studiendesign verbessern. Bei Kindern korreliert die Persistenz von Post-COVID-Symptomen mit der Schwere der Akutinfektion. Neuere Bevölkerungskohorten stützen zudem anhaltende Verläufe mit hoher Symptomlast, während gemeinsam mit Betroffenen entwickelte Instrumente (CNAME, PASS für PEM, SoMES, MEOSS) und ein internationaler Konsensrahmen vielversprechende Grundlagen für Bedarfserhebung, standardisierte Messung und sicherere Diagnostik bieten, die jedoch noch Peer-Review und externer Validierung bedürfen.
  - status: not_established
    label: Nicht belegt
    items:
    - Ein einzelner objektiver Biomarker oder Diagnosetest, der ME/CFS bevölkerungsübergreifend zuverlässig nachweist. Genomweit signifikante Genvarianten, die klinische Schweregrad-Untergruppen unterscheiden. Abrechnungscodes aus elektronischen Gesundheitsakten (EHR) als sensitive oder vollständige Kennzahlen für die Bevölkerungsprävalenz – aufgrund weitverbreiteter Untercodierung und verzögerter Diagnosestellung. Die neuen Konsens-Grenzwerte, das Symptom-Timing-Modell sowie die Preprint-Messskalen (PASS, SoMES, MEOSS) sind vorläufig und erfordern Peer-Review sowie eine prospektive externe Validierung gegenüber relevanten Krankheitskontrollen und in schwerbetroffenen Kohorten.
  - status: limitations
    label: Zentrale Einschränkungen
    items:
    - Länderübergreifende Netzwerkkohorten auf Basis von ICD-Abrechnungscodes in elektronischen Gesundheitsakten erfassen ME/CFS und Dysautonomien wegen Diagnoseverzögerungen und Codierungsstigma systematisch zu selten, und registerbasierte Kostenanalysen übersehen undiagnostizierte oder bettlägerige Betroffene ohne Klinikzugang. Gängige patientenberichtete Messinstrumente (PROMs) übersehen häufig Post-Exertional Malaise und kognitive Schwankungen und erzeugen dadurch Messfehler in klinischen Studien, während auch die Erfassung von Sicherheit und unerwünschten Ereignissen uneinheitlich bleibt. Viele große Kohorten- und psychometrische Analysen stützen sich auf selbstberichtete Online-Umfragen, was Selektionsverzerrungen mit sich bringt und objektive physiologische Messungen vermissen lässt. Ein wachsender Teil der Literatur zur postviralen Charakterisierung nutzt breite Post-COVID- (PASC-) oder Aktenkohorten ohne ME/CFS-Falldefinitionen oder standardisierte PEM-Erfassung; Prävalenzen, Komorbiditätsrisiken (wie hEDS-Long-COVID-Zusammenhänge), Symptomverteilungen und Schätzungen der sozioökonomischen Last aus solchen Kohorten lassen sich daher nicht direkt auf kriterienbasiertes ME/CFS übertragen. Die Operationalisierung von „schwerem“ ME/CFS in Universitätskohorten
      bildet hausgebundene oder bettlägerige Betroffene aus Versorgungskohorten nicht ab, und klinische Ähnlichkeiten nach unterschiedlichen Virusauslösern beweisen keine identischen zellulären Krankheitsmechanismen. Schwer und sehr schwer Betroffene bleiben selbst in Online-Erhebungen schwer erreichbar, und Konferenz- oder Preprint-Ergebnisse können sich nach vollständigem Peer-Review noch ändern. Mehrere neuere Einträge sind Positionspapiere, Förderanalysen, Ausschreibungen (wie die BMFTR-Pathomechanismus-Fördermaßnahme vom November 2026) oder Infrastrukturberichte, die Bedarf und geplante Kapazitäten dokumentieren, aber noch keine Patientenergebnisse liefern; zudem bilden umfragebasierte nationale Erhebungen (KCE) und klinikbasierte Register (MECFS-R) sehr schwer Betroffene und Bettlägerige zu wenig ab.
  open_questions: []
