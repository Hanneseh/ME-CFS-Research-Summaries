en:
  title: Exploratory shotgun metagenomic study links gut microbiome shifts to cognitive symptoms in post-infectious ME/CFS
  plain_summary: In a small NIH stool-sequencing study of 15 people with post-infectious ME/CFS and 17 healthy volunteers, patients had slightly lower microbial richness, different bacterial species, and microbiome links that were strongest for cognitive symptoms. Because the cohort is very small and measured at a single time point, it cannot prove that gut bacteria cause symptoms or justify microbiome-targeted treatments.
  detail: "In an exploratory cross-sectional study published in *Medicine in Microecology*, Vizioli, Barb, McCauley, Nath, and Walitt performed shotgun metagenomic sequencing on stool samples from 15 individuals with post-infectious ME/CFS (PI-ME/CFS) and 17 matched healthy volunteers from the NIH intramural cohort. Compared with controls, PI-ME/CFS participants showed modestly reduced microbial richness (Chao1 p = 0.049) alongside statistically significant differences in overall microbial community structure (PERMANOVA p = 0.015) and predicted functional gene profiles (PERMANOVA p = 0.029). Taxonomically, PI-ME/CFS samples were enriched in *Eggerthella lenta* and *Hungatella* species—along with genes related to macrolide resistance proteins, heme biosynthesis, and glycerolipid metabolism—while *Barnesiella intestinihominis*, *Holdemanella* species, and genes involved in host-interaction pathways were depleted. In stratified analyses across fatigue, sleep, physical, mental, and cognitive domains, microbiome–symptom associations were most prominent for cognitive function scores, displaying predominantly positive correlations within the PI-ME/CFS group (see [Neuroinflammation & Brain Changes](thread:neuroinflammation-brain-changes)). Using shotgun metagenomics rather than 16S rRNA sequencing gives sharper species- and gene-level resolution, but key caveats limit interpretation: the sample size is very small (n = 15 vs. 17), the cross-sectional design cannot separate cause from downstream effects of diet, medication, or reduced activity, and recruitment through an inpatient NIH protocol restricts generalizability to non-post-infectious ME/CFS and systematically underrepresents bedbound or very severe patients."
de:
  title: Explorative Shotgun-Metagenomik-Studie verknüpft Darmmikrobiom-Verschiebungen mit kognitiven Symptomen bei postinfektiösem ME/CFS
  plain_summary: In einer kleinen NIH-Stuhlsequenzierungsstudie mit 15 Menschen mit postinfektiösem ME/CFS und 17 gesunden Freiwilligen zeigten Betroffene eine etwas geringere Artenvielfalt, verschobene Bakterienprofile und Zusammenhänge, die vor allem bei kognitiven Symptomen hervortraten. Wegen der sehr kleinen Stichprobe und der einmaligen Messung beweist die Studie weder eine ursächliche Rolle der Darmbakterien noch eine Wirksamkeit mikrobiombezogener Therapien.
  detail: "In einer explorativen Querschnittsstudie in *Medicine in Microecology* führten Vizioli, Barb, McCauley, Nath und Walitt eine Shotgun-Metagenomik-Sequenzierung von Stuhlproben bei 15 Personen mit postinfektiösem ME/CFS (PI-ME/CFS) und 17 gematchten gesunden Freiwilligen aus der intramuralen NIH-Kohorte durch. Im Vergleich zu den Kontrollen zeigten PI-ME/CFS-Teilnehmende eine leicht verringerte mikrobielle Artenzahl (Chao1 p = 0,049) sowie signifikante Unterschiede in der gesamten Gemeinschaftsstruktur (PERMANOVA p = 0,015) und den funktionellen Genprofilen (PERMANOVA p = 0,029). Taxonomisch waren bei PI-ME/CFS insbesondere *Eggerthella lenta* und *Hungatella*-Arten angereichert – zusammen mit Genen für Makrolid-Resistenzproteine, Häm-Biosynthese und Glycerolipid-Stoffwechsel –, während *Barnesiella intestinihominis*, *Holdemanella*-Arten sowie Gene für Wirt-Interaktions-Signalwege vermindert waren. In stratifizierten Korrelationsanalysen über Fatigue, Schlaf, körperliche, psychische und kognitive Bereiche hinweg fielen die Zusammenhänge zwischen Mikrobiom und Symptomen am deutlichsten bei kognitiven Scores aus, mit überwiegend positiven Korrelationen in der PI-ME/CFS-Gruppe (siehe [Neuroinflammation & Gehirnveränderungen](thread:neuroinflammation-brain-changes)). Zwar bietet die Shotgun-Metagenomik gegenüber 16S-rRNA-Analysen eine höhere Auflösung auf Arten- und Genebene, doch schränken wesentliche Limitationen die Aussagekraft ein: Die Kohorte ist sehr klein (n = 15 vs. 17), das Querschnittsdesign trennt Ursache nicht von Folgen durch Ernährung, Medikamente oder geringe Aktivität, und die Rekrutierung über ein stationäres NIH-Protokoll begrenzt die Übertragbarkeit auf nicht-postinfektiöses ME/CFS sowie auf bettlägerige und sehr schwer Erkrankte."
