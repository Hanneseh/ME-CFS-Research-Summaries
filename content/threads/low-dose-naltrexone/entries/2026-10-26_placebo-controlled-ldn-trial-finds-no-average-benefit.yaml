en:
  title: Placebo-controlled LDN trial finds no average benefit for post-COVID fatigue
  plain_summary: A double-blind placebo-controlled preprint trial of 160 adults with post-COVID fatigue found that 16 weeks of LDN (up to 4.5 mg/day) gave no average advantage over placebo on fatigue, pain, daily steps, or quality of life. While this tempers earlier uncontrolled claims, it is not yet peer-reviewed and does not settle whether LDN helps in classic ME/CFS or severe disease.
  detail: A double-blind randomized medRxiv preprint tested low-dose naltrexone, titrated from 1 to 4.5 mg/day for 16 weeks, in 160 adults with post-COVID fatigue syndrome (81 LDN, 79 placebo). It found no between-group benefit on fatigue, pain, overall symptom score, daily steps or quality of life, tempering earlier uncontrolled reports. Grade 3 or higher adverse events occurred in five LDN participants and three placebo participants; these small numbers do not establish a difference in risk. The largely decentralized design reduced travel, but severe or bedbound participation was not reported and PEM was not a dedicated safety outcome. This is an unreviewed result in post-COVID illness with ME/CFS-type symptoms, rather than a trial establishing efficacy or inefficacy in classic ME/CFS. An exploratory sex interaction does not establish a responder subgroup.
de:
  title: Placebokontrollierte LDN-Studie findet im Durchschnitt keinen Nutzen bei Post-COVID-Fatigue
  plain_summary: Eine doppelt verblindete, placebokontrollierte Preprint-Studie mit 160 Erwachsenen mit Post-COVID-Fatigue fand nach 16 Wochen LDN (bis 4,5 mg/Tag) im Durchschnitt keinen Vorteil gegenüber Placebo bei Fatigue, Schmerzen, Schrittzahl oder Lebensqualität. Das dämpft frühere unkontrollierte Berichte, ist aber noch nicht begutachtet und klärt nicht abschließend die Wirkung bei klassischem ME/CFS oder schweren Verläufen.
  detail: Eine doppelt verblindete, randomisierte medRxiv-Preprint-Studie testete niedrigdosiertes Naltrexon, auftitriert von 1 auf 4,5 mg/Tag über 16 Wochen, bei 160 Erwachsenen mit Post-COVID-Fatigue-Syndrom (81 LDN, 79 Placebo). Zwischen den Gruppen fand sich kein Vorteil bei Fatigue, Schmerzen, Gesamtsymptomscore, täglichen Schritten oder Lebensqualität, was frühere unkontrollierte Berichte relativiert. Unerwünschte Ereignisse ab Grad 3 traten bei fünf Teilnehmenden unter LDN und drei unter Placebo auf; diese kleinen Zahlen belegen keinen Risikounterschied. Das überwiegend dezentrale Design verringerte Anfahrten, doch eine Beteiligung schwer Betroffener oder Bettlägeriger wurde nicht berichtet, und PEM war kein eigener Sicherheitsendpunkt. Es handelt sich um ein noch nicht begutachtetes Ergebnis bei Post-COVID-Erkrankung mit ME/CFS-ähnlichen Symptomen, nicht um eine Studie, die Wirksamkeit oder Unwirksamkeit bei klassischem ME/CFS belegt; eine explorative Geschlechter-Interaktion begründet
    ebenfalls keine Ansprech-Untergruppe.
