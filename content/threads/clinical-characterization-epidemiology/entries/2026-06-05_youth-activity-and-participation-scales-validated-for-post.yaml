en:
  title: Youth activity and participation scales validated for post-acute infection, vaccination syndromes, and ME/CFS
  plain_summary: Researchers in Munich validated two brief questionnaires tracking school, daily activities, and social participation in 91 young people aged 10–25 with ME/CFS or post-viral syndromes. Larger multi-center checks are still needed, but the tools help measure what matters in youth care.
  detail: Researchers at the Munich Chronic Fatigue Center validated brief activity and participation questionnaires for children, adolescents, and young adults with post-acute infection or vaccination syndromes and/or ME/CFS. In 91 patients aged 10-25 years, the MCFC Activity Scale and Participation Scale correlated with the Bell Score, fatigue, PEM, and physical quality-of-life measures, and showed moderate ability to discriminate ME/CFS from related post-acute syndromes. The practical value is that pediatric and young-adult cohorts need instruments that capture school, independence, social participation, and PEM risk, not just adult work capacity. The single tertiary-center sample and modest cohort size mean the tools need broader validation. Still, they help translate clinical severity into domains families and clinicians can act on.
de:
  title: Aktivitäts- und Teilhabeskalen für junge Menschen mit postakuten Infektions-, Impf-Syndromen und ME/CFS validiert
  plain_summary: Forschende in München haben zwei kurze Fragebögen zu Schule, Alltagsaktivität und sozialer Teilhabe bei 91 jungen Menschen zwischen 10 und 25 Jahren mit ME/CFS oder postviralen Syndromen validiert. Eine breitere Prüfung an weiteren Zentren steht noch aus, die Instrumente erfassen aber lebensnahe Bereiche junger Betroffener.
  detail: Forschende am Chronischen Fatigue Centrum für junge Menschen in München validierten kurze Aktivitäts- und Teilhabefragebögen für Kinder, Jugendliche und junge Erwachsene mit postakuten Infektions- oder Impfsyndromen und/oder ME/CFS. Bei 91 Patientinnen und Patienten im Alter von 10–25 Jahren korrelierten die MCFC Activity Scale und Participation Scale mit dem Bell-Score, Fatigue, PEM und der körperlichen Lebensqualität und zeigten eine moderate Trennschärfe zwischen ME/CFS und verwandten postakuten Syndromen. Praktisch ist das wertvoll, weil pädiatrische und jungerwachsene Kohorten Instrumente benötigen, die Schulbesuch, Selbstständigkeit, soziale Teilhabe und PEM-Risiko abbilden statt nur Erwerbsfähigkeit im Erwachsenenalter. Die Stichprobe eines einzelnen Tertiärzentrums und die überschaubare Fallzahl erfordern weitere Validierung; dennoch helfen die Skalen, den klinischen Schweregrad in alltagsrelevante Bereiche zu übersetzen.
