en:
  title: German patient survey links medical invalidation to structural care barriers
  plain_summary: A German survey of 577 adults with ME/CFS, Long COVID, or post-vaccination symptoms found 87% struggled to get needed care, citing lack of treatments and disbelief—especially from welfare offices and employers. Because it was an online survey, it maps reported hurdles rather than testing care interventions.
  detail: Saad and colleagues surveyed 577 adults with ME/CFS, Long COVID, or post-vaccination syndrome in Germany. Eighty-seven percent reported difficulty accessing necessary care, with absent therapies and symptoms being dismissed among the leading barriers; ME/CFS respondents more often reported physician knowledge gaps and travel/accessibility barriers, while welfare authorities and workplaces were rated more invalidating than medical staff. The remote survey imposed no physical exertion, but screen and cognitive burden remained possible and severe or bedbound inclusion was not reported. Cross-sectional self-report and digital recruitment limit causal inference, and the PAIMS umbrella is a study framework rather than an established diagnostic category; no treatment was tested.
de:
  title: Deutsche Patientenbefragung verknüpft medizinische Entwertung mit strukturellen Versorgungshürden
  plain_summary: Eine deutsche Befragung von 577 Erwachsenen mit ME/CFS, Long COVID oder Post-Vakzin-Syndrom ergab, dass 87 % Schwierigkeiten beim Zugang zu nötiger Versorgung hatten – vor allem wegen fehlender Therapien und mangelnder Anerkennung durch Ärzte, Behörden und Arbeitgeber. Als Online-Querschnittsbefragung beschreibt sie Hürden, ohne Maßnahmen zu testen.
  detail: Saad und Kolleginnen und Kollegen befragten 577 Erwachsene mit ME/CFS, Long COVID oder Post-Vakzin-Syndrom in Deutschland. Siebenundachtzig Prozent berichteten über Schwierigkeiten beim Zugang zur erforderlichen Versorgung, wobei fehlende Therapien und das Nicht-Ernstnehmen von Symptomen zu den Hauptbarrieren zählten; ME/CFS-Betroffene nannten häufiger Wissenslücken bei Ärztinnen und Ärzten sowie Reise- und Zugangsbarrieren, während Sozialbehörden und Arbeitsplätze als noch entwertender bewertet wurden als medizinisches Personal. Die Online-Erhebung vermied körperliche Anreisebelastung, konnte jedoch Bildschirm- und kognitive Ermüdung auslösen, und der Anteil schwer Betroffener oder Bettlägeriger wurde nicht berichtet. Querschnitts-Selbstberichte und digitale Rekrutierung begrenzen kausale Schlüsse, und der Oberbegriff PAIMS ist ein Studienrahmen statt einer etablierten Diagnosekategorie; eine Therapie wurde nicht geprüft.
