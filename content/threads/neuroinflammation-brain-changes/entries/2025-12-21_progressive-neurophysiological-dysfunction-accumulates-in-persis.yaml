en:
  title: Progressive neurophysiological dysfunction accumulates in persistent post-COVID fatigue
  plain_summary: In a non-peer-reviewed preprint studying 145 people at different stages after COVID-19, those ill for over 200 days showed slower reaction times and worse muscle and brain excitability metrics. Because each person was tested only once, it cannot prove individual decline over time.
  detail: A cross-sectional study of 145 patients evaluated between 12 weeks and 45 months post-infection demonstrated that physiological abnormalities in the brain and muscles accumulate over time in patients who do not recover. Using transcranial magnetic stimulation (TMS) and reaction time tests, the researchers found that patients with fatigue persisting longer than 200 days exhibited significantly higher fatigue scores, increased cortical excitability, slower reaction times, and worse muscle fatigue than those with shorter durations. This suggests that post-viral fatigue involves a progressive decline in central and peripheral neurophysiological function rather than a static injury. However, the cross-sectional design limits the ability to establish individual trajectories, and longitudinal confirmation of this progressive decline is required.
de:
  title: Fortschreitende neurophysiologische Dysfunktion häuft sich bei anhaltender Post-COVID-Fatigue
  plain_summary: In einem noch nicht begutachteten Preprint an 145 Personen zeigten Betroffene mit über 200 Tagen Krankheitsdauer langsamere Reaktionszeiten und stärkere Auffälligkeiten bei Muskel- und Hirnerregbarkeit. Da jede Person nur einmal untersucht wurde, beweist dies noch keine fortschreitende Verschlechterung beim Einzelnen.
  detail: Eine Querschnittsstudie an 145 Patientinnen und Patienten, die zwischen 12 Wochen und 45 Monaten nach der Infektion untersucht wurden, zeigte, dass sich physiologische Auffälligkeiten in Gehirn und Muskulatur bei Personen ohne Genesung über die Zeit anhäufen. Mithilfe transkranieller Magnetstimulation (TMS) und Reaktionszeittests stellten die Forschenden fest, dass Betroffene mit einer Fatigue-Dauer von über 200 Tagen signifikant höhere Fatigue-Werte, eine erhöhte kortikale Erregbarkeit, langsamere Reaktionszeiten und stärkere Muskelermüdung aufwiesen als Personen mit kürzerer Krankheitsdauer. Dies legt nahe, dass postvirale Fatigue eher einen fortschreitenden Rückgang zentraler und peripherer neurophysiologischer Funktionen umfasst als eine statische Schädigung. Das Querschnittsdesign schränkt jedoch die Aussagekraft über individuelle Verläufe ein, und eine Bestätigung im Längsschnitt ist erforderlich.
