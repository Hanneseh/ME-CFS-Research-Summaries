en:
  title: IFATICO RCT does not establish superiority of VR exergaming for post-COVID fatigue
  plain_summary: In a German trial of 100 post-COVID fatigue patients, 6 weeks of supervised virtual-reality exercise did not beat standard activation exercise on fatigue scores, and PEM worsening occurred in both groups. Because there was no rest/pacing control arm and PEM was not required for entry, this does not show exercise is safe or effective for ME/CFS.
  detail: In the single-centre double-blind IFATICO trial in Heidelberg (DRKS00032059), 100 adults meeting WHO post-COVID criteria with fatigue severity scale (FSS) scores $\ge$36 were randomized to 12 supervised 45-minute sessions over 6 weeks of either immersive virtual reality neuromuscular exergaming (n=48) or conventional activation exercise (n=52). Exercise intensity in both arms was guided by Borg ratings of perceived exertion adjusted to prevent post-exertional malaise (PEM), and while fatigue improved in both groups, the primary endpoint showed no statistically significant difference between arms (between-group difference 3.03 points; 95% CI −1.02 to 7.06; p=0.15). Responder rates were comparable (37% vs 32%), and while dropouts (3 vs 12) and overall symptom worsening (4/46 vs 11/50; p=0.07, not significant) were numerically lower in the VR arm, worsening episodes of PEM occurred in both groups (3 in VR vs 1 in conventional) without serious adverse events. The trial lacked a rest
    or pacing control group, the conventional exercise arm exceeded its intended exertion ceiling, and exploratory secondary outcomes were uncorrected for multiplicity. Because PEM was not an inclusion criterion and in-person attendance effectively excluded severe or bedbound individuals, these findings cannot be generalized to PEM-defined ME/CFS and do not establish exercise safety or efficacy for ME/CFS (see [Post-Exertional Malaise & Exercise Physiology](thread:pem-exercise-physiology)).
de:
  title: IFATICO-RCT belegt keine Überlegenheit von VR-Exergaming bei Post-COVID-Fatigue
  plain_summary: In einer deutschen Studie mit 100 Personen mit Post-COVID-Fatigue übertraf ein 6-wöchiges betreutes Virtual-Reality-Training ein herkömmliches Aktivierungstraining bei den Fatigue-Werten nicht, und PEM-Verschlechterungen traten in beiden Gruppen auf. Da keine Ruhe- oder Pacing-Kontrollgruppe einbezogen war und PEM kein Einschlusskriterium darstellte, belegt die Studie weder Sicherheit noch Wirksamkeit von Training bei ME/CFS.
  detail: In der monozentrischen, doppelt verblindeten IFATICO-Studie in Heidelberg (DRKS00032059) wurden 100 Erwachsene nach WHO-Post-COVID-Kriterien mit Fatigue-Severity-Scale-(FSS)-Werten ≥36 über 6 Wochen auf 12 betreute 45-Minuten-Sitzungen entweder mit immersivem Virtual-Reality-neuromuskulärem Exergaming (n=48) oder konventionellem Aktivierungstraining (n=52) randomisiert. Die Belastungsintensität wurde in beiden Armen anhand der Borg-Skala gesteuert, um Post-Exertional Malaise (PEM) zu vermeiden; zwar nahm Fatigue in beiden Gruppen ab, doch zeigte der primäre Endpunkt keinen statistisch signifikanten Unterschied zwischen den Armen (Zwischengruppen-Differenz 3,03 Punkte; 95-%-KI −1,02 bis 7,06; p=0,15). Die Ansprechraten waren vergleichbar (37 % vs. 32 %), und obwohl Abbrüche (3 vs. 12) und allgemeine Symptomverschlechterungen (4/46 vs. 11/50; p=0,07, nicht signifikant) im VR-Arm numerisch niedriger lagen, traten PEM-Verschlechterungen in beiden Gruppen auf (3 unter VR vs. 1 unter
    konventionell), ohne schwere unerwünschte Ereignisse. Der Studie fehlte eine Ruhe- oder Pacing-Kontrollgruppe, der konventionelle Arm überschritt die geplante Belastungsobergrenze, und explorative sekundäre Endpunkte wurden nicht für multiples Testen korrigiert. Da PEM kein Einschlusskriterium war und Präsenztermine schwer Betroffene oder Bettlägerige faktisch ausschlossen, lassen sich diese Befunde nicht auf PEM-definiertes ME/CFS übertragen und belegen weder Sicherheit noch Wirksamkeit von Training bei ME/CFS (siehe [Post-Exertional Malaise & Belastungsphysiologie](thread:pem-exercise-physiology)).
