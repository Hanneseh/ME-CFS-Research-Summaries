en:
  title: Clinical update proposes vestibular disequilibrium alongside small heart syndrome as drivers of orthostatic intolerance
  plain_summary: A clinical update highlights smaller heart chambers, blunted fluid-retention hormones, and balance-system instability as potential causes of upright intolerance in ME/CFS. These ideas rely on single-clinic records and narrative review, and mentioned drugs like desmopressin carry serious safety risks.
  detail: A clinical review and mechanistic update synthesized cardiovascular, neurohumoral, and vestibular contributors to orthostatic intolerance in ME/CFS cohorts. The author reviewed echocardiographic and radiographic evidence for "small heart syndrome" (cardiothoracic ratio ≤42% and reduced left ventricular dimension), showing that diminished stroke volume contributes to upright low-output circulatory states and cerebral hypoperfusion. The paper highlighted paradoxical downregulation of the renin-angiotensin-aldosterone and antidiuretic hormone (ADH/vasopressin) systems despite hypovolemia, pointing to neurohumoral uncoupling in blood volume regulation. Furthermore, the synthesis proposed central vestibular disequilibrium as an overlooked non-cardiovascular driver of orthostatic disability, noting that in 160 ME/CFS patients, 45% displayed static or kinetic balance instability and 10-minute active standing test failure occurred exclusively in those with disequilibrium. However, the
    evidence rests primarily on narrative literature synthesis and retrospective single-clinic observational data without randomized control arms, and active standing tests exclude severely affected, bedbound patients. Mentioned therapeutic approaches like desmopressin and repetitive transcranial magnetic stimulation (rTMS) remain preliminary and investigational; desmopressin in particular carries a serious risk of severe hyponatremia and must not be used without strict baseline sodium monitoring and clinical oversight.
de:
  title: Klinisches Update schlägt vestibuläre Gleichgewichtsstörung neben Small-Heart-Syndrom als Treiber orthostatischer Intoleranz vor
  plain_summary: Ein klinisches Update rückt kleinere Herzkammern, gedämpfte Volumenhormone und zentrale Gleichgewichtsstörungen als mögliche Ursachen von Kreislaufproblemen bei ME/CFS in den Blick. Die Daten beruhen vorwiegend auf Einzelklinik-Beobachtungen, und genannte Wirkstoffe wie Desmopressin bergen ernste Risiken.
  detail: 'Eine klinische Übersichtsarbeit und mechanistische Aktualisierung fasste kardiovaskuläre, neurohumorale und vestibuläre Faktoren orthostatischer Intoleranz bei ME/CFS zusammen. Der Autor wertete Echokardiographie- und Röntgendaten zum „Small-Heart-Syndrom“ (Herz-Thorax-Quotient ≤42 % und verkleinerter linker Ventrikel) aus, wonach ein geringeres Schlagvolumen zu Niedrigfluss-Zuständen im Stehen und Hirnminderdurchblutung beiträgt. Zudem hob die Arbeit eine paradoxe Herunterregulierung des Renin-Angiotensin-Aldosteron-Systems und des antidiuretischen Hormons (ADH/Vasopressin) trotz Volumenmangel hervor, was auf eine neurohumorale Entkopplung hinweist. Darüber hinaus schlug die Synthese eine zentrale vestibuläre Gleichgewichtsstörung als übersehenen nicht-kardiovaskulären Faktor vor: Unter 160 ME/CFS-Betroffenen zeigten 45 % statische oder kinetische Gleichgewichtsinstabilität, und Abbrüche im 10-Minuten-Stehtest traten ausschließlich bei Personen mit Gleichgewichtsstörung auf.
    Die Evidenz stützt sich jedoch überwiegend auf narrative Literatursynthese und retrospektive Einzelklinikdaten ohne randomisierte Kontrollarme, während aktive Stehtests schwer betroffene, bettlägerige Betroffene ausschließen. Erwähnte Ansätze wie Desmopressin und rTMS bleiben experimentell; insbesondere Desmopressin birgt das ernste Risiko schwerer Hyponatriämie und darf keinesfalls ohne strenge Natriumkontrolle eingesetzt werden.'
