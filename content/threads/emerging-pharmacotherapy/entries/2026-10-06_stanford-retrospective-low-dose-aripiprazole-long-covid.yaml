en:
  title: Stanford retrospective cohort reports functional score improvement but no significant symptom reductions with low-dose aripiprazole in Long COVID
  plain_summary: In a retrospective clinic review of 50 Long COVID patients taking low-dose aripiprazole, average daily functioning scores improved, but fatigue, brain fog, and post-exertional malaise did not improve significantly. Because there was no control group and over half of patients also took low-dose naltrexone at the same time, the study cannot prove that the drug works.
  detail: |-
    Researchers at the Stanford Long COVID Clinic reviewed electronic health records of 76 adults prescribed titrated oral low-dose aripiprazole (LDA, 0.1–2.0 mg/day; median final dose 1 mg; mean duration 204.4 days) between May 2021 and September 2023, analyzing outcomes in 50 patients with complete baseline and follow-up surveys (median age 46.5 years, 62% female, median symptom duration 566.5 days; pre-COVID ME/CFS was explicitly excluded). Mean Functional Status Scale (FSS) scores improved from 3.78 to 3.28 (p=0.001), and the number of incapacitated, bedridden patients (Level V) fell from 8 (16%) to 3 (6%). However, none of the seven tracked core symptoms—including fatigue (p=0.153), brain fog (p=0.283), or post-exertional malaise (p=0.341)—nor total symptom count (p=0.282) or the unvalidated 7-symptom composite score (p=0.121; 27 improved, 22 worsened, 1 unchanged) showed statistically significant improvement in the 50-patient cohort, although a 33-patient subgroup with complete longitudinal assessments showed lower symptom count (p=0.011) and FSS (p=0.013). Across all 76 exposed patients, 12 (15.8%) reported side effects with no severe adverse events documented, while weight gain (1–42 lb) was recorded in 25 patients and weight loss (1–71 lb) in 18. Major limitations include the uncontrolled retrospective design, exclusion of 26 prescribed patients with missing surveys, variable follow-up intervals (31–1,025 days), unverified adherence, and substantial co-medication confounding—43 of 50 patients also received [low-dose naltrexone](thread:low-dose-naltrexone), with 28 taking both drugs simultaneously. Although the cohort included severely affected bedbound Long COVID patients, these observational data cannot establish efficacy or safety in Long COVID or ME/CFS without a randomized placebo-controlled trial.
de:
  title: Retrospektive Stanford-Kohorte berichtet besseren Funktionsscore, aber keine signifikanten Symptomrückgänge unter niedrigdosiertem Aripiprazol bei Long COVID
  plain_summary: In einer rückblickenden Klinikauswertung von 50 Long-COVID-Patientinnen und -Patienten unter niedrigdosiertem Aripiprazol verbesserte sich zwar der durchschnittliche Funktionsscore im Alltag, aber Fatigue, Brain Fog und Post-Exertional Malaise nahmen nicht signifikant ab. Da eine Kontrollgruppe fehlte und mehr als die Hälfte gleichzeitig niedrigdosiertes Naltrexon einnahm, beweist die Studie keine Wirksamkeit.
  detail: |-
    Forschende der Stanford Long COVID Clinic werteten elektronische Krankenakten von 76 Erwachsenen aus, denen zwischen Mai 2021 und September 2023 titriertes orales niedrigdosiertes Aripiprazol (LDA, 0,1–2,0 mg/Tag; mediane Enddosis 1 mg; mittlere Einnahmedauer 204,4 Tage) verordnet wurde; 50 Personen mit vollständigen Ausgangs- und Verlaufsfragebögen gingen in die Wirksamkeitsanalyse ein (medianes Alter 46,5 Jahre, 62 % weiblich, mediane Krankheitsdauer 566,5 Tage; eine ME/CFS-Diagnose vor SARS-CoV-2 war ausdrücklich ausgeschlossen). Der mittlere Wert auf der Functional Status Scale (FSS) verbesserte sich von 3,78 auf 3,28 (p=0,001), und die Zahl der bettlägerigen Betroffenen auf Stufe V sank von 8 (16 %) auf 3 (6 %). Keines der sieben erfassten Kernsymptome – darunter Fatigue (p=0,153), Brain Fog (p=0,283) und Post-Exertional Malaise (p=0,341) – sowie weder die Gesamtzahl der Symptome (p=0,282) noch der nicht validierte 7-Symptome-Summenscore (p=0,121; 27 verbessert, 22 verschlechtert, 1 unverändert) erreichten jedoch in der 50-Personen-Kohorte statistische Signifikanz; lediglich in einer 33-köpfigen Untergruppe mit vollständigen Längsschnittdaten nahmen Symptomzahl (p=0,011) und FSS (p=0,013) ab. In der gesamten Sicherheitskohorte (n=76) meldeten 12 Personen (15,8 %) Nebenwirkungen ohne schwere unerwünschte Ereignisse, während bei 25 Personen eine Gewichtszunahme (1–42 Pfund) und bei 18 eine Gewichtsabnahme (1–71 Pfund) dokumentiert wurde. Wesentliche Grenzen sind das unkontrollierte retrospektive Design, der Ausschluss von 26 Verordneten wegen fehlender Fragebögen, stark schwankende Nachbeobachtungszeiten (31–1.025 Tage), ungeprüfte Therapietreue sowie erhebliche Begleitmedikation: 43 von 50 Personen erhielten ebenfalls [niedrigdosiertes Naltrexon](thread:low-dose-naltrexone), davon 28 gleichzeitig mit LDA. Obwohl die Kohorte auch schwer betroffene, bettlägerige Long-COVID-Patientinnen und -Patienten einschloss, können diese Beobachtungsdaten ohne randomisierte placebokontrollierte Studie weder Wirksamkeit noch Sicherheit bei Long COVID oder ME/CFS belegen.
