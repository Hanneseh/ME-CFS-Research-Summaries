en:
  title: Conference presentation reports Phase 1/2 results for low-dose rapamycin
  plain_summary: In a 2026 conference talk, researchers reported that about one-third of ME/CFS patients completing early open-label studies on low-dose rapamycin felt better and showed improved cellular energy reserve. These findings have not yet passed peer review and come from uncontrolled studies, so a placebo-controlled trial is still needed.
  detail: |-
    At the Internationale ME/CFS-Konferenz 2026, Dr. Gunnar Gottschalk presented preliminary findings from Phase 1 and Phase 2 clinical studies investigating low-dose rapamycin (sirolimus) in ME/CFS. The studies targeted a patient subgroup exhibiting mTOR pathway dysregulation and impaired cellular autophagy. Results indicated that approximately one-third of participants who completed the studies demonstrated a clinical response, with self-reported improvements in fatigue, physical capability, and cognitive function. This clinical response correlated with an increase in cellular oxidative reserve capacity. While the low-dose regimen (about one-third of the standard transplant dose) appeared generally safe and well tolerated, these findings remain preliminary and have only been presented in a conference format with full peer-reviewed publications pending. A randomized, placebo-controlled trial is planned and will be required to confirm these efficacy signals and rule out placebo effects.

    Gottschalk 2026 presentation video (Conference presentation video; Speaker: Dr. Gunnar Gottschalk; full presentation video)
de:
  title: Konferenzvortrag berichtet Phase-1/2-Ergebnisse für niedrigdosiertes Rapamycin
  plain_summary: In einem Konferenzvortrag 2026 berichteten Forschende, dass etwa ein Drittel der ME/CFS-Betroffenen, die frühe offene Studien zu niedrigdosiertem Rapamycin abschlossen, Besserungen und eine höhere zelluläre Energiereserve zeigten. Die Befunde sind noch nicht begutachtet und stammen aus unkontrollierten Studien, sodass eine placebokontrollierte Prüfung weiter nötig bleibt.
  detail: |-
    Auf der Internationalen ME/CFS-Konferenz 2026 präsentierte Dr. Gunnar Gottschalk vorläufige Ergebnisse aus klinischen Phase-1- und Phase-2-Studien zu niedrigdosiertem Rapamycin (Sirolimus) bei ME/CFS. Die Studien richteten sich an eine Untergruppe von Patientinnen und Patienten mit mTOR-Signalweg-Fehlregulation und gestörter zellulärer Autophagie. Den Ergebnissen zufolge zeigte etwa ein Drittel der Teilnehmenden, welche die Studien abschlossen, ein klinisches Ansprechen mit selbstberichteten Verbesserungen bei Fatigue, körperlicher Leistungsfähigkeit und kognitiver Funktion. Dieses Ansprechen korrelierte mit einer Zunahme der zellulären oxidativen Reservekapazität. Während das niedrigdosierte Schema (etwa ein Drittel der üblichen Transplantationsdosis) insgesamt sicher und gut verträglich erschien, sind diese Ergebnisse vorläufig, wurden bislang nur auf einer Konferenz vorgestellt und warten auf eine begutachtete Vollpublikation. Eine randomisierte, placebokontrollierte Studie ist geplant und nötig, um diese Signale zu bestätigen und Placeboeffekte auszuschließen.

    Gottschalk 2026 Präsentationsvideo (Konferenzvortrag; Referent: Dr. Gunnar Gottschalk; vollständiges Vortragsvideo)
