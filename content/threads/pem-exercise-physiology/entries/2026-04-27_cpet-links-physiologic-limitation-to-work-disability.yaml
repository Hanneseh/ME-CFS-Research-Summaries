en:
  title: CPET links physiologic limitation to work disability
  plain_summary: A study showed that abnormal exercise-test results in severely affected post-COVID and ME/CFS patients lined up closely with inability to work. While useful for documenting functional loss in severe cases, the results do not tell how milder patients perform.
  detail: This study showed that CPET abnormalities in severe post-COVID and ME/CFS cohorts correlate with occupational disability. The practical change is that objective exercise testing can quantify functional loss in a way that matches real-world work capacity. That makes CPET useful for disability assessment and clinical documentation. The cohort is already enriched for severe cases, so the findings do not define how milder or less selected patients will perform.
de:
  title: CPET verknüpft physiologische Leistungseinschränkung mit Arbeitsunfähigkeit
  plain_summary: Eine Studie zeigte, dass auffällige Ergebnisse im Belastungstest bei schwer betroffenen Post-COVID- und ME/CFS-Patientinnen und -Patienten eng mit beruflicher Erwerbsunfähigkeit zusammenhingen. Das hilft bei der objektiven Dokumentation von Funktionseinbußen, spiegelt durch die Auswahl schwerer Fälle aber nicht automatisch leichtere Verläufe wider.
  detail: Diese Studie zeigte, dass CPET-Auffälligkeiten in Kohorten mit schwerem Post-COVID und ME/CFS mit beruflicher Erwerbsminderung korrelieren. Der praktische Nutzen liegt darin, dass objektive Belastungstests funktionelle Einbußen in einer Weise quantifizieren können, die der tatsächlichen Arbeitsfähigkeit entspricht. Das macht den CPET für sozialmedizinische Begutachtungen und klinische Dokumentation hilfreich. Da die Kohorte bereits stark auf schwere Fälle ausgerichtet war, lassen sich die Befunde nicht ohne Weiteres auf mildere oder weniger stark selektierte Patientengruppen übertragen.
