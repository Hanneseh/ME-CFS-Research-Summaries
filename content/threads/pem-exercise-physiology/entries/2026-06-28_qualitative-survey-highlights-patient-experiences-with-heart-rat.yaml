en:
  title: Qualitative survey highlights patient experiences with heart rate monitor pacing
  plain_summary: In a survey of 488 people with ME/CFS and 27 interviews, most found heart-rate monitors helpful for spotting hidden overexertion and avoiding crashes, though erratic autonomic heart-rate spikes and guesswork around personal limits made setup tricky. Self-reported feedback shows its practical value for pacing while underscoring the need for clearer clinical guidance.
  detail: An international survey of 488 individuals with ME/CFS, accompanied by semi-structured interviews with 27 participants, investigated the experiences, benefits, and challenges of using a heart rate monitor (HRM) for activity pacing. A strong majority of participants reported that HRM pacing provided valuable real-time biofeedback, helping them recognize when they were approaching their anaerobic threshold and helping to interrupt the push-crash cycle. However, users highlighted significant challenges, including the difficulty of establishing accurate heart rate thresholds without clinical testing, device discomfort, and erratic heart rate fluctuations caused by dehydration or autonomic dysfunction. While the study demonstrates that HRM pacing is a highly valued self-management strategy, its findings are based on self-reported data subject to selection bias, and clinical guidance is needed to prevent patients from setting inappropriate activity limits.
de:
  title: Qualitative Umfrage beleuchtet Patientenerfahrungen mit Herzfrequenz-Pacing
  plain_summary: In einer Befragung von 488 ME/CFS-Betroffenen und 27 Interviews empfanden die meisten Pulsmesser als hilfreich, um Überlastungen frühzeitig zu bremsen – auch wenn schwankende POTS-Pulse und unklare Zielwerte den Einstieg erschwerten. Die Selbstberichte zeigen den praktischen Nutzen für das Pacing und den Bedarf an besserer fachlicher Anleitung.
  detail: Eine internationale Befragung von 488 Menschen mit ME/CFS, ergänzt durch 27 halbstrukturierte Interviews, untersuchte Erfahrungen, Nutzen und Hürden beim Einsatz von Herzfrequenzmonitoren (HRM) für das Aktivitäts-Pacing. Eine große Mehrheit berichtete, dass HRM-Pacing wertvolles Echtzeit-Biofeedback lieferte, um das Annähern an die anaerobe Schwelle zu erkennen und den Kreislauf aus Überlastung und Einbruch zu unterbrechen. Gleichzeitig nannten Nutzende erhebliche Probleme, darunter die Schwierigkeit, ohne klinische Tests verlässliche Pulsschwellen festzulegen, Tragekomfort-Einbußen sowie sprunghafte Herzfrequenzschwankungen durch Dehydratation oder autonome Dysfunktion. Obwohl die Studie auf Selbstauskünften mit Selektionsbias beruht, belegt sie die hohe praktische Wertschätzung von HRM-Pacing und den Bedarf an klinischer Begleitung bei der Festlegung individueller Grenzen.
