en:
  title: Neuroinflammation & Brain Changes
  subtitle: A living thread on brain imaging, neurovascular coupling, microglial activation, and neuroendocrine alterations in ME/CFS and Long COVID.
  evidence_label: early clinical and mechanistic validation
  plain_summary: Specialized brain scans and fluid studies increasingly show subtle physical differences in people with ME/CFS and Long COVID, including altered blood flow, energy bottlenecks under mental or visual load, and signs of overactive brain immune cells. These findings help confirm that cognitive exhaustion and sensory overload have real biological roots rather than being purely psychological. Still, these changes vary widely across individuals, rely mostly on small research scans, and have not yet led to a routine diagnostic test or proven brain-targeted treatment.
  takeaway: |-
    Central nervous system alterations, impaired neurovascular coupling, and chronic neuroimmune activation represent a key pathological axis in Myalgic Encephalomyelitis/Chronic Fatigue Syndrome (ME/CFS) and Post-Acute Sequelae of COVID-19 (PASC). Multimodal imaging—including structural MRI, diffusion tensor and kurtosis imaging (DTI/DKI), functional MRI (fMRI), and task-based EEG—reveals widespread, yet localized, alterations in the post-viral brain. A systematic review of 12 imaging studies confirms that objective white matter tract connectivity changes (42%) and grey matter volume reductions (16%) frequently affect the prefrontal cortex, precentral gyrus, and subcortical regions (thalamus, pallidum, and basal ganglia). Task-based fMRI and EEG demonstrate a central nervous system failure to upregulate motor drive during fatiguing tasks, establishing a biological central neural origin of physical and cognitive fatigability distinct from peripheral muscle fatigue. Furthermore, predictive processing models frame baseline thalamocortical hyperconnectivity with sensorimotor and visual cortices as a reversible thalamic gain control failure that normalizes toward healthy controls following hyperbaric oxygen therapy in clinical responders.

    At the cellular and chemokine level, these central alterations are driven by microglial priming, astrogliosis, and prefrontal-hippocampal excitation-inhibition (E/I) imbalance. Preclinical models demonstrate that systemic peripheral inflammation directly exacerbates central cerebral inflammation under hypoxic stress via a CCL5 chemokine-dependent signaling axis, illustrating how peripheral post-viral flares translate into central neuroinflammation. In post-COVID cohorts, [18F]DPA-714 PET/fMRI reveals that high neuroinflammatory activity directly correlates with reduced functional connectivity within visual-peripheral and dorsal-attention networks. Expert syntheses highlight TSPO PET, diffusion MRI, and fluid biomarkers (NfL, GFAP) for patient stratification, while clinical trial protocols actively deploy multimodal MRI to evaluate whether non-invasive therapies can restore hippocampal metabolism and resting-state network connectivity.

    Despite these advancements, significant clinical and methodological challenges persist. Group-level neuroimaging and metabolic signatures—such as regional hypoperfusion seen in arterial spin labeling, divergent 7T spectroscopy metabolite patterns (including elevated cingulate lactate in ME/CFS, other region-specific lactate and glutamate observations, and reduced choline in Long COVID), and altered gut-brain axis kynurenine metabolites—serve as research observations rather than validated individual diagnostic biomarkers. Crucially, evidence is limited by the heterogeneity of scanning protocols, modest cohort sizes, reliance on cross-sectional designs, and the preliminary nature of conference proceedings and preclinical models. Further large-scale longitudinal validation is required to establish causal pathways linking systemic expression of serotonin-metabolizing enzymes in brainstem endothelial cells, endocrine hyporeactivity, and central nervous system remodeling.
  why_it_matters: |-
    Characterizing the neurological and neurovascular pathophysiology of post-viral syndromes shifts the clinical understanding from subjective symptom reports to objective, quantifiable biology. Demonstrating that cognitive exhaustion is linked to prefrontal capillary blood flow rigidity, thalamic volume reduction, and altered white matter microstructure provides concrete physical markers that can be evaluated in vivo. Additionally, establishing that visual stimulation triggers cerebral lactate accumulation and cingulate energy depletion proves that cognitive symptoms are rooted in impaired brain energy metabolism.

    Identifying specific cellular processes, such as microglial priming, astrocytic dysfunction, and HPA-axis hyporeactivity, points to targeted therapeutic strategies. These include intranasal monoclonal antibodies to recruit regulatory T cells and shift microglia to a restorative state, low-dose hydrocortisone to address the cortisol deficit, or pharmacological agents to rebalance excitatory-inhibitory neurotransmission. Furthermore, establishing a link between haptoglobin phenotypes and post-exertional symptom severity suggests a genetic basis for clinical variability, allowing for personalized, phenotype-informed clinical care and trial stratification.
  state_of_evidence:
  - status: established
    label: Established
    items:
    - Post-viral cognitive dysfunction involves objective deficits in attention, executive function, and visual processing speed. Endothelial activation and vascular inflammation are elevated in neurological post-viral cohorts up to a year post-infection. A hyporeactive HPA axis is characterized by decreased salivary, urinary, and hair cortisol levels in patients compared to controls. Widespread white matter microstructural alterations and localized grey matter volume reductions (especially in the prefrontal cortex, precentral gyrus, thalamus, and basal ganglia) are consistently observed at the group level across patient cohorts.
  - status: plausible
    label: Plausible but early
    items:
    - Submaximal exercise induces hyperactivation of the anterior Default Mode Network (medial prefrontal cortex) during resting states. Visual and cognitive tasks trigger abnormal shifts to anaerobic pathways, resulting in elevated visual cortex lactate and reduced cingulate cortex ATP-to-phosphocreatine ratios. Widespread white matter abnormalities, characterized by cerebral edema and cellular infiltration, are detectable using advanced neuroinflammation diffusion MRI. Autopsy tissue reveals functional down-regulation of hypothalamic CRH and vasopressin neurons, and altered microglial states without widespread chronic neuroinflammation. Post-exertional symptom severity is modulated by haptoglobin phenotype (Hp2-1 associated with worse PEM and cognitive deficits). Nicotinic acetylcholine receptor blockade by viral spike proteins impairs cholinergic neurotransmission, which can be restored by nicotine displacement. Intranasal immunomodulation (such as anti-CD3) recruits regulatory T cells
      to resolve neuroinflammation and restore hippocampal neurogenesis in animal models. Neurocognitive symptoms are associated with reduced within-network connectivity in resting-state cognitive networks (such as default mode, visual-peripheral, and dorsal attention networks), which correlates with high neuroinflammatory activity on [18F]DPA-714 PET in a subset of post-COVID patients. Sensory hypersensitivity in ME/CFS is driven by dysfunction in higher-order cognitive control and attentional processing (characterized by reduced late auditory P300 potential on ERP tasks) rather than early sensory gating deficits. Cognitive dysfunction is driven by functional, modifiable neurovascular and synaptic dysregulation of brain-resident cells (microglial priming, astrocytic dysfunction, and prefrontal-hippocampal E/I imbalance) rather than permanent neurodegenerative damage. Multimodal neuroimaging (fMRI/EEG) demonstrates a central nervous system failure to upregulate motor drive during physical
      and cognitive tasks, establishing a central neural origin of fatigability distinct from peripheral muscle fatigue. Thalamocortical hyperconnectivity reflects a precision gate control failure mediating sensory overload and cognitive fatigue, which shifts toward healthy control levels in hyperbaric oxygen therapy responders. Systemic peripheral inflammation exacerbates central cerebral inflammation under hypoxic stress via a CCL5 chemokine-dependent microglial activation axis (preclinical model). Controlled physiological hypoxia challenges reveal exhausted thalamic neurometabolic reserve (blunted compensatory lactate response) and abnormal neurovascular coupling in ME/CFS, supporting challenge-based over static imaging designs. High-field 7T magnetic resonance spectroscopy identifies divergent resting central metabolite signatures—elevated anterior cingulate lactate in ME/CFS and reduced dorsal anterior cingulate choline in Long COVID—without corresponding resting calf muscle alterations.
  - status: not_established
    label: Not established
    items:
    - A single, universal neuroimaging or CSF biomarker that reliably diagnoses ME/CFS or Long COVID in clinical settings. Direct causal evidence that glymphatic system waste clearance dysfunction or choroid plexus swelling is the primary driver of cognitive symptoms in human cohorts. The clinical efficacy of low-dose hydrocortisone or neurotransmitter-rebalancing drugs (like memantine or dextromethorphan) in unstratified patient populations. The clinical efficacy of interventions such as acupuncture or hyperbaric oxygen therapy (HBOT) in reversing hippocampal connectivity or metabolic dysfunction in larger, placebo-controlled trials.
  - status: limitations
    label: Key limitations
    items:
    - Many neuroimaging studies feature small, highly heterogeneous cohorts and lack longitudinal follow-up to track whether structural and functional brain changes resolve over time. In vivo measurement of glymphatic flow and choroid plexus perfusion is technically challenging and early-stage. The absence of healthy control groups in cerebrospinal fluid proteomic studies due to ethical lumbar puncture restrictions limits the specificity of identified biomarkers. Animal models of passive antibody transfer, hypoxia models, and intranasal immunotherapy may not fully replicate the chronic, multi-systemic pathobiology of human disease. TSPO-based PET neuroimaging requires complex genotyping to account for binder affinity, limiting its clinical scalability and generalizability. Conference abstracts, clinical trial protocols, and narrative medical reviews represent preliminary, planned, or synthesised work rather than large-scale empirical replication. Magnetic resonance spectroscopy captures
      localized metabolite shifts rather than direct proof of neuroinflammation or primary mitochondrial causality, while 7T imaging protocols require substantial travel and scanner tolerance that often leave severe or bedbound populations unrepresented.
  open_questions:
  - What is the precise temporal sequence of events linking peripheral metabolic exhaustion (NLRP3 activation) to central neurovascular dysfunction during post-exertional malaise?
  - What are the molecular mechanisms by which specific haptoglobin structural variants (oligomers in the Hp2-1 phenotype) interact with brain vascular endothelium to promote cognitive fatigue?
  - What specific ligands target the hyporeactive hypothalamic CRH and vasopressin neurons, and can targeted neuroendocrine therapies restore long-term HPA axis homeostasis?
  - How does the elevated visual cortex lactate production observed under ultra-high-field 7T functional MRS correlate with structural myelin loss or neurochemical alterations in adjacent white matter?
  - By what mechanism does intranasal anti-CD3 monoclonal antibody treatment promote the recruitment of protective regulatory T cells to the brain, and can this reverse established glial priming in human cohorts?
  - Does targeted CCL5 chemokine inhibition or microglial modulation attenuate hypoxia-exacerbated central neuroinflammation in human post-viral cohorts?
  - How reliably does the normalization of thalamocortical hyperconnectivity observed after hyperbaric oxygen therapy correlate with long-term clinical recovery in ME/CFS?
  - Does blunted thalamic lactate elevation and altered neurovascular coupling under experimental hypoxia predict post-exertional malaise severity across clinical ME/CFS subgroups?
de:
  title: Neuroinflammation & Gehirnveränderungen
  subtitle: Ein laufender Forschungsstrang zu Gehirn-Bildgebung, neurovaskulärer Kopplung, Mikroglia-Aktivierung und neuroendokrinen Veränderungen bei ME/CFS und Long COVID.
  evidence_label: frühe klinische und mechanistische Validierung
  plain_summary: Spezialisierte Gehirn-Scans und Liquoruntersuchungen zeigen bei Menschen mit ME/CFS und Long COVID zunehmend messbare biologische Auffälligkeiten – etwa bei der Hirndurchblutung, im Energiestoffwechsel unter geistiger oder visueller Belastung sowie Hinweise auf überaktive Immunzellen im Gehirn. Das untermauert, dass kognitive Erschöpfung („Brain Fog“) und Reizüberempfindlichkeit reale körperliche Grundlagen haben. Dennoch unterscheiden sich die Befunde stark zwischen Betroffenen, stammen meist aus kleineren Forschungsstudien und ergeben bislang weder einen Routinetest noch eine gesicherte Behandlung.
  takeaway: |-
    Veränderungen im zentralen Nervensystem, eine gestörte neurovaskuläre Kopplung und chronische neuroimmune Aktivierung stellen eine zentrale pathologische Achse bei Myalgischer Enzephalomyelitis/Chronischem Fatigue-Syndrom (ME/CFS) und postakuten Folgen von COVID-19 (PASC) dar. Multimodale Bildgebung – einschließlich struktureller MRT, Diffusions-Tensor- und Kurtosis-Bildgebung (DTI/DKI), funktioneller MRT (fMRT) sowie aufgabenbasierter EEG – zeigt weitreichende, zugleich aber regional umschriebene Veränderungen im postviralen Gehirn. Eine systematische Übersichtsarbeit von 12 Bildgebungsstudien bestätigt, dass objektive Veränderungen der Konnektivität weißer Substanz (42 %) und Volumenminderungen der grauen Substanz (16 %) häufig den präfrontalen Kortex, den Gyrus praecentralis sowie subkortikale Regionen (Thalamus, Pallidum und Basalganglien) betreffen. Aufgabenbasierte fMRT- und EEG-Studien belegen zudem ein Versagen des zentralen Nervensystems, den motorischen Antrieb bei ermüdenden Aufgaben hochzuregulieren, und etablieren damit einen biologischen, zentralnervösen Ursprung körperlicher und kognitiver Ermüdbarkeit – abgegrenzt von peripherer Muskelermüdung. Darüber hinaus ordnen Predictive-Processing-Modelle eine thalamokortikale Hyperkonnektivität mit sensorimotorischen und visuellen Kortizes im Ruhezustand als reversible Störung der thalamischen Verstärkungssteuerung („Gain Control“) ein, die sich bei Therapierespondern nach hyperbarer Sauerstofftherapie (HBOT) wieder in Richtung gesunder Kontrollen normalisiert.

    Auf zellulärer und Chemokin-Ebene werden diese zentralen Veränderungen durch Mikroglia-Priming, Astrogliose und ein Ungleichgewicht zwischen Erregung und Hemmung (E/I-Balance) zwischen präfrontalem Kortex und Hippocampus angetrieben. Präklinische Modelle zeigen, dass systemische periphere Entzündung unter hypoxischem Stress eine zentrale Hirnentzündung direkt über eine CCL5-Chemokin-abhängige Signalachse verstärkt – was veranschaulicht, wie periphere postvirale Schübe in zentrale Neuroinflammation übergehen. In Post-COVID-Kohorten zeigt [18F]DPA-714-PET/fMRT, dass hohe neuroinflammatorische Aktivität direkt mit verringerter funktioneller Konnektivität im visuell-peripheren Netzwerk und im dorsalen Aufmerksamkeitsnetzwerk korreliert. Übersichtsarbeiten von Fachleuten heben TSPO-PET, Diffusions-MRT und flüssige Biomarker (NfL, GFAP) zur Patientenstratifizierung hervor, während aktuelle klinische Studienprotokolle multimodale MRT einsetzen, um zu prüfen, ob nicht-invasive Therapien den Hippocampus-Stoffwechsel und die Konnektivität von Ruhezustandsnetzwerken wiederherstellen können.

    Trotz dieser Fortschritte bestehen erhebliche klinische und methodische Herausforderungen fort. Bildgebungs- und Stoffwechselsignaturen auf Gruppenebene – etwa regionale Hypoperfusion im Arterial Spin Labeling, unterschiedliche 7T-Spektroskopie-Metabolitenmuster (darunter erhöhtes Laktat im Gyrus cinguli bei ME/CFS, andere regionsspezifische Laktat- und Glutamatbefunde sowie reduziertes Cholin bei Long COVID) und veränderte Kynurenin-Metaboliten der Darm-Hirn-Achse – sind Forschungsbeobachtungen und noch keine validierten individuellen Diagnose-Biomarker. Entscheidend eingeschränkt wird die Evidenz durch heterogene Scan-Protokolle, kleine Kohortengrößen, die überwiegende Nutzung von Querschnittsdesigns sowie den vorläufigen Charakter von Konferenzbeiträgen und präklinischen Modellen. Größere Längsschnittstudien sind erforderlich, um kausale Pfade zu belegen, die die Expression Serotonin-metabolisierender Enzyme in Endothelzellen des Hirnstamms, endokrine Hyporeaktivität und Umbauprozesse im zentralen Nervensystem verknüpfen.
  why_it_matters: |-
    Die Charakterisierung der neurologischen und neurovaskulären Pathophysiologie postviraler Syndrome verschiebt das klinische Verständnis von subjektiven Symptomberichten hin zu objektiver, messbarer Biologie. Der Nachweis, dass kognitive Erschöpfung mit einer starren Kapillardurchblutung im präfrontalen Kortex, einem Volumenrückgang im Thalamus und veränderter Mikrostruktur der weißen Substanz zusammenhängt, liefert konkrete physische Marker, die sich in vivo untersuchen lassen. Zudem belegt der Befund, dass visuelle Reize im Gehirn Laktatanstiege und einen Energieabfall im Gyrus cinguli auslösen, dass kognitive Symptome in einem gestörten Gehirnenergiestoffwechsel wurzeln.

    Die Identifikation konkreter zellulärer Prozesse – wie Mikroglia-Priming, Astrozytendysfunktion und Unterfunktion der HPA-Achse – weist auf gezielte Therapieansätze hin. Dazu gehören intranasale monoklonale Antikörper zur Rekrutierung regulatorischer T-Zellen und Umstimmung von Mikroglia in einen regenerativen Zustand, niedrig dosiertes Hydrokortison zum Ausgleich des Kortisolmangels oder pharmakologische Wirkstoffe zur Wiederherstellung der Balance zwischen erregender und hemmender Neurotransmission. Darüber hinaus deutet ein Zusammenhang zwischen Haptoglobin-Phänotypen und der Schwere von Belastungsintoleranz auf eine genetische Grundlage klinischer Unterschiede hin, was langfristig eine personalisierte, phänotyp-geleitete Versorgung und Studienstratifizierung ermöglicht.
  state_of_evidence:
  - status: established
    label: Etabliert
    items:
    - Postvirale kognitive Dysfunktion geht mit objektiven Defiziten bei Aufmerksamkeit, Exekutivfunktionen und visueller Verarbeitungsgeschwindigkeit einher.
    - Endothelaktivierung und Gefäßentzündung sind in neurologischen postviralen Kohorten bis zu einem Jahr nach der Infektion erhöht.
    - Eine hyporeaktive HPA-Achse ist durch erniedrigte Kortisolspiegel in Speichel, Urin und Haaren bei Betroffenen im Vergleich zu Kontrollen gekennzeichnet.
    - Weitreichende mikrostrukturelle Veränderungen der weißen Substanz sowie regionale Volumenminderungen der grauen Substanz (vor allem in präfrontalem Kortex, Gyrus praecentralis, Thalamus und Basalganglien) werden auf Gruppenebene konsistent über Patientenkohorten hinweg beobachtet.
  - status: plausible
    label: Plausibel, aber noch früh
    items:
    - Submaximale Belastung löst im Ruhezustand eine Überaktivierung des anterioren Default Mode Network (medialer präfrontaler Kortex) aus.
    - Visuelle und kognitive Aufgaben führen zu einer abnormen Verschiebung hin zu anaerober Energiegewinnung, mit erhöhtem Laktat im visuellen Kortex und verringertem ATP/Phosphokreatin-Verhältnis im Gyrus cinguli.
    - Ausgedehnte Auffälligkeiten der weißen Substanz, geprägt durch Hirnödem und zelluläre Infiltration, lassen sich mithilfe fortgeschrittener Neuroinflammations-Diffusions-MRT nachweisen.
    - Autopsiegewebe zeigt eine funktionelle Herunterregulierung hypothalamischer CRH- und Vasopressin-Neuronen sowie veränderte Mikroglia-Zustände ohne flächendeckende chronische Neuroinflammation.
    - Der Schweregrad von Symptomen nach Belastung wird durch den Haptoglobin-Phänotyp moduliert (Hp2-1 geht mit stärkerer PEM und kognitiven Defiziten einher).
    - Eine Blockade nikotinischer Acetylcholinrezeptoren durch virale Spike-Proteine beeinträchtigt die cholinerge Neurotransmission und lässt sich durch Verdrängung mit Nikotin rückgängig machen.
    - Intranasale Immunmodulation (wie Anti-CD3) rekrutiert in Tiermodellen regulatorische T-Zellen, um Neuroinflammation abzubauen und die hippocampale Neurogenese wiederherzustellen.
    - Neurokognitive Symptome hängen mit verringerter Konnektivität innerhalb kognitiver Ruhezustandsnetzwerke (Default Mode, visuell-peripheres und dorsales Aufmerksamkeitsnetzwerk) zusammen, was bei einer Teilgruppe von Post-COVID-Betroffenen mit hoher neuroinflammatorischer Aktivität im [18F]DPA-714-PET korreliert.
    - Reizüberempfindlichkeit bei ME/CFS beruht eher auf einer Dysfunktion übergeordneter kognitiver Kontroll- und Aufmerksamkeitsprozesse (gekennzeichnet durch ein reduziertes spätes auditorisches P300-Potenzial in ERP-Aufgaben) als auf Defiziten der frühen sensorischen Filterung.
    - Kognitive Dysfunktion wird eher durch eine funktionelle, modifizierbare neurovaskuläre und synaptische Fehlregulation hirneigener Zellen (Mikroglia-Priming, Astrozytendysfunktion und präfrontal-hippokampales E/I-Ungleichgewicht) als durch dauerhafte neurodegenerative Schäden angetrieben.
    - Multimodale Bildgebung (fMRT/EEG) belegt ein Versagen des zentralen Nervensystems, den motorischen Antrieb bei körperlichen und kognitiven Aufgaben hochzuregulieren, und weist damit einen zentralnervösen Ursprung der Ermüdbarkeit getrennt von peripherer Muskelermüdung nach.
    - Thalamokortikale Hyperkonnektivität spiegelt eine Störung der Präzisions- und Verstärkungssteuerung wider, die Reizüberflutung und kognitive Fatigue vermittelt und sich bei HBOT-Respondern wieder in Richtung gesunder Kontrollen verschiebt.
    - Systemische periphere Entzündung verstärkt unter hypoxischem Stress die zentrale Hirnentzündung über eine CCL5-Chemokin-abhängige Mikroglia-Aktivierungsachse (präklinisches Modell).
    - Kontrollierte physiologische Hypoxie-Belastungen decken bei ME/CFS eine erschöpfte thalamische neurometabolische Reserve (abgeflachte kompensatorische Laktatantwort) und eine abnorme neurovaskuläre Kopplung auf, was Belastungs- gegenüber reinen Ruhemessungen stützt.
    - Hochfeld-7T-Magnetresonanzspektroskopie identifiziert unterschiedliche zentrale Ruhe-Metabolitensignaturen – erhöhtes Laktat im anterioren Cingulum bei ME/CFS und verringertes Cholin im dorsalen anterioren Cingulum bei Long COVID – ohne entsprechende Veränderungen in der ruhenden Wadenmuskulatur.
  - status: not_established
    label: Nicht belegt
    items:
    - Ein einzelner, universeller Bildgebungs- oder Liquor-Biomarker, der ME/CFS oder Long COVID im klinischen Alltag zuverlässig diagnostiziert.
    - Ein direkter kausaler Beleg dafür, dass eine Störung der Abfallentsorgung über das glymphatische System oder eine Schwellung des Plexus choroideus der Haupttreiber kognitiver Symptome beim Menschen ist.
    - Die klinische Wirksamkeit von niedrig dosiertem Hydrokortison oder neurotransmitter-ausgleichenden Medikamenten (wie Memantin oder Dextromethorphan) in unstratifizierten Patientenpopulationen.
    - Die klinische Wirksamkeit von Interventionen wie Akupunktur oder hyperbarer Sauerstofftherapie (HBOT) zur Umkehrung hippocampaler Konnektivitäts- oder Stoffwechselstörungen in größeren, placebokontrollierten Studien.
  - status: limitations
    label: Wesentliche Einschränkungen
    items:
    - Viele Bildgebungsstudien untersuchen kleine, stark heterogene Kohorten und weisen keine Längsschnitt-Nachbeobachtung auf, um zu klären, ob sich strukturelle und funktionelle Gehirnveränderungen im Zeitverlauf zurückbilden.
    - Die In-vivo-Messung von glymphatischem Fluss und Perfusion des Plexus choroideus ist technisch anspruchsvoll und befindet sich noch in einem frühen Stadium.
    - Das Fehlen gesunder Kontrollgruppen in Liquor-Proteomik-Studien aufgrund ethischer Einschränkungen bei Lumbalpunktionen begrenzt die Spezifität der gefundenen Biomarker.
    - Tiermodelle mit passivem Antikörpertransfer, Hypoxie-Modelle und intranasale Immuntherapien bilden die chronische, multisystemische Pathobiologie beim Menschen möglicherweise nicht vollständig ab.
    - TSPO-basierte PET-Bildgebung erfordert aufwändige Genotypisierungen zur Berücksichtigung der Bindungsaffinität, was die klinische Skalierbarkeit und Übertragbarkeit einschränkt.
    - Konferenzabstracts, Studienprotokolle und narrative medizinische Übersichtsarbeiten stellen vorläufige, geplante oder zusammenfassende Arbeiten dar und ersetzen keine groß angelegte empirische Replikation.
    - Magnetresonanzspektroskopie erfasst lokale Metabolitenverschiebungen statt eines direkten Nachweises von Neuroinflammation oder primärer mitochondrialer Kausalität; zudem erfordern 7T-Protokolle erhebliche Anreisewege und Scannertoleranz, sodass schwer Betroffene und Bettlägerige häufig ausgeschlossen bleiben.
  open_questions:
  - Wie sieht die genaue zeitliche Abfolge der Ereignisse aus, die periphere metabolische Erschöpfung (NLRP3-Aktivierung) während einer Post-Exertional Malaise mit zentraler neurovaskulärer Dysfunktion verknüpft?
  - Über welche molekularen Mechanismen interagieren spezifische Haptoglobin-Strukturvarianten (Oligomere beim Hp2-1-Phänotyp) mit dem Gefäßendothel des Gehirns, um kognitive Fatigue zu fördern?
  - Welche spezifischen Liganden adressieren die hyporeaktiven hypothalamischen CRH- und Vasopressin-Neuronen, und können gezielte neuroendokrine Therapien die langfristige Homöostase der HPA-Achse wiederherstellen?
  - Wie hängt die unter Ultrahochfeld-7T-fMRS beobachtete erhöhte Laktatbildung im visuellen Kortex mit strukturellem Myelinverlust oder neurochemischen Veränderungen in benachbarter weißer Substanz zusammen?
  - Über welchen Mechanismus fördert eine intranasale Behandlung mit monoklonalen Anti-CD3-Antikörpern die Rekrutierung schützender regulatorischer T-Zellen ins Gehirn, und lässt sich damit ein etabliertes Glia-Priming in menschlichen Kohorten umkehren?
  - Schwächt eine gezielte Hemmung des Chemokins CCL5 oder eine Mikroglia-Modulation die durch Hypoxie verstärkte zentrale Neuroinflammation in postviralen Humankohorten ab?
  - Wie zuverlässig korreliert die nach hyperbarer Sauerstofftherapie beobachtete Normalisierung der thalamokortikalen Hyperkonnektivität mit einer langfristigen klinischen Erholung bei ME/CFS?
  - Sagen eine abgeflachte thalamische Laktaterhöhung und eine veränderte neurovaskuläre Kopplung unter experimenteller Hypoxie die Schwere von Post-Exertional Malaise über klinische ME/CFS-Untergruppen hinweg voraus?
