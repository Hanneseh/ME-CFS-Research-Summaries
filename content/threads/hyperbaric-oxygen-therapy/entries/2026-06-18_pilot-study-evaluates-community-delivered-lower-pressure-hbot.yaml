en:
  title: Pilot study evaluates community-delivered lower-pressure HBOT (1.4 ATA) for Long COVID
  plain_summary: A tiny pilot study tested gentler, lower-pressure hyperbaric oxygen (1.4 ATA) in a community pharmacy for six people with Long COVID and found it was tolerable with short-term symptom gains, though frequent travel was tiring. With only six participants and no control group, it cannot tell us whether lower-pressure HBOT truly works.
  detail: A mixed-methods pilot study of six participants with Long COVID evaluated the safety and feasibility of community-delivered hyperbaric oxygen therapy (HBOT) using a single-person chamber at 1.4 ATA in a community pharmacy. Following a 4-week treatment course, participants reported short-term improvements in fatigue, breathlessness (dyspnea), and overall quality of life. The lower-pressure protocol was safe and well-tolerated, and delivering the therapy in a community setting successfully increased accessibility. However, participants noted that traveling to and attending regular, frequent sessions was physically and logistically challenging due to their chronic illness. Due to the extremely small sample size and lack of a control group, larger randomized sham-controlled trials are required to establish efficacy and define optimal treatment protocols.
de:
  title: Pilotstudie prüft wohnortnahe Niedrigdruck-HBOT (1,4 ATA) bei Long COVID
  plain_summary: Eine sehr kleine Pilotstudie testete eine sanftere Niedrigdruck-HBOT (1,4 ATA) in einer Apotheke bei sechs Personen mit Long COVID und fand sie gut verträglich mit kurzfristigen Besserungen, wobei die häufige Anfahrt belastend war. Bei nur sechs Teilnehmenden ohne Kontrollgruppe lässt die Studie keinen Rückschluss auf eine echte Wirksamkeit zu.
  detail: Eine Mixed-Methods-Pilotstudie mit sechs Teilnehmenden mit Long COVID untersuchte Sicherheit und Machbarkeit einer wohnortnah in einer öffentlichen Apotheke angebotenen hyperbaren Sauerstofftherapie (HBOT) in einer Einpersonen-Kammer bei 1,4 ATA. Nach einer 4-wöchigen Behandlung berichteten die Teilnehmenden über kurzfristige Verbesserungen bei Fatigue, Atemnot (Dyspnoe) und allgemeiner Lebensqualität. Das niedrigere Druckprotokoll war sicher und gut verträglich, und die Bereitstellung vor Ort verbesserte die Erreichbarkeit. Allerdings gaben die Teilnehmenden an, dass die Anfahrt und der regelmäßige Besuch häufiger Termine angesichts ihrer chronischen Erkrankung körperlich und organisatorisch anstrengend waren. Wegen der extrem kleinen Stichprobe und der fehlenden Kontrollgruppe sind größere randomisierte, schein-kontrollierte Studien erforderlich, um Wirksamkeit und optimale Protokolle zu klären.
