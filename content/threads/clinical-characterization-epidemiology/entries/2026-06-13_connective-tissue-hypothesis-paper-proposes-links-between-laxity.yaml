en:
  title: Connective-tissue hypothesis paper proposes links between laxity, mast cells, hypoxia, and ME/CFS symptoms
  plain_summary: A hypothesis preprint suggested that loose connective tissue, mast-cell activation, low tissue oxygen, and muscle dysfunction might reinforce one another in ME/CFS. It presents no new patient data and does not prove that connective-tissue problems cause ME/CFS.
  detail: 'Klaus Wirth published a hypothesis preprint arguing that connective-tissue laxity, mast-cell activation, hypoxia signaling, capillary basement-membrane changes, and skeletal-muscle dysfunction may reinforce one another in ME/CFS. The clinical characterization value is that it offers a framework for why hypermobility, orthostatic intolerance, craniocervical complaints, and exertional intolerance can co-occur in some patients. It does not present new patient data and should not be treated as proof that connective-tissue pathology causes ME/CFS. The main implication is cohort design: studies may need to record hypermobility, cervical instability symptoms, and mast-cell features when characterizing subgroups.'
de:
  title: Bindegewebs-Hypothesenpapier schlägt Zusammenhänge zwischen Gewebelaxität, Mastzellen, Hypoxie und ME/CFS-Symptomen vor
  plain_summary: Ein Hypothesen-Preprint schlägt vor, dass lockeres Bindegewebe, Mastzellaktivierung, Sauerstoffmangel und Muskelfunktionsstörungen sich bei ME/CFS gegenseitig verstärken könnten. Neue Patientendaten liefert die Arbeit nicht und beweist auch keine Bindegewebsursache.
  detail: 'Klaus Wirth veröffentlichte ein Hypothesen-Preprint, in dem er darlegt, dass Bindegewebslaxität, Mastzellaktivierung, Hypoxie-Signalwege, Veränderungen der Kapillar-Basalmembran und Skelettmuskel-Dysfunktion bei ME/CFS ineinandergreifen könnten. Für die klinische Charakterisierung liegt der Wert darin, dass ein Rahmen dafür geboten wird, warum Hypermobilität, orthostatische Intoleranz, Beschwerden der oberen Halswirbelsäule und Belastungsintoleranz bei einem Teil der Betroffenen gemeinsam vorkommen. Neue Patientendaten liefert der Text nicht, und er sollte nicht als Beleg dafür gelten, dass Bindegewebserkrankungen ME/CFS verursachen. Die wichtigste Konsequenz betrifft das Kohortendesign: Studien sollten Hypermobilität, Anzeichen zervikaler Instabilität und Mastzellmerkmale systematisch miterfassen, wenn Untergruppen charakterisiert werden.'
