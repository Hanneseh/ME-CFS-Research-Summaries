en:
  title: Safety study shows CPET flare is temporary in severe post-COVID
  plain_summary: In a study of severe post-COVID patients, a maximal exercise test triggered a temporary symptom flare lasting several days before patients returned to baseline within about a week. While reassuring for the studied group, it excluded bedbound patients and does not mean exercise testing is risk-free for everyone.
  detail: This matched case-control study monitored PEM symptoms daily before and after a maximal CPET in severe post-COVID condition. The main change was a temporary symptom worsening for several days after testing, followed by return to baseline within about a week. That supports CPET as an objective assessment tool that can provoke PEM without causing permanent deterioration in the studied cohort. It does not cover very severe bedbound patients and does not mean the test is benign for every individual.
de:
  title: Sicherheitsstudie zeigt vorübergehenden CPET-Schub bei schwerem Post-COVID
  plain_summary: In einer Studie mit schwerem Post-COVID löste ein maximaler Belastungstest eine vorübergehende Symptomverschlechterung über mehrere Tage aus, bevor binnen etwa einer Woche wieder das Ausgangsniveau erreicht wurde. Das betrifft allerdings nicht bettlägerige Betroffene und bedeutet nicht, dass ein solcher Test für jede Person unbedenklich ist.
  detail: Diese gematchte Fall-Kontroll-Studie überwachte PEM-Symptome täglich vor und nach einem maximalen CPET bei schwerem Post-COVID-Syndrom. Die wesentliche Beobachtung war eine vorübergehende Symptomverschlechterung über mehrere Tage nach dem Test, gefolgt von einer Rückkehr zum Ausgangszustand innerhalb von etwa einer Woche. Das stützt den CPET als objektives Messinstrument, das in der untersuchten Kohorte PEM auslösen kann, ohne eine dauerhafte Verschlechterung zu verursachen. Sehr schwer betroffene, bettlägerige Patientinnen und Patienten waren jedoch nicht eingeschlossen, und die Ergebnisse bedeuten nicht, dass der Test für jede Einzelperson harmlos ist.
