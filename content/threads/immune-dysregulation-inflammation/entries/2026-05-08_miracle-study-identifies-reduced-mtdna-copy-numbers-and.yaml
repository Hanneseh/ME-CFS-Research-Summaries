en:
  title: MIRACLE study identifies reduced mtDNA copy numbers and altered HDL function in ME/CFS
  plain_summary: A conference report on the 400-person MIRACLE study—including severely ill, bedridden patients—found fewer mitochondrial DNA copies and altered HDL cholesterol behavior in ME/CFS. This links cellular energy depletion to the full severity range, though it does not show which change happens first.
  detail: The multi-center MIRACLE study (200 patients, including severely ill bedridden patients, and 200 controls) demonstrated significantly lower mitochondrial DNA (mtDNA) copy numbers (indicating reduced mitochondrial density) and partially reduced inflammatory potential of HDL. This links systemic energy production failure (mitochondrial depletion) and lipidome alterations to the clinical presentation of ME/CFS, validating metabolic stress in the full spectrum of disease severity. However, the study does not establish the causal order between mitochondrial depletion, HDL alterations, and systemic immune dysregulation.
de:
  title: MIRACLE-Studie findet verringerte mtDNA-Kopienzahl und veränderte HDL-Funktion bei ME/CFS
  plain_summary: Ein Konferenzbericht zur MIRACLE-Studie mit 400 Teilnehmenden – ausdrücklich auch schwerstbetroffenen, bettlägerigen Menschen – fand bei ME/CFS weniger mitochondriale DNA-Kopien und ein verändertes Verhalten von HDL-Cholesterin. Das verbindet zellulären Energiemangel über alle Schweregrade hinweg mit Fettstoffwechsel- und Immunzeichen, klärt aber nicht die zeitliche Ursache-Wirkungs-Kette.
  detail: Die multizentrische MIRACLE-Studie (200 Patientinnen und Patienten einschließlich schwer erkrankter, bettlägeriger Betroffener sowie 200 Kontrollen) wies deutlich niedrigere Kopienzahlen mitochondrialer DNA (mtDNA, als Hinweis auf eine geringere Mitochondriendichte) und eine teilweise veränderte entzündungsbezogene Funktion von HDL nach. Dies verknüpft Störungen der zellulären Energiegewinnung (mitochondriale Verarmung) und Lipidom-Veränderungen mit dem klinischen Bild von ME/CFS über das gesamte Schweregradspektrum hinweg. Allerdings bestimmt die Studie nicht die kausale Reihenfolge zwischen mitochondrialer Abnahme, HDL-Veränderungen und systemischer Immundysregulation.
