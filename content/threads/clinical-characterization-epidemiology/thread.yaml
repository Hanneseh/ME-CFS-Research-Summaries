en:
  title: Clinical Characterization & Epidemiology
  subtitle: A living thread on ME/CFS case definitions, clinical guidelines, epidemiology, cohort structure, symptom measurement, research infrastructure, and funding developments for ME/CFS and Long COVID.
  evidence_label: established clinical consensus with ongoing refinement
  plain_summary: ME/CFS is widely recognized as a serious, multi-system physical illness defined by lasting exhaustion, unrefreshing sleep, and a delayed worsening of symptoms after minor effort (post-exertional malaise). Large surveys and national registries show heavy daily disability, low employment, long waits for diagnosis, nearly three times higher direct healthcare costs in a Norwegian registry study, and overlapping connective-tissue and autonomic conditions, while new patient-informed scales aim to measure PEM and severity more reliably. Even so, there is still no single lab test for ME/CFS, trial endpoints and safety reporting remain fragmented, and new public funding calls are only beginning to close large gaps in basic and treatment research.
  takeaway: |-
    ME/CFS is established as a serious, multi-systemic, biologically grounded illness. Since the 2015 IOM report established a tightened clinical case definition around post-exertional malaise, unrefreshing sleep, and cognitive or orthostatic symptoms, large-scale epidemiology and registry studies have clarified the disease's massive socioeconomic burden and persistent care gaps. In the United States, survey data indicates that 1.5% of adults have received a diagnosis, with the critical caveat that nearly half of those reporting a "past" diagnosis still experience active symptoms and functional impairment. In New Zealand, nationwide registry data documents severe socioeconomic disadvantage, including employment rates under 20% and significant barriers to obtaining disability support services, while a 2026 nationwide Norwegian registry study shows direct healthcare costs for diagnosed ME/CFS patients are nearly three times higher than in general-population controls—driven heavily by hospital care despite the lack of an established curative treatment. These challenges are compounded by healthcare fragmentation and "statistical invisibility" due to missing diagnostic codes, as highlighted in service reviews, which obstruct patient tracking and service capacity planning.

    Recent large-scale symptom-clustering, comorbidity, and factor-analysis work has further stratified patients into subgroups and identified overlapping risk groups. Analysis of the UK DecodeME cohort of over 19,000 participants identified high- and low-symptom-burden subgroups, linking infectious onset to higher long-term severity, though without finding genome-wide genetic predictors. Comparative cohort evidence using a prospectively followed post-mononucleosis arm further indicates that Long COVID functional and symptom burden can fall between operationally defined moderate and severe post-mononucleosis ME/CFS groups, supporting phenotypic overlap across post-viral conditions while distinguishing university-cohort severity labels from bedbound disease. In a US electronic health record cohort of over 19 million patients, hypermobile Ehlers-Danlos syndrome (hEDS) was more common than previously recorded (~1 in 788) and linked to nearly triple the odds of a Long COVID diagnosis (OR 2.88), concentrated among patients with overlapping POTS, MCAS, and ME/CFS—though EHR billing codes capture broad Long COVID rather than criteria-defined ME/CFS. Other factor analyses confirm that patient-reported symptoms group into coherent biological dimensions (brain, autonomic, gut-immune), with sex-stratified models revealing that female sex hormones dynamically modulate immune symptoms (such as flu-like complaints in premenopausal women) but not gastrointestinal pathways. Standardized measurement has advanced with the Rasch-validated TIMES scale—mapping a severe cumulative multi-system burden where cognitive symptoms ranked as most troublesome—and November 2026 preprints introducing the patient co-produced Post Activity Symptom Scale (PASS) for PEM alongside brief severity (SoMES) and occupational status (MEOSS) scales, though PASS, SoMES, and MEOSS still await peer review and independent validation across severely affected patients.

    National research and care infrastructure has grown with new funding initiatives, though major structural gaps remain. In Europe, the €7.5 million DISCOVER-ME consortium aims to standardize biobank protocols across 20+ institutions to validate multi-system biomarkers. In Germany, the BMG-funded PEDNET-LC network has established care pathways and a centralized pediatric registry, complementing childhood cohort data showing that pediatric post-COVID symptom persistence correlates stepwise with initial infection severity. However, a November 2026 ME/CFS Research Foundation audit of 259 publicly funded German projects (€292 million for 2020–2029) revealed that only 7% are interventional trials, 5% test drug treatments, and 39% include ME/CFS compared with 84% for Long COVID; shortly afterward, the BMFTR launched an interdisciplinary NDPE pathomechanism funding call (outlines due January 2027) explicitly encouraging inclusion of housebound, severely affected patients. Therapeutic evidence remains preliminary: the peer-reviewed version of the Cohen Center home-use magnetic-therapy pilot supports feasibility and tolerability but shows no cognitive benefit after false-discovery-rate correction, the Cohen Center antiviral data remain an open-label case series, and a peer-reviewed, non-randomized controlled Charité study found no statistically significant 12-month physical-function difference for integrated multidisciplinary care with inpatient rehabilitation compared with a single specialist consultation. National and regional bodies have also documented care gaps and planned capacity: the German MECFS-R registry final report (724 patients, 54% of its recruitment target, no prognosis analysis possible), Belgium's KCE patient-needs report, the German Leopoldina statement on post-infectious diseases, and Vienna's planned PAIS clinic (staged care from summer 2027, full service from mid-2028). These are plans, audits, and descriptions, not outcome evidence.

    Recent evidence also makes trial-design and practical gaps harder to dismiss. Population cohorts show that high-burden Long COVID trajectories and persistent post-COVID symptoms can plateau rather than resolve quickly, while patient-led measurement tools and an international diagnostic consensus are pushing care toward lower-burden, PEM-aware assessment. Surveys document medical and administrative invalidation as structural barriers, and a 2026 review mapping 397 outcome measures across 105 Long COVID and ME/CFS biomedical trials confirmed a lack of endpoint consensus alongside major gaps in PEM, dysautonomia, mast-cell, and adverse-event safety reporting. These developments improve orientation and study design, but they do not amount to validated biomarkers or proven disease-modifying treatments.
  why_it_matters: |-
    The precision of a case definition shapes every downstream study. Cohorts recruited under the 1994 Fukuda criteria, the Canadian Consensus Criteria, and the 2015 IOM criteria differ substantially in symptom severity and biological signal, which complicates comparisons between studies and between funders. Epidemiological work matters for the same reason: if the patient population captured by registries skews toward those with diagnostic access, prevalence estimates undercount the true burden and resource allocation follows those biased numbers.

    Measurement tools directly affect whether clinical trials can detect real change. The absence of a validated, psychometrically grounded symptom scale has historically made it hard to compare trial arms or aggregate data across sites. New instruments developed with patients, like the TIMES scale, and new methodological frameworks accounting for chronobiology and sex-hormone cycles represent substantive infrastructure improvements, even when they produce no treatment findings on their own.
  state_of_evidence:
  - status: established
    label: Established
    items:
    - ME/CFS meets clinical criteria for a severe, chronic, multi-systemic illness. PEM, unrefreshing sleep, and cognitive or autonomic symptoms anchor all major case definitions. International medical societies and clinical consensus guidelines (IDSA, ERJ) define infection-associated chronic conditions (IACCs) and mandate pacing while contraindicating graded exercise therapy. The massive socioeconomic impact—including extremely low employment and high polypharmacy—is documented at the national registry level, and a 2026 Norwegian registry study reports nearly three times higher direct healthcare costs driven heavily by hospital care. Clinical symptom profiles consistently group into statistically distinct biological factors (brain, gut, immune, autonomic) across large cohorts, while trial-landscape reviews confirm fragmented outcome measures (397 in total across 105 biomedical trials) with persistent gaps in PEM, dysautonomia, and safety reporting. Gastrointestinal comorbidity is quantitatively elevated, with meta-analytic data demonstrating a 37% pooled prevalence and a seven-fold increased odds of irritable bowel syndrome (OR 7.20, 95% CI 2.77–18.76) in ME/CFS, though the direction of association remains unresolved.
  - status: plausible
    label: Plausible but early
    items:
    - ME/CFS symptom severity can be stratified into distinct high- and low-symptom-burden subgroups linked to infectious triggers. Comparative evidence from 55 post-mononucleosis ME/CFS participants and 55 matched people with Long COVID indicates that Long COVID symptom burden fell between operationally defined moderate and severe ME/CFS groups, supporting phenotypic overlap without establishing identical biology or a shared longitudinal baseline. National US EHR data (>19 million patients) also link hypermobile Ehlers-Danlos syndrome (hEDS) to nearly triple the odds of a Long COVID diagnosis (OR 2.88), concentrated in patients with overlapping POTS, MCAS, and ME/CFS, though broad coded Long COVID does not establish criteria-defined ME/CFS causality. Structural equation modeling demonstrates sex- and menopause-specific latent symptom structures, with female sex hormones dynamically modulating immune (flu-like) symptoms but not gastrointestinal pathways. Large-scale epidemiological surveys show adolescent CFS prevalence correlates with academic stage and physical endurance deficits, while participatory research frameworks (CureME, Deutsche Gesellschaft für ME/CFS) optimize biobanking and trial co-design. In children, post-COVID symptom persistence correlates with initial infection severity.
      Recent community cohorts further support persistent, high-burden symptom trajectories, while patient co-produced instruments (CNAME, PASS for PEM, SoMES, MEOSS) and an international consensus framework offer promising infrastructure for needs assessment, standardized measurement, and safer diagnostics pending peer review and external validation.
  - status: not_established
    label: Not established
    items:
    - Any single objective biomarker or diagnostic test that reliably identifies ME/CFS across populations. Genome-wide significant genetic variants that differentiate clinical severity subgroups. Electronic health record (EHR) diagnostic billing codes as sensitive or complete metrics for population prevalence, due to widespread diagnostic undercoding and billing delays. The new consensus cut-offs, symptom-timing framework, and preprint measurement scales (PASS, SoMES, MEOSS) remain provisional and require peer review and independent prospective validation against relevant disease controls and across severe-patient cohorts.
  - status: limitations
    label: Key limitations
    items:
    - Multi-country network cohort analyses relying on ICD billing codes in electronic health records undercount ME/CFS and dysautonomia cases due to diagnostic delays and coding stigma, and registry-based healthcare cost studies miss undiagnosed or bedbound patients unable to access clinics. Standard patient-reported outcome measures (PROMs) frequently miss post-exertional malaise and cognitive fluctuations, introducing measurement error into clinical trials, while safety and adverse-event reporting remains under-standardized. Many large cohort and psychometric analyses rely on self-reported online surveys, introducing selection biases and lacking objective physiological measures. A growing share of the post-viral characterization literature relies on broad Post-COVID Condition (PASC) or EHR registry cohorts without ME/CFS case definitions or standardized post-exertional malaise measurement, meaning prevalence figures, comorbidity odds (such as hEDS-Long COVID associations), symptom distributions, and socioeconomic burden estimates from these cohorts do not transfer directly to criteria-defined ME/CFS. The operationalization of severe ME/CFS within university student cohorts does not capture housebound or bedbound patients seen in community
      cohorts, and clinical phenotypic concordance between distinct viral triggers does not establish identical underlying cellular etiology. Severe and very severe patients remain difficult to represent, even in remote surveys, and conference or preprint findings may change after full peer review. Several recent entries are policy statements, funding audits, grant calls (such as the November 2026 BMFTR pathomechanism call), or infrastructure reports that document need and planned capacity but deliver no patient outcomes yet, and survey-based national assessments (KCE) and clinic-based registries (MECFS-R) under-represent very severe and bedbound patients.
