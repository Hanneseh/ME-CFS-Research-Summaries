en:
  title: Scheibenbogen patent targets vascular dysfunction with soluble guanylate cyclase stimulation
  plain_summary: Researchers filed a patent around stimulating soluble guanylate cyclase to improve chronic blood-vessel dysfunction. This is an early legal filing on blood-flow signaling rather than a clinical trial or direct evidence for muscle ion-pump therapy.
  detail: Scheibenbogen and collaborators filed a patent around treating chronic vascular dysfunction using soluble guanylate cyclase stimulation. This is not a Na-K-ATPase patent and should not be treated as direct evidence for pump-targeting therapy. It is relevant as an adjacent treatment direction because improving microvascular perfusion and nitric-oxide-like signalling could theoretically reduce tissue hypoxia, mitochondrial stress, and downstream ion-pump failure.
de:
  title: Scheibenbogen-Patent zielt mit Stimulation der löslichen Guanylatzyklase auf Gefäßdysfunktion
  plain_summary: Forschende reichten ein Patent zur Behandlung chronischer Gefäßfunktionsstörungen über eine Stimulation der löslichen Guanylatzyklase ein. Dies ist eine frühe Patentanmeldung zur Durchblutungsregulation, keine klinische Studie und kein direkter Beleg für eine Muskel-Ionenpumpen-Therapie.
  detail: Scheibenbogen und Mitarbeitende meldeten ein Patent zur Behandlung chronischer vaskulärer Dysfunktion mittels Stimulation der löslichen Guanylatzyklase an. Es handelt sich dabei nicht um ein Na-K-ATPase-Patent und sollte nicht als direkter Beleg für eine pumpenzielende Therapie gewertet werden. Relevant ist es als angrenzende Therapierichtung, weil eine verbesserte mikrovaskuläre Perfusion und Stickstoffmonoxid-ähnliche Signalgebung theoretisch Gewebehypoxie, mitochondrialen Stress und nachgeschaltetes Ionenpumpen-Versagen mindern könnten.
