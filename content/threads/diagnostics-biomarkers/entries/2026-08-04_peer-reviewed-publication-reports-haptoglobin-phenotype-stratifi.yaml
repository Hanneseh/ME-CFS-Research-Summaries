en:
  title: Peer-reviewed publication reports haptoglobin phenotype stratification of post-exertional cognitive decline
  plain_summary: In 44 Long COVID patients given a 90-minute arm-cuff provocation test, those carrying a specific haptoglobin gene variant (Hp2-2) had worse post-test thinking decline and lower brain oxygen extraction than Hp1-1 carriers. This small study did not include a pre-pandemic ME/CFS group and differs from an earlier ME/CFS pilot pointing to Hp2-1, so replication is needed.
  detail: In a peer-reviewed study in the *International Journal of Molecular Sciences*, Moezzi et al. evaluated haptoglobin (Hp) phenotypes as biological stratification markers in post-viral illness. The investigators subjected 44 Long COVID patients and 20 rapid-recovery controls to a 90-minute standardized passive pneumatic cuff provocation challenge while monitoring computerized cognitive performance, cerebral tissue oxygen extraction via near-infrared spectroscopy (NIRS), and plasma metabolomics. Patients carrying the Hp2-2 phenotype exhibited significant post-provocation cognitive decline on BrainCheck testing, reduced right-hemisphere cerebral fractional tissue oxygen extraction, and depressed plasma levels of citric acid, isethionate, and glucosamine. In contrast, cognitively resilient Hp1-1 carriers maintained cerebral oxygen extraction and metabolic stability during provocation. This Long COVID cohort therefore extends, but should not be conflated with, the earlier conference-reported
    ME/CFS pilot that associated Hp2-1 with a worse trajectory; the differing phenotype signals require replication and direct cohort comparison. While passive pneumatic cuff stimulation provides an exertion-testing alternative for individuals unable to perform maximal exercise tests, active provocation still carries a risk of inducing post-exertional symptom flares. Key limitations include a modest sample size, the absence of a prepandemic non-COVID ME/CFS comparison cohort, and the fact that proposed haptoglobin-modulating therapeutic concepts remain unvalidated preclinical hypotheses.
de:
  title: Begutachtete Publikation berichtet Stratifizierung post-exertionellen kognitiven Abfalls nach Haptoglobin-Phänotyp
  plain_summary: Bei 44 Long-COVID-Betroffenen zeigten Träger einer bestimmten Haptoglobin-Variante (Hp2-2) nach einer 90-minütigen Manschetten-Provokation stärkere kognitive Einbußen und eine geringere Sauerstoffausschöpfung im Gehirn als Hp1-1-Träger. Die kleine Studie enthielt keine präpandemische ME/CFS-Gruppe und weicht vom früheren ME/CFS-Pilotbefund (Hp2-1) ab, sodass eine Replikation aussteht.
  detail: In einer begutachteten Studie im *International Journal of Molecular Sciences* untersuchten Moezzi et al. Haptoglobin-(Hp)-Phänotypen als biologische Stratifizierungsmarker bei postviraler Erkrankung. 44 Long-COVID-Patientinnen und -Patienten sowie 20 rasch genesene Kontrollpersonen durchliefen eine 90-minütige standardisierte passive pneumatische Manschetten-Provokation, während computerisierte kognitive Leistung (BrainCheck), zerebrale Gewebesauerstoff-Extraktion mittels Nahinfrarotspektroskopie (NIRS) und Plasmametabolomik erfasst wurden. Betroffene mit dem Phänotyp Hp2-2 zeigten nach Provokation einen signifikanten kognitiven Abfall, eine verringerte fraktionierte Sauerstoffextraktion in der rechten Hirnhälfte sowie erniedrigte Plasmaspiegel von Zitronensäure, Isethionat und Glucosamin – während Hp1-1-Träger Sauerstoffextraktion und Stoffwechsel stabil hielten. Diese Long-COVID-Kohorte erweitert damit den früher auf einer Konferenz vorgestellten ME/CFS-Pilotbefund (der Hp2-1
    mit einem schlechteren Verlauf verknüpfte), darf aber nicht mit ihm gleichgesetzt werden; die abweichenden Phänotyp-Signale erfordern Replikation und direkte Kohortenvergleiche. Obwohl passive Manschettenstimulation eine Alternative zu maximalen Belastungstests darstellt, birgt auch sie das Risiko post-exertioneller Symptomverschlechterungen; zudem sind die Stichprobe klein, eine nicht-COVID-ME/CFS-Kontrolle fehlt und vorgeschlagene Haptoglobin-Therapiekonzepte bleiben unbestätigte Hypothesen.
