en:
  title: Muscle secretome and redox markers proposed as non-invasive diagnostic targets
  plain_summary: A review of three decades of muscle research argues that oxidative stress and calcium-handling problems in muscle cells are core disease features of ME/CFS rather than effects of inactivity. It proposes measuring muscle-released proteins as a non-invasive test, though no clinical assay has been built or tested yet.
  detail: This narrative review from the University G. d'Annunzio of Chieti-Pescara synthesized three decades of literature on skeletal muscle involvement in ME/CFS, identifying mitochondrial oxidative distress, redox imbalance, and impaired calcium handling in muscle cells as primary rather than secondary defects. The diagnostic implication is that the muscle secretome and specific redox biomarkers measurable non-invasively could serve as objective indicators of disease severity. The review explicitly frames these as primary physiological defects rather than consequences of deconditioning, which matters for how diagnostic thresholds would be interpreted clinically. No prospective biomarker validation study is reported; the muscle secretome proposal remains a conceptual target requiring dedicated assay development.
de:
  title: Muskelsekretom und Redox-Marker als nicht-invasive diagnostische Zielgrößen vorgeschlagen
  plain_summary: Eine Übersichtsarbeit über drei Jahrzehnte Muskelforschung argumentiert, dass oxidativer Stress und gestörte Kalziumregulation in Muskelzellen primäre Krankheitsmerkmale von ME/CFS sind und keine Folge von Bewegungsmangel. Sie schlägt von Muskeln freigesetzte Signalstoffe als nicht-invasive Marker vor, doch existiert bislang weder ein entwickelter Test noch eine klinische Validierung.
  detail: Diese narrative Übersichtsarbeit der Universität G. d'Annunzio in Chieti-Pescara fasste drei Jahrzehnte Literatur zur Beteiligung der Skelettmuskulatur bei ME/CFS zusammen und identifizierte mitochondrialen oxidativen Stress, ein gestörtes Redox-Gleichgewicht sowie eine beeinträchtigte Kalziumhandhabung in Muskelzellen als primäre statt sekundäre Defekte. Die diagnostische Schlussfolgerung lautet, dass das Muskelsekretom und spezifische, nicht-invasiv messbare Redox-Biomarker als objektive Indikatoren für den Krankheitsschweregrad dienen könnten. Die Arbeit ordnet diese Veränderungen ausdrücklich als primäre physiologische Defekte und nicht als Folgen von Dekonditionierung ein, was für die klinische Bewertung diagnostischer Grenzwerte wesentlich ist. Eine prospektive Biomarker-Validierungsstudie wird nicht berichtet; der Vorschlag rund um das Muskelsekretom bleibt vorerst ein konzeptionelles Ziel, das eine gezielte Assay-Entwicklung erfordert.
