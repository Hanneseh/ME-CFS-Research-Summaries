en:
  title: Cross-sectional study documents SFN and POTS in ME/CFS and post-COVID using Sudoscan and evoked potentials
  plain_summary: A study in Spain found objective signs of small-fiber nerve damage and POTS in people with ME/CFS and post-COVID condition, with sweat-gland changes showing up more in the hands than the feet. This points toward a possible immune-related nerve pattern, though larger studies using skin biopsies are needed to confirm it.
  detail: Azcue et al. published a comparative study in the Journal of Translational Medicine recruiting 87 patients with post-COVID condition, 50 with ME/CFS, and 50 healthy controls at centres in the Basque Country, Spain. Autonomic function was assessed with tilt-table testing, the Valsalva manoeuvre, and deep-breathing tests; small-fiber function was evaluated with Sudoscan (sweat gland electrochemical conductance as a surrogate for C-fibre innervation density) and with heat- and cold-evoked nerve potential latencies. Both patient groups showed significantly elevated resting and standing heart rates relative to controls, with POTS criteria met by 31% of ME/CFS and 13.8% of post-COVID participants. Both groups also showed significantly delayed responses to heat stimuli, indicating damage to unmyelinated C-type sensory fibres. The key structural finding was that Sudoscan abnormalities clustered in the hands more than the feet — a non-length-dependent distribution suggesting patchy, possibly
    immune-mediated nerve loss rather than the distal-to-proximal dying-back pattern seen in toxic or metabolic neuropathies. The study was the first to directly compare these neurological and autonomic parameters across both patient groups in the same protocol. The authors called for replication with larger, better-matched control groups and suggested adding corneal confocal microscopy and autoantibody profiling to future assessments to investigate autoimmune drivers.
de:
  title: Querschnittsstudie belegt SFN und POTS bei ME/CFS und Post-COVID mittels Sudoscan und evozierter Potenziale
  plain_summary: Eine Studie aus Spanien fand bei Menschen mit ME/CFS und Post-COVID objektive Hinweise auf Schädigungen dünner Nervenfasern und POTS, wobei die Schweißdrüsen-Auffälligkeiten stärker an den Händen als an den Füßen auftraten. Das deutet auf ein mögliches immunvermitteltes Nervenmuster hin, muss aber noch in größeren Studien mit Hautbiopsien bestätigt werden.
  detail: Azcue et al. veröffentlichten im *Journal of Translational Medicine* eine Vergleichsstudie, für die an Zentren im spanischen Baskenland 87 Patientinnen und Patienten mit Post-COVID-Syndrom, 50 mit ME/CFS und 50 gesunde Kontrollpersonen rekrutiert wurden. Die autonome Funktion wurde mittels Kipptischuntersuchung, Valsalva-Manöver und tiefer Atemprüfung getestet; die Small-Fiber-Funktion wurde per Sudoscan (elektrochemische Leitfähigkeit der Schweißdrüsen als Stellvertretermaß für die Dichte der C-Faser-Innervation) sowie anhand von Latenzen hitze- und kälteevozierter Nervenpotenziale erfasst. Beide Patientengruppen zeigten im Vergleich zu den Kontrollen signifikant erhöhte Ruhe- und Stehherzfrequenzen, wobei 31 % der ME/CFS-Betroffenen und 13,8 % der Post-COVID-Teilnehmenden die POTS-Kriterien erfüllten. Beide Gruppen wiesen zudem deutlich verzögerte Reaktionen auf Hitzereize auf, was auf eine Schädigung unmyelinisierter sensibler C-Fasern hinweist. Der zentrale strukturelle Befund
    war, dass Sudoscan-Auffälligkeiten häufiger an den Händen als an den Füßen auftraten – ein nicht-längenabhängiges Verteilungsmuster, das auf einen fleckigen, möglicherweise immunvermittelten Nervenverlust hindeutet statt auf das von distal nach proximal fortschreitende Absterben bei toxischen oder metabolischen Neuropathien. Es handelte sich um die erste Studie, die diese neurologischen und autonomen Parameter bei beiden Patientengruppen im selben Protokoll direkt verglich. Die Autorinnen und Autoren forderten eine Replikation mit größeren, besser abgestimmten Kontrollgruppen und empfahlen für künftige Untersuchungen die Ergänzung um konfokale Hornhautmikroskopie und Autoantikörper-Profile zur Erforschung autoimmuner Auslöser.
