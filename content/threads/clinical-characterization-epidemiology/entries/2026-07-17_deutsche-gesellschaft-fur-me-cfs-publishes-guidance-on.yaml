en:
  title: Deutsche Gesellschaft für ME/CFS publishes guidance on participatory health research standards
  plain_summary: The German ME/CFS Association published guidelines for involving patients directly in designing clinical studies so trials account for PEM and severe disability. It is a research-planning framework rather than new clinical or lab data.
  detail: The Deutsche Gesellschaft für ME/CFS published a guidance document establishing principles and methodology for participatory health research (patient-led research) in ME/CFS study design and clinical trials. The framework defines standards for embedding patient representatives directly into trial co-design, primary outcome selection, protocol safety screening, and institutional ethics review. From a research infrastructure perspective, formalizing patient participation ensures that study protocols account for post-exertional malaise and severe functional impairment, preventing inappropriate exercise interventions that risk patient harm. The guidance also provides tools to optimize participant recruitment, longitudinal retention, and data validity in complex chronic illness cohorts. The document functions as an organizational policy and methodological standard rather than reporting novel biological data or clinical trial outcomes.
de:
  title: Deutsche Gesellschaft für ME/CFS veröffentlicht Leitfaden zu Standards partizipativer Gesundheitsforschung
  plain_summary: Die Deutsche Gesellschaft für ME/CFS hat einen Leitfaden dazu vorgelegt, wie Betroffene direkt in die Planung klinischer Studien eingebunden werden können, damit PEM und schwere Einschränkungen berücksichtigt werden. Es handelt sich um einen methodischen Standard ohne eigene neue Patientendaten.
  detail: Die Deutsche Gesellschaft für ME/CFS veröffentlichte ein Leitfadendokument, das Prinzipien und Methoden partizipativer Gesundheitsforschung (Patientenbeteiligung) für Studiendesign und klinische Prüfungen bei ME/CFS festlegt. Der Rahmen definiert Standards für die direkte Einbindung von Patientenvertretungen in gemeinsames Studiendesign, Auswahl primärer Endpunkte, Sicherheitsprüfung gegen Überlastung im Protokoll sowie Ethikbegutachtung. Aus Sicht der Forschungsinfrastruktur stellt formale Patientenbeteiligung sicher, dass Studienprotokolle Post-Exertional Malaise und schwere Funktionseinschränkungen berücksichtigen und ungeeignete Belastungsinterventionen mit Schadensrisiko vermeiden. Zudem bietet der Leitfaden Werkzeuge für Rekrutierung, langfristige Studienteilnahme und Datenqualität bei komplexen chronischen Erkrankungen. Das Dokument fungiert als organisatorischer und methodischer Standard und berichtet keine neuen biologischen Daten oder Studienergebnisse.
