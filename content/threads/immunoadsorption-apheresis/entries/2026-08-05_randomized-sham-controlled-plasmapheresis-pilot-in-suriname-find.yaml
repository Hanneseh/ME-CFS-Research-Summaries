en:
  title: Randomized sham-controlled plasmapheresis pilot in Suriname finds no benefit over placebo
  plain_summary: In a small randomized sham-controlled pilot trial of 18 Long COVID outpatients in Suriname, both active plasma filtration and a fake blood-reinfusion procedure produced nearly identical fatigue improvements. This shows that the symptom drops could not be attributed to filtering the blood and highlights how strong placebo or contextual effects can be.
  detail: 'A double-blind, randomized, sham-controlled pilot trial evaluated therapeutic plasma exchange using a gravity-driven crossflow microfiltration system (HemoClear) in 18 adult outpatients with Long COVID in Suriname: 11 received active plasma filtration and 7 received a sham blood-draw-and-reinfusion procedure. Participants underwent five sessions, with primary outcomes assessed at 90 days. Both groups exhibited substantial, near-identical reductions in fatigue (Chalder Fatigue Scale scores improving from 20 to 10 in active treatment versus 22 to 12 in placebo; p = 0.8770); 9 of 11 active-treatment participants and 5 of 7 sham participants met the clinical responder criterion (>30% fatigue reduction). Secondary functional instruments (SF-36 and Fatigue Assessment Scale) showed concordant null between-group findings, so the marked symptomatic improvements cannot be attributed to plasma clearance and are consistent with non-specific or placebo effects. The study was constrained by
    early termination due to slow recruitment, an unstratified cohort lacking biological marker enrichment, and the explicit exclusion of bedridden or severe ME/CFS patients. Furthermore, the report was published on F1000Research, where articles appear before formal peer review completes, leaving peer-review status unrecorded.'
de:
  title: Randomisierte schein-kontrollierte Plasmapherese-Pilotstudie in Suriname findet keinen Vorteil gegenüber Placebo
  plain_summary: In einer kleinen randomisierten schein-kontrollierten Pilotstudie mit 18 ambulanten Long-COVID-Betroffenen in Suriname zeigten sowohl aktive Plasmafiltration als auch ein Scheinverfahren nahezu identische Besserungen der Fatigue. Die Symptomrückgänge lassen sich daher nicht der Blutwäsche zuschreiben und verdeutlichen, wie stark Placebo- oder Kontexteffekte ausfallen können.
  detail: 'Eine doppelt verblindete, randomisierte, schein-kontrollierte Pilotstudie prüfte den therapeutischen Plasmaaustausch mittels eines schwerkraftbetriebenen Querstrom-Mikrofiltrationssystems (HemoClear) bei 18 erwachsenen ambulanten Patientinnen und Patienten mit Long COVID in Suriname: 11 erhielten eine aktive Plasmafiltration und 7 eine Scheinprozedur mit Blutentnahme und Rückgabe. Alle absolvierten fünf Sitzungen, die primären Endpunkte wurden nach 90 Tagen erhoben. Beide Gruppen zeigten deutliche, nahezu identische Rückgänge der Fatigue (Chalder Fatigue Scale von 20 auf 10 in der aktiven Gruppe gegenüber 22 auf 12 in der Placebogruppe; p = 0,8770); 9 von 11 aktiv Behandelten und 5 von 7 Scheinbehandelten erfüllten das Ansprechkriterium (>30 % Fatigue-Reduktion). Sekundäre Funktionsskalen (SF-36 und Fatigue Assessment Scale) bestätigten übereinstimmende Null-Unterschiede zwischen den Gruppen, sodass die markanten Besserungen nicht der Plasmareinigung zugeschrieben werden können
    und mit unspezifischen oder Placeboeffekten vereinbar sind. Die Studie war durch vorzeitigen Abbruch wegen langsamer Rekrutierung, eine unstratifizierte Kohorte ohne Biomarker-Anreicherung und den expliziten Ausschluss bettlägeriger oder schwerer ME/CFS-Betroffener begrenzt. Zudem erschien der Bericht auf F1000Research, wo Artikel vor Abschluss des formalen Peer-Reviews veröffentlicht werden, sodass der Begutachtungsstatus offen bleibt.'
