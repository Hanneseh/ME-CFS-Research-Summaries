en:
  title: Viral Persistence & Reactivation
  subtitle: A living thread on persistent viral reservoirs, herpesvirus reactivations, endogenous retrovirus expression, and viral-induced autoimmunity in ME/CFS and Long COVID.
  evidence_label: early clinical and mechanistic validation
  plain_summary: Researchers are investigating whether lingering virus fragments in deep tissues or the reawakening of dormant viruses like Epstein-Barr virus (EBV) keep the immune system chronically triggered in ME/CFS and Long COVID. Large studies show that dormant viruses frequently reactivate during acute COVID-19 and that viral proteins can persist in gut tissue or trigger cross-reactive antibodies in some patients. Still, it is not yet proven whether persistent viruses are the main cause of chronic symptoms or whether targeted antivirals and antibodies can reliably relieve them.
  takeaway: 'Persistent viral reservoirs and the reactivation of latent pathogens represent a primary biological model for the development and maintenance of Myalgic Encephalomyelitis/Chronic Fatigue Syndrome (ME/CFS) and Long COVID. In this model, initial infections—such as acute COVID-19 or infectious mononucleosis—disturb immune homeostasis, leading to the failure of T-cell surveillance and the subsequent reactivation of dormant herpesviruses (such as Epstein-Barr virus, HHV-6, and varicella-zoster virus), the expression of ancient human endogenous retroviruses (HERVs), or the long-term persistence of SARS-CoV-2 in deep tissues. These persistent pathogens and their proteins act as chronic antigens, driving persistent systemic inflammation, neuroinflammation, and metabolic exhaustion.


    Recent research has expanded from single-center observations to large-scale multi-viral mapping across more than 1,000 patients. A peer-reviewed IMPACC cohort study reports that acute infection is associated with reactivation across multiple DNA virus families (including Herpesviridae and Anelloviridae) even in immunocompetent hosts. Separately, a bioRxiv preprint reports SARS-CoV-2 RNA and proteins in colorectal mucosal tissue from a subset of people with Long COVID, alongside local myeloid inflammation and suppressed cytotoxic clearance pathways that were not apparent in circulating blood. Further mechanistic evidence indicates that EBV reactivation can metabolically reprogram host B cells into autoimmune-like phenotypes that stimulate bystander T cells and correlate with convalescent autoantibodies, complementing models of abortive lytic replication and molecular mimicry.


    While these multi-viral landscapes and deep-tissue persistence signatures are biologically plausible, significant uncertainties remain. The presence of viral persistence in tissue subsets or elevated post-viral autoantibody titers does not prove a singular causal relationship with ME/CFS and Long COVID symptoms, as most large datasets remain observational and derived from acute COVID-19 cohorts. Furthermore, targeted therapies—such as anti-CD80 monoclonal antibodies, HERV-targeting agents, or pathogen-clearing antivirals—require validation in double-blind, placebo-controlled clinical trials to establish therapeutic efficacy and clinical safety.'
  why_it_matters: Mapping viral persistence and reactivation provides a concrete, biologically measurable link between the acute infectious onset of ME/CFS and Long COVID and their chronic, multi-system symptoms. By shifting the focus from generalized systemic distress to specific viral antigens (such as herpesvirus dUTPase, HERV-K/W proteins, and SARS-CoV-2 spike proteins), research defines clear, drugable targets. Identifying these pathways explains why standard antiviral courses or single-virus assessments often fail to capture the disease process, since pathobiology may involve multi-viral cooperation, abortive replication cycles, or persistent low-level reservoirs in sanctuary tissues. These findings guide the development of next-generation therapeutic trials, including selective B-cell depletion, HERV-targeting monoclonal antibodies, and metabolic restoration protocols.
  state_of_evidence:
  - status: established
    label: Established
    items:
    - Acute infections like Epstein-Barr virus (EBV) and SARS-CoV-2 can trigger chronic, post-infectious fatigue syndromes. Latent DNA viruses (including Herpesviridae such as EBV, CMV, HHV-6, and Anelloviridae) reside long-term in human tissues and reactivate at cohort scale (documented in nearly 50% of hospitalized patients during acute COVID-19) in immunocompetent individuals during acute inflammatory stress, though statistical links between convalescent viral activity and chronic fatigue symptoms remain correlational.
  - status: plausible
    label: Plausible but early
    items:
    - Epstein-Barr virus uses the membrane protein R9AP as a universal receptor to infect both B cells and epithelial cells. Acute COVID-19 induces senescent phenotypes in CD8+ T cells, impairing host control and facilitating EBV reactivation. Persistent viral activity in ME/CFS and Long COVID involves abortive lytic reactivation, where viruses express immunogenic proteins like dUTPase without completing full replication. Molecular mimicry between herpesvirus proteins (like EBNA1) and central nervous system proteins (like Synapsin 1) drives cross-reactive autoantibodies that correlate with fatigue and autonomic symptoms. Reactivation of human endogenous retroviruses (HERVs), particularly HERV-K and HERV-W, occurs in response to environmental triggers, producing persistent antigens that drive neuroinflammation. Long COVID patients harbor persistently expanded cytolytic CD8+ T cells recognizing both SARS-CoV-2 and reactivated herpesvirus (EBV/CMV) epitopes, indicating ongoing antigen-driven
      immune activation rather than passive immune memory. Direct SARS-CoV-2 persistence occurs in colorectal tissue mucosal sanctuaries months to years post-infection alongside local myeloid inflammation and suppressed cytotoxic clearance pathways, demonstrating that tissue-compartment sampling detects persistence and immune dysregulation that peripheral blood assays miss. EBV reactivation during acute viral infection metabolically and transcriptionally reprograms B cells toward an autoimmune-like phenotype that correlates with post-acute autoantibody elevation and Long COVID symptoms. Preclinical K18-hACE2 mouse models demonstrate sustained neuroinflammation, microglial activation, and behavioral deficits persisting weeks after SARS-CoV-2 clearance, though translation to human ME/CFS remains unvalidated.
  - status: not_established
    label: Not established
    items:
    - Clear causal proof that persistent SARS-CoV-2 reservoirs or herpesvirus reactivations are the sole or primary drivers of ME/CFS and Long COVID symptoms. Clinical efficacy of targeted therapeutic candidates—such as anti-CD80 antibodies, valganciclovir, temelimab, or GLP-1 receptor agonists—in treating post-viral fatigue. Whether persistent cytolytic CD8+ T-cell expansion in Long COVID represents pathological tissue damage or beneficial viral containment.
  - status: limitations
    label: Key limitations
    items:
    - Most clinical cohort studies linking viral reactivation or HERV expression to symptoms are small, single-center, or restricted by gender, limiting their generalizability. Large multi-viral reactivation cohorts are primarily derived from acute hospitalized COVID-19 patients rather than non-COVID ME/CFS cohorts. Computational predictions of molecular mimicry require extensive validation in live biological systems. Identifying low-level tissue reservoirs remains technologically challenging, as blood-based assays may not reflect localized sanctuary sites in the gut, brain, or bone marrow. Peripheral blood T-cell profiling may not capture tissue-resident immune responses inside organ reservoirs. Preclinical rodent models of post-viral neurological sequelae require translational validation in human cohorts.
  open_questions:
  - What are the molecular mechanisms by which different variants of SARS-CoV-2 (or other viruses) trigger the reactivation of specific herpesviruses?
  - To what extent do persistent low-level viral reservoirs in deep tissues (e.g., gut mucosal tissues) sustain systemic immune dysregulation compared to abortive replication of herpesviruses?
  - Can therapeutic targeting of the universal EBV receptor R9AP clear established latent EBV infection, or is it limited to preventing new infections?
  - What are the long-term clinical safety and efficacy profiles of anti-CD80 chimeric monoclonal antibodies when used to eliminate EBV-transformed B-cell pools in autoimmune/post-viral patient cohorts?
  - Do the persistent cytolytic CD8+ T cells targeting viral epitopes in Long COVID represent pathological tissue damage or beneficial viral containment, and do equivalent T-cell signatures characterize classic post-infectious ME/CFS?
  - How does acute EBV-driven metabolic reprogramming of B cells interact with host genetic susceptibility to sustain chronic autoantibody production and post-viral illness?
de:
  title: Viruspersistenz & Reaktivierung
  subtitle: Ein fortlaufender Überblick zu anhaltenden Virusreservoirs, Herpesvirus-Reaktivierungen, der Aktivierung endogener Retroviren sowie virusinduzierter Autoimmunität bei ME/CFS und Long COVID.
  evidence_label: Frühe klinische und mechanistische Validierung
  plain_summary: Forschende prüfen, ob versteckte Virusreste in tiefen Geweben oder wiedererwachte Schlafviren wie das Epstein-Barr-Virus (EBV) das Immunsystem bei ME/CFS und Long COVID dauerhaft in Alarmbereitschaft halten. Große Studien zeigen zwar, dass ruhende Viren während akuter Infektionen häufig reaktivieren und Virusbestandteile bei einem Teil der Betroffenen im Darmgewebe nachweisbar sind oder kreuzreaktive Antikörper anstoßen. Ob dies jedoch tatsächlich die Hauptursache der Beschwerden ist und ob gezielte antivirale Medikamente oder Antikörper zuverlässig helfen, ist bislang nicht bewiesen.
  takeaway: 'Anhaltende Virusreservoirs und die Reaktivierung ruhender Erreger gehören zu den zentralen biologischen Erklärungsmodellen für die Entstehung und Aufrechterhaltung von ME/CFS und Long COVID. In diesem Modell stört eine Erstinfektion – etwa akutes COVID-19 oder Pfeiffersches Drüsenfieber – das Immungleichgewicht, sodass die T-Zell-Kontrolle versagt und schlafende Herpesviren (wie Epstein-Barr-Virus, HHV-6 oder Varizella-Zoster-Virus) wiedererwachen, alte humane endogene Retroviren (HERVs) abgelesen werden oder SARS-CoV-2 langfristig in tiefen Geweben verbleibt. Diese fortbestehenden Erreger und ihre Proteine wirken als chronische Antigene und treiben anhaltende systemische Entzündung, Neuroinflammation und zelluläre Erschöpfung voran.


    Neuere Arbeiten haben den Blick von Einzelzentrums-Beobachtungen auf groß angelegte Multi-Virus-Analysen mit über 1.000 Patientinnen und Patienten erweitert. Eine begutachtete Studie der IMPACC-Kohorte zeigt, dass eine akute Infektion selbst bei immunkompetenten Menschen mit einer Reaktivierung mehrerer DNA-Virusfamilien (darunter Herpesviridae und Anelloviridae) einhergeht. Unabhängig davon berichtet ein bioRxiv-Preprint über SARS-CoV-2-RNA und -Proteine in der Darmschleimhaut eines Teils der Long-COVID-Betroffenen – begleitet von lokaler myeloider Entzündung und gedrosselten zytotoxischen Abwehrmechanismen, die im zirkulierenden Blut nicht sichtbar waren. Weitere mechanistische Daten deuten darauf hin, dass eine EBV-Reaktivierung B-Zellen des Wirts stoffwechselmäßig in einen autoimmunähnlichen Zustand umprogrammiert, der benachbarte T-Zellen anregt und mit Autoantikörpern in der Erholungsphase zusammenhängt; dies ergänzt Modelle einer unvollständigen („abortiven“) lytischen Replikation
    und molekularen Mimikry.


    Obwohl diese Multi-Virus-Muster und Gewebebefunde biologisch plausibel sind, bleiben erhebliche Unsicherheiten bestehen. Der Nachweis von Virusresten in Gewebe-Untergruppen oder erhöhten Autoantikörpern nach einer Infektion beweist noch keine alleinige Ursache für ME/CFS- und Long-COVID-Symptome, da die meisten großen Datensätze beobachtend sind und aus akuten COVID-19-Kohorten stammen. Zudem müssen gezielte Therapien – etwa Anti-CD80-Antikörper, gegen HERVs gerichtete Wirkstoffe oder Virostatika zur Erregerbeseitigung – erst in doppelblinden, placebokontrollierten klinischen Studien ihre Wirksamkeit und Sicherheit unter Beweis stellen.'
  why_it_matters: 'Die Erforschung von Viruspersistenz und -reaktivierung schlägt eine konkret messbare biologische Brücke zwischen dem infektiösen Beginn von ME/CFS und Long COVID und den chronischen Beschwerden in mehreren Organsystemen. Indem der Fokus von unspezifischer Belastung auf definierte Virusantigene (wie Herpesvirus-dUTPase, HERV-K/W-Proteine und SARS-CoV-2-Spike-Proteine) gelenkt wird, entstehen konkrete therapeutische Angriffspunkte. Diese Signalwege erklären auch, warum herkömmliche Standard-Virostatika oder Tests auf nur ein einzelnes Virus oft ins Leere greifen: Dem Krankheitsprozess könnten ein Zusammenspiel mehrerer Viren, unvollständige Vermehrungszyklen oder versteckte Reservoirs in schwer zugänglichen Geweben zugrunde liegen. Solche Erkenntnisse leiten die Entwicklung neuer klinischer Studien – etwa zu selektiver B-Zell-Depletion, gegen HERVs gerichteten monoklonalen Antikörpern und stoffwechselunterstützenden Konzepten.'
  state_of_evidence:
  - status: established
    label: Gesichert
    items:
    - Akute Infektionen wie mit dem Epstein-Barr-Virus (EBV) oder SARS-CoV-2 können chronische postinfektiöse Erschöpfungssyndrome auslösen. Latente DNA-Viren (darunter Herpesviridae wie EBV, CMV, HHV-6 sowie Anelloviridae) verbleiben dauerhaft im menschlichen Gewebe und reaktivieren bei akutem Entzündungsstress auf Kohortenebene auch bei immunkompetenten Menschen (bei fast 50 % der hospitalisierten Patientinnen und Patienten während akuten COVID-19), wobei statistische Zusammenhänge zwischen späterer Virusaktivität und chronischer Erschöpfung bislang korrelativ bleiben.
  - status: plausible
    label: Plausibel, aber noch früh
    items:
    - Das Epstein-Barr-Virus nutzt das Membranprotein R9AP als universellen Rezeptor, um sowohl B-Zellen als auch Epithelzellen zu infizieren. Akutes COVID-19 versetzt CD8+-T-Zellen in einen alternden (seneszenten) Zustand, was die Immunabwehr schwächt und eine EBV-Reaktivierung begünstigt. Anhaltende Virusaktivität bei ME/CFS und Long COVID kann über eine abortive lytische Reaktivierung ablaufen, bei der Viren entzündungsfördernde Proteine wie dUTPase bilden, ohne sich vollständig zu vermehren. Molekulare Mimikry zwischen Herpesvirus-Proteinen (wie EBNA1) und Proteinen des zentralen Nervensystems (wie Synapsin 1) fördert kreuzreaktive Autoantikörper, die mit Erschöpfung und autonomen Symptomen zusammenhängen. Eine Reaktivierung humaner endogener Retroviren (HERVs), vor allem HERV-K und HERV-W, entsteht unter Umwelt- und Infektreizen und liefert dauerhafte Antigene für Neuroinflammation. Long-COVID-Betroffene weisen dauerhaft vermehrte zytolytische CD8+-T-Zellen auf, die sowohl SARS-CoV-2-
      als auch reaktivierte Herpesvirus-Epitope (EBV/CMV) erkennen – ein Hinweis auf anhaltende Antigen-Stimulation statt bloßer Immunitätserinnerung. Eine direkte SARS-CoV-2-Persistenz in der Dickdarmschleimhaut Monate bis Jahre nach der Infektion geht mit lokaler myeloider Entzündung und gedrosselter zytotoxischer Abwehr einher, was zeigt, dass Gewebeproben Prozesse erfassen, die im Blut verborgen bleiben. Eine EBV-Reaktivierung während akuter Infektion programmiert B-Zellen stoffwechselmäßig und transkriptionell in einen autoimmunähnlichen Zustand um, der mit erhöhten Autoantikörpern und Long-COVID-Symptomen korreliert. Präklinische K18-hACE2-Mausmodelle zeigen anhaltende Neuroinflammation, Mikroglia-Aktivierung und Verhaltensänderungen Wochen nach Virusclearance, doch die Übertragbarkeit auf menschliches ME/CFS ist unbestätigt.
  - status: not_established
    label: Nicht gesichert
    items:
    - Ein klarer Kausalbeweis, dass anhaltende SARS-CoV-2-Reservoirs oder Herpesvirus-Reaktivierungen die alleinige oder wichtigste Ursache von ME/CFS- und Long-COVID-Symptomen sind. Die klinische Wirksamkeit gezielter Therapiekandidaten – wie Anti-CD80-Antikörper, Valganciclovir, Temelimab oder GLP-1-Rezeptor-Agonisten – bei postviraler Erschöpfung. Ob die dauerhafte Vermehrung zytolytischer CD8+-T-Zellen bei Long COVID eher zu Gewebeschäden führt oder eine nützliche Viruskontrolle widerspiegelt.
  - status: limitations
    label: Wichtige Einschränkungen
    items:
    - Die meisten klinischen Studien, die Virusreaktivierung oder HERV-Aktivität mit Symptomen verknüpfen, sind klein, auf ein Zentrum beschränkt oder auf ein Geschlecht begrenzt, was die Übertragbarkeit einschränkt. Große Kohorten zur Multi-Virus-Reaktivierung stammen überwiegend von hospitalisierten akuten COVID-19-Patienten und nicht aus klassischen Nicht-COVID-ME/CFS-Kohorten. Computergestützte Vorhersagen zur molekularen Mimikry müssen erst umfassend in lebenden biologischen Systemen bestätigt werden. Der Nachweis kleiner Gewebereservoirs bleibt technisch schwierig, da Bluttests lokale Nischen in Darm, Gehirn oder Knochenmark möglicherweise nicht abbilden. T-Zell-Analysen im peripheren Blut erfassen gewebsständige Immunantworten in Organreservoirs oft nicht. Präklinische Nagetiermodelle postviraler Nervenschäden müssen erst in menschlichen Kohorten validiert werden.
  open_questions:
  - Über welche molekularen Mechanismen lösen verschiedene Varianten von SARS-CoV-2 (oder andere Viren) jeweils die Reaktivierung bestimmter Herpesviren aus?
  - In welchem Ausmaß unterhalten anhaltende Virusreservoirs mit niedriger Aktivität in tiefen Geweben (z. B. Darmschleimhaut) die systemische Immundysregulation im Vergleich zu einer unvollständigen Replikation von Herpesviren?
  - Lässt sich durch ein gezieltes Blockieren des universellen EBV-Rezeptors R9AP auch eine bereits bestehende latente EBV-Infektion beseitigen, oder verhindert dies nur Neuinfektionen?
  - Wie sind langfristige klinische Sicherheit und Wirksamkeit chimärer monoklonaler Anti-CD80-Antikörper zur gezielten Beseitigung EBV-veränderter B-Zellen bei autoimmunen oder postviralen Patientenkohorten?
  - Stehen die anhaltend aktiven zytolytischen CD8+-T-Zellen gegen Virusepitope bei Long COVID für schädliche Gewebeangriffe oder für eine hilfreiche Eindämmung der Viren, und finden sich vergleichbare T-Zell-Signaturen auch beim klassischen postinfektiösen ME/CFS?
  - Wie greifen die akute EBV-bedingte Stoffwechsel-Umprogrammierung von B-Zellen und eine genetische Veranlagung des Wirts ineinander, um chronische Autoantikörperbildung und postvirale Erkrankungen aufrechtzuerhalten?
