en:
  title: Norwegian inpatient unit reports 50% improvement rate in severely ill patients
  plain_summary: Half of 24 severely ill ME/CFS patients staying at a specialized low-stimulation Norwegian care unit improved measurably, especially those who had been sick for fewer years. Because there was no control group and patients used different optional supplements and low-dose medications, the report cannot isolate which specific factors drove the gains.
  detail: Saugstad et al. published a retrospective review of the first three years of the Røysumtunet ME unit in Norway, the country's first dedicated inpatient facility for severely and very severely ill ME/CFS patients. Twenty-four patients who had stayed for at least three months between June 2021 and June 2024 were included; all met NICE severity criteria for severe or very severe disease. Half of the patients showed measurable improvement during their stay, with seven (29%) moving up at least one NICE severity level and a further five showing within-level gains such as improved sensory tolerance or slightly expanded daily activity. Improvement was strongly associated with shorter illness duration — improvers had been ill for a mean of 2.3 years versus 6.7 years for non-improvers — which raises the question of whether early access to adapted care might prevent some of the accumulating severity seen in longer-duration patients. The unit also offered an optional multi-supplement and low-dose
    medication programme including thiamine, NADH, CoQ10, vitamin B12, low-dose naltrexone, and low-dose aripiprazole, but the study design does not allow any conclusions about what those contributed. The main lesson the authors draw is that a safe, low-stimulation environment where PEM is actively managed appears to be a meaningful intervention in its own right.
de:
  title: Norwegische Spezialstation meldet Besserungsrate von 50 % bei schwer erkrankten Patientinnen und Patienten
  plain_summary: Die Hälfte von 24 schwer an ME/CFS erkrankten Menschen verbesserte sich während des Aufenthalts auf einer reizarmen norwegischen Spezialstation messbar – vor allem bei kürzerer Krankheitsdauer. Da eine Kontrollgruppe fehlte und zusätzlich optionale Medikamente sowie Nahrungsergänzungsmittel genutzt wurden, lässt sich nicht genau trennen, welche Einzelmaßnahme den Ausschlag gab.
  detail: 'Saugstad et al. veröffentlichten eine retrospektive Auswertung der ersten drei Jahre der norwegischen ME-Station Røysumtunet, der ersten spezialisierten stationären Einrichtung des Landes für Menschen mit schwerem und sehr schwerem ME/CFS. Eingeschlossen wurden 24 Patientinnen und Patienten, die zwischen Juni 2021 und Juni 2024 mindestens drei Monate dort blieben; alle erfüllten die NICE-Kriterien für eine schwere oder sehr schwere Erkrankung. Die Hälfte der Betroffenen zeigte während des Aufenthalts eine messbare Besserung: Sieben (29 %) verbesserten sich um mindestens eine NICE-Schweregradstufe, weitere fünf erreichten Fortschritte innerhalb ihrer Stufe wie bessere Reiztoleranz oder leicht erweiterte Alltagsaktivität. Eine Besserung hing stark mit einer kürzeren Krankheitsdauer zusammen – Gebesserte waren im Schnitt 2,3 Jahre krank gegenüber 6,7 Jahren bei Nicht-Gebesserten –, was die Frage aufwirft, ob ein früher Zugang zu angepasster Versorgung eine zunehmende Verschlechterung
    bei längeren Verläufen teilweise verhindern könnte. Die Einrichtung bot zudem ein optionales Programm aus mehreren Nahrungsergänzungsmitteln und niedrig dosierten Medikamenten an (darunter Thiamin, NADH, CoQ10, Vitamin B12, niedrig dosiertes Naltrexon und niedrig dosiertes Aripiprazol), doch erlaubt das Studiendesign keine Aussagen über deren jeweiligen Beitrag. Als wichtigste Erkenntnis betonen die Autorinnen und Autoren, dass ein sicheres, reizarmes Umfeld mit aktivem PEM-Management offenbar bereits für sich genommen eine wirksame Maßnahme darstellt.'
