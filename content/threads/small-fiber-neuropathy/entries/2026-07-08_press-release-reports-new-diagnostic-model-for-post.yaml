en:
  title: Press release reports new diagnostic model for post-COVID eye problems
  plain_summary: A university press release reports that researchers built a new diagnostic model to spot lingering eye abnormalities after even mild COVID-19. Because no peer-reviewed paper, sample size, or test details were shared yet, this remains a very preliminary announcement.
  detail: Linköping University in Sweden issued a press release reporting that even mild cases of COVID-19 can cause severe and long-lasting eye problems. The study highlights that the resulting abnormal eye behavior is difficult to detect using standard clinical methods. To address this gap, researchers developed a new diagnostic model specifically designed to detect these COVID-related visual issues. However, because this information is based solely on a brief university news release rather than a peer-reviewed scientific paper, specific details of the diagnostic model, study design, and sample size are not provided, representing a limited level of evidence.
de:
  title: Pressemitteilung berichtet über neues Diagnosemodell für Post-COVID-Augenprobleme
  plain_summary: Eine Universitätspressemitteilung berichtet über ein neues Diagnosemodell zur Erkennung anhaltender Augenveränderungen selbst nach mildem COVID-19. Da bislang weder eine begutachtete Publikation noch Fallzahlen oder Testdetails vorliegen, bleibt diese Meldung ein sehr vorläufiger Hinweis.
  detail: Die Universität Linköping in Schweden veröffentlichte eine Pressemitteilung, wonach selbst milde COVID-19-Verläufe schwere und lang anhaltende Augenprobleme verursachen können. Die Mitteilung hebt hervor, dass die entstehenden Auffälligkeiten der Augenfunktion mit klinischen Standardmethoden schwer zu erkennen sind. Um diese Lücke zu schließen, entwickelten Forschende ein neues Diagnosemodell, das gezielt auf den Nachweis solcher COVID-bedingten Sehstörungen ausgerichtet ist. Da diese Informationen jedoch ausschließlich auf einer kurzen Universitäts-Pressemitteilung statt auf einer begutachteten Fachpublikation beruhen, fehlen konkrete Angaben zu Diagnosemodell, Studiendesign und Stichprobengröße, sodass die Aussagekraft bislang stark begrenzt bleibt.
