en:
  title: Theoretical model links symptoms to excitatory-inhibitory neurotransmitter imbalance
  plain_summary: A non-peer-reviewed preprint review proposes that an excess of 'go' brain chemicals over calming ones could explain the 'wired but tired' feeling, sensory sensitivity, and muscle strain in ME/CFS. Because brain and muscle levels of these chemicals are rarely measured directly in patients, the idea remains a theoretical guide for future trials.
  detail: A neurobiological review proposed that a fundamental shift toward excitatory neurotransmission (glutamate, noradrenaline) over inhibitory signaling (GABA, serotonin) drives the "wired but tired" state, sensory hypersensitivity, and muscle dysfunction in ME/CFS. This imbalance is hypothesized to promote central brain overactivation and, in the periphery, lead to skeletal muscle hyperexcitability, calcium overload, and mitochondrial dysfunction. The framework suggests that restoring neurotransmitter equilibrium using agents like low-dose naltrexone, pyridostigmine, dextromethorphan, or memantine represents a logical therapeutic approach. However, direct measurement of these neurotransmitter levels in the brains and muscles of patients is limited, and high inter-individual variability remains a challenge for standardized treatment.
de:
  title: Theoretisches Modell verknüpft Symptome mit einem Ungleichgewicht erregender und hemmender Neurotransmitter
  plain_summary: Ein noch nicht begutachtetes Preprint-Review schlägt vor, dass ein Übergewicht aktivierender Botenstoffe gegenüber dämpfenden Signalen das Gefühl von „überdreht und erschöpft“, Reizempfindlichkeit und Muskelerschöpfung erklärt. Da direkte Messungen dieser Botenstoffe bei Betroffenen kaum vorliegen, bleibt dies ein theoretischer Ansatz für künftige Studien.
  detail: Eine neurobiologische Übersichtsarbeit schlug vor, dass eine grundlegende Verschiebung hin zu erregender Neurotransmission (Glutamat, Noradrenalin) gegenüber hemmenden Signalen (GABA, Serotonin) den Zustand „wired but tired“, die sensorische Überempfindlichkeit und die Muskeldysfunktion bei ME/CFS antreibt. Hypothetisch fördert dieses Ungleichgewicht eine zentrale Überaktivierung des Gehirns und führt in der Peripherie zu einer Übererregbarkeit der Skelettmuskulatur, Kalziumüberladung und mitochondrialer Dysfunktion. Das Rahmenmodell legt nahe, dass die Wiederherstellung des Neurotransmitter-Gleichgewichts mit Wirkstoffen wie niedrig dosiertem Naltrexon, Pyridostigmin, Dextromethorphan oder Memantin einen logischen Therapieansatz darstellt. Direkte Messungen dieser Neurotransmitterspiegel in Gehirn und Muskulatur von Betroffenen sind jedoch begrenzt, und große Unterschiede zwischen einzelnen Personen erschweren eine standardisierte Behandlung.
