en:
  title: Inappropriately low vasopressin secretion mimics central diabetes insipidus
  plain_summary: In a fluid-deprivation test of 111 ME/CFS patients, 82% had undetectable levels of the water-retaining hormone vasopressin despite rising blood concentration, even though brain scans looked normal. This helps explain low blood volume and frequent thirst, though vasopressin drugs have not yet been proven in trials.
  detail: An observational study of 111 ME/CFS patients who underwent a 10-hour fluid deprivation test demonstrated that 82% of patients had plasma vasopressin levels below the limit of detection, despite elevated blood osmolality that would normally trigger hormone release. The absence of structural pituitary or hypothalamic lesions on brain MRIs suggests a functional down-regulation of vasopressin-producing neurons. This chronic deficiency underpins hypovolemia, excessive thirst, frequent urination, and orthostatic intolerance, indicating central endocrine dysregulation of fluid homeostasis. However, the underlying cause of this functional neuronal shut-down remains unknown, and trials of vasopressin analogues are needed to determine if replacement therapy improves cardiovascular stability.
de:
  title: Unangemessen niedrige Vasopressin-Ausschüttung ahmt zentralen Diabetes insipidus nach
  plain_summary: Bei einem 10-stündigen Durstversuch hatten 82 % von 111 ME/CFS-Betroffenen kein nachweisbares wasserbindendes Hormon Vasopressin im Blut, obwohl die Hirn-MRTs strukturell unauffällig waren. Das erklärt niedriges Blutvolumen und starken Durst mit, doch sind Hormontherapien damit noch nicht durch Studien belegt.
  detail: Eine Beobachtungsstudie an 111 ME/CFS-Patientinnen und -Patienten, die sich einem 10-stündigen Flüssigkeitsentzugstest unterzogen, zeigte, dass bei 82 % der Betroffenen die Plasma-Vasopressin-Spiegel unter der Nachweisgrenze lagen – trotz erhöhter Blutosmolalität, die normalerweise eine Hormonausschüttung auslöst. Das Fehlen struktureller Läsionen von Hypophyse oder Hypothalamus in Hirn-MRTs deutet auf eine funktionelle Herunterregulierung Vasopressin-produzierender Neuronen hin. Dieser chronische Mangel liegt Hypovolämie, übermäßigem Durst, häufigem Wasserlassen und orthostatischer Intoleranz zugrunde und weist auf eine zentrale endokrine Fehlregulation des Flüssigkeitshaushalts hin. Die zugrunde liegende Ursache dieser funktionellen neuronalen Drosselung bleibt jedoch unbekannt, und Studien mit Vasopressin-Analoga sind nötig, um zu klären, ob eine Ersatztherapie die Kreislaufstabilität verbessert.
