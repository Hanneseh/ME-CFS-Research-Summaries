en:
  title: Transdisciplinary expert statement establishes clinical guidance for severe ME/CFS home care
  plain_summary: Hermisson and colleagues published detailed consensus guidelines in *Wiener Medizinische Wochenschrift* covering low-stimulation nursing, nutrition, home visits, and caregiver support for severe ME/CFS. While it gives families and visiting clinicians a structured practical framework, it is based on clinical consensus rather than controlled trials.
  detail: Hermisson et al. published a transdisciplinary expert consensus statement in *Wiener Medizinische Wochenschrift* establishing practice-oriented guidelines for home-based management, nursing care, physical therapy adaptation, outreach diagnostics, and palliative care principles in severe and very severe ME/CFS. The panel—comprising medical specialists, nursing scientists, physiotherapists, public health researchers, and patient advocates—structured care protocols specifically tailored around individual exertion thresholds and post-exertional malaise (PEM) prevention. The guidance categorizes practical care dimensions across nutrition, personal hygiene, positioning, sensory mitigation (light and sound reduction), and low-stimulation communication strategies to prevent severe post-exertional crashes during essential daily activities. It further outlines requirements for professional caregiver instruction, family caregiver support, adapted home visits, and the selective application
    of palliative care principles for extremely severe cases. The primary limitation is that these guidelines reflect structured expert consensus and clinical experience rather than evidence from randomized interventional trials. For patients, families, and visiting healthcare professionals, this statement provides an actionable framework to guide home-based care while protecting severely ill patients from exertion-induced deterioration.
de:
  title: Transdisziplinäres Expertenpapier legt klinische Leitlinien für die häusliche Versorgung bei schwerem ME/CFS vor
  plain_summary: Hermisson und Kolleginnen veröffentlichten in der *Wiener Medizinischen Wochenschrift* detaillierte Konsens-Empfehlungen zu reizarmer Pflege, Ernährung, angepassten Hausbesuchen und Entlastung Angehöriger bei schwerem ME/CFS. Sie bieten Familien und mobilen Diensten einen praxisnahen Handlungsrahmen, stützen sich aber auf klinischen Konsens statt auf kontrollierte Studien.
  detail: Hermisson et al. veröffentlichten in der *Wiener Medizinischen Wochenschrift* ein transdisziplinäres Expertenkonsens-Papier mit praxisorientierten Leitlinien für das häusliche Management, die pflegerische Versorgung, angepasste Physiotherapie, aufsuchende Diagnostik und Palliativprinzipien bei schwerem und sehr schwerem ME/CFS. Das Gremium aus Fachärztinnen, Pflegewissenschaft, Physiotherapie, Public Health und Patientenvertretung richtete die Versorgungsprotokolle konsequent an individuellen Belastungsgrenzen und der Vermeidung von Post-Exertional Malaise (PEM) aus. Die Empfehlungen gliedern praktische Versorgungsbereiche nach Ernährung, Körperpflege, Lagerung, Reizreduktion (Licht- und Lärmabschirmung) sowie reizarmen Kommunikationsstrategien, um schwere Einbrüche bei unverzichtbaren Alltagsverrichtungen zu verhindern. Zudem formulieren sie Anforderungen an die Schulung professioneller Pflegekräfte, die Unterstützung pflegender Angehöriger, angepasste Hausbesuche und die gezielte
    Anwendung von Palliativversorgung bei extrem schweren Verläufen. Die wesentliche Einschränkung besteht darin, dass diese Leitlinien strukturierten Expertenkonsens und klinische Erfahrung widerspiegeln und keine Evidenz aus randomisierten Interventionsstudien darstellen. Für Betroffene, Familien und aufsuchende Fachkräfte bietet diese Stellungnahme dennoch einen konkreten Handlungsrahmen, um die Versorgung zu Hause so zu gestalten, dass schwer erkrankte Menschen vor belastungsbedingter Verschlechterung geschützt bleiben.
