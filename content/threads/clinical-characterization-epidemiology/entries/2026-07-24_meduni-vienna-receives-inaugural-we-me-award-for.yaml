en:
  title: MedUni Vienna receives inaugural WE&ME Award for mechanistic ME/CFS endotype project
  plain_summary: The Medical University of Vienna won a €450,000 four-year grant starting September 2026 to link clinical symptom profiles with DecodeME genetic scores to map ME/CFS subtypes. It is a funding announcement with no findings yet.
  detail: The Medical University of Vienna announced the receipt of the inaugural €450,000 WE&ME Award, funded by the WE&ME Foundation through the Austrian Science Fund (FWF) alpha+ Foundation, for an ME/CFS research initiative. The four-year project, titled "Mechanistic Endotypes in ME/CFS" and led by Dr. Matthias Wielscher and Prof. Kathryn Hoffmann, officially commences on September 1, 2026. The initiative aims to integrate comprehensive clinical symptom phenotyping with genetic mechanism scores derived from the large UK DecodeME cohort to identify distinct biological patient endotypes. By mapping biological subgroups, the project seeks to resolve clinical heterogeneity and lay the groundwork for targeted trial stratification and individualized therapies. As a research infrastructure and funding announcement, no empirical biological or clinical trial results are yet available, and candidate genomic subtyping models will require prospective validation.
de:
  title: MedUni Wien erhält ersten WE&ME Award für Projekt zu mechanistischen ME/CFS-Endotypen
  plain_summary: Die Medizinische Universität Wien hat eine vierjährige Förderung über 450.000 Euro ab September 2026 erhalten, um klinische Symptomprofile mit genetischen Scores aus DecodeME zur Suche nach ME/CFS-Untergruppen zu verknüpfen. Es handelt sich um eine Förderankündigung ohne bisherige Ergebnisse.
  detail: Die Medizinische Universität Wien gab den Erhalt des ersten, mit 450.000 Euro dotierten WE&ME Award bekannt, finanziert von der WE&ME Foundation über die alpha+ Stiftung des Österreichischen Wissenschaftsfonds (FWF). Das vierjährige Projekt „Mechanistic Endotypes in ME/CFS“ unter Leitung von Dr. Matthias Wielscher und Prof. Kathryn Hoffmann startet offiziell am 1. September 2026. Ziel der Initiative ist es, umfassende klinische Symptomphänotypisierung mit genetischen Mechanismus-Scores aus der großen britischen DecodeME-Kohorte zu verknüpfen, um abgrenzbare biologische Patienten-Endotypen zu identifizieren. Durch die Kartierung biologischer Untergruppen soll die klinische Heterogenität aufgelöst und der Grundstein für gezielte Studienstratifizierung und individualisierte Therapien gelegt werden. Als Förder- und Infrastrukturankündigung liegen noch keine empirischen biologischen oder klinischen Ergebnisse vor, und künftige genomische Subtypisierungsmodelle müssen prospektiv validiert
    werden.
