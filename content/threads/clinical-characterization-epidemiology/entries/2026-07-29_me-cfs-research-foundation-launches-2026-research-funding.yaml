en:
  title: ME/CFS Research Foundation launches 2026 research funding program
  plain_summary: The ME/CFS Research Foundation opened its 2026 grant call to fund biomedical projects on mechanisms, biomarkers, and potential therapies. It is a funding announcement with no scientific results yet.
  detail: The ME/CFS Research Foundation announced the official launch of its 2026 research funding cycle, opening grant applications for targeted biomedical research projects. The program focuses on expanding private foundation funding for projects investigating disease mechanisms, objective biomarker validation, and novel therapeutic targets in ME/CFS. By funding multi-center collaborative projects in Germany and internationally, the initiative seeks to bridge financial gaps in public research infrastructure. As an official funding program press release, the document details grant availability and strategic research priorities without reporting scientific data or clinical trial results.
de:
  title: ME/CFS Research Foundation startet Forschungsförderprogramm 2026
  plain_summary: Die ME/CFS Research Foundation hat ihre Ausschreibung 2026 gestartet, um biomedizinische Projekte zu Krankheitsmechanismen, Biomarkern und neuen Therapieansätzen zu fördern. Es handelt sich um eine Förderbekanntmachung ohne eigene Forschungsergebnisse.
  detail: Die ME/CFS Research Foundation gab den offiziellen Start ihres Forschungsförderzyklus 2026 bekannt und eröffnete die Antragsphase für gezielte biomedizinische Projekte. Das Programm zielt darauf ab, private Stiftungsmittel für Vorhaben zu Krankheitsmechanismen, objektiver Biomarker-Validierung und neuen therapeutischen Zielstrukturen bei ME/CFS auszubauen. Durch Förderung multizentrischer Kooperationsprojekte in Deutschland und international soll die Initiative Finanzierungslücken in der öffentlichen Forschungslandschaft schließen. Als offizielle Förderpressemitteilung informiert das Dokument über Ausschreibung und Schwerpunkte, berichtet aber keine wissenschaftlichen Daten oder Studienergebnisse.
