en:
  title: Preprint evaluates two brief patient-informed scales (SoMES and MEOSS) for ME/CFS severity and occupational status
  plain_summary: A medRxiv preprint introduces two short, patient-informed questionnaires—SoMES for overall ME/CFS severity and MEOSS for work and activity capacity—tested in nearly 1,000 adults online. Both scales are early preprint tools that still need peer review and independent validation in clinical cohorts and trials.
  detail: Tyson and Fleming (University of Manchester) co-produced two brief assessment tools from clinical literature and lived experience—the Severity of Myalgic Encephalomyelitis Scale (SoMES) and the Myalgic Encephalomyelitis Occupational Status Scale (MEOSS)—and evaluated them in an online survey of 995 adults with ME/CFS, of whom 579 completed a two-week retest. Participant feedback supported construct validity, and comparisons against the SF-36 Physical Function subscale (SF36-PF) showed moderate-to-good criterion-related validity (SoMES r = 0.663; MEOSS r = 0.472; both p < 0.001) along with significant discriminant validity across scale levels (p = 0.003 to 0.0001). Two-week test-retest reliability measured by weighted kappa was moderate for SoMES (k = 0.53, p < 0.001; minimal detectable difference 1.6) and excellent for MEOSS (k = 0.76, p < 0.001; minimal detectable difference 1.4). As a non-peer-reviewed preprint based on a self-selected online adult sample, the findings require independent external validation across clinician-diagnosed cohorts and longitudinal trials before routine adoption. Furthermore, the moderate retest agreement for SoMES may reflect genuine short-term symptom fluctuation or measurement noise, and online two-wave surveys generally under-represent severely ill or bedbound patients.
de:
  title: Preprint prüft zwei kurze, patienteninformierte Skalen (SoMES und MEOSS) zu Schweregrad und Erwerbsstatus bei ME/CFS
  plain_summary: Ein medRxiv-Preprint stellt zwei kurze, gemeinsam mit Betroffenen entwickelte Fragebögen vor – SoMES für den ME/CFS-Schweregrad und MEOSS für den Berufs- und Aktivitätsstatus –, die online bei fast 1.000 Erwachsenen getestet wurden. Beide Instrumente sind frühe Preprint-Entwürfe und benötigen noch Peer-Review sowie eine unabhängige Prüfung in klinischen Kohorten und Studien.
  detail: Tyson und Fleming (University of Manchester) entwickelten auf Basis von Fachliteratur und Betroffenenerfahrung zwei kurze Messinstrumente – die Severity of Myalgic Encephalomyelitis Scale (SoMES) und die Myalgic Encephalomyelitis Occupational Status Scale (MEOSS) – und prüften sie in einer Online-Befragung mit 995 Erwachsenen mit ME/CFS, von denen 579 die Wiederholungsbefragung nach zwei Wochen ausfüllten. Rückmeldungen der Teilnehmenden stützten die Konstruktvalidität, und Vergleiche mit der Skala für körperliche Funktionsfähigkeit des SF-36 (SF36-PF) zeigten eine moderate bis gute Kriteriumsvalidität (SoMES r = 0,663; MEOSS r = 0,472; jeweils p < 0,001) sowie signifikante Unterschiede zwischen den Skalenstufen (p = 0,003 bis 0,0001). Die Test-Retest-Reliabilität über zwei Wochen (gewichtetes Kappa) war für SoMES moderat (k = 0,53; p < 0,001; kleinste nachweisbare Veränderung 1,6) und für MEOSS sehr gut (k = 0,76; p < 0,001; kleinste nachweisbare Veränderung 1,4). Da es sich um ein noch nicht begutachtetes Preprint aus einer selbstselektierten Online-Stichprobe handelt, steht eine unabhängige externe Validierung in ärztlich diagnostizierten Kohorten und Längsschnittstudien noch aus. Zudem könnte die nur moderate Retest-Übereinstimmung von SoMES sowohl echte kurzfristige Symptomschwankungen als auch Messunschärfe widerspiegeln, und zweistufige Online-Befragungen erfassen schwerstbetroffene oder bettlägerige Menschen erfahrungsgemäß nur eingeschränkt.
