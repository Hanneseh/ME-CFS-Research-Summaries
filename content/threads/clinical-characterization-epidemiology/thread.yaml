en:
  title: Clinical Characterization & Epidemiology
  subtitle: A living thread on ME/CFS case definitions, clinical guidelines, epidemiology, cohort structure, symptom measurement, research infrastructure, and funding developments for ME/CFS and Long COVID.
  evidence_label: established clinical consensus with ongoing refinement
  plain_summary: ME/CFS is widely recognized as a serious, multi-system physical illness defined by lasting exhaustion, unrefreshing sleep, and a delayed worsening of symptoms after minor effort (post-exertional malaise). Large surveys and national registries show heavy daily disability, low employment, and long waits for diagnosis, while newer studies are beginning to map distinct symptom patterns across patients. Even so, there is still no single lab test for ME/CFS, and major new research networks and clinics are only just starting to build better data and care.
  takeaway: |-
    ME/CFS is established as a serious, multi-systemic, biologically grounded illness. Since the 2015 IOM report established a tightened clinical case definition around post-exertional malaise, unrefreshing sleep, and cognitive or orthostatic symptoms, large-scale epidemiology and registry studies have clarified the disease's massive socioeconomic burden and persistent care gaps. In the United States, survey data indicates that 1.5% of adults have received a diagnosis, with the critical caveat that nearly half of those reporting a "past" diagnosis still experience active symptoms and functional impairment. In New Zealand, nationwide registry data documents severe socioeconomic disadvantage, including employment rates under 20% and significant barriers to obtaining disability support services. These challenges are compounded by healthcare fragmentation and "statistical invisibility" due to missing diagnostic codes, as highlighted in service reviews, which obstruct patient tracking and service capacity planning.

    Recent large-scale symptom-clustering and factor analysis work has successfully stratified patients into distinct clinical subgroups. Analysis of the UK DecodeME cohort of over 19,000 participants identified high- and low-symptom-burden subgroups, linking infectious onset to higher long-term severity, though without finding genome-wide genetic predictors. Comparative cohort evidence using a prospectively followed post-mononucleosis arm further indicates that Long COVID functional and symptom burden can fall between operationally defined moderate and severe post-mononucleosis ME/CFS groups, supporting phenotypic overlap across post-viral conditions while distinguishing university-cohort severity labels from bedbound disease. Other factor analyses confirm that patient-reported symptoms group into coherent biological dimensions (brain, autonomic, gut-immune), with sex-stratified models revealing that female sex hormones dynamically modulate immune symptoms (such as flu-like complaints in premenopausal women) but not gastrointestinal pathways. Standardized symptom measurement has also advanced with the Rasch-validated TIMES scale, mapping a severe cumulative multi-system burden where cognitive symptoms are ranked as the most troublesome.

    National research and care infrastructure has grown substantially with new large-scale funding and specialized networks. In Europe, the launching of the €7.5 million DISCOVER-ME consortium aims to standardize biobank protocols across 20+ institutions to validate multi-system biomarkers. In Germany, the BMG-funded PEDNET-LC network has established care pathways and a centralized pediatric registry, complementing childhood cohort data showing that pediatric post-COVID symptom persistence correlates stepwise with initial infection severity. However, therapeutic evidence remains preliminary: the peer-reviewed version of the Cohen Center home-use magnetic-therapy pilot supports feasibility and tolerability but shows no cognitive benefit after false-discovery-rate correction, the Cohen Center antiviral data remain an open-label case series, and a peer-reviewed, non-randomized controlled Charité study found no statistically significant 12-month physical-function difference for integrated multidisciplinary care with inpatient rehabilitation compared with a single specialist consultation. National and regional bodies have also documented care gaps and planned capacity: the German MECFS-R registry final report (724 patients, 54% of its recruitment target, no prognosis analysis possible), Belgium's KCE patient-needs report, the German Leopoldina statement on post-infectious diseases, and Vienna's planned PAIS clinic (staged care from summer 2027, full service from mid-2028). These are plans and descriptions, not outcome evidence.

    Recent evidence also makes the practical gaps harder to dismiss. Population cohorts show that high-burden Long COVID trajectories and persistent post-COVID symptoms can plateau rather than resolve quickly, while patient-led measurement tools and an international diagnostic consensus are pushing care toward lower-burden, PEM-aware assessment. Surveys document medical and administrative invalidation as structural barriers, and trial-landscape work shows that patient-prioritized treatments and PEM endpoints remain sparsely represented. These developments improve orientation and study design, but they do not amount to validated biomarkers or proven disease-modifying treatments.
  why_it_matters: |-
    The precision of a case definition shapes every downstream study. Cohorts recruited under the 1994 Fukuda criteria, the Canadian Consensus Criteria, and the 2015 IOM criteria differ substantially in symptom severity and biological signal, which complicates comparisons between studies and between funders. Epidemiological work matters for the same reason: if the patient population captured by registries skews toward those with diagnostic access, prevalence estimates undercount the true burden and resource allocation follows those biased numbers.

    Measurement tools directly affect whether clinical trials can detect real change. The absence of a validated, psychometrically grounded symptom scale has historically made it hard to compare trial arms or aggregate data across sites. New instruments developed with patients, like the TIMES scale, and new methodological frameworks accounting for chronobiology and sex-hormone cycles represent substantive infrastructure improvements, even when they produce no treatment findings on their own.
  state_of_evidence:
  - status: established
    label: Established
    items:
    - ME/CFS meets clinical criteria for a severe, chronic, multi-systemic illness. PEM, unrefreshing sleep, and cognitive or autonomic symptoms anchor all major case definitions. International medical societies and clinical consensus guidelines (IDSA, ERJ) define infection-associated chronic conditions (IACCs) and mandate pacing while contraindicating graded exercise therapy. The massive socioeconomic impact, including extremely low employment and high polypharmacy, is documented at the national registry level. Clinical symptom profiles consistently group into statistically distinct biological factors (brain, gut, immune, autonomic) across large cohorts. Gastrointestinal comorbidity is quantitatively elevated, with meta-analytic data demonstrating a 37% pooled prevalence and a seven-fold increased odds of irritable bowel syndrome (OR 7.20, 95% CI 2.77–18.76) in ME/CFS, though the direction of association remains unresolved.
  - status: plausible
    label: Plausible but early
    items:
    - ME/CFS symptom severity can be stratified into distinct high- and low-symptom-burden subgroups linked to infectious triggers. Comparative evidence from 55 post-mononucleosis ME/CFS participants and 55 matched people with Long COVID indicates that Long COVID symptom burden fell between operationally defined moderate and severe ME/CFS groups, supporting phenotypic overlap without establishing identical biology or a shared longitudinal baseline. Structural equation modeling demonstrates sex- and menopause-specific latent symptom structures, with female sex hormones dynamically modulating immune (flu-like) symptoms but not gastrointestinal pathways. Large-scale epidemiological surveys show adolescent CFS prevalence correlates with academic stage and physical endurance deficits, while participatory research frameworks (CureME, Deutsche Gesellschaft für ME/CFS) optimize biobanking and trial co-design. In children, post-COVID symptom persistence correlates with initial infection severity.
      Recent community cohorts further support persistent, high-burden symptom trajectories, while the patient-led CNAME instrument and an international consensus framework offer promising infrastructure for needs assessment and safer diagnostic standardization.
  - status: not_established
    label: Not established
    items:
    - Any single objective biomarker or diagnostic test that reliably identifies ME/CFS across populations. Genome-wide significant genetic variants that differentiate clinical severity subgroups. Electronic health record (EHR) diagnostic billing codes as sensitive or complete metrics for population prevalence, due to widespread diagnostic undercoding and billing delays. The new consensus cut-offs and symptom-timing framework remain provisional and require prospective validation against relevant disease controls.
  - status: limitations
    label: Key limitations
    items:
    - Multi-country network cohort analyses relying on ICD billing codes in electronic health records undercount ME/CFS and dysautonomia cases due to diagnostic delays and coding stigma. Standard patient-reported outcome measures (PROMs) frequently miss post-exertional malaise and cognitive fluctuations, introducing measurement error into clinical trials. Many large cohort analyses rely on self-reported online surveys, introducing selection biases and lacking objective physiological measures. A growing share of the post-viral characterization literature relies on broad Post-COVID Condition (PASC) or registry cohorts without ME/CFS case definitions or standardized post-exertional malaise measurement, meaning prevalence figures, symptom distributions, and socioeconomic burden estimates from these cohorts do not transfer directly to criteria-defined ME/CFS. The operationalization of severe ME/CFS within university student cohorts does not capture housebound or bedbound patients seen in community
      cohorts, and clinical phenotypic concordance between distinct viral triggers does not establish identical underlying cellular etiology. Severe and very severe patients remain difficult to represent, even in remote surveys, and conference or preprint findings may change after full peer review. Several recent entries are policy statements, announcements, or infrastructure reports that document need and planned capacity but no patient outcomes, and survey-based national assessments (KCE) and clinic-based registries (MECFS-R) under-represent very severe and bedbound patients.
  open_questions: []
de:
  title: Klinische Charakterisierung & Epidemiologie
  subtitle: Ein fortlaufender Überblick zu ME/CFS-Falldefinitionen, klinischen Leitlinien, Epidemiologie, Kohortendesign, Symptommessung, Forschungsinfrastruktur sowie Förderentwicklungen bei ME/CFS und Long COVID.
  evidence_label: etablierter klinischer Konsens mit laufender Verfeinerung
  plain_summary: ME/CFS ist als schwere, körperliche Multisystemerkrankung anerkannt, die durch anhaltende Erschöpfung, nicht erholsamen Schlaf und eine oft verzögerte Verschlechterung nach geringer Belastung (Post-Exertional Malaise) gekennzeichnet ist. Große Befragungen und nationale Register zeigen ausgeprägte Einschränkungen im Alltag, niedrige Erwerbsquoten und lange Wege bis zur Diagnose, während neuere Studien unterschiedliche Beschwerdemuster bei Betroffenen herausarbeiten. Einen einzelnen Labortest zur Diagnose gibt es bislang jedoch nicht, und viele neue Forschungsnetzwerke und Versorgungsangebote befinden sich noch im Aufbau.
  takeaway: |-
    ME/CFS ist als schwere, biologisch fundierte Multisystemerkrankung etabliert. Seit der IOM-Bericht von 2015 eine geschärfte klinische Falldefinition rund um Post-Exertional Malaise (PEM), nicht erholsamen Schlaf sowie kognitive oder orthostatische Symptome verankert hat, haben große epidemiologische Studien und Register die enorme sozioökonomische Krankheitslast und anhaltende Versorgungslücken deutlich gemacht. US-Umfragedaten zufolge haben 1,5 % der Erwachsenen eine Diagnose erhalten – mit der wichtigen Einschränkung, dass fast die Hälfte derer, die eine „frühere“ Diagnose angeben, weiterhin aktive Symptome und funktionelle Einschränkungen erlebt. Landesweite Registerdaten aus Neuseeland belegen erhebliche sozioökonomische Benachteiligungen, darunter Erwerbsquoten unter 20 % und große Hürden beim Zugang zu Behinderten- und Unterstützungsleistungen. Verschärft wird dies durch eine fragmentierte Versorgung und „statistische Unsichtbarkeit“ aufgrund fehlender Diagnosecodes, wie Versorgungsanalysen zeigen – was Nachverfolgung und Kapazitätsplanung erschwert.

    Neuere große Symptom-Cluster- und Faktorenanalysen haben Patientinnen und Patienten erfolgreich in klinische Untergruppen eingeteilt. Eine Auswertung der britischen DecodeME-Kohorte mit über 19.000 Teilnehmenden identifizierte Untergruppen mit hoher und niedriger Symptomlast und verknüpfte einen infektiösen Beginn mit höherer Langzeitschwere, fand jedoch keine genomweit signifikanten genetischen Prädiktoren. Vergleichende Kohortendaten mit einer prospektiv begleiteten Post-Mononukleose-Gruppe deuten zudem darauf hin, dass die Funktions- und Symptomlast bei Long COVID zwischen operational definiertem moderatem und schwerem Post-Mononukleose-ME/CFS liegen kann; dies stützt phänotypische Überschneidungen postviraler Erkrankungen, grenzt aber Schweregrad-Einteilungen aus Universitätskohorten klar von bettlägerigen Verläufen ab. Weitere Faktorenanalysen bestätigen, dass sich selbstberichtete Symptome zu konsistenten biologischen Dimensionen bündeln (Gehirn, autonomes Nervensystem, Darm-Immun-Achse), wobei geschlechtsstratifizierte Modelle zeigen, dass weibliche Sexualhormone Immunbeschwerden (etwa grippeähnliche Symptome bei prämenopausalen Frauen) dynamisch modulieren, nicht aber gastrointestinale Signalwege. Auch die standardisierte Symptommessung ist mit der Rasch-validierten TIMES-Skala vorangekommen, die eine schwere kumulative Multisystemlast abbildet, bei der kognitive Beschwerden als am belastendsten eingestuft werden.

    Die nationale Forschungs- und Versorgungsinfrastruktur ist durch neue Großförderungen und spezialisierte Netzwerke deutlich gewachsen. In Europa zielt das mit 7,5 Millionen Euro gestartete Konsortium DISCOVER-ME darauf ab, Biobank-Protokolle über mehr als 20 Einrichtungen hinweg zu standardisieren, um Multisystem-Biomarker zu validieren. In Deutschland hat das vom BMG geförderte Netzwerk PEDNET-LC Versorgungspfade und ein zentrales pädiatrisches Register aufgebaut und ergänzt damit Kinderkohorten, die zeigen, dass anhaltende Post-COVID-Symptome bei Kindern schrittweise mit der Schwere der Akutinfektion korrelieren. Die therapeutische Evidenz bleibt jedoch vorläufig: Die begutachtete Publikation der Cohen-Center-Pilotstudie zur häuslichen Magnetfeldtherapie stützt zwar Machbarkeit und Verträglichkeit, zeigt nach Korrektur für multiples Testen (False Discovery Rate) aber keinen kognitiven Nutzen; die antiviralen Daten des Cohen Centers bleiben eine offene Fallserie; und eine begutachtete, nicht randomisierte kontrollierte Studie der Charité fand nach 12 Monaten keinen statistisch signifikanten Vorteil bei der körperlichen Funktion durch integrierte multidisziplinäre Versorgung mit stationärer Rehabilitation gegenüber einer einmaligen Spezialsprechstunde. Nationale und regionale Stellen haben zudem Versorgungslücken und geplante Kapazitäten dokumentiert: der Abschlussbericht des deutschen Registers MECFS-R (724 Patientinnen und Patienten, 54 % des Rekrutierungsziels, keine Prognoseanalyse möglich), der belgische KCE-Bericht zum Versorgungsbedarf, die Stellungnahme der Leopoldina zu postinfektiösen Erkrankungen sowie das geplante PAIS-Zentrum in Wien (gestufte Versorgung ab Sommer 2027, Vollbetrieb ab Mitte 2028). Dabei handelt es sich um Pläne und Bestandsaufnahmen, nicht um Wirksamkeitsnachweise.

    Neuere Arbeiten machen die praktischen Lücken zudem schwerer übersehbar. Bevölkerungskohorten zeigen, dass stark belastende Long-COVID-Verläufe und anhaltende Post-COVID-Symptome eher auf einem Plateau verharren als rasch abzuklingen, während patientengeführte Messinstrumente und ein internationaler Diagnosekonsens auf belastungsärmere, PEM-bewusste Untersuchungen hinwirken. Befragungen dokumentieren medizinische und behördliche Entwertung als strukturelle Hürden, und Auswertungen der Studienlandschaft zeigen, dass von Betroffenen priorisierte Therapien und PEM-Endpunkte in klinischen Studien weiterhin kaum abgebildet sind. Diese Entwicklungen verbessern Orientierung und Studiendesign, ersetzen aber keine validierten Biomarker oder belegten krankheitsmodifizierenden Therapien.
  why_it_matters: |-
    Die Genauigkeit einer Falldefinition prägt jede nachfolgende Studie. Kohorten, die nach den Fukuda-Kriterien von 1994, den Kanadischen Konsenskriterien oder den IOM-Kriterien von 2015 rekrutiert werden, unterscheiden sich erheblich in Symptomschwere und biologischen Signalen – das erschwert den Vergleich zwischen Studien und Förderprogrammen. Epidemiologische Forschung ist aus demselben Grund zentral: Wenn Register vor allem Menschen mit gutem Zugang zu Fachdiagnostik erfassen, unterschätzen Prävalenzschätzungen die tatsächliche Krankheitslast, und Ressourcen fließen an verzerrten Zahlen entlang.

    Messinstrumente entscheiden unmittelbar darüber, ob klinische Studien echte Veränderungen erkennen können. Das Fehlen einer validierten, psychometrisch geprüften Symptomskala hat es lange erschwert, Studienarme zu vergleichen oder Daten standortübergreifend zusammenzuführen. Neue, gemeinsam mit Betroffenen entwickelte Instrumente wie die TIMES-Skala sowie methodische Rahmenwerke, die Chronobiologie und Hormonzyklen berücksichtigen, stellen substanzielle Infrastrukturfortschritte dar – auch wenn sie für sich genommen noch keine Therapieergebnisse liefern.
  state_of_evidence:
  - status: established
    label: Etabliert
    items:
    - 'ME/CFS erfüllt die klinischen Kriterien einer schweren, chronischen Multisystemerkrankung. PEM, nicht erholsamer Schlaf sowie kognitive oder autonome Symptome bilden den Kern aller wichtigen Falldefinitionen. Internationale medizinische Fachgesellschaften und klinische Konsensleitlinien (IDSA, ERJ) definieren infektionsassoziierte chronische Erkrankungen (IACCs), schreiben Pacing als Kernstrategie vor und stufen abgestufte Aktivierungstherapie (GET) als kontraindiziert ein. Die erheblichen sozioökonomischen Folgen einschließlich extrem niedriger Erwerbsquoten und ausgeprägter Polypharmazie sind auf nationaler Registerebene dokumentiert. Klinische Symptomprofile bündeln sich über große Kohorten hinweg konsistent in statistisch abgrenzbaren biologischen Faktoren (Gehirn, Darm, Immunsystem, autonomes Nervensystem). Gastrointestinale Begleiterkrankungen sind quantitativ erhöht: Metaanalysen zeigen für das Reizdarmsyndrom (IBS) bei ME/CFS eine gepoolte Prävalenz von 37 % und ein siebenfach
      erhöhtes Chancenverhältnis (OR 7,20; 95-%-KI 2,77–18,76), wobei die Richtung des Zusammenhangs ungeklärt bleibt.'
  - status: plausible
    label: Plausibel, aber noch früh
    items:
    - Die Symptomschwere bei ME/CFS lässt sich in abgrenzbare Untergruppen mit hoher und niedriger Symptomlast einteilen, die mit infektiösen Auslösern zusammenhängen. Vergleichende Daten von 55 Teilnehmenden mit Post-Mononukleose-ME/CFS und 55 gematchten Personen mit Long COVID zeigen, dass die Symptomlast bei Long COVID zwischen operational definiertem moderatem und schwerem ME/CFS lag; dies spricht für phänotypische Überschneidungen, beweist aber weder identische Biologie noch eine gemeinsame Verlaufsbasis. Strukturgleichungsmodelle belegen geschlechts- und menopausespezifische latente Symptomstrukturen, wobei weibliche Sexualhormone Immunbeschwerden (grippeähnliche Symptome) dynamisch modulieren, nicht aber gastrointestinale Signalwege. Große epidemiologische Erhebungen zeigen, dass die CFS-Prävalenz bei Jugendlichen mit der Schulstufe und Einbußen der körperlichen Ausdauer korreliert, während partizipative Forschungsansätze (CureME, Deutsche Gesellschaft für ME/CFS) Biobanking und gemeinsames
      Studiendesign verbessern. Bei Kindern korreliert die Persistenz von Post-COVID-Symptomen mit der Schwere der Akutinfektion. Neuere Bevölkerungskohorten stützen zudem anhaltende Verläufe mit hoher Symptomlast, während das von Betroffenen mitentwickelte Instrument CNAME und ein internationaler Konsensrahmen vielversprechende Grundlagen für Bedarfserhebung und sicherere diagnostische Standardisierung bieten.
  - status: not_established
    label: Nicht belegt
    items:
    - Ein einzelner objektiver Biomarker oder Diagnosetest, der ME/CFS bevölkerungsübergreifend zuverlässig nachweist. Genomweit signifikante Genvarianten, die klinische Schweregrad-Untergruppen unterscheiden. Abrechnungscodes aus elektronischen Gesundheitsakten (EHR) als sensitive oder vollständige Kennzahlen für die Bevölkerungsprävalenz – aufgrund weitverbreiteter Untercodierung und verzögerter Diagnosestellung. Die neuen Konsens-Grenzwerte und das Symptom-Timing-Modell sind vorläufig und erfordern eine prospektive Validierung gegenüber passenden Krankheitskontrollen.
  - status: limitations
    label: Zentrale Einschränkungen
    items:
    - Länderübergreifende Netzwerkkohorten auf Basis von ICD-Abrechnungscodes in elektronischen Gesundheitsakten erfassen ME/CFS und Dysautonomien wegen Diagnoseverzögerungen und Codierungsstigma systematisch zu selten. Gängige patientenberichtete Messinstrumente (PROMs) übersehen häufig Post-Exertional Malaise und kognitive Schwankungen und erzeugen dadurch Messfehler in klinischen Studien. Viele große Kohortenanalysen stützen sich auf selbstberichtete Online-Umfragen, was Selektionsverzerrungen mit sich bringt und objektive physiologische Messungen vermissen lässt. Ein wachsender Teil der Literatur zur postviralen Charakterisierung nutzt breite Post-COVID- (PASC-) oder Registerkohorten ohne ME/CFS-Falldefinitionen oder standardisierte PEM-Erfassung; Prävalenzen, Symptomverteilungen und Schätzungen der sozioökonomischen Last aus solchen Kohorten lassen sich daher nicht direkt auf kriterienbasiertes ME/CFS übertragen. Die Operationalisierung von „schwerem“ ME/CFS in Universitätskohorten
      bildet hausgebundene oder bettlägerige Betroffene aus Versorgungskohorten nicht ab, und klinische Ähnlichkeiten nach unterschiedlichen Virusauslösern beweisen keine identischen zellulären Krankheitsmechanismen. Schwer und sehr schwer Betroffene bleiben selbst in Online-Erhebungen schwer erreichbar, und Konferenz- oder Preprint-Ergebnisse können sich nach vollständigem Peer-Review noch ändern. Mehrere neuere Einträge sind Positionspapiere, Ankündigungen oder Infrastrukturberichte, die Bedarf und geplante Kapazitäten dokumentieren, aber keine Patientenergebnisse liefern; zudem bilden umfragebasierte nationale Erhebungen (KCE) und klinikbasierte Register (MECFS-R) sehr schwer Betroffene und Bettlägerige zu wenig ab.
  open_questions: []
