en:
  title: Comprehensive review synthesizes post-viral immune mechanisms and immunomodulatory strategies
  plain_summary: A review paper summarized how persistent immune activation and altered T and B cells are studied in Long COVID, and stressed matching future immune-drug trials to biomarker-defined patient subgroups. As a literature synthesis rather than new patient data, it does not support off-label use of immunomodulators outside formal trials.
  detail: A narrative review published in *Frontiers in Immunology* synthesized post-viral immune pathomechanisms across Long COVID and post-infectious syndromes, focusing on persistent immune activation, altered T-cell and B-cell phenotypes, and chronic low-grade inflammatory cascades. The authors evaluated targeted immunomodulatory interventions, cytokine-specific therapies, and host-directed treatments currently in development or undergoing clinical testing. This framework connects post-viral immune dysfunction to candidate therapeutic translation, emphasizing the necessity of biomarker-stratified clinical trial designs to account for biological heterogeneity. However, as a narrative synthesis of existing literature and early-stage trial concepts rather than novel empirical cohort data, it reflects heterogeneous clinical trial endpoints across cited studies, and immunomodulatory agents require rigorous clinical trial evaluation before routine off-label use.
de:
  title: Umfassende Übersichtsarbeit bündelt postvirale Immunmechanismen und immunmodulatorische Behandlungsstrategien
  plain_summary: Eine Übersichtsarbeit fasst zusammen, wie anhaltende Immunaktivierung sowie veränderte T- und B-Zellen bei Long COVID erforscht werden, und plädiert für Studien anhand biologischer Untergruppen. Als reine Literatursynthese ohne neue Studiendaten rechtfertigt sie keinen ungeprüften Off-Label-Einsatz von Immunmedikamenten.
  detail: Eine narrative Übersichtsarbeit in *Frontiers in Immunology* fasste postvirale Immunmechanismen bei Long COVID und verwandten Syndromen zusammen – mit Fokus auf anhaltender Immunaktivierung, veränderten T- und B-Zell-Phänotypen und chronischen niedriggradigen Entzündungskaskaden. Die Autorinnen und Autoren bewerteten gezielte Immunmodulatoren, zytokinspezifische Therapien und wirtsgerichtete Ansätze in Entwicklung oder früher klinischer Prüfung und betonten die Bedeutung biomarker-stratifizierter Studiendesigns. Als narrative Synthese bestehender Literatur und früher Studienkonzepte statt neuer empirischer Kohortendaten spiegelt die Arbeit uneinheitliche Endpunkte wider und unterstreicht, dass immunmodulierende Wirkstoffe vor einem breiten Off-Label-Einsatz streng geprüft werden müssen.
