en:
  title: Transcriptomic signature screen nominates four metabolism-targeting compounds for ME/CFS
  plain_summary: A preprint computer analysis of gene-activity datasets suggested four existing metabolic drugs (including pioglitazone and tideglusib) might reverse cellular stress patterns seen in ME/CFS, and three boosted energy markers in mouse muscle cells. Because this is an unreviewed computer and mouse-cell study with no human data, these potent drugs have no proven safety or dosing for off-label use.
  detail: 'A bioinformatics and in vitro drug-repurposing study published as a preprint on Research Square by Dehlia et al. re-analyzed two independent public transcriptomic datasets (GSE14577 and GSE227375) to identify therapeutic candidates targeting metabolic dysfunction in ME/CFS cohorts. By extracting a consensus 46-gene expression signature reflecting disruptions in cytokine signaling, immune pathways, lipid and nucleotide metabolism, and cellular redox balance, the authors queried the Connectivity Map (CMap) L1000 database to prioritize perturbagens predicted to reverse the ME/CFS gene expression profile. This computational screen nominated four repurposed compounds: the PPAR-gamma agonists pioglitazone and rosiglitazone, the GSK-3beta inhibitor tideglusib, and the mTOR pathway activator MHY1485. In vitro validation in mouse C2C12 skeletal muscle myoblasts demonstrated that pioglitazone, tideglusib, and MHY1485 significantly increased mitochondrial membrane potential in TMRM and JC-1
    assays, providing preclinical support for their capacity to counteract cellular metabolic suppression. However, as an unreviewed preprint, the findings are based solely on in silico re-analysis and mouse muscle cell-line assays rather than patient-derived primary cells or validated animal models of ME/CFS. The underlying transcriptomic cohorts did not report severe or bedbound patient representation, and these potent pharmacological agents have no human clinical trial evidence, validated dosing, or established safety profiles in ME/CFS, precluding off-label use.'
de:
  title: Transkriptom-Signatur-Screening schlägt vier stoffwechselzielende Wirkstoffe für ME/CFS vor
  plain_summary: Eine noch nicht begutachtete Computeranalyse von Genaktivitätsdaten schlug vier bekannte Stoffwechselmedikamente (u. a. Pioglitazon und Tideglusib) für ME/CFS vor, von denen drei Energiemarker in Maus-Muskelzellen steigerten. Da keinerlei Daten am Menschen vorliegen, gibt es weder geprüfte Dosierungen noch Sicherheitsbelege für einen Off-Label-Einsatz.
  detail: 'Eine bioinformatische und In-vitro-Drug-Repurposing-Studie, veröffentlicht als Preprint auf Research Square von Dehlia et al., analysierte zwei unabhängige öffentliche Transkriptom-Datensätze (GSE14577 und GSE227375) neu, um therapeutische Kandidaten gegen metabolische Dysfunktion bei ME/CFS zu identifizieren. Aus einer gemeinsamen 46-Gen-Signatur zu Zytokinsignalen, Immunwegen, Lipid- und Nukleotidstoffwechsel sowie zellulärem Redox-Gleichgewicht durchsuchten die Autorinnen und Autoren die Datenbank Connectivity Map (CMap) L1000 nach Substanzen, die das ME/CFS-Genexpressionsprofil umkehren könnten. Dieses rechnergestützte Screening nominierte vier umgewidmete Substanzen: die PPAR-gamma-Agonisten Pioglitazon und Rosiglitazon, den GSK-3beta-Hemmer Tideglusib sowie den mTOR-Aktivator MHY1485. In-vitro-Tests in Maus-C2C12-Skelettmuskelmyoblasten zeigten, dass Pioglitazon, Tideglusib und MHY1485 das mitochondriale Membranpotenzial in TMRM- und JC-1-Assays signifikant erhöhten, was
    präklinische Hinweise gegen zelluläre Stoffwechseldrosselung liefert. Als unbegutachteter Preprint basiert die Arbeit jedoch ausschließlich auf In-silico-Reanalysen und Maus-Muskelzelllinien statt auf primären Patientenzellen oder validierten ME/CFS-Tiermodellen; zudem berichten die zugrunde liegenden Kohorten keine Beteiligung schwer Betroffener oder Bettlägeriger, und für diese potenten Substanzen fehlen menschliche Studiendaten, geprüfte Dosierungen und Sicherheitsprofile, was einen Off-Label-Einsatz ausschließt.'
