en:
  title: Conference abstract proposes candidate immune endotypes linked to immunoadsorption responsiveness
  plain_summary: In a 2026 conference abstract, researchers used blood immune profiling to propose three biological subgroups in Long COVID/ME/CFS that seemed to match who did or did not respond to immunoadsorption in past data. Because the abstract is unreviewed, lacks sample sizes, and has not been tested prospectively, these subgroup ideas do not establish treatment benefit.
  detail: 'At ISLC-PAIS 2026 in Amsterdam on 27 August 2026, Arendholz and colleagues presented the conference abstract "Multi-layered immune profiling reveals treatment-relevant endotypes in Long Covid-ME/CFS." The team applied CyTOF mass cytometry, plasma proteomics, and machine learning across two cohorts—a Long COVID-ME/CFS cohort enriched for elevated GPCR autoantibodies with linked immunoadsorption response data, and an unselected Long COVID-ME/CFS cohort—to explore treatment-relevant biological stratification. Unsupervised analysis identified three candidate immune endotypes: a germinal center-associated autoimmune endotype characterized by germinal center B-cell features that retrospectively tracked with positive immunoadsorption response; a high-inflammatory autoimmune endotype marked by extrafollicular B-cell activation, heightened innate immune signaling, elevated autoimmunity scores, and molecular similarities to Sjögren''s disease that retrospectively tracked with treatment
    non-response; and a low-inflammatory endotype identified in the unselected cohort with expanded CD161+ CD4+ and CD8+ T cells. These observations are preliminary stratification hypotheses that may inform future trial designs. Given the high procedural burden and risks documented in recent immunoadsorption studies, rigorous biological stratification would be necessary before any subgroup-specific clinical value could be assessed. The abstract book entry was not peer reviewed, reported no sample sizes for the profiling cohorts, and provided no prospective validation or information about severe or bedbound inclusion; the retrospective associations do not establish treatment efficacy.'
de:
  title: Konferenz-Abstract schlägt Immun-Endotypen vor, die mit dem Ansprechen auf Immunadsorption zusammenhängen könnten
  plain_summary: In einem Konferenz-Abstract von 2026 schlagen Forschende mittels Immunprofilierung drei biologische Untergruppen bei Long COVID/ME/CFS vor, die rückblickend unterschiedlich auf Immunadsorption anzusprechen schienen. Da der Beitrag nicht begutachtet ist, keine Fallzahlen nennt und nicht prospektiv geprüft wurde, belegen diese Ideen keinen Behandlungserfolg.
  detail: 'Auf der ISLC-PAIS 2026 in Amsterdam am 27. August 2026 stellten Arendholz und Kolleginnen bzw. Kollegen das Konferenz-Abstract „Multi-layered immune profiling reveals treatment-relevant endotypes in Long Covid-ME/CFS“ vor. Das Team kombinierte CyTOF-Massenzytometrie, Plasmaproteomik und maschinelles Lernen in zwei Kohorten – einer mit erhöhten GPCR-Autoantikörpern angereicherten Long-COVID-ME/CFS-Kohorte mit Daten zum Immunadsorptions-Ansprechen sowie einer unselektierten Long-COVID-ME/CFS-Kohorte –, um eine therapierelevante biologische Stratifizierung zu prüfen. Eine unüberwachte Analyse identifizierte drei Kandidaten-Immunendotypen: einen Keimzentrums-assoziierten autoimmunen Endotyp mit Merkmalen von Keimzentrums-B-Zellen, der retrospektiv mit positivem Immunadsorptions-Ansprechen einherging; einen hoch-entzündlichen autoimmunen Endotyp mit extrafollikulärer B-Zell-Aktivierung, verstärkten angeborenen Immunsignalen, hohen Autoimmunitäts-Scores und molekularer Ähnlichkeit zum
    Sjögren-Syndrom, der retrospektiv mit Nicht-Ansprechen zusammenhing; sowie einen niedrig-entzündlichen Endotyp in der unselektierten Kohorte mit vermehrten CD161+ CD4+- und CD8+-T-Zellen. Diese Beobachtungen sind vorläufige Stratifizierungshypothesen für künftige Studiendesigns. Angesichts der hohen Belastungen und Risiken neuerer Immunadsorptions-Studien wäre eine strenge biologische Vorauswahl nötig, bevor ein Nutzen für Untergruppen beurteilt werden könnte. Der Abstract-Eintrag wurde nicht peer-reviewed, nannte keine Fallzahlen und lieferte weder prospektive Validierung noch Angaben zur Beteiligung schwer Betroffener oder Bettlägeriger; die retrospektiven Zusammenhänge belegen keine Therapiewirksamkeit.'
