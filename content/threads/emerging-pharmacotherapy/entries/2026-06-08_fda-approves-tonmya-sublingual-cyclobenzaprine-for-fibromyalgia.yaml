en:
  title: FDA approves Tonmya (sublingual cyclobenzaprine) for fibromyalgia, discussed for off-label ME/CFS relevance
  plain_summary: The FDA approved Tonmya, an under-the-tongue form of the muscle relaxant cyclobenzaprine, for fibromyalgia, sparking discussion of off-label use in ME/CFS due to overlapping sleep and pain symptoms. However, no ME/CFS trials exist, the drug was not tested against cheap generic pills, and out-of-pocket costs are roughly $2,000 a month with possible mouth irritation.
  detail: On June 8, 2026, the FDA approved Tonmya (sublingual cyclobenzaprine, though captions rendered the brand name variably as Tonmya or Tomaya) for the treatment of fibromyalgia. In a Younger Lab commentary, Dr. Jarred Younger discussed the drug's pharmacokinetic rationale, explaining that sublingual delivery bypasses first-pass hepatic and gut metabolism, avoiding the rapid conversion to norcyclobenzaprine and reducing next-day grogginess compared to oral generic Flexeril. While published clinical trials demonstrated a clear separation between Tonmya and placebo in improving fibromyalgia severity, sleep, and fatigue, there are no head-to-head trials comparing it to cheap oral generics. Given that ME/CFS, Long COVID, and Gulf War Illness have zero FDA-approved treatments, Dr. Younger framed Tonmya as potentially useful off-label for these conditions due to their overlapping symptom profiles, though he noted that no ME/CFS-specific efficacy data exist. Practical limitations include
    a high out-of-pocket cost of approximately $2,000 per month compared to around $15 for generic oral formulations, mucosal irritation or chemical burn risk if the tablet does not dissolve before sleep, and the necessity of a 2-month trial to properly judge efficacy.
de:
  title: FDA lässt Tonmya (sublinguales Cyclobenzaprin) bei Fibromyalgie zu – Diskussion zur Off-Label-Relevanz für ME/CFS
  plain_summary: Die US-Arzneimittelbehörde FDA ließ Tonmya – eine unter der Zunge lösliche Form von Cyclobenzaprin – gegen Fibromyalgie zu, was Diskussionen über einen möglichen Off-Label-Einsatz bei ME/CFS auslöste. Es liegen jedoch keine Wirksamkeitsdaten für ME/CFS vor, ein direkter Vergleich mit günstigen Generika fehlt, und die Kosten betragen rund 2.000 US-Dollar monatlich bei möglichem Risiko für Schleimhautreizungen.
  detail: 'Am 8. Juni 2026 ließ die FDA Tonmya (sublinguales Cyclobenzaprin, in automatischen Untertiteln teils unterschiedlich als Tonmya oder Tomaya wiedergegeben) zur Behandlung der Fibromyalgie zu. In einem Kommentar des Younger Lab erläuterte Dr. Jarred Younger die pharmakokinetische Rationale: Die sublinguale Aufnahme umgeht den First-Pass-Metabolismus in Leber und Darm, vermeidet so eine rasche Umwandlung in Norcyclobenzaprin und verringert Benommenheit am Folgetag im Vergleich zu oralen Generika (Flexeril). Während veröffentlichte Studien eine klare Trennung zwischen Tonmya und Placebo bei Fibromyalgie-Schweregrad, Schlaf und Fatigue zeigten, fehlen direkte Vergleichsstudien gegen preiswerte orale Generika. Da für ME/CFS, Long COVID und das Golfkriegssyndrom keine von der FDA zugelassenen Therapien existieren, ordnete Dr. Younger Tonmya aufgrund überlappender Symptome als potenziell interessant für den Off-Label-Einsatz ein, betonte aber ausdrücklich, dass keine ME/CFS-spezifischen
    Wirksamkeitsdaten vorliegen. Praktische Einschränkungen sind hohe Selbstzahlerkosten von rund 2.000 US-Dollar monatlich gegenüber etwa 15 US-Dollar für orale Generika, das Risiko von Schleimhautreizungen oder chemischen Verbrennungen im Mund bei unvollständigem Auflösen vor dem Einschlafen sowie die Notwendigkeit einer zweimonatigen Testphase zur Beurteilung.'
