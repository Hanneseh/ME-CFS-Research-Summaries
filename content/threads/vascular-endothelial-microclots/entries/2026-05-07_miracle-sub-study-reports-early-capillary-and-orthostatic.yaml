en:
  title: MIRACLE sub-study reports early capillary and orthostatic cerebral perfusion differences in ME/CFS
  plain_summary: Early conference data using finger-nailfold microscopes and head blood-flow ultrasound showed a tendency toward lower brain blood flow when standing in ME/CFS patients. The tested subgroups are still too small to set clear diagnostic thresholds.
  detail: At the International ME/CFS Conference 2026, Annabell Sprenger presented preliminary vascular findings from the MIRACLE collaborative study using nailfold capillaroscopy and transcranial Doppler during orthostatic stress. Baseline cerebral flow velocities did not clearly separate patients from controls, but after passive standing the ME/CFS group showed a consistent trend toward lower cerebral flow velocities, while controls maintained higher values. The capillaroscopy work also suggested possible sex-related differences and a relationship between capillary measures and functional status. This is useful because it tests practical bedside-style tools across both microvascular and macrovascular scales instead of relying on a single specialized lab assay. The evidence remains preliminary, with small analyzed subgroups and effect sizes that have not yet matured into statistically definitive diagnostic thresholds.
de:
  title: MIRACLE-Substudie berichtet frühe Kapillar- und orthostatische Hirndurchblutungsunterschiede bei ME/CFS
  plain_summary: Erste Konferenzdaten mit Nagelfalzmikroskopie und Hirn-Ultraschall zeigten bei ME/CFS eine Tendenz zu geringerer Hirndurchblutung im Stehen. Die untersuchten Teilgruppen sind für feste Diagnosegrenzwerte noch zu klein.
  detail: Auf der International ME/CFS Conference 2026 präsentierte Annabell Sprenger vorläufige Gefäßbefunde aus der MIRACLE-Verbundstudie mithilfe von Nagelfalzkapillaroskopie und transkranieller Dopplersonographie unter orthostatischer Belastung. Die Ruhe-Flussgeschwindigkeiten im Gehirn trennten Betroffene nicht klar von Kontrollpersonen, doch nach passivem Aufstehen zeigte die ME/CFS-Gruppe einen durchgängigen Trend zu niedrigeren zerebralen Flussgeschwindigkeiten, während Kontrollpersonen höhere Werte hielten. Die Kapillaroskopie deutete zudem auf mögliche geschlechtsbezogene Unterschiede sowie einen Zusammenhang zwischen Kapillarmaßen und Funktionsstatus hin. Der Ansatz ist wertvoll, weil er praxisnahe Werkzeuge auf mikro- und makrovaskulärer Ebene testet, statt sich auf einen einzigen Speziallabortest zu stützen. Die Evidenz bleibt vorläufig, mit kleinen analysierten Untergruppen und Effektstärken, die noch nicht für statistisch belastbare Diagnosegrenzwerte ausreichen.
