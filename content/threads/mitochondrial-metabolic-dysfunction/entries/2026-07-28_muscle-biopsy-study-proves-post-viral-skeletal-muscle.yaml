en:
  title: Muscle biopsy study proves post-viral skeletal muscle pathology is distinct from bed-rest deconditioning
  plain_summary: A landmark Nature Communications study compared muscle biopsies from ME/CFS and Long COVID patients with healthy people placed on strict bed rest, proving that post-viral mitochondrial and capillary defects are a real disease process rather than deconditioning. Biopsies remain too invasive for routine diagnosis.
  detail: '- **What changed:** A comparative muscle biopsy study published in *Nature Communications* evaluated skeletal muscle histology, mitochondrial respiration, capillary-to-fiber ratio, and glycogen storage in Long COVID and ME/CFS patients against healthy controls and bed-rest deconditioned individuals. The study demonstrated that structural mitochondrial defects, microvascular capillary alterations, and metabolic storage abnormalities in post-viral patients are distinct from the changes induced by prolonged bed rest.

    - **Why it matters:** This directly refutes the long-standing clinical assumption that physical weakness and exercise intolerance in ME/CFS and Long COVID stem primarily from inactivity or deconditioning. By proving that muscle bioenergetic impairment is an intrinsic cellular disease process, it reinforces the need for biomedical therapies targeting mitochondrial and vascular function rather than forced aerobic reconditioning.

    - **What it does not prove yet:** Muscle biopsy methodology is invasive and restricted to specialized research settings, preventing its routine use as a bedside diagnostic test, and cross-sectional comparisons cannot fully capture individual longitudinal disease trajectories.'
de:
  title: 'Muskelbiopsie-Studie belegt: Postvirale Skelettmuskelpathologie unterscheidet sich grundlegend von Bettruhe-Dekonditionierung'
  plain_summary: Eine wegweisende Studie in *Nature Communications* verglich Muskelbiopsien von ME/CFS- und Long-COVID-Betroffenen mit gesunden Menschen nach strenger Bettruhe und zeigte, dass die postviralen Mitochondrien- und Kapillarschäden ein eigenständiger Krankheitsprozess und keine bloße Untrainiertheit sind. Für Routinediagnostik sind Biopsien aber zu invasiv.
  detail: '- **Was sich gezeigt hat:** Eine in *Nature Communications* veröffentlichte vergleichende Muskelbiopsie-Studie untersuchte Skelettmuskel-Histologie, Mitochondrienatmung, Kapillar-zu-Faser-Verhältnis und Glykogenspeicher bei Long-COVID- und ME/CFS-Betroffenen im Vergleich zu gesunden Kontrollpersonen sowie durch Bettruhe dekonditionierten Probanden. Die Studie zeigte, dass strukturelle Mitochondriendefekte, mikrovaskuläre Kapillarveränderungen und Störungen der Stoffwechselspeicherung bei postviralen Patientinnen und Patienten sich deutlich von den Folgen langer Bettruhe unterscheiden.

    - **Warum das wichtig ist:** Dies widerlegt direkt die lange verbreitete klinische Annahme, körperliche Schwäche und Belastungsintoleranz bei ME/CFS und Long COVID beruhten im Wesentlichen auf Inaktivität oder Dekonditionierung. Indem die muskuläre Energiebeeinträchtigung als intrinsischer Zellkrankheitsprozess belegt wird, stärkt die Arbeit den Bedarf an biomedizinischen Therapien für Mitochondrien und Gefäßfunktion statt forcierten Ausdauertrainings.

    - **Was damit noch nicht belegt ist:** Muskelbiopsien sind invasiv und spezialisierten Forschungszentren vorbehalten, sodass sie sich nicht als alltäglicher Praxistest eignen; zudem bilden Querschnittsvergleiche individuelle Langzeitverläufe nur begrenzt ab.'
