en:
  title: MYOFLAME-19 trial of losartan and prednisone for post-COVID cardiac inflammation presents results at International ME/CFS Conference 2026
  plain_summary: A 16-week trial of 279 patients with post-COVID fatigue and mild heart inflammation on MRI tested losartan (with or without prednisone) and missed its primary heart-pumping endpoint on the main test, though an adjusted analysis suggested small improvements. With an 11.8% dropout rate and a missed primary test, these conference findings remain exploratory rather than proven.
  detail: Prof. Dr. Valentina Puntmann presented findings from the MYOFLAME-19 trial, a 16-week randomized, placebo-controlled trial evaluating the angiotensin receptor blocker losartan (with or without the corticosteroid prednisone) in 279 patients with post-COVID fatigue syndrome showing subclinical cardiac inflammation on MRI. While the study did not meet its primary confirmatory endpoint of improving left ventricular ejection fraction (LVEF) using a conservative unpaired t-test, an ANCOVA analysis adjusting for baseline LVEF showed a statistically significant treatment effect. The trial showed directional proof of concept with improvements in cardiac volume, reduced tissue and systemic inflammation (CRP, D-dimer, lymphocytes), and reduced fatigue. However, the study suffered from a high attrition rate (11.8%), and LVEF may not be the optimal endpoint for post-infectious endothelial dysfunction.
de:
  title: MYOFLAME-19-Studie zu Losartan und Prednison bei Post-COVID-Herzentzündung auf der Internationalen ME/CFS-Konferenz 2026 vorgestellt
  plain_summary: Eine 16-wöchige Studie mit 279 Betroffenen mit Post-COVID-Fatigue und leichter Herzentzündung im MRT prüfte Losartan (mit oder ohne Prednison) und verfehlte im Haupttest den primären Pumpfunktions-Endpunkt, zeigte in einer adjustierten Analyse jedoch leichte Verbesserungen. Angesichts einer Abbruchrate von 11,8 % und des verfehlten Haupttests bleiben die Konferenzdaten vorläufig.
  detail: Prof. Dr. Valentina Puntmann präsentierte Ergebnisse der MYOFLAME-19-Studie, einer 16-wöchigen randomisierten, placebokontrollierten Studie zum Angiotensin-Rezeptorblocker Losartan (mit oder ohne das Kortikosteroid Prednison) bei 279 Patientinnen und Patienten mit Post-COVID-Fatigue-Syndrom und subklinischer Herzentzündung im MRT. Während die Studie ihren primären konfirmatorischen Endpunkt – die Verbesserung der linksventrikulären Ejektionsfraktion (LVEF) im konservativen ungepaarten t-Test – verfehlte, zeigte eine für den LVEF-Ausgangswert adjustierte ANCOVA-Analyse einen statistisch signifikanten Behandlungseffekt. Die Studie ergab richtungsweisende Hinweise auf Verbesserungen bei Herzvolumen, verringerter Gewebe- und systemischer Entzündung (CRP, D-Dimere, Lymphozyten) sowie geringerer Fatigue. Allerdings verzeichnete die Studie eine hohe Abbruchrate (11,8 %), und die LVEF ist möglicherweise nicht der optimale Endpunkt für postinfektiöse Endothelschäden.
