en:
  title: Post-COVID ME/CFS shows a different depressive-symptom profile from historical controls
  plain_summary: In a small study of 17 post-COVID ME/CFS patients with similar overall depression-questionnaire scores to matched controls, the ME/CFS group actually reported less depressed mood. This suggests physical exhaustion can push up standard depression scores without indicating primary depression.
  detail: In an exploratory secondary analysis, 17 adults meeting 2015 IOM criteria for post-COVID ME/CFS were compared with 34 age- and sex-matched pre-COVID historical controls with similar total PHQ-9 scores. Depressed mood was lower in the post-COVID group while anhedonia did not differ, suggesting that somatic exhaustion can inflate a composite depression score without establishing primary mood disorder. The questionnaire itself imposed little physical burden and involved no exertion or PEM challenge, but the outpatient hospital recruitment did not report severe or bedbound inclusion. The small, post hoc design, historical controls, and lack of structured psychiatric interviews limit interpretation; this is a caution about symptom measurement and misattribution, not evidence for a treatment.
de:
  title: Post-COVID-ME/CFS zeigt ein anderes Depressionssymptom-Profil als historische Kontrollen
  plain_summary: In einer kleinen Studie mit 17 Post-COVID-ME/CFS-Betroffenen und vergleichbarem Gesamtwert auf einem Depressionsfragebogen berichtete die ME/CFS-Gruppe weniger gedrückte Stimmung als die Vergleichsgruppe. Körperliche Erschöpfung kann solche Summenwerte erhöhen, ohne dass eine primäre Depression vorliegt.
  detail: In einer explorativen Sekundäranalyse wurden 17 Erwachsene, die die IOM-Kriterien von 2015 für Post-COVID-ME/CFS erfüllten, mit 34 alters- und geschlechtsgematchten historischen Kontrollen aus der Zeit vor COVID-19 mit ähnlichen Gesamt-PHQ-9-Werten verglichen. Gedrückte Stimmung war in der Post-COVID-Gruppe geringer ausgeprägt, während Anhedonie sich nicht unterschied – was darauf hindeutet, dass körperliche Erschöpfung einen Summenscore aufblähen kann, ohne eine primäre affektive Störung zu belegen. Der Fragebogen selbst verursachte kaum körperliche Belastung und beinhaltete keinen Belastungstest, allerdings berichtete die ambulante Klinikrekrutierung keinen Einschluss schwer Betroffener oder Bettlägeriger. Die kleine Post-hoc-Analyse, historische Kontrollen und fehlende strukturierte psychiatrische Interviews begrenzen die Aussagekraft; dies ist eine Warnung vor Messfehlern und Fehldeutungen, kein Therapiebeleg.
