en:
  title: Imperial College's Rosetta Stone study launches to compare ME/CFS and Long COVID immunology
  plain_summary: UK researchers launched a £1.1 million project to compare immune profiles in blood, stool, and saliva across 250 people with ME/CFS and 250 with Long COVID. No results are out yet, as the three-year study is only getting started.
  detail: Imperial College London announced £1.1 million in funding for the Rosetta Stone study, which will perform a direct side-by-side molecular comparison of 250 people with ME/CFS and 250 people with Long COVID alongside matched healthy controls. Blood, stool, and saliva samples will be analysed using high-resolution immunological profiling, with symptom data collected via the ELAROS smartphone app. The project draws on the UK ME/CFS Biobank and integrates with the existing DecodeME genetic cohort and the NIHR WILCO Long COVID study, building connectivity across the major UK patient resources. The stated goal is to identify shared immunological pathways—the "Rosetta Stone" key—that could explain overlapping post-infectious disability, and to distinguish what is shared from what is disease-specific. No findings are available from this announcement; the three-year data collection and analysis phase is the focus.
de:
  title: „Rosetta Stone“-Studie des Imperial College startet zum immunologischen Vergleich von ME/CFS und Long COVID
  plain_summary: Britische Forschende haben ein mit 1,1 Millionen Pfund gefördertes Projekt gestartet, das Immunprofile in Blut, Stuhl und Speichel bei je 250 Menschen mit ME/CFS und Long COVID vergleicht. Ergebnisse liegen noch nicht vor, da die dreijährige Datenerhebung erst beginnt.
  detail: Das Imperial College London kündigte eine Förderung von 1,1 Millionen Pfund für die „Rosetta Stone“-Studie an, die einen direkten molekularen Seitenvergleich von 250 Menschen mit ME/CFS und 250 Menschen mit Long COVID sowie gematchten gesunden Kontrollpersonen durchführen wird. Blut-, Stuhl- und Speichelproben sollen mit hochauflösenden immunologischen Profilen untersucht werden, während Symptomdaten über die Smartphone-App ELAROS erfasst werden. Das Projekt stützt sich auf die UK ME/CFS Biobank und verknüpft sich mit der genetischen DecodeME-Kohorte sowie der Long-COVID-Studie NIHR WILCO, wodurch die großen britischen Patientenkohorten enger vernetzt werden. Erklärtes Ziel ist es, gemeinsame immunologische Signalwege – den „Stein von Rosetta“ – zu finden, die überlappende postinfektiöse Behinderungen erklären, und Gemeinsamkeiten von krankheitsspezifischen Merkmalen zu trennen. Aus dieser Ankündigung liegen noch keine Ergebnisse vor; im Vordergrund steht zunächst die dreijährige
    Phase der Datenerhebung und Analyse.
