en:
  title: First German-language transdisciplinary care guide published for severe ME/CFS home care
  plain_summary: An Austrian panel of clinicians, nurses, therapists, and caregivers published the first German-language practice guide on adapting home care for severe ME/CFS so daily care does not trigger crashes. It reflects expert and caregiver consensus rather than clinical trial proof.
  detail: A transdisciplinary Austrian expert group—including nursing scientists, physiotherapists, general practitioners, public health researchers, and patient/family-caregiver representatives—published the first German-language consensus practice guide for home-based care of severely affected ME/CFS patients in *Wiener Medizinische Wochenschrift*. The guide addresses the tension that care-dependent patients with severe ME/CFS require substantial nursing support, yet the defining feature of their illness (PEM) means that any care activity can trigger disproportionate deterioration if individual exertion thresholds are exceeded. It outlines PEM-aware adaptations for daily care activities (nutrition, hygiene, positioning, and communication), symptom-specific management, home-visit planning, and the potential application of palliative care principles. The statement warns against standard rehabilitation or graded-activity approaches and highlights the reliance on family caregivers. As an expert
    consensus statement rather than a randomized controlled trial, it represents clinical consensus and patient/caregiver experience rather than high-level experimental efficacy evidence.
de:
  title: Erster deutschsprachiger transdisziplinärer Praxisleitfaden für die häusliche Versorgung bei schwerem ME/CFS veröffentlicht
  plain_summary: Eine österreichische Expertengruppe aus Medizin, Pflege, Therapie und Angehörigenvertretung hat den ersten deutschsprachigen Praxisleitfaden für die häusliche Versorgung bei schwerem ME/CFS veröffentlicht, um Überlastungsschäden im Pflegealltag zu vermeiden. Die Empfehlungen beruhen auf fachlichem Konsens und Praxiserfahrung, nicht auf klinischen Interventionsstudien.
  detail: Eine transdisziplinäre österreichische Expertengruppe – darunter Pflegewissenschaftlerinnen, Physiotherapeuten, Allgemeinmediziner, Public-Health-Forschende sowie Patienten- und Angehörigenvertretungen – veröffentlichte in der *Wiener Medizinischen Wochenschrift* den ersten deutschsprachigen Konsens-Praxisleitfaden für die häusliche Versorgung schwer an ME/CFS erkrankter Menschen. Der Leitfaden adressiert das Spannungsfeld, dass pflegebedürftige Betroffene mit schwerem ME/CFS umfassende Unterstützung benötigen, während das Kernsymptom der Erkrankung (PEM) dazu führt, dass jede Pflegemaßnahme bei Überschreiten individueller Belastungsgrenzen eine unverhältnismäßige Verschlechterung auslösen kann. Er beschreibt PEM-sensible Anpassungen für alltägliche Pflegebereiche (Ernährung, Hygiene, Lagerung und Kommunikation), symptomorientiertes Management, die Planung von Hausbesuchen sowie die mögliche Einbindung von Palliativprinzipien. Die Stellungnahme warnt vor Standard-Rehabilitation
    oder gestufter Aktivierung und hebt die große Abhängigkeit von pflegenden Angehörigen hervor. Als Expertenkonsens-Papier und nicht als randomisierte kontrollierte Studie bildet der Leitfaden klinischen Konsens sowie Patienten- und Angehörigenerfahrungen ab, jedoch keine experimentelle Wirksamkeitsevidenz.
