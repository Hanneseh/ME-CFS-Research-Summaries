en:
  title: Patient-led Long COVID clustering study shows high-burden PEM groups but warns against over-interpreting algorithmic phenotypes
  plain_summary: An online analysis of 6,031 adults with Long COVID confirmed a high-burden group marked by severe PEM, though different clustering algorithms sorted participants differently. Because symptoms overlap continuously without lab biomarkers, symptom clusters alone cannot define fixed disease subtypes.
  detail: The Patient-Led Research Collaborative analyzed 162 self-reported symptoms from 6,031 adults with Long COVID using three unsupervised clustering methods. All methods produced plausible groups and consistently found a high-symptom-burden subgroup enriched for severe PEM, younger age, and female sex, but agreement between algorithms was low and the symptom landscape appeared continuous rather than clearly partitioned. The result is useful because it validates PEM-heavy Long COVID as a recurring clinical pattern while warning that symptom clusters are partly method-dependent. Biomarker integration will be needed before these groupings can become stable endotypes for trials. Online self-report recruitment and lack of objective measures remain the main limitations.
de:
  title: Patientengeführte Long-COVID-Clusterstudie zeigt stark belastete PEM-Gruppen, warnt aber vor Überinterpretation algorithmischer Phänotypen
  plain_summary: Eine Online-Analyse von 6.031 Erwachsenen mit Long COVID bestätigte eine schwer belastete Untergruppe mit ausgeprägter PEM, wobei verschiedene Rechenverfahren die Teilnehmenden unterschiedlich einteilten. Da die Beschwerden fließend ineinander übergehen und Biomarker fehlen, reichen reine Symptom-Cluster noch nicht für feste Subtypen.
  detail: Die Patient-Led Research Collaborative analysierte 162 selbstberichtete Symptome von 6.031 Erwachsenen mit Long COVID mithilfe dreier unüberwachter Clustering-Verfahren. Alle Methoden lieferten plausible Gruppen und fanden konsistent eine stark belastete Untergruppe mit häufiger schwerer PEM, jüngerem Alter und weiblichem Geschlecht; die Übereinstimmung zwischen den Algorithmen war jedoch gering, und die Symptomlandschaft wirkte eher kontinuierlich als scharf getrennt. Das Ergebnis ist nützlich, weil es PEM-betontes Long COVID als wiederkehrendes klinisches Muster bestätigt und zugleich davor warnt, Symptomcluster als feststehende Einheiten überzubewerten. Bevor solche Gruppierungen zu stabilen Endotypen für Studien werden, ist eine Einbindung von Biomarkern erforderlich. Online-Selbstberichte und fehlende objektive Messwerte bleiben die wichtigsten Einschränkungen.
