en:
  title: Preclinical metabolomics study indicates Ginseng stem-leaf saponins modulate brain-gut pathways in chronic fatigue syndrome mice
  plain_summary: In a mouse model of stress-induced fatigue, ginseng stem-leaf extracts partly shifted lipid and energy-related molecules in brain and stool samples. As an early animal biology study, it does not show whether ginseng extracts are safe or helpful in human ME/CFS.
  detail: A preclinical animal study published in the *Journal of Pharmaceutical and Biomedical Analysis* by Wu et al. evaluated the effects of Ginseng stem-leaf saponins (GSLS) in a chronic fatigue mouse model induced by a long-term forced-swimming protocol. Using untargeted metabolomics, the authors analyzed brain tissue and fecal samples, identifying 17 differential metabolites in the brain and 17 in feces. GSLS supplementation partially normalized metabolic abnormalities mapping to lipid-derived mediators, membrane-lipid remodeling, and energy/redox cofactor pathways. As a preclinical study in a mouse model, these findings represent early exploratory biology and do not demonstrate therapeutic efficacy or clinical safety in human patients.
de:
  title: Präklinische Metabolomik-Studie weist auf Modulation von Darm-Hirn-Signalwegen durch Ginseng-Saponine bei CFS-Mäusen hin
  plain_summary: In einem Mausmodell belastungsinduzierter Erschöpfung verschoben Extrakte aus Ginseng-Stängeln und -Blättern teilweise Lipid- und Energiestoffwechselprodukte in Hirn- und Kotproben. Als frühe Tierstudie belegt dies weder Sicherheit noch Nutzen für Menschen mit ME/CFS.
  detail: Eine präklinische Tierstudie von Wu et al. im *Journal of Pharmaceutical and Biomedical Analysis* untersuchte die Effekte von Ginseng-Stängel-Blatt-Saponinen (GSLS) in einem Mausmodell chronischer Fatigue, das durch ein langfristiges Schwimmprotokoll ausgelöst wurde. Mittels ungezielter Metabolomik analysierten die Autorinnen und Autoren Hirngewebe und Kotproben und identifizierten jeweils 17 veränderte Metaboliten im Gehirn und im Stuhl. Eine Supplementierung mit GSLS normalisierte Stoffwechselauffälligkeiten bei lipidabgeleiteten Mediatoren, Membranlipid-Umbau und Energie-/Redox-Kofaktorwegen teilweise. Als präklinische Untersuchung im Mausmodell spiegeln diese Befunde frühe explorative Biologie wider und belegen weder therapeutische Wirksamkeit noch klinische Sicherheit beim Menschen.
