en:
  title: Vascular Endothelial Dysfunction & Microclots
  subtitle: A living thread on endothelial impairment, circulating microclots, red blood cell deformability, hypercoagulability, fibrin amyloid fibrils, and microvascular perfusion.
  evidence_label: early clinical and mechanistic validation
  plain_summary: Researchers are investigating whether damaged blood vessel linings, stiffened red blood cells, and tiny persistent blood clots block oxygen delivery to muscles and organs in ME/CFS and Long COVID. While several studies link small-vessel problems to worse symptoms, recent negative findings in milder Long COVID cohorts show that clotting changes are not uniform across all patients or test methods. Because measurement techniques are not yet standardized and blood-thinning treatments carry real bleeding risks, clot-targeted therapies remain unproven.
  takeaway: 'Vascular endothelial dysfunction and microcirculatory impairment remain a plausible core mechanism linking fatigue, orthostatic symptoms, cognitive strain, and post-exertional worsening in ME/CFS and Long COVID. The model is no longer limited to isolated microclot reports. Newer work is layering together capillary structure, cerebral perfusion responses, extracellular-vesicle signals, platelet and complement activation, coagulation profiling, and now programmed cell-death pathways into a broader thrombo-inflammatory picture.


    The latest additions push the field toward multi-scale measurement and upstream pathway identification. A peer-reviewed study has linked necroptosis—a regulated form of inflammatory cell death—to persistent endothelial and immune dysfunction in Long COVID, suggesting that vascular barrier damage may be actively maintained by specific cell-death signaling rather than passively persisting after infection. A separate hypothesis paper proposes that capillary microclotting acts in concert with interstitial accumulation of viscous extracellular material (such as hyaluronan) to restrict both blood-side perfusion and tissue-side oxygen transfer, offering a dual-compartment model for peripheral symptoms. These join earlier multi-omics, capillaroscopy, and extracellular-vesicle work in building a broader mechanistic picture.


    A controlled EXPLAIN substudy in never-hospitalized Long COVID found no persistent prothrombotic pattern or excess fibrin(ogen)-cell membrane microaggregates. Its assay differs from amyloid-microclot methods, and the result does not settle all vascular mechanisms or apply directly to very severe ME/CFS. Clinical translation is still early. No blood-flow, microclot, necroptosis, or coagulation assay is ready to serve as a standalone diagnostic or treatment guide, and intervention evidence—whether targeting cell death pathways, clot clearance, or extracellular matrix compliance—remains preliminary.'
  why_it_matters: The identification of structural capillary alterations and circulating microclots shifts the understanding of post-infectious syndromes from subjective, descriptive conditions to defined, measurable endovascular diseases. Documenting physical barriers to oxygen transport—such as thickened basement membranes that hinder oxygen diffusion, narrowed vessel lumens, and stiffened red blood cells—provides a direct physiological explanation for the muscle oxygenation deficits and exercise intolerance observed in patient cohorts. Targeting these pathways opens concrete therapeutic options, including soluble guanylate cyclase stimulators to restore vasodilation, anti-NETosis agents or anticoagulants to address fibrinolysis-resistant microclots, and rheological treatments to enhance red blood cell deformability.
  state_of_evidence:
  - status: established
    label: Established
    items:
    - ME/CFS and Long COVID research continues to show reproducible signs of vascular dysregulation, including impaired perfusion, endothelial stress, abnormal clotting biology, and links between these changes and symptom burden.
  - status: plausible
    label: Plausible but early
    items:
    - Multi-scale approaches are gaining traction, with nailfold capillaroscopy, orthostatic cerebral flow measurements, extracellular-vesicle cargo, endothelial-platelet transcriptomic programs, thromboelastography, necroptosis-mediated endothelial injury, and interstitial matrix models all pointing toward thrombo-inflammatory perfusion problems. These signals are mechanistically coherent, but they are not yet standardized enough for routine use.
  - status: not_established
    label: Not established
    items:
    - It remains unclear whether microclots, endothelial injury, and platelet activation are primary disease drivers, downstream consequences, or only one branch of a broader multi-system process. TEG-guided management, anticoagulant strategies, and other clot-targeting interventions do not yet have robust controlled evidence in these populations. Static retinal microvascular metrics (such as OCTA vessel density and foveolar avascular zone) have not separated post-COVID patients from recovered controls, in contrast to dynamic functional retinal vessel analysis. Circulating NETosis markers were not raised in one long-duration, severe Long COVID cohort, so sampling timing and assay choice matter for the NET-scaffolded microclot model.
  - status: limitations
    label: Key limitations
    items:
    - Several important additions are conference-stage findings, small female-only biomarker cohorts, or review-level syntheses. Assay standardization remains a major barrier, especially for microclot detection, real-time coagulation profiling, and thromboelastography-based assessment across different laboratories.
  - status: negative
    label: Controlled negative finding
    items:
    - The EXPLAIN substudy found no persistent systemic hypercoagulability or excess fibrin(ogen)-cell membrane microaggregates in never-hospitalized Long COVID. Different aggregate methods, single-time-point sampling and unreported severe-patient inclusion limit comparisons with earlier positive reports.
  open_questions:
  - Are microclots, endothelial activation, and reduced red blood cell deformability primary drivers of tissue hypoperfusion or downstream consequences of immune and metabolic stress?
  - How can assays for fibrinaloid microclots, thromboelastography, and dynamic vascular testing be reliably standardized across independent laboratories?
  - Which patient subgroups—especially severely affected or criteria-defined ME/CFS cohorts—consistently show persistent microvascular or prothrombotic signatures?
  - Will targeted vascular, microcirculation, necroptosis-inhibiting, or anticoagulation approaches prove safe and effective in randomized controlled trials?
de:
  title: Vaskuläre Endotheldysfunktion & Mikrogerinnsel
  subtitle: Ein fortlaufender Forschungsstrang zu Funktionsstörungen der Gefäßinnenwand (Endothel), zirkulierenden Mikrogerinnseln, Verformbarkeit roter Blutkörperchen, Hyperkoagulabilität, Fibrin-Amyloid-Fibrillen und Mikrozirkulation.
  evidence_label: Frühe klinische und mechanistische Hinweise
  plain_summary: Forschende untersuchen, ob geschädigte Gefäßwände, steifere rote Blutkörperchen und winzige, schwer lösliche Gerinnsel die Sauerstoffversorgung von Muskeln und Organen bei ME/CFS und Long COVID behindern. Mehrere Studien verbinden Durchblutungsstörungen kleiner Gefäße mit stärkeren Beschwerden, doch jüngere Negativbefunde bei nicht-hospitalisierten Long-COVID-Kohorten zeigen, dass Gerinnungsveränderungen nicht bei allen Betroffenen und Tests gleichermaßen auftreten. Da die Messverfahren noch nicht einheitlich sind und Blutverdünner erhebliche Blutungsrisiken bergen, sind gerinnungshemmende Therapien bislang nicht belegt.
  takeaway: 'Funktionsstörungen der Gefäßinnenwand (Endothel) und der Mikrozirkulation bleiben ein plausibler Kernmechanismus, der Fatigue, Kreislaufbeschwerden, kognitive Einschränkungen und Belastungseinbrüche (PEM) bei ME/CFS und Long COVID verknüpfen könnte. Das Modell beschränkt sich längst nicht mehr auf einzelne Berichte über Mikrogerinnsel: Neuere Arbeiten fügen Kapillarstruktur, Reaktionen der Hirndurchblutung, Signale extrazellulärer Vesikel, Thrombozyten- und Komplementaktivierung, Gerinnungsprofile sowie regulierten Zelltod zu einem breiteren thrombo-inflammatorischen Gesamtbild zusammen.


    Jüngste Studien erweitern das Feld um Messungen auf mehreren Ebenen und vorgelagerte Signalwege. Eine begutachtete Studie verknüpft Nekroptose – eine regulierte, entzündungsfördernde Form des Zelltods – mit anhaltender Endothel- und Immundysfunktion bei Long COVID und legt nahe, dass Gefäßbarriereschäden aktiv durch Zelltod-Signale aufrechterhalten werden könnten. Ein separates Hypothesenpapier schlägt vor, dass kapilläre Mikrogerinnsel zusammen mit zähem extrazellulärem Material im Gewebezwischenraum (etwa Hyaluronan) sowohl den Blutfluss als auch den Sauerstoffübertritt ins Gewebe bremsen. Diese Ansätze ergänzen frühere Multi-Omics-, Kapillaroskopie- und Vesikel-Befunde.


    Dem steht eine kontrollierte EXPLAIN-Substudie bei nie hospitalisierten Long-COVID-Betroffenen gegenüber, die weder ein anhaltend prothrombotisches Muster noch vermehrte Fibrin(ogen)-Zellmembran-Mikroaggregate fand. Da sich deren Messverfahren von Amyloid-Mikrogerinnsel-Tests unterscheidet, widerlegt das Ergebnis zwar nicht alle Gefäßmechanismen und gilt nicht direkt für sehr schweres ME/CFS, zeigt aber Grenzen einer pauschalen Gerinnsel-Erklärung auf. Die klinische Übertragung steht noch am Anfang: Kein Durchblutungs-, Mikrogerinnsel-, Nekroptose- oder Gerinnungstest taugt bislang als alleinige Diagnostik oder Therapierichtschnur, und Interventionsdaten bleiben vorläufig.'
  why_it_matters: Der Nachweis struktureller Kapillarveränderungen und zirkulierender Mikrogerinnsel verschiebt das Verständnis postinfektiöser Syndrome von rein beschreibenden Symptomlisten hin zu messbaren Gefäßerkrankungen. Dokumentierte physische Hindernisse für den Sauerstofftransport – etwa verdickte Basalmembranen, verengte Kapillarlumina und weniger verformbare rote Blutkörperchen – liefern eine direkte physiologische Erklärung für die gestörte Muskelsauerstoffversorgung und Belastungsintoleranz. Solche Signalwege eröffnen konkrete Therapieansätze zur Prüfung in Studien, darunter Stimulatoren der löslichen Guanylatzyklase zur Gefäßerweiterung sowie Ansätze für Endothelschutz und Mikrozirkulation.
  state_of_evidence:
  - status: established
    label: Gesichert
    items:
    - Die Forschung zu ME/CFS und Long COVID zeigt wiederholt Hinweise auf vaskuläre Fehlregulation, darunter gestörte Gewebedurchblutung, Endothelstress und veränderte Gerinnungsbiologie, die mit der Symptomlast zusammenhängen.
  - status: plausible
    label: Plausibel, aber noch früh
    items:
    - 'Mehrschichtige Untersuchungsansätze gewinnen an Gewicht: Nagelfalzkapillaroskopie, orthostatische Hirndurchblutungsmessungen, Fracht extrazellulärer Vesikel, Endothel-Thrombozyten-Genprogramme, Thromboelastographie, Nekroptose-vermittelte Endothelschäden und Gewebematrix-Modelle weisen gemeinsam auf thrombo-inflammatorische Durchblutungsstörungen hin. Diese Signale sind mechanistisch stimmig, aber noch nicht ausreichend für den Routineeinsatz standardisiert.'
  - status: not_established
    label: Nicht gesichert
    items:
    - Unklar bleibt, ob Mikrogerinnsel, Endothelschäden und Thrombozytenaktivierung primäre Krankheitstreiber, nachgeschaltete Folgen oder nur ein Zweig eines größeren Systemprozesses sind. Für TEG-gestützte Therapien, Antikoagulanzien oder andere gerinnselgerichtete Behandlungen fehlt belastbare kontrollierte Evidenz. Statische Netzhaut-Gefäßmaße (wie OCTA-Gefäßdichte) trennten Post-COVID-Betroffene anders als dynamische Flimmerlicht-Messungen nicht von Genesenen. Zirkulierende NETose-Marker waren in einer langjährigen schweren Long-COVID-Kohorte nicht erhöht, sodass Zeitpunkt und Testmethode entscheidend sind.
  - status: limitations
    label: Wesentliche Einschränkungen
    items:
    - Mehrere wichtige Beiträge sind Konferenzdaten, kleine reine Frauenkohorten oder Übersichtsarbeiten. Die fehlende Standardisierung zwischen Laboren – besonders beim Nachweis von Mikrogerinnseln und bei der Thromboelastographie – bleibt ein Haupthindernis.
  - status: negative
    label: Kontrollierter Negativbefund
    items:
    - Die EXPLAIN-Substudie fand bei nie hospitalisiertem Long COVID weder eine anhaltende Hyperkoagulabilität noch vermehrte Fibrin(ogen)-Zellmembran-Mikroaggregate. Abweichende Aggregat-Methoden, ein einzelner Messzeitpunkt und unklare Einschlüsse schwer Betroffener schränken den direkten Vergleich mit früheren positiven Berichten ein.
  open_questions:
  - Sind Mikrogerinnsel, Endothelaktivierung und veränderte Blutkörperchen-Verformbarkeit primäre Auslöser von Gewebeminderdurchblutung oder Folgeerscheinungen von Immun- und Stoffwechselstress?
  - Wie lassen sich Nachweismethoden für Mikrogerinnsel, Thromboelastographie und dynamische Gefäßtests zwischen Laboren zuverlässig standardisieren?
  - Welche Untergruppen von Betroffenen – insbesondere schwer erkrankte oder ME/CFS-definierte Kohorten – weisen tatsächlich anhaltende mikrovaskuläre oder prothrombotische Signaturen auf?
  - Erweisen sich gezielte Ansätze wie Endothel- oder Mikrozirkulations-Therapien, Nekroptose-Hemmung oder gerinnungsmodulierende Verfahren in randomisierten kontrollierten Studien als sicher und wirksam?
