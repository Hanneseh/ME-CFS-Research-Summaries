en:
  title: Norwegian national registry study finds ME/CFS healthcare costs nearly three times higher than general population controls
  plain_summary: A nationwide Norwegian registry study found that healthcare costs for diagnosed ME/CFS patients are almost three times higher than in a random population sample, driven heavily by hospital care despite no established curative treatment. Because the study relies on coded registry diagnoses, undiagnosed or bedbound patients unable to reach clinics may be missed.
  detail: |-
    Anthun, Halvorsen, and Melby conducted a retrospective population-based study linking individual-level Norwegian national registries for hospital treatments, general practitioner (GP) visits, and municipal primary care. They compared patients diagnosed with ME/CFS against a random general-population sample as well as cohorts diagnosed with Lyme disease, breast cancer, or fibromyalgia, estimating total hospital costs alongside tariff- and average-based GP and primary care costs. Overall, patients with ME/CFS used healthcare services more than the random population sample—with healthcare costs nearly three times higher—but less than several comparable chronic conditions and at lower total cost than breast cancer. Hospital treatments accounted for a particularly large share of utilization and spending even though no established curative therapy exists, prompting the authors to highlight comorbidity management and ask whether parts of care could be delivered more appropriately outside hospitals. Key caveats apply: this summary draws on the peer-reviewed accepted early-access abstract (before final Version of Record copyediting), registry-based case identification depends on recorded diagnostic codes and therefore misses undiagnosed patients as well as severely affected or bedbound individuals with limited healthcare access (see [Severe ME/CFS Care](thread:severe-mecfs-care)), and direct healthcare spending excludes indirect societal costs such as lost income and informal caregiving.
de:
  title: Norwegische landesweite Registerstudie zeigt fast dreifach höhere Gesundheitskosten bei ME/CFS gegenüber der Allgemeinbevölkerung
  plain_summary: Eine landesweite Registerstudie aus Norwegen zeigt, dass die Gesundheitskosten bei diagnostiziertem ME/CFS fast dreimal so hoch sind wie in einer zufälligen Bevölkerungsstichprobe – stark getrieben durch Krankenhausbehandlungen trotz fehlender etablierter Therapie. Da die Analyse auf codierten Registerdiagnosen beruht, können undiagnostizierte oder bettlägerige Betroffene ohne Klinikzugang untererfasst sein.
  detail: |-
    Anthun, Halvorsen und Melby führten eine retrospektive, bevölkerungsbasierte Studie durch, die personenbezogene Daten norwegischer Nationalregister zu Krankenhausbehandlungen, Hausarztkontakten und kommunaler Primärversorgung verknüpfte. Sie verglichen Patientinnen und Patienten mit ME/CFS-Diagnose mit einer zufälligen Bevölkerungsstichprobe sowie Vergleichsgruppen mit Borreliose, Brustkrebs oder Fibromyalgie und berechneten die Krankenhausgesamtkosten sowie tarif- und durchschnittsbasiert geschätzte Kosten in der Hausarzt- und Primärversorgung. Insgesamt nahmen ME/CFS-Betroffene mehr Gesundheitsleistungen in Anspruch als die Zufallsstichprobe – bei fast dreimal so hohen Gesundheitskosten –, nutzten jedoch weniger Leistungen als manche andere chronische Diagnosegruppen und verursachten geringere Gesamtkosten als Brustkrebspatientinnen. Nutzung und Kosten waren besonders im Krankenhausbereich hoch, obwohl es keine etablierte heilende Behandlung gibt; die Autorinnen und Autoren fordern daher mehr Aufmerksamkeit für Begleiterkrankungen und eine Prüfung, welche Versorgung besser außerhalb von Kliniken erfolgen könnte. Wichtige Einschränkungen sind zu beachten: Die Angaben stützen sich auf das begutachtete Early-Access-Abstract vor der endgültigen Druckfassung, registerbasierte Falldefinitionen über Diagnosecodes übersehen undiagnostizierte sowie schwerstbetroffene oder bettlägerige Menschen ohne regelmäßigen Zugang zu Praxen und Kliniken (siehe [Versorgung bei schwerem ME/CFS](thread:severe-mecfs-care)), und indirekte gesellschaftliche Kosten wie Erwerbsausfall und familiäre Pflege sind nicht enthalten.
