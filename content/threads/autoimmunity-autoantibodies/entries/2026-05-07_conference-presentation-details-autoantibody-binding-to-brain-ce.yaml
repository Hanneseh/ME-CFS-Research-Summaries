en:
  title: Conference presentation details autoantibody binding to brain cells
  plain_summary: At a 2026 Berlin conference, researchers reported that blood antibodies from some post-COVID ME/CFS patients bound to lab-grown brain cells, with stronger binding tracking worse neurological symptoms. This is preliminary, un-peer-reviewed dish work and does not test whether those antibodies cross into the living brain.
  detail: At the International ME/CFS Conference 2026 in Berlin, Germany, Dr. Marlen Alisch (ECRC Charité/MDC Berlin) presented in vitro research titled "Effects of Autoantibodies on Neuronal Function" demonstrating that serum IgG autoantibodies from a subset of post-COVID ME/CFS patients show increased binding to cultivated central nervous system (CNS) neurons. Furthermore, serum from all tested patients showed enhanced IgG binding to astrocytes, with binding intensity correlating with the severity of patients' neurological clinical symptoms. This suggests a potential biological mechanism for neuroinflammation and cognitive symptoms. However, as preliminary conference data, these findings have not yet undergone formal peer review. Additionally, in vitro studies of cultured cells do not account for blood-brain barrier dynamics, and further validation in larger, well-defined clinical cohorts is required.
de:
  title: Konferenzvortrag beschreibt Autoantikörperbindung an Gehirnzellen
  plain_summary: Auf einer Berliner Konferenz 2026 berichteten Forschende, dass Blut-Antikörper einiger Betroffener mit Post-COVID-ME/CFS an im Labor gezüchtete Gehirnzellen banden, wobei stärkere Bindung mit schwereren neurologischen Symptomen einherging. Es handelt sich um vorläufige, noch nicht begutachtete Zellkulturdaten, die nicht prüfen, ob die Antikörper die Blut-Hirn-Schranke im Menschen überwinden.
  detail: Auf der International ME/CFS Conference 2026 in Berlin stellte Dr. Marlen Alisch (ECRC Charité/MDC Berlin) In-vitro-Forschung mit dem Titel „Effects of Autoantibodies on Neuronal Function“ vor, die zeigt, dass Serum-IgG-Autoantikörper einer Teilgruppe von Patientinnen und Patienten mit Post-COVID-ME/CFS eine verstärkte Bindung an kultivierte Neuronen des zentralen Nervensystems (ZNS) aufweisen. Zudem zeigte Serum aller getesteten Betroffenen eine verstärkte IgG-Bindung an Astrozyten, wobei die Bindungsintensität mit der Schwere der neurologischen klinischen Symptome korrelierte. Dies deutet auf einen möglichen biologischen Mechanismus für Neuroinflammation und kognitive Symptome hin. Als vorläufige Konferenzdaten haben diese Befunde jedoch noch kein formelles Peer-Review durchlaufen. Darüber hinaus berücksichtigen In-vitro-Studien an kultivierten Zellen die Dynamik der Blut-Hirn-Schranke nicht, und eine weitere Validierung in größeren, klar definierten klinischen Kohorten ist erforderlich.
