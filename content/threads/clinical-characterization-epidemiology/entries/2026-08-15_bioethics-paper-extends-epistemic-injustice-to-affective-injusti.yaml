en:
  title: Bioethics paper extends epistemic injustice to affective injustice in ME/CFS care
  plain_summary: A bioethics paper described how medical disbelief not only dismisses ME/CFS patients' symptom reports, but also pressures them to hide distress so doctors take them seriously. It offers an ethical framework rather than clinical or biological data.
  detail: A peer-reviewed bioethics analysis by Sven Walter in *Medicine, Health Care and Philosophy* examined the systemic harms of clinical disbelief in ME/CFS care. Moving beyond epistemic injustice—where patients are dismissed as unreliable informants—the paper introduced the concept of affective injustice to describe how institutional disbelief polices and distorts patients' emotional lives. The author outlined structural mechanisms including the pathologization of legitimate distress as psychiatric illness, the denial of emotional validation by clinicians, and the forced emotional labor required of patients to appear calm and compliant to secure basic care. This framework articulates how medical skepticism imposes an unacknowledged psychological and iatrogenic burden that compounds the physical severity of ME/CFS. As a conceptual philosophical analysis, the paper provides no empirical cohort datasets, biological biomarkers, or therapeutic evaluations, and should not be interpreted
    as clinical trial evidence.
de:
  title: Bioethik-Beitrag erweitert epistemische Ungerechtigkeit in der ME/CFS-Versorgung um affektive Ungerechtigkeit
  plain_summary: Ein bioethischer Fachartikel beschreibt, wie medizinisches Misstrauen nicht nur die Symptomberichte von ME/CFS-Betroffenen abwertet, sondern sie auch zwingt, ihre Belastung zu verbergen, um ernst genommen zu werden. Die Arbeit bietet eine ethische Analyse ohne klinische oder biologische Daten.
  detail: Eine in Medicine, Health Care and Philosophy veröffentlichte bioethische Analyse von Sven Walter untersuchte systemische Schäden durch klinischen Unglauben in der ME/CFS-Versorgung. Über die epistemische Ungerechtigkeit hinaus – bei der Betroffene als unzuverlässige Berichtende abgetan werden – führte der Beitrag das Konzept der affektiven Ungerechtigkeit ein, um zu beschreiben, wie institutioneller Zweifel das Gefühlsleben von Patientinnen und Patienten reguliert und verzerrt. Benannt werden Mechanismen wie die Psychiatrisierung berechtigter Not, fehlende emotionale Anerkennung durch Behandelnde sowie die erzwungene Emotionsarbeit, ruhig und gefügig zu wirken, um überhaupt Basisversorgung zu erhalten. Dieser Rahmen zeigt, wie medizinische Skepsis eine zusätzliche iatrogene Belastung erzeugt; als philosophisch-konzeptionelle Arbeit liefert der Artikel jedoch keine empirischen Kohorten-, Biomarker- oder Therapiedaten.
