en:
  title: Representative New York City survey estimates a substantial PEM burden after COVID-19
  plain_summary: A representative survey of 9,620 New York City adults with prior COVID-19 estimated PEM symptoms in about 21% overall and 42% among those with Long COVID, strongly linked to disability. Because it relied on self-reported survey answers, it estimates symptom burden rather than confirmed clinical diagnoses.
  detail: A probability-weighted survey of 9,620 New York City adults with prior COVID-19 estimated PEM symptoms in 20.9% of respondents, rising to 42.3% among those reporting Long COVID; prolonged PEM lasting at least 14 hours was estimated at 4.0%. PEM was associated with substantially higher WHODAS disability scores and higher screening risk for anxiety and depression, with longer PEM linked to greater disability. Remote web, mobile, and telephone collection reduced travel and exertion burden and likely reached some housebound people, but strictly bedbound numbers and ME/CFS staging were not reported. The cross-sectional, self-reported survey did not provoke PEM or test treatment efficacy, and its prevalence estimates should not be treated as a clinical diagnosis.
de:
  title: Repräsentative New-York-City-Umfrage schätzt erhebliche PEM-Belastung nach COVID-19
  plain_summary: Eine repräsentative Befragung von 9.620 Erwachsenen in New York City nach COVID-19 schätzte PEM-Symptome auf rund 21 % insgesamt und 42 % bei Menschen mit Long COVID, deutlich verknüpft mit Alltagsbehinderung. Da die Daten auf Selbstauskünften beruhen, schätzen sie Symptomlast statt ärztlicher Diagnosen.
  detail: Eine wahrscheinlichkeitsgewichtete Befragung von 9.620 Erwachsenen in New York City mit früherer COVID-19-Infektion schätzte PEM-Symptome bei 20,9 % der Befragten – mit einem Anstieg auf 42,3 % bei Personen, die Long COVID angaben; länger anhaltende PEM von mindestens 14 Stunden wurde auf 4,0 % geschätzt. PEM ging mit deutlich höheren WHODAS-Behinderungswerten sowie höheren Screening-Werten für Angst und Depression einher, wobei längere PEM mit stärkerer Einschränkung korrelierte. Die Erhebung per Web, Smartphone und Telefon verringerte Reise- und Belastungsaufwand und erreichte wohl auch einige Hausgebundene, doch wurden streng bettlägerige Anteile und ME/CFS-Stadien nicht berichtet. Die querschnittliche Selbstberichts-Umfrage löste keine PEM aus, prüfte keine Therapien und ersetzt keine klinische Diagnose.
