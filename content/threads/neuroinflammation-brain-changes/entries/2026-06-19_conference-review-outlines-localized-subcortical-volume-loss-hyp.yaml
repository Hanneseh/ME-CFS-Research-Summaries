en:
  title: Conference review outlines localized subcortical volume loss, hypoperfusion, and metabolic alterations
  plain_summary: In a 2026 Berlin conference review, researchers summarized scan evidence of smaller deep-brain structures, lower brain blood flow, and altered energy chemicals in ME/CFS and post-COVID syndrome, plus early HBOT scan observations. Because many referenced studies and the 30-person pilot were small, larger controlled peer-reviewed trials are still needed.
  detail: Prof. Dr. Carsten Finke presented a comprehensive summary of neuroimaging findings in ME/CFS and post-COVID syndrome at the International ME/CFS Conference 2026 in Berlin. The presentation detailed structural MRI evidence of localized volume reductions in the thalamus and pallidum, alongside diffusion tensor imaging (DTI) white matter changes that correlate with physical fatigue. Functional resting-state MRI showed reduced connectivity within default mode network (DMN), hippocampal, and thalamic circuits, while arterial spin labeling (ASL) documented regional cerebral hypoperfusion correlating with symptom severity. Additionally, 7-Tesla MR spectroscopy (MRS) revealed metabolic abnormalities (elevated lactate and glutamate, reduced choline) indicating impaired energy metabolism. A pilot study of 30 patients also suggested that hyperbaric oxygen therapy (HBOT) might normalize elevated thalamic connectivity, though these preliminary findings are based on small cohorts and require
    large-scale, peer-reviewed replication before clinical adoption.
de:
  title: Konferenzübersicht skizziert lokalisierten subkortikalen Volumenverlust, Hypoperfusion und Stoffwechselveränderungen
  plain_summary: In einem Berliner Konferenzvortrag 2026 fasste ein Forschungsteam Scan-Befunde zu verkleinerten Tiefenhirnstrukturen, geringerer Hirndurchblutung und veränderten Energiemetaboliten zusammen, ergänzt durch frühe HBOT-Daten. Da viele der zugrunde liegenden Studien und die 30-Personen-Pilotstudie klein waren, sind größere begutachtete Studien erforderlich.
  detail: Prof. Dr. Carsten Finke präsentierte auf der International ME/CFS Conference 2026 in Berlin eine umfassende Zusammenfassung von Bildgebungsbefunden bei ME/CFS und Post-COVID-Syndrom. Der Vortrag beschrieb strukturelle MRT-Befunde lokaler Volumenminderungen in Thalamus und Pallidum sowie Veränderungen der weißen Substanz in der Diffusions-Tensor-Bildgebung (DTI), die mit körperlicher Fatigue korrelieren. Funktionelle Ruhe-MRT zeigte eine verringerte Konnektivität innerhalb von Schaltkreisen des Default Mode Network (DMN), des Hippocampus und des Thalamus, während Arterial Spin Labeling (ASL) eine regionale zerebrale Hypoperfusion dokumentierte, die mit dem Schweregrad der Symptome zusammenhing. Zudem deckte die 7-Tesla-MR-Spektroskopie (MRS) metabolische Auffälligkeiten auf (erhöhtes Laktat und Glutamat, verringertes Cholin), die auf einen beeinträchtigten Energiestoffwechsel hinweisen. Eine Pilotstudie mit 30 Patientinnen und Patienten deutete zudem an, dass eine hyperbare Sauerstofftherapie
    (HBOT) eine erhöhte thalamische Konnektivität normalisieren könnte, wobei diese vorläufigen Befunde auf kleinen Kohorten beruhen und vor einer klinischen Übernahme eine groß angelegte, begutachtete Replikation erfordern.
