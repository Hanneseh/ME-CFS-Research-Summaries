en:
  title: Multimodal ME/CFS subgrouping protocol combines immune, autonomic, neuroinflammatory, gut, and stress-response measures
  plain_summary: Belgian researchers outlined a study plan to test immune, brain-scan, autonomic, and gut-microbiome data in 115 ME/CFS patients to look for biological subgroups. No results are out yet, and its later follow-up through routine CBT rehabilitation cannot isolate treatment effects.
  detail: A KU Leuven and Hasselt University protocol describes a cross-sectional and longitudinal study enrolling 115 ME/CFS patients and 55 controls to identify neuropsychophysiological subgroups. The baseline design combines systemic cytokines, heart-rate variability, MRS and PET neuroinflammation measures, gut microbiota, short-chain fatty acids, stress-response testing, cognitive and physical fatigability, and 7-day experience sampling. The longitudinal phase follows patients through routine clinical CBT rehabilitation, which makes treatment-response interpretation open-label and expectation-sensitive. The study is valuable as a characterization design because it explicitly tests whether multimodal signals can define subgroups instead of treating ME/CFS as one homogeneous cohort. No outcome data are available yet.
de:
  title: Multimodales ME/CFS-Subgruppen-Protokoll verknüpft Immun-, autonome, Neuroinflammations-, Darm- und Stressmessungen
  plain_summary: Belgische Forschende haben ein Studienprotokoll vorgestellt, das bei 115 ME/CFS-Betroffenen Immun-, Hirnscan-, Kreislauf- und Darmmikrobiom-Daten zur Suche nach biologischen Untergruppen kombiniert. Ergebnisse liegen noch nicht vor, und die spätere Begleitung während üblicher KVT-Reha erlaubt keine verblindete Therapiebewertung.
  detail: Ein Studienprotokoll der KU Leuven und der Universität Hasselt beschreibt eine Querschnitts- und Längsschnittstudie mit 115 ME/CFS-Patientinnen und -Patienten sowie 55 Kontrollpersonen zur Identifikation neuropsychophysiologischer Untergruppen. Das Ausgangsdesign kombiniert systemische Zytokine, Herzratenvariabilität, MRS- und PET-Messungen der Neuroinflammation, Darmmikrobiota, kurzkettige Fettsäuren, Stressreaktionstests, kognitive und körperliche Ermüdbarkeit sowie ein 7-tägiges Experience Sampling. In der Längsschnittphase werden Teilnehmende durch die reguläre klinische KVT-Rehabilitation begleitet, was die Interpretation des Therapieansprechens offen und erwartungssensitiv macht. Als Charakterisierungsdesign ist die Studie wertvoll, weil sie ausdrücklich prüft, ob multimodale Signale Untergruppen abgrenzen statt ME/CFS als einheitliche Kohorte zu behandeln. Ergebnisdaten liegen noch nicht vor.
