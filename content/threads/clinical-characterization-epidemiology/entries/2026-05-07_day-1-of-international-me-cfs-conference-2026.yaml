en:
  title: Day 1 of International ME/CFS Conference 2026 in Berlin surfaces genetics, neuroimaging, and metabolic convergence
  plain_summary: Talks on day one of the 2026 Berlin ME/CFS conference pointed to converging findings across genetics, brain inflammation scans, and exercise-related lactate shifts. These are preliminary conference reports that have not yet passed peer review.
  detail: 'A live social-media thread summarising the first day of the International ME/CFS Conference in Berlin covered 19 presentations from global researchers spanning genetics, neuroimaging, immunology, and metabolic dysfunction. Highlights included neural tissue enrichment of DecodeME genetic signals, distinct autoimmune endotypes from immune profiling, neuroinflammation evidenced by TSPO-PET imaging and white matter MRI, impaired brain energy metabolism measured by phosphorus MRS, and distinct lactate recovery trajectories after exertion in ME/CFS and post-infectious cohorts. The conference-level context matters for clinical characterization because it shows where the field''s subtyping efforts are converging: researchers from multiple independent groups are pointing to similar biological disruptions using different measurement modalities, which strengthens the case for pathological consistency even without yet having validated biomarkers. These are preliminary data from ongoing projects
    and have not yet completed full peer review.'
de:
  title: Tag 1 der Internationalen ME/CFS-Konferenz 2026 in Berlin zeigt Annäherung bei Genetik, Bildgebung und Stoffwechsel
  plain_summary: Vorträge am ersten Tag der Berliner ME/CFS-Konferenz 2026 zeigten übereinstimmende Hinweise aus Genetik, Hirnbildgebung und Laktatveränderungen nach Belastung. Es handelt sich um vorläufige Konferenzberichte, die noch kein Peer-Review durchlaufen haben.
  detail: 'Ein Live-Thread in sozialen Medien fasste den ersten Tag der Internationalen ME/CFS-Konferenz in Berlin mit 19 Vorträgen internationaler Forschender zu Genetik, Neurobildgebung, Immunologie und Stoffwechselstörungen zusammen. Zu den Höhepunkten gehörten eine Anreicherung genetischer DecodeME-Signale in Nervengewebe, abgrenzbare autoimmune Endotypen in Immunprofilen, Hinweise auf Neuroinflammation mittels TSPO-PET und MRT der weißen Substanz, ein gestörter Hirnenergiestoffwechsel in der Phosphor-MRS sowie abweichende Laktat-Erholungsverläufe nach Belastung bei ME/CFS und postinfektiösen Kohorten. Für die klinische Charakterisierung ist dieser Konferenzüberblick wichtig, weil er zeigt, wo Subtypisierungsansätze zusammenlaufen: Mehrere unabhängige Gruppen weisen mit unterschiedlichen Messmethoden auf ähnliche biologische Störungen hin, was für ein konsistentes Krankheitsbild spricht – auch wenn validierte Biomarker noch fehlen. Es handelt sich um vorläufige Daten laufender Projekte
    ohne abgeschlossenes Peer-Review.'
