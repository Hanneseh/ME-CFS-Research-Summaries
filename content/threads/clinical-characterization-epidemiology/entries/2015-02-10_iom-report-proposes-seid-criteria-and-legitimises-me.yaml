en:
  title: IOM report proposes SEID criteria and legitimises ME/CFS as a systemic disease
  plain_summary: A landmark U.S. expert report defined core diagnostic criteria centered on exertion intolerance (PEM), unrefreshing sleep, and cognitive or upright-posture problems. While it did not deliver a lab test or change all terminology, it established ME/CFS as a real systemic illness and still underpins modern diagnostic standards.
  detail: The Institute of Medicine commissioned a 15-member expert committee to resolve the longstanding proliferation of conflicting case definitions. After reviewing literature back to 1950 and taking testimony from patients and researchers, the committee proposed three required core symptoms—substantially reduced activity lasting more than six months with profound new-onset fatigue not alleviated by rest, post-exertional malaise, and unrefreshing sleep—plus at least one of cognitive impairment or orthostatic intolerance. The committee also concluded that neither of the existing names served the illness well, proposing "systemic exertion intolerance disease" (SEID) as an alternative, a name that has not been widely adopted but whose rationale—centering exertion intolerance—has influenced subsequent clinical guidance. The report simultaneously flagged that between 84 and 91 percent of patients remained undiagnosed and that the research funding base was inadequate to support subgroup work
    or natural history studies. It remains the most widely cited modern framework for what a minimum case definition must include.
de:
  title: IOM-Bericht schlägt SEID-Kriterien vor und erkennt ME/CFS als Systemerkrankung an
  plain_summary: Ein wegweisender US-Fachbericht definierte zentrale Diagnosekriterien rund um Belastungsintoleranz (PEM), nicht erholsamen Schlaf sowie kognitive oder Kreislaufbeschwerden im Stehen. Einen Labortest lieferte er nicht, verankerte ME/CFS aber als ernsthafte Systemerkrankung und prägt moderne Diagnosemaßstäbe bis heute.
  detail: 'Das Institute of Medicine setzte ein 15-köpfiges Expertengremium ein, um die lange bestehende Vielzahl widersprüchlicher Falldefinitionen zu ordnen. Nach Auswertung der Literatur bis zurück ins Jahr 1950 und Anhörungen von Betroffenen und Forschenden schlug das Gremium drei verpflichtende Kernsymptome vor – eine länger als sechs Monate anhaltende, deutliche Einschränkung der Aktivität mit ausgeprägter neu aufgetretener und durch Ruhe nicht zu lindernder Fatigue, Post-Exertional Malaise sowie nicht erholsamen Schlaf – ergänzt durch mindestens eines von zwei weiteren Merkmalen: kognitive Beeinträchtigung oder orthostatische Intoleranz. Das Gremium kam zudem zu dem Schluss, dass keiner der bisherigen Namen der Erkrankung gerecht werde, und schlug als Alternative „systemic exertion intolerance disease“ (SEID) vor; dieser Name hat sich zwar nicht breit durchgesetzt, doch sein Grundgedanke – die Belastungsintoleranz ins Zentrum zu stellen – hat nachfolgende klinische Leitlinien geprägt.
    Zugleich wies der Bericht darauf hin, dass zwischen 84 und 91 Prozent der Betroffenen ohne Diagnose blieben und die Forschungsförderung für Subgruppen- oder Verlaufsstudien unzureichend war. Er bleibt der meistzitierte moderne Referenzrahmen dafür, was eine Mindest-Falldefinition umfassen muss.'
