en:
  title: Austrian PAIS/PEM guidance defines PEM and POTS assessment for primary care
  plain_summary: Austrian primary-care guidance clearly defines PEM as delayed post-effort worsening—not deconditioning—and outlines practical screening for PEM and POTS. It is expert clinical guidance rather than trial data, and warns against graded exercise when PEM is present.
  detail: The Tiroler Gesellschaft für Allgemeinmedizin and the PAIS Quality Circle of the Tyrolean Medical Chamber published clinical guidance on PEM in post-acute infection syndromes. The document defines PEM as delayed, disproportionate symptom worsening after physical or mental exertion, emphasizes that PEM is not deconditioning and is not reversed by training, and recommends tools such as DSQ-PEM and FUNCAP55 for screening. It also outlines POTS criteria and a staged laboratory-workup framework based on illness duration. The guidance is expert-consensus and living-document material rather than trial evidence, but it is useful for primary care because it translates PEM and orthostatic assessment into practical steps. Its central safety message is that active or graded rehabilitation is inappropriate when PEM is present.
de:
  title: Österreichische PAIS-/PEM-Handreichung definiert PEM- und POTS-Abklärung für die Hausarztpraxis
  plain_summary: Eine österreichische Praxishilfe definiert PEM klar als verzögerte Verschlechterung nach Belastung – nicht als Trainingsmangel – und skizziert alltagstaugliche Tests für PEM und POTS. Es handelt sich um einen ärztlichen Praxisleitfaden ohne eigene Studiendaten, der bei PEM vor aktivierender Reha warnt.
  detail: Die Tiroler Gesellschaft für Allgemeinmedizin und der PAIS-Qualitätszirkel der Ärztekammer für Tirol veröffentlichten eine klinische Handreichung zu PEM bei postakuten Infektionssyndromen. Das Dokument definiert PEM als verzögerte, unverhältnismäßige Symptomverschlechterung nach körperlicher oder geistiger Anstrengung, betont, dass PEM keine Dekonditionierung ist und sich nicht durch Training beheben lässt, und empfiehlt Instrumente wie DSQ-PEM und FUNCAP55 zum Screening. Zudem beschreibt es POTS-Kriterien sowie ein gestuftes Laborprogramm je nach Krankheitsdauer. Die Handreichung ist Expertenkonsens und ein fortlaufend aktualisiertes Arbeitsdokument statt neuer Studiendaten, hilft aber in der Primärversorgung, weil sie PEM- und Kreislaufabklärung in konkrete Praxisschritte übersetzt. Ihre zentrale Sicherheitsaussage lautet, dass aktive oder stufenweise gesteigerte Rehabilitation bei vorliegender PEM ungeeignet ist.
