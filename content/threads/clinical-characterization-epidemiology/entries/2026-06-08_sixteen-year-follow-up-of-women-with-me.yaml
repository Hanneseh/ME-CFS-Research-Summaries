en:
  title: Sixteen-year follow-up of women with ME/CFS shows long-term comorbidity and worsening fatigue burden
  plain_summary: A 16-year follow-up of 20 women with ME/CFS in Serbia found worsening fatigue impact and high rates of new medical diagnoses over time. Because half the original group dropped out and there was no healthy comparison group, those rates cannot be generalized as population risk.
  detail: A Serbian longitudinal study followed 20 women with ME/CFS for 16 years after an original cohort of 40, finding that 85% developed at least one significant new somatic or psychiatric diagnosis and that fatigue impact worsened on follow-up measures. Reported new diagnoses included depression, rheumatoid arthritis, hypertension, cancer, asthma, premature myocardial infarction, and infertility. The study is clinically important because it argues against assuming ME/CFS is generally benign or self-limiting over long time horizons. Its small female-only sample, 50% loss to follow-up, and lack of a matched control group mean the comorbidity rates should not be read as population incidence estimates. The durable signal is that long-term follow-up and comorbidity surveillance matter.
de:
  title: 16-Jahres-Nachbeobachtung von Frauen mit ME/CFS zeigt Langzeit-Begleiterkrankungen und zunehmende Fatigue-Last
  plain_summary: Eine 16-jährige Nachbeobachtung von 20 Frauen mit ME/CFS in Serbien fand eine zunehmende Fatigue-Belastung und häufige neue Erkrankungen im Langzeitverlauf. Da die Hälfte der ursprünglichen Gruppe ausschied und eine Kontrollgruppe fehlte, lassen sich die Zahlen nicht als allgemeine Erkrankungsraten übertragen.
  detail: Eine serbische Längsschnittstudie begleitete 20 Frauen mit ME/CFS aus einer ursprünglichen Kohorte von 40 Teilnehmenden über 16 Jahre und stellte fest, dass 85 % mindestens eine bedeutende neue körperliche oder psychiatrische Diagnose entwickelten und die Fatigue-Belastung bei Folgeuntersuchungen zunahm. Zu den berichteten neuen Diagnosen gehörten Depression, rheumatoide Arthritis, Bluthochdruck, Krebs, Asthma, vorzeitiger Herzinfarkt und Unfruchtbarkeit. Klinisch ist die Studie wichtig, weil sie der Annahme widerspricht, ME/CFS verlaufe langfristig meist mild oder selbstlimitierend. Die kleine rein weibliche Stichprobe, 50 % Ausfall in der Nachbeobachtung und das Fehlen einer gematchten Kontrollgruppe bedeuten jedoch, dass die Komorbiditätsraten nicht als Bevölkerungs-Inzidenzen gelesen werden dürfen. Das belastbare Signal ist, dass langfristige Verlaufskontrollen und Aufmerksamkeit für Begleiterkrankungen wichtig bleiben.
