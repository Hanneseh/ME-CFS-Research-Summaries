en:
  title: ChronicleBio and Prolong plan a phase 2a trial of PP-007 in ME/CFS
  plain_summary: Two companies plan to test whether an infusion can help people with ME/CFS recover faster after a flare brought on by exertion. The first infusions are planned for mid-2027, and there are no results in ME/CFS yet.
  detail: |-
    ChronicleBio and Prolong Pharmaceuticals announced a partnership to study intravenous PP-007 (SANGUINATE), a PEGylated bovine carboxyhemoglobin designed to deliver oxygen to tissues and potentially support blood flow and modulate inflammation by releasing small amounts of carbon monoxide. The planned multicenter phase 2a trial would enroll at least 40 people with ME/CFS selected via ChronicleBio's proprietary AI precision-medicine platform using biomarker profiles that the companies hypothesize may indicate impaired oxygen delivery. The trial would give PP-007 during episodes of post-exertional malaise (PEM) and assess tissue oxygenation, recovery time, symptom severity and daily function. The companies anticipate first dosing in mid-2027. No public trial registration was identified at the time of the announcement, and the companies gave no details on a control arm or whether housebound or bedbound patients could enroll. Intravenous administration adds practical burden, particularly during PEM, and the announcement includes no safety or efficacy data in ME/CFS.
de:
  title: ChronicleBio und Prolong planen Phase-2a-Studie zu PP-007 bei ME/CFS
  plain_summary: Zwei Unternehmen wollen prüfen, ob sich Menschen mit ME/CFS nach einer belastungsbedingten Verschlechterung mit einer Infusion schneller erholen. Die ersten Infusionen sind für Mitte 2027 vorgesehen, Ergebnisse bei ME/CFS stehen noch aus.
  detail: |-
    ChronicleBio und Prolong Pharmaceuticals haben eine Partnerschaft zur Untersuchung von intravenösem PP-007 (SANGUINATE) angekündigt. Das PEGylierte Carboxyhämoglobin vom Rind soll Gewebe mit Sauerstoff versorgen und könnte durch die Freisetzung geringer Mengen Kohlenmonoxid die Durchblutung unterstützen und Entzündungsprozesse beeinflussen. Die geplante multizentrische Phase-2a-Studie soll mindestens 40 Menschen mit ME/CFS einschließen, die über die firmeneigene KI-Plattform von ChronicleBio anhand von Biomarkerprofilen ausgewählt werden sollen, die nach Annahme der Unternehmen auf eine beeinträchtigte Sauerstoffversorgung hindeuten könnten. Vorgesehen ist die Gabe während einer Phase von Post-Exertional Malaise (PEM), um die Sauerstoffversorgung des Gewebes, die Erholungszeit, die Stärke der Beschwerden und die Alltagsfunktion zu untersuchen. Die Unternehmen rechnen mit der ersten Gabe Mitte 2027. Zur Ankündigung war kein öffentlicher Registereintrag auffindbar, und die Unternehmen machten keine Angaben zu einer Kontrollgruppe oder zur Teilnahme von Haus- oder Bettgebundenen. Die intravenöse Gabe bedeutet zusätzlichen Aufwand, besonders während PEM, und die Ankündigung enthält keine Daten zur Sicherheit oder Wirksamkeit bei ME/CFS.
