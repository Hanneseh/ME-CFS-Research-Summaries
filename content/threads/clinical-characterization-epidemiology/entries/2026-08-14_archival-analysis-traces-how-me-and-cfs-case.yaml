en:
  title: Archival analysis traces how ME and CFS case definitions were built between 1950 and 1990
  plain_summary: A historical study traced how UK ME outbreak reports and 1980s US CFS panels shaped today's conflicting case definitions and clinical skepticism. It is humanities research with no new clinical or biological data.
  detail: A peer-reviewed sociohistorical analysis published in Medical Humanities examined how biomedical institutions constructed case definitions for myalgic encephalomyelitis and chronic fatigue syndrome between 1950 and 1990. The archival study traced the divergent origins of UK outbreak investigations of epidemic ME and the late-1980s US CDC consensus panels that formulated the initial CFS criteria. The author argued that health institutions systematically managed biomedical uncertainty by regulating diagnostic boundaries and producing epistemic obscurity around post-infectious disability. This analysis provides important institutional context for why diagnostic definitions remain historically contentious and how administrative categorizations shaped clinician skepticism and patient stigma. As a qualitative medical humanities work, the study contains no empirical biological or clinical cohort data and does not assess contemporary biomarker developments or post-2015 case definitions.
de:
  title: Archivstudie zeichnet nach, wie Falldefinitionen für ME und CFS zwischen 1950 und 1990 entstanden
  plain_summary: Eine medizinhistorische Archivstudie untersuchte, wie britische Ausbruchsberichte zu ME und US-Gremien der 1980er Jahre zu CFS die bis heute umstrittenen Falldefinitionen und ärztliche Skepsis prägten. Als geisteswissenschaftliche Arbeit enthält sie keine neuen klinischen oder biologischen Daten.
  detail: Eine in Medical Humanities veröffentlichte soziohistorische Analyse untersuchte, wie biomedizinische Institutionen zwischen 1950 und 1990 Falldefinitionen für Myalgische Enzephalomyelitis und Chronic Fatigue Syndrome konstruierten. Die Archivarbeit zeichnete die unterschiedlichen Ursprünge britischer Ausbruchsuntersuchungen zu epidemischer ME und der US-amerikanischen CDC-Konsensgruppen der späten 1980er Jahre nach, aus denen die ersten CFS-Kriterien hervorgingen. Der Autor argumentierte, Gesundheitsinstitutionen hätten wissenschaftliche Unsicherheit durch enge diagnostische Grenzziehungen verwaltet und damit Unklarheit rund um postinfektiöse Behinderung erzeugt. Dies liefert wichtigen institutionellen Kontext dafür, warum Definitionen historisch umstritten blieben und wie Verwaltungskategorien Skepsis und Stigma beförderten. Als qualitative medizinhistorische Arbeit enthält die Studie keine empirischen Kohortendaten und bewertet keine modernen Biomarker oder Kriterien nach 2015.
