en:
  title: Literature review maps the clinical profile and systemic burden of severe ME/CFS
  plain_summary: A review highlights how severe ME/CFS—including extreme light and sound sensitivity and difficulty eating—is routinely missed in research, accounting for only about 0.5% of published studies. While it adds no new patient data, it explains why standard hospital settings can harm severely ill patients and why home or adapted inpatient care is needed.
  detail: Vink and Vink-Niese published a comprehensive review in the Journal of Clinical Medicine documenting the clinical characteristics of severe and very severe ME/CFS, drawing on biomedical literature and international patient surveys. The review describes extreme sensory hypersensitivity in which even a soft voice or low-level light can trigger multi-day relapses, the prevalence of life-threatening malnutrition requiring tube feeding in a subset of very severely affected patients, and a high frequency of medical misattribution that delays appropriate care. The authors note that this subgroup is largely invisible in research — approximately 0.5% of ME/CFS publications focus on severe cases despite those patients bearing some of the greatest disease burden — and that two-day CPET and other physiologic tools can objectively characterise functional collapse even when standard resting assessments appear unremarkable. The review does not add new primary data, but it consolidates the clinical
    picture needed to understand why standard care environments cause harm and why specialist inpatient and outreach approaches are a prerequisite rather than a luxury.
de:
  title: Übersichtsarbeit beschreibt klinisches Profil und systemische Belastung bei schwerem ME/CFS
  plain_summary: Eine Übersichtsarbeit zeigt, wie stark schweres ME/CFS – etwa mit extremer Licht- und Geräuschempfindlichkeit oder schwerer Mangelernährung – in der Forschung übersehen wird und nur rund 0,5 % aller Publikationen ausmacht. Sie liefert keine neuen Originaldaten, macht aber verständlich, warum herkömmliche Kliniken schwer Betroffenen schaden können und spezialisierte stationäre oder aufsuchende Konzepte nötig sind.
  detail: Vink und Vink-Niese veröffentlichten im *Journal of Clinical Medicine* eine umfassende Übersichtsarbeit, die auf Basis biomedizinischer Literatur und internationaler Patientenumfragen das klinische Bild des schweren und sehr schweren ME/CFS dokumentiert. Die Arbeit beschreibt extreme sensorische Überempfindlichkeiten, bei denen schon eine leise Stimme oder schwaches Licht mehrtägige Rückfälle auslösen kann, das Auftreten lebensbedrohlicher Mangelernährung mit Bedarf an Sondenernährung bei einem Teil der sehr schwer Betroffenen sowie häufige medizinische Fehldeutungen, die eine angemessene Versorgung verzögern. Die Autoren weisen darauf hin, dass diese Untergruppe in der Forschung weitgehend unsichtbar ist – nur etwa 0,5 % der ME/CFS-Publikationen befassen sich mit schweren Fällen, obwohl diese Patientinnen und Patienten einen besonders großen Teil der Krankheitslast tragen – und dass zweitägige CPET-Tests oder andere physiologische Messverfahren funktionelle Einbrüche objektiv
    abbilden können, selbst wenn Ruheuntersuchungen unauffällig wirken. Die Übersichtsarbeit fügt keine neuen Primärdaten hinzu, bündelt aber das klinische Gesamtbild, das erklärt, warum Standardkliniken Schaden anrichten können und warum spezialisierte stationäre sowie aufsuchende Konzepte keine Luxuslösung, sondern eine Grundvoraussetzung sind.
