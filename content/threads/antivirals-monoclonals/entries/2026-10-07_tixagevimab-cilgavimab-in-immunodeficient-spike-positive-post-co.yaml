en:
  title: 'Tixagevimab/cilgavimab in immunodeficient spike-positive post-COVID ME/CFS: no group-level clinical change'
  plain_summary: In a small German study, nine immunodeficient patients with post-COVID ME/CFS and lingering spike protein received the preventive antibody combination tixagevimab/cilgavimab, showing no group-level clinical improvement after 30 days. Because there was no control treatment group and the study was very small, it does not show that clearing spike protein with antibodies helps ME/CFS.
  detail: A prospective, non-randomized observational pre/post study from Marien Hospital Herne and Ruhr-Universität Bochum investigated the anti-spike monoclonal combination tixagevimab/cilgavimab administered for pre-exposure prophylaxis in 10 immunodeficient patients with post-COVID ME/CFS and persistent circulating spike protein. Nine patients completed baseline and day-30 assessments alongside 11 healthy convalescent controls who served only as a descriptive reference rather than an efficacy comparator. At 30 days, β1-adrenergic receptor (β1-AR) autoantibodies decreased from 26.8 ± 18.2 to 21.2 ± 14.7 U/ml (unadjusted p=0.003), whereas β2-AR and muscarinic M3/M4 autoantibodies remained unchanged, circulating spike declined non-significantly from a median of 63 to 26 pg/ml (p=0.63), and no group-level clinical improvement was detected. The report is limited by a small sample size, single-arm open design, short 30-day follow-up, and no adverse-event reporting in the abstract. These exploratory
    findings link to related work on GPCR autoantibodies in post-COVID cohorts by the same Bochum research group covered in [Autoimmunity & Autoantibodies](thread:autoimmunity-autoantibodies), but they do not establish that persistent spike protein is disease-causing or that monoclonal therapy provides clinical benefit in ME/CFS.
de:
  title: 'Tixagevimab/Cilgavimab bei immungeschwächtem, Spike-positivem Post-COVID-ME/CFS: keine klinische Veränderung auf Gruppenebene'
  plain_summary: In einer kleinen deutschen Studie erhielten neun immungeschwächte Betroffene mit Post-COVID-ME/CFS und nachweisbarem Spike-Protein die Antikörperkombination Tixagevimab/Cilgavimab, zeigten nach 30 Tagen aber auf Gruppenebene keine klinische Besserung. Wegen der winzigen Fallzahl und fehlender Vergleichsgruppe belegt die Untersuchung keinen klinischen Nutzen dieser Antikörpertherapie bei ME/CFS.
  detail: Eine prospektive, nicht-randomisierte Vorher-Nachher-Beobachtungsstudie des Marien Hospitals Herne und der Ruhr-Universität Bochum untersuchte die zur Präexpositionsprophylaxe verabreichte Anti-Spike-Antikörperkombination Tixagevimab/Cilgavimab bei 10 immungeschwächten Patientinnen und Patienten mit Post-COVID-ME/CFS und anhaltend zirkulierendem Spike-Protein. Neun Personen schlossen die Untersuchungen zu Beginn und an Tag 30 ab, begleitet von 11 gesunden genesenen Kontrollen, die lediglich als deskriptive Referenz und nicht als Wirksamkeitsvergleich dienten. Nach 30 Tagen sanken Autoantikörper gegen den β1-adrenergen Rezeptor (β1-AR) von 26,8 ± 18,2 auf 21,2 ± 14,7 U/ml (unbereinigtes p=0,003), während β2-AR- und muskarinische M3/M4-Autoantikörper unverändert blieben, das zirkulierende Spike-Protein nicht signifikant von im Median 63 auf 26 pg/ml fiel (p=0,63) und auf Gruppenebene keine klinische Besserung festgestellt wurde. Die Aussagekraft wird durch die geringe Fallzahl, das
    einarmige offene Design, die kurze 30-tägige Nachbeobachtung und fehlende Angaben zu unerwünschten Ereignissen im Abstract begrenzt. Diese explorativen Befunde knüpfen an verwandte Arbeiten zu GPCR-Autoantikörpern bei Post-COVID-Kohorten derselben Bochumer Arbeitsgruppe an, die unter [Autoimmunität & Autoantikörper](thread:autoimmunity-autoantibodies) behandelt werden, belegen jedoch weder, dass zirkulierendes Spike-Protein krankheitsursächlich ist, noch dass monoklonale Antikörper bei ME/CFS klinisch helfen.
