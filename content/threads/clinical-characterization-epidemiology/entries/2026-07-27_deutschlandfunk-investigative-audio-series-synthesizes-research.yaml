en:
  title: Deutschlandfunk investigative audio series synthesizes research acceleration and trial pipelines in ME/CFS
  plain_summary: A Deutschlandfunk radio documentary summarized current ME/CFS research leads—including DecodeME genetics, muscle ion pumps, small blood vessels, and trial bottlenecks—based on expert interviews. It is a journalistic overview rather than new scientific data.
  detail: Part 2 of Deutschlandfunk's investigative science radio feature ('Wissenschaft im Brennpunkt') synthesized current biomedical research progress across international research groups. The broadcast detailed emerging pathophysiological models—including DecodeME genetic findings, sodium-potassium pump dysfunction, microvascular impairment, and autoantibody-mediated vascular damage—while profiling off-label trial pipelines such as daratumumab. Featuring expert commentary from leading researchers, the feature outlined key bottlenecks in European research funding and clinical trial infrastructure. While providing high-signal public science synthesis, the broadcast remains a journalistic media report rather than a peer-reviewed empirical scientific publication.
de:
  title: Deutschlandfunk-Radioreihe bündelt Forschungsfortschritte und Studienpipeline bei ME/CFS
  plain_summary: Ein Deutschlandfunk-Radiofeature fasste aktuelle ME/CFS-Forschungsansätze – darunter DecodeME-Genetik, Muskel-Ionenpumpen, Gefäßstörungen und Engpässe bei klinischen Studien – anhand von Experteninterviews zusammen. Es handelt sich um einen journalistischen Überblick und keine neue Fachstudie.
  detail: Teil 2 der investigativen Deutschlandfunk-Wissenschaftssendung („Wissenschaft im Brennpunkt“) fasste aktuelle biomedizinische Forschungsfortschritte internationaler Gruppen zusammen. Der Beitrag stellte aufkommende Pathomechanismen vor – darunter genetische Befunde aus DecodeME, Dysfunktion der Natrium-Kalium-Pumpe, mikrovaskuläre Beeinträchtigungen und autoantikörpervermittelte Gefäßschäden – und beleuchtete Off-Label-Studienansätze wie Daratumumab. Gestützt auf Expertenkommentare führender Forschender skizzierte die Sendung zentrale Engpässe bei europäischer Forschungsförderung und Studieninfrastruktur. Trotz hoher journalistischer Informationsdichte bleibt der Beitrag eine Medienberichterstattung und keine begutachtete empirische Publikation.
