en:
  title: Multimodal MRI with controlled hypoxia finds blunted thalamic lactate response in ME/CFS
  plain_summary: In a non-peer-reviewed preprint of 53 people, ME/CFS patients had higher baseline lactate in the thalamus and failed to boost it during a brief low-oxygen challenge, suggesting exhausted brain energy reserve. Because the study is small, excluded severe patients, and used a risky provocation test, it is a research lead rather than a diagnostic test or treatment.
  detail: A proof-of-concept multimodal 3T MRI study posted on medRxiv by Bader and colleagues evaluated in vivo neurovascular and neurometabolic responses to experimental physiological stress in 26 patients with Canadian Consensus Criteria-defined ME/CFS and 27 matched healthy controls. Under baseline normoxia, structural volumetry revealed significantly reduced normalized brainstem volume, while multivoxel proton magnetic resonance spectroscopy (1H-MRS) demonstrated elevated thalamic lactate-to-creatine ratios in ME/CFS patients. Crucially, during controlled normobaric hypoxic challenges (SpO2 87 ± 3%), patients failed to mount the normal physiological compensatory increase in thalamic lactate seen in healthy controls, indicating an exhausted neurometabolic reserve accompanied by heightened cerebral blood flow variability on arterial spin labeling and exaggerated inverse coupling between thalamic total N-acetylaspartate and white-matter perfusion. These findings provide direct in vivo
    proof-of-concept evidence for the "virtual hypoxia" hypothesis, demonstrating that baseline metabolic strain and blunted adaptive reserve under physiological challenge connect central nervous system changes to mechanisms in [Vascular Endothelial Dysfunction & Microclots](thread:vascular-endothelial-microclots) and [Mitochondrial & Metabolic Dysfunction](thread:mitochondrial-metabolic-dysfunction). However, the study is an un-peer-reviewed preprint with a modest sample size that requires prospective multi-center replication, and the demanding in-scanner breathing protocol excluded severe and bedbound patients. Additionally, controlled normobaric hypoxia is a monitored research-only provocation tool carrying post-exertional symptom flare risks, not a diagnostic test or self-administrable intervention.
de:
  title: Multimodale MRT unter kontrollierter Hypoxie findet abgeflachte thalamische Laktatantwort bei ME/CFS
  plain_summary: In einem noch nicht begutachteten Preprint mit 53 Personen hatten ME/CFS-Betroffene bereits in Ruhe erhöhtes Laktat im Thalamus und konnten es bei kurzem Sauerstoffmangel nicht mehr hochregeln – ein Hinweis auf eine erschöpfte Energiereserve. Da die Studie klein war, Schwerbetroffene ausschloss und eine belastende Provokation nutzte, ist dies ein Forschungsansatz, kein Test oder gar eine Therapie.
  detail: Eine von Bader und Kolleginnen und Kollegen auf medRxiv veröffentlichte Proof-of-Concept-Studie mittels multimodaler 3T-MRT untersuchte neurovaskuläre und neurometabolische Reaktionen in vivo unter experimenteller physiologischer Belastung bei 26 Patientinnen und Patienten mit nach den Kanadischen Konsenskriterien definiertem ME/CFS und 27 gematchten gesunden Kontrollen. Unter normaler Sauerstoffversorgung im Ausgangszustand zeigte die strukturelle Volumetrie ein signifikant verringertes normalisiertes Hirnstammvolumen, während die Multivoxel-Protonen-Magnetresonanzspektroskopie (1H-MRS) erhöhte thalamische Laktat-zu-Kreatin-Verhältnisse bei ME/CFS-Betroffenen nachwies. Entscheidend ist, dass Patientinnen und Patienten während kontrollierter normobarer Hypoxie-Belastungen (SpO2 87 ± 3 %) den normalen physiologischen kompensatorischen Anstieg des thalamischen Laktats, der bei gesunden Kontrollen auftrat, nicht aufbringen konnten – ein Hinweis auf eine erschöpfte neurometabolische
    Reserve, begleitet von erhöhter Variabilität der Hirndurchblutung im Arterial Spin Labeling und einer übersteigerten inversen Kopplung zwischen thalamischem Gesamt-N-Acetylaspartat und Perfusion der weißen Substanz. Diese Befunde liefern direkte In-vivo-Proof-of-Concept-Evidenz für die Hypothese der „virtuellen Hypoxie“ und zeigen, dass basale Stoffwechselbelastung und abgeflachte Anpassungsreserve unter physiologischer Herausforderung Veränderungen des zentralen Nervensystems mit Mechanismen in [Vaskuläre Endotheldysfunktion & Mikrogerinnsel](thread:vascular-endothelial-microclots) sowie [Mitochondrien & Zellstoffwechsel](thread:mitochondrial-metabolic-dysfunction) verknüpfen. Allerdings ist die Studie ein noch nicht begutachteter Preprint mit moderater Stichprobengröße, der eine prospektive multizentrische Replikation erfordert, und das anspruchsvolle Atemprotokoll im Scanner schloss schwer betroffene und bettlägerige Patientinnen und Patienten aus. Zudem ist kontrollierte normobare
    Hypoxie ein überwachtes reines Forschungswerkzeug mit dem Risiko postexertionaler Symptomschübe und kein Diagnosetest oder eine zur Selbstanwendung geeignete Intervention.
