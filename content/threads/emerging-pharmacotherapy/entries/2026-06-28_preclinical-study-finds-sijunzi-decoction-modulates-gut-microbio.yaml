en:
  title: Preclinical study finds Sijunzi decoction modulates gut microbiota and metabolic profiles in chronic fatigue syndrome rats
  plain_summary: In fatigued rats, a 30-day course of the traditional Chinese herbal blend Sijunzi Decoction improved swim time, gut motility, and muscle energy markers alongside gut bacteria changes. Because this was a rat study of an unstandardized herb mix, it does not prove clinical safety or benefit in humans.
  detail: A study published in the *Journal of Chromatography B* by Shan et al. evaluated the traditional herbal formulation Sijunzi Decoction (SJZD) in a multi-factor stress-induced rat model of chronic fatigue syndrome. Daily administration of SJZD for 30 days improved body weight, gastrointestinal motility, exhaustive swimming time, and skeletal muscle ATPase content, while regulating 25 serum and 7 fecal metabolites and enhancing intestinal microbiota diversity. As a preclinical study in a rodent model, these findings demonstrate biological pathways in animals and do not represent clinical efficacy or safety in humans, and the specific bioactive components of the multi-herb formulation were not isolated.
de:
  title: 'Präklinische Studie zeigt: Sijunzi-Dekokt moduliert Darmmikrobiota und Stoffwechselprofile bei CFS-Ratten'
  plain_summary: Bei erschöpften Ratten verbesserte eine 30-tägige Gabe der traditionellen Kräutermischung Sijunzi-Dekokt Schwimmzeit, Darmbewegung und Muskel-Energiemarker zusammen mit Veränderungen der Darmflora. Da es sich um einen Tierversuch mit einem unstandardisierten Kräutergemisch handelt, belegt dies keinen Nutzen und keine Sicherheit beim Menschen.
  detail: Eine im *Journal of Chromatography B* veröffentlichte Studie von Shan et al. prüfte die traditionelle Kräuterrezeptur Sijunzi-Dekokt (SJZD) in einem durch mehrfachen Stress ausgelösten Rattenmodell des chronischen Fatigue-Syndroms. Eine tägliche Gabe von SJZD über 30 Tage verbesserte Körpergewicht, Magen-Darm-Motilität, Schwimmzeit bis zur Erschöpfung sowie den ATPase-Gehalt im Skelettmuskel und regulierte dabei 25 Serum- und 7 Stuhlmetaboliten bei erhöhter Vielfalt der Darmmikrobiota. Als präklinische Studie an Nagern zeigen diese Ergebnisse biologische Signalwege im Tiermodell, belegen aber weder klinische Wirksamkeit noch Sicherheit beim Menschen; zudem wurden die einzelnen bioaktiven Bestandteile der Mehrkräuter-Mischung nicht isoliert.
