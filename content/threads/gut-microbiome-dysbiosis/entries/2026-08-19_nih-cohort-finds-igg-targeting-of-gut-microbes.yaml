en:
  title: NIH cohort finds IgG targeting of gut microbes enriched for stress pathways without gross translocation
  plain_summary: In a small NIH study of 35 people, post-infectious ME/CFS patients did not show widespread bacteria leaking into the bloodstream, though antibodies targeted gut bacteria predicted to be under stress. Because the group was small and relied on computer predictions and hospital visits, it refines gut-immune ideas rather than providing a test or treatment.
  detail: In a cross-sectional translational study of the NIH intramural cohort, McCauley et al. analyzed mucosal immune interactions with the gut microbiota in 16 deeply adjudicated individuals with post-infectious ME/CFS (PI-ME/CFS) and 19 healthy volunteers using fluorescence-activated cell sorting and 16S rRNA gene sequencing of immunoglobulin G-bound (IgG+) and unbound fecal bacteria. Contrary to simple models of widespread intestinal barrier breakdown, the authors observed limited evidence of gross microbial translocation into peripheral circulation, while pre-sort microbiota composition closely mirrored the IgG-positive fraction and revealed elevated IgG targeting across 11 taxa in PI-ME/CFS (principally members of _Lachnospiraceae_, _Eggerthellaceae_, and _Ruminococcaceae_) compared with 9 in controls. Computational pathway inference via PICRUSt2 indicated that IgG-targeted bacteria in PI-ME/CFS were enriched for prokaryotic stress and defense mechanisms; however, these reflect bioinformatic
    predictions from 16S rRNA gene sequences rather than direct measurements of microbial gene expression or metabolic function. These data refine the mucosal dysbiosis hypothesis by suggesting that gut involvement in post-infectious illness may be driven by localized immune-microbe tension and bacterial stress adaptation rather than overt systemic bacterial leakage. The cross-sectional design and modest cohort size (n=16 vs n=19) preclude causal conclusions, the post-infectious criteria may not generalize across all ME/CFS phenotypes, and severe or bedbound patient inclusion was not specifically reported while the protocol's inpatient participation requirements likely limited access for severely affected individuals.
de:
  title: NIH-Kohorte findet auf Stresssignalwege angereicherte IgG-Bindung an Darmmikroben ohne grobe Translokation
  plain_summary: In einer kleinen NIH-Studie mit 35 Personen zeigten Betroffene mit postinfektiösem ME/CFS keine massiven Bakterienübertritte ins Blut, wohl aber Antikörper gegen Darmbakterien mit rechnerisch vorhergesagten Stress-Genen. Da die Gruppe klein war und auf Modellrechnungen sowie Klinikbesuchen beruhte, verfeinert dies die Darm-Immun-Hypothese, liefert aber noch keinen Test und keine Therapie.
  detail: In einer translationalen Querschnittsstudie der NIH-Intramural-Kohorte analysierten McCauley et al. mukosale Immuninteraktionen mit der Darmmikrobiota bei 16 sorgfältig charakterisierten Personen mit postinfektiösem ME/CFS (PI-ME/CFS) und 19 gesunden Freiwilligen mittels fluoreszenzaktivierter Zellsortierung und 16S-rRNA-Gensequenzierung Immunglobulin-G-gebundener (IgG+) und ungebundener Stuhlbakterien. Entgegen einfachen Modellen eines breiten Zusammenbruchs der Darmbarriere beobachteten die Autorinnen und Autoren nur begrenzte Hinweise auf eine grobe mikrobielle Translokation in den peripheren Blutkreislauf; zugleich spiegelte die Mikrobiota-Zusammensetzung vor der Sortierung die IgG-positive Fraktion eng wider und zeigte eine erhöhte IgG-Bindung an 11 Taxa bei PI-ME/CFS (vorwiegend Vertreter von _Lachnospiraceae_, _Eggerthellaceae_ und _Ruminococcaceae_) gegenüber 9 bei Kontrollen. Rechnerische Signalweg-Vorhersagen mittels PICRUSt2 deuteten darauf hin, dass IgG-gebundene Bakterien
    bei PI-ME/CFS für prokaryotische Stress- und Abwehrmechanismen angereichert waren; hierbei handelt es sich jedoch um bioinformatische Ableitungen aus 16S-rRNA-Gensequenzen und nicht um direkte Messungen mikrobieller Genexpression oder Stoffwechselfunktion. Diese Daten verfeinern die Hypothese der mukosalen Dysbiose dahingehend, dass eine Darmbeteiligung bei postinfektiöser Erkrankung eher durch lokale Immun-Mikroben-Spannungen und bakterielle Stressanpassung als durch offenen systemischen Bakterienübertritt getrieben sein könnte. Das Querschnittsdesign und die geringe Kohortengröße (n=16 vs. n=19) schließen kausale Folgerungen aus; zudem sind die postinfektiösen Kriterien möglicherweise nicht auf alle ME/CFS-Phänotypen übertragbar, und der Einschluss schwer betroffener oder bettlägeriger Personen wurde nicht gesondert berichtet, während die stationäre Studienteilnahme schwer Erkrankten den Zugang vermutlich erschwerte.
