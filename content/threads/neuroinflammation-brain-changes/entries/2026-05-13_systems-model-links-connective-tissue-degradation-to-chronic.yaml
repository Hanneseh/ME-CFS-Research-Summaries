en:
  title: Systems model links connective tissue degradation to chronic inflammatory loops
  plain_summary: A non-peer-reviewed theoretical preprint proposes a cycle in which loose ligaments, mast-cell enzymes, and low tissue oxygen further weaken connective tissue and neck stability. This offers a hypothesis for why hypermobility and POTS often overlap with ME/CFS, but the enzyme pathways have not yet been measured in patient cohorts.
  detail: A theoretical model proposed a bidirectional cycle where preexisting ligament laxity predisposes individuals to orthostatic stress and ME/CFS, while ME/CFS-associated pathophysiological processes further degrade connective tissues. The hypothesis suggests that chronic mast cell activation releases enzymes (tryptase and chymase) that activate collagen-degrading metalloproteinases. Simultaneously, local tissue hypoxia and oxidative stress inhibit prolyl hydroxylases (PHDs), impairing collagen stability and leading to basement membrane thickening and reduced capillary density. In the neck, this metabolic muscle dysfunction impairs the ability to compensate for lax ligaments, worsening craniocervical instability. While providing a molecular explanation for the high rates of hypermobility and POTS comorbidity, direct measurement of these enzyme and collagen pathways in clinical cohorts is required.
de:
  title: Systemmodell verknüpft Bindegewebsabbau mit chronischen Entzündungsschleifen
  plain_summary: Ein noch nicht begutachtetes theoretisches Preprint beschreibt einen möglichen Kreislauf, in dem Bandlaxität, Mastzell-Enzyme und Sauerstoffmangel im Gewebe das Bindegewebe und die Halsstabilität weiter schwächen. Das liefert eine Hypothese für die häufige Überschneidung von Hypermobilität, POTS und ME/CFS, muss aber in Patientenkohorten erst gemessen werden.
  detail: Ein theoretisches Modell schlug einen bidirektionalen Kreislauf vor, in dem eine vorbestehende Bandlaxität Betroffene für orthostatischen Stress und ME/CFS prädisponiert, während ME/CFS-assoziierte pathophysiologische Prozesse Bindegewebe weiter abbauen. Die Hypothese besagt, dass chronische Mastzellaktivierung Enzyme (Tryptase und Chymase) freisetzt, die kollagenabbauende Metalloproteinasen aktivieren. Gleichzeitig hemmen lokale Gewebehypoxie und oxidativer Stress Prolylhydroxylasen (PHDs), was die Kollagenstabilität beeinträchtigt und zu Basalmembranverdickung sowie verringerter Kapillardichte führt. Im Nacken beeinträchtigt diese metabolische Muskeldysfunktion die Fähigkeit, laxe Bänder zu kompensieren, was eine kraniozervikale Instabilität verschlechtert. Obwohl dies eine molekulare Erklärung für die hohen Raten von Hypermobilität und POTS-Komorbidität bietet, ist eine direkte Messung dieser Enzym- und Kollagenpfade in klinischen Kohorten erforderlich.
