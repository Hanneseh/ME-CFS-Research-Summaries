en:
  title: German BMFTR launches interdisciplinary funding call for PAIS and ME/CFS pathomechanism research
  plain_summary: Germany's federal research ministry (BMFTR) opened a funding call for interdisciplinary consortia studying the biological causes of post-infectious syndromes and ME/CFS, explicitly encouraging inclusion of housebound and severely ill patients. This is a grant call with outlines due in January 2027, so no funded projects or research results exist yet.
  detail: Under Germany's National Decade against Post-Infectious Diseases (NDPE), the Federal Ministry of Research, Technology and Space (BMFTR) announced a two-stage funding call for interdisciplinary research consortia investigating the molecular pathomechanisms of post-acute infection syndromes (PAIS), placing Long/Post-COVID and post-infectious ME/CFS at the center while permitting other infectious triggers. Eligible projects span mechanistic basic research, biomarker identification, preclinical therapeutic approaches, disease models, and systems-biology or data-driven studies grounded in experimentally testable hypotheses with prior supporting evidence (see [Diagnostics & Biomarkers](thread:diagnostics-biomarkers)). Proposals must use comprehensive clinical phenotyping—citing Canadian Consensus Criteria (CCC) and IOM criteria for ME/CFS—build on existing datasets, registries, and biobanks wherever possible, and make generated data reusable for follow-on research. Notably, the guideline explicitly calls for efforts to include severely affected, housebound patients—allowing project budgets to cover additional outreach-research costs—and requires meaningful patient involvement at all relevant levels (see [Severe ME/CFS Care](thread:severe-mecfs-care)). Project outlines (Projektskizzen) are due by 2027-01-27 before selected consortia submit formal applications; as a funding announcement only, it produces no clinical or biological data yet, and real-world impact will depend on grant selection, budget allocation, and study execution.
de:
  title: BMFTR startet interdisziplinäre Fördermaßnahme zur Pathomechanismus-Forschung bei PAIS und ME/CFS
  plain_summary: Das Bundesforschungsministerium (BMFTR) hat eine neue Fördermaßnahme für interdisziplinäre Verbünde zu den biologischen Ursachen postinfektiöser Erkrankungen und ME/CFS ausgeschrieben und ermutigt ausdrücklich zur Einbindung schwerstbetroffener, hausgebundener Patientinnen und Patienten. Es handelt sich um eine Ausschreibung mit Skizzenfrist im Januar 2027 – bewilligte Projekte oder Forschungsergebnisse liegen noch nicht vor.
  detail: Im Rahmen der Nationalen Dekade gegen Postinfektiöse Erkrankungen (NDPE) hat das Bundesministerium für Forschung, Technologie und Raumfahrt (BMFTR) eine zweistufige Fördermaßnahme für interdisziplinäre Forschungsverbünde zu den molekularen Pathomechanismen postakuter Infektionssyndrome (PAIS) ausgeschrieben, mit Schwerpunkt auf Long-/Post-COVID und postinfektiösem ME/CFS sowie Offenheit für weitere Erreger. Förderfähig sind mechanistische Grundlagenforschung, Biomarker-Identifikation, präklinische Therapieansätze, Krankheitsmodelle sowie systembiologische oder datenbasierte Ansätze auf Grundlage experimentell überprüfbarer Hypothesen mit bereits belastbaren Vorbefunden (siehe [Diagnostik & Biomarker](thread:diagnostics-biomarkers)). Die Vorhaben sollen eine umfassende klinische Phänotypisierung – etwa anhand der Kanadischen Konsenskriterien (CCC) oder IOM-Kriterien bei ME/CFS – sicherstellen, bestehende Datensätze, Register und Biobanken gezielt einbinden und generierte Daten nachhaltig nachnutzbar machen. Bemerkenswert ist der ausdrückliche Hinweis, dass schwerstbetroffene, hausgebundene Patientinnen und Patienten einbezogen werden sollten – Mehrkosten aufsuchender Forschung können über das Projektbudget abgedeckt werden – und dass die Betroffenenperspektive auf allen relevanten Ebenen verbindlich darzustellen ist (siehe [Versorgung bei schwerem ME/CFS](thread:severe-mecfs-care)). Projektskizzen sind bis zum 27.01.2027 einzureichen, bevor ausgewählte Verbünde förmliche Anträge stellen; als reine Förderausschreibung liefert die Meldung noch keine Forschungs- oder Patientenergebnisse, und die Wirkung hängt von Auswahl, Mittelvolumen und Umsetzung ab.
