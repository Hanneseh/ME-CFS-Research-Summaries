en:
  title: Cohen Center updates detail pilot trial results of microtesla magnetic therapy and antiviral combination protocol
  plain_summary: Conference updates from Mount Sinai reported feasibility for a small home magnetic-therapy pilot and symptom improvements in an unblinded 26-patient antiviral series. However, the later peer-reviewed magnetic-therapy paper showed no cognitive benefit after statistical correction, and open-label case series cannot prove drug efficacy.
  detail: At the Internationale ME/CFS-Konferenz 2026, clinical trial updates from the Cohen Center for Recovery from Complex Chronic Illness at Mount Sinai were presented. The updates included positive safety and feasibility results from a completed 30-participant, triple-blind, randomized controlled trial of Fareon's "Mighty" home-use microtesla magnetic therapy (MMT) device, showing exploratory cognitive speed benefits. Additionally, case series data for 26 patients treated with the "Prigen protocol" (combining valacyclovir, celecoxib, and a 15-day course of Paxlovid) showed durable symptomatic improvements on the Patient Global Impression of Change up to two years post-treatment. These preliminary signals offer feasibility data for home-based magnetic therapy and long-term antiviral/anti-inflammatory combination therapies, supporting planned larger validation trials. However, these are preliminary conference reports rather than peer-reviewed papers. The MMT trial was a very small pilot
    (n=30) requiring larger replication, and the Prigen protocol data are based on an open-label, non-randomized case series (n=26) subject to selection and placebo biases. The magnetic-therapy pilot was published on 2026-09-28 in Brain Communications (33 randomized, 30 analysed, feasibility as primary endpoint); the paper names the device "Fareon Restore", and whether it is the same product as the conference-reported "Mighty" is unconfirmed. In the paper no cognitive outcome remained significant after false-discovery-rate correction, so the conference-reported cognitive-speed signal should not be read as a benefit; see [Emerging Pharmacotherapy](thread:emerging-pharmacotherapy) for the full study.
de:
  title: Cohen-Center-Updates berichten Pilotstudienergebnisse zu Mikrotesla-Magnettherapie und antiviraler Kombinationsbehandlung
  plain_summary: Konferenzberichte vom Mount Sinai zeigten Machbarkeit in einer kleinen Pilotstudie zur häuslichen Magnetfeldtherapie sowie Besserungen in einer offenen antiviralen Fallserie mit 26 Personen. In der später begutachteten Fachpublikation zur Magnettherapie blieb nach statistischer Korrektur jedoch kein kognitiver Nutzen bestehen, und offene Fallserien belegen keine Wirksamkeit.
  detail: 'Auf der Internationalen ME/CFS-Konferenz 2026 wurden klinische Studienupdates des Cohen Center for Recovery from Complex Chronic Illness am Mount Sinai vorgestellt. Dazu zählten positive Sicherheits- und Machbarkeitsergebnisse aus einer abgeschlossenen dreifach verblindeten, randomisierten kontrollierten Pilotstudie mit 30 Teilnehmenden zu Fareons häuslichem Mikrotesla-Magnettherapie-Gerät (MMT) „Mighty“ mit explorativen Vorteilen bei der kognitiven Verarbeitungsgeschwindigkeit. Zudem zeigten Fallseriendaten von 26 Patientinnen und Patienten unter dem „Prigen-Protokoll“ (Kombination aus Valaciclovir, Celecoxib und einer 15-tägigen Paxlovid-Gabe) anhaltende symptomatische Verbesserungen auf der Skala Patient Global Impression of Change bis zu zwei Jahre nach Behandlung. Diese vorläufigen Signale liefern Machbarkeitsdaten für häusliche Magnettherapie und kombinierte antivirale/entzündungshemmende Ansätze zur Vorbereitung größerer Validierungsstudien. Es handelt sich jedoch um vorläufige
    Konferenzberichte statt begutachteter Vollpublikationen: Die MMT-Studie war ein sehr kleiner Pilotversuch (n=30), und die Prigen-Daten stammen aus einer offenen, nicht randomisierten Fallserie (n=26), die anfällig für Selektions- und Placeboeffekte ist. Die Magnettherapie-Pilotstudie erschien am 28.09.2026 in Brain Communications (33 randomisiert, 30 ausgewertet, Machbarkeit als primärer Endpunkt); dort heißt das Gerät „Fareon Restore“, und ob es mit dem auf der Konferenz genannten „Mighty“ identisch ist, bleibt unbestätigt. In der Publikation blieb nach False-Discovery-Rate-Korrektur kein kognitiver Endpunkt signifikant, sodass das auf der Konferenz berichtete Signal zur Verarbeitungsgeschwindigkeit nicht als Nutzen gewertet werden darf; für die vollständige Studie siehe [Neue Arzneistoffe & Therapieansätze](thread:emerging-pharmacotherapy).'
