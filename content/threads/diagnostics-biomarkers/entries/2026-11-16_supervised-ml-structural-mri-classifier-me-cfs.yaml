en:
  title: Supervised machine learning on structural brain MRI separates ME/CFS from healthy controls in internal cross-validation
  plain_summary: A Griffith University study trained machine-learning models on structural 3T brain MRI scans from 106 ME/CFS patients and 67 healthy controls, reaching an AUC of 0.86 in internal cross-validation. Because the models were never tested on an independent clinic cohort or against other chronic illnesses—and bedbound patients cannot easily undergo MRI scans—this remains an exploratory research signal rather than a diagnostic test.
  detail: "In an exploratory cross-sectional study accepted in *Frontiers in Neurology*, Huynh, Barnden, Thapaliya, and colleagues at Griffith University's National Centre for Neuroimmunology and Emerging Diseases evaluated five supervised machine-learning algorithms (Decision Tree, Random Forest, Gradient Boosting Decision Tree, Logistic Regression, and Support Vector Machine) using 3T structural MRI brain features from 173 participants (106 ME/CFS, mean age 45.1 years; 67 healthy controls, mean age 39.9 years). Combining cortical volume, surface area, and thickness features yielded the strongest classification across held-out folds of 10-fold internal cross-validation: Support Vector Machine achieved a mean accuracy of 0.79 (95% CI 0.72–0.87), an F1 score of 0.83 (95% CI 0.74–0.91), and an AUC of 0.86 (95% CI 0.78–0.94), while Logistic Regression reached a mean accuracy of 0.77 (95% CI 0.68–0.87), an F1 score of 0.79 (95% CI 0.69–0.89), and an AUC of 0.86 (95% CI 0.77–0.95). While these results add to evidence of measurable structural brain differences on group-level neuroimaging (see [Neuroinflammation & Brain Changes](thread:neuroinflammation-brain-changes)), performance was assessed solely via internal cross-validation within a single dataset, with no independent external test set or multi-scanner replication. The study also included only healthy controls rather than clinically overlapping disease controls (such as fibromyalgia, depression, or multiple sclerosis), leaving diagnostic specificity untested, and the groups differed by about five years in mean age (a potential confounder). Finally, 3T MRI requires travel and tolerating loud scanner environments, systematically excluding bedbound and very severe ME/CFS patients, and the article was available as a provisionally accepted Frontiers manuscript awaiting final formatted publication."
de:
  title: Überwachtes maschinelles Lernen auf strukturellen Hirn-MRT-Daten trennt ME/CFS in interner Kreuzvalidierung von Gesunden
  plain_summary: Eine Studie der Griffith University trainierte Machine-Learning-Modelle auf strukturellen 3T-Hirn-MRT-Aufnahmen von 106 ME/CFS-Betroffenen und 67 gesunden Kontrollen und erreichte in der internen Kreuzvalidierung eine AUC von 0,86. Da die Modelle weder an einer unabhängigen Kohorte noch gegen andere chronische Erkrankungen geprüft wurden – und bettlägerige Betroffene kaum MRT-Untersuchungen durchlaufen können –, bleibt dies ein exploratives Forschungssignal und kein Diagnosetest.
  detail: "In einer explorativen Querschnittsstudie, angenommen in *Frontiers in Neurology*, prüften Huynh, Barnden, Thapaliya und Kolleginnen am National Centre for Neuroimmunology and Emerging Diseases der Griffith University fünf überwachte Machine-Learning-Algorithmen (Entscheidungsbaum, Random Forest, Gradient Boosting, logistische Regression und Support Vector Machine) auf Basis struktureller 3T-MRT-Hirnmerkmale von 173 Teilnehmenden (106 mit ME/CFS, mittleres Alter 45,1 Jahre; 67 gesunde Kontrollen, mittleres Alter 39,9 Jahre). Die Kombination aus kortikalem Volumen, Oberfläche und Dicke erzielte in den Test-Folds der 10-fachen internen Kreuzvalidierung die beste Trennleistung: Die Support Vector Machine erreichte eine mittlere Genauigkeit von 0,79 (95%-KI 0,72–0,87), einen F1-Score von 0,83 (95%-KI 0,74–0,91) und eine AUC von 0,86 (95%-KI 0,78–0,94); die logistische Regression kam auf eine mittlere Genauigkeit von 0,77 (95%-KI 0,68–0,87), einen F1-Score von 0,79 (95%-KI 0,69–0,89) und ebenfalls eine AUC von 0,86 (95%-KI 0,77–0,95). Die Ergebnisse stützen Hinweise auf messbare strukturelle Hirnveränderungen auf Gruppenebene (siehe [Neuroinflammation & Gehirnveränderungen](thread:neuroinflammation-brain-changes)), wurden jedoch ausschließlich per interner Kreuzvalidierung innerhalb eines einzelnen Datensatzes ohne unabhängige externe Validierung oder Mehrgeräte-Replikation bewertet. Zudem fehlten klinisch überlappende Krankheitskontrollen (etwa Fibromyalgie, Depression oder Multiple Sklerose), sodass die Spezifität für ME/CFS ungeprüft bleibt, und die Gruppen unterschieden sich im mittleren Alter um rund fünf Jahre (ein möglicher Störfaktor). Schließlich erfordern 3T-MRT-Aufnahmen Anfahrt und die Toleranz lauter Scannerumgebungen, was bettlägerige und sehr schwer erkrankte Menschen systematisch ausschließt; der Artikel lag zudem erst als vorläufig angenommene Fassung vor."
