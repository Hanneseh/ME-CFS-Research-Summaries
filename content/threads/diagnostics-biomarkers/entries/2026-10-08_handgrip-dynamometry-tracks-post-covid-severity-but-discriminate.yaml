en:
  title: Handgrip dynamometry tracks post-COVID severity but discriminates ME/CFS poorly
  plain_summary: In 102 post-COVID patients, those meeting ME/CFS criteria had weaker handgrip force and poorer 60-minute recovery, tracking overall symptom severity. However, the overlap between groups was too large for grip strength to diagnose ME/CFS on its own, and bedbound patients were excluded.
  detail: In a prospective observational study published in *Scientific Reports*, Wallraven and colleagues evaluated digital handgrip dynamometry in 102 post-COVID syndrome (PCS) patients, with 62 of 101 classifiable participants meeting Canadian Consensus Criteria for ME/CFS, as a secondary analysis of the Technical University of Munich 'All Eyes on PCS' cohort (NCT05635552)—the same cohort as the 2026-08-19 retinal study in [Vascular, Endothelial & Microclots](thread:vascular-endothelial-microclots). Participants completed two sessions of 10 maximal contractions separated by 60 minutes; the ME/CFS subgroup showed significantly lower mean force (*p* = 0.031), accelerated fatigability (*p* = 0.042), and poorer delayed recovery (*p* = 0.048) than non-ME/CFS PCS patients, with strength metrics correlating modestly with clinical severity scales (PCS severity score, C19-YRS, and FSS, *r* ≈ −0.30 to −0.36). However, discriminatory accuracy between PCS patients with and without ME/CFS was poor
    (AUC 0.61–0.63), demonstrating that dynamometry captures functional impairment rather than serving as a standalone diagnostic biomarker. The authors caution that patients with pathological measurements may require adapted rehabilitation because unadapted muscle training could pose a risk, though this represents clinical caution rather than a validated triage rule, and exploratory associations with ICAM-1, VEGF, and platelets suggest possible microvascular involvement. Key limitations include an ambulatory, single-center sample that excluded bedbound patients, a between-session learning effect, an empirically set recovery cutoff, and absence of multi-day PEM tracking, while possible overlap with the 102-patient Wunderle handgrip preprint (2026-06-12) in [Mitochondrial & Metabolic Dysfunction](thread:mitochondrial-metabolic-dysfunction) remains unconfirmed, so independent replication should not be assumed. The 2026-07-15 Mihatsch and 2026-07-24 Steinkirchner entries describe other cohorts;
    see also [Post-Exertional Malaise & Exercise Physiology](thread:pem-exercise-physiology).
de:
  title: Handkraft-Dynamometrie bildet Post-COVID-Schweregrad ab, trennt ME/CFS jedoch schwach
  plain_summary: In einer Gruppe von 102 Post-COVID-Betroffenen zeigten Personen mit ME/CFS-Kriterien geringere Handkraft und schlechtere Erholung nach 60 Minuten, was mit dem Schweregrad zusammenhing. Die Überschneidung zwischen den Gruppen war jedoch zu groß für eine verlässliche ME/CFS-Diagnose, und bettlägerige Patientinnen und Patienten waren ausgeschlossen.
  detail: In einer prospektiven Beobachtungsstudie in *Scientific Reports* untersuchten Wallraven und Kolleginnen die digitale Handkraft-Dynamometrie bei 102 Post-COVID-Syndrom-(PCS)-Patientinnen und -Patienten, von denen 62 von 101 klassifizierbaren Teilnehmenden die Kanadischen Konsenskriterien für ME/CFS erfüllten – als Sekundäranalyse der Münchner TU-Kohorte „All Eyes on PCS“ (NCT05635552), derselben Kohorte wie die Netzhautstudie vom 2026-08-19 in [Vaskuläre, endotheliale Dysfunktion & Mikrogerinnsel](thread:vascular-endothelial-microclots). Die Teilnehmenden absolvierten zwei Durchgänge mit je zehn Maximalkontraktionen im Abstand von 60 Minuten; die ME/CFS-Untergruppe zeigte eine signifikant geringere mittlere Kraft (*p* = 0,031), schnellere Ermüdbarkeit (*p* = 0,042) und schlechtere verzögerte Erholung (*p* = 0,048) als PCS-Betroffene ohne ME/CFS, wobei die Kraftwerte moderat mit klinischen Schweregradskalen (PCS-Score, C19-YRS und FSS, *r* ≈ −0,30 bis −0,36) korrelierten. Die diagnostische
    Trennschärfe zwischen PCS mit und ohne ME/CFS war jedoch schwach (AUC 0,61–0,63), was zeigt, dass Dynamometrie funktionelle Einschränkungen erfasst, aber keinen eigenständigen diagnostischen Biomarker darstellt. Die Autoren weisen vorsorglich darauf hin, dass pathologische Messwerte eine angepasste Rehabilitation nahelegen könnten, da unangepasstes Muskeltraining Risiken birgt – dies ist jedoch klinische Vorsicht und keine validierte Triage-Regel –, und explorative Zusammenhänge mit ICAM-1, VEGF und Thrombozyten deuten auf mögliche mikrovaskuläre Beteiligung hin. Wichtige Einschränkungen sind eine ambulante, monozentrische Stichprobe ohne Bettlägerige, ein Lerneffekt zwischen den Sitzungen, ein empirisch gesetzter Erholungs-Grenzwert und fehlende mehrtägige PEM-Verfolgung; eine mögliche Überschneidung mit dem 102-Personen-Wunderle-Handkraft-Preprint (2026-06-12) in [Mitochondriale & metabolische Dysfunktion](thread:mitochondrial-metabolic-dysfunction) ist unbestätigt, sodass keine unabhängige
    Replikation vorausgesetzt werden darf. Die Einträge Mihatsch (2026-07-15) und Steinkirchner (2026-07-24) beschreiben andere Kohorten; siehe auch [Post-Exertional Malaise & Belastungsphysiologie](thread:pem-exercise-physiology).
