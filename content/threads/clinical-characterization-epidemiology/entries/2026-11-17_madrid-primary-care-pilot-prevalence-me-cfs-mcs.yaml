en:
  title: Madrid primary-care pilot estimates 2.26% ME/CFS screening prevalence and substantial overlap with multiple chemical sensitivity
  plain_summary: A Spanish primary-care pilot survey of 280 adults estimated that 2.26% met questionnaire criteria for ME/CFS and half of those also met criteria for multiple chemical sensitivity. Because only about half of those who agreed to take part completed the questionnaires and no medical exam confirmed diagnoses, the true population rate may be lower.
  detail: |-
    Researchers in the Community of Madrid, Spain, conducted a cross-sectional primary-care pilot study (published in Spanish, within a planned 2,000-person two-stage cluster survey of adult primary-care nursing panels) to estimate the prevalence of ME/CFS and multiple chemical sensitivity (MCS) using the DSQ-SF, SF-36, and QEESI questionnaires. In the Western Primary Care Directorate pilot, 530 adults agreed to participate and 280 (52.8%) completed screening. Questionnaire-based prevalence estimates reached 2.26% for ME/CFS (roughly six screen-positive individuals) and 2.64% for MCS, with half of ME/CFS screen-positive respondents also meeting MCS criteria (1.13% dual-condition prevalence). The authors note that these figures substantially exceed rare-disease thresholds and reflect social invisibility and diagnostic variability. Key methodological limitations include the small pilot sample (n=280), substantial non-response (47.2% did not complete screening, which can inflate prevalence if symptomatic people are more likely to respond), reliance on self-report screening tools without clinical examination to exclude mimicking conditions, and lack of reported severity stratification for housebound or bedbound adults. Larger completed phases with clinical verification are needed before drawing firm national prevalence estimates.
de:
  title: Pilotstudie in der Primärversorgung in Madrid schätzt 2,26 % ME/CFS-Screening-Prävalenz und deutliche Überschneidung mit MCS
  plain_summary: Eine spanische Pilotbefragung von 280 Erwachsenen in der Primärversorgung ergab, dass 2,26 % die Fragebogenkriterien für ME/CFS erfüllten und die Hälfte davon zugleich Kriterien für Multiple Chemikalien-Sensitivität. Da nur gut die Hälfte der Zustimmenden die Fragebögen abschloss und keine ärztliche Bestätigung erfolgte, liegt die tatsächliche Häufigkeit möglicherweise niedriger.
  detail: |-
    Forschende in der Region Madrid führten im Rahmen einer geplanten zweistufigen Cluster-Erhebung mit 2.000 Erwachsenen aus den Patientenlisten von Pflegefachkräften in der Primärversorgung eine (auf Spanisch veröffentlichte) Querschnitts-Pilotstudie zur Häufigkeit von ME/CFS und Multipler Chemikalien-Sensitivität (MCS) mithilfe der Fragebögen DSQ-SF, SF-36 und QEESI durch. In der Pilotregion (Westliche Primärversorgungsdirektion) stimmten 530 Erwachsene der Teilnahme zu, von denen 280 (52,8 %) das Screening vollständig ausfüllten. Die fragebogenbasierten Prävalenzschätzungen lagen bei 2,26 % für ME/CFS (rund sechs screening-positive Personen) und 2,64 % für MCS; die Hälfte der im ME/CFS-Screening positiven Personen erfüllte zugleich die MCS-Kriterien, was einer Doppelprävalenz von 1,13 % entspricht. Die Autorinnen und Autoren betonen, dass die geschätzten Raten deutlich über der Schwelle seltener Erkrankungen liegen und gesellschaftliche Unsichtbarkeit sowie diagnostische Uneinheitlichkeit widerspiegeln. Zentrale methodische Grenzen sind die kleine Pilotstichprobe (n=280), die hohe Nicht-Rücklaufquote von 47,2 % (die zu einer Überschätzung führen kann, wenn Betroffene eher teilnehmen), die rein fragebogenbasierte Falldefinition ohne ärztliche Differentialdiagnostik sowie fehlende Angaben zum Anteil hausgebundener oder bettlägeriger Personen. Belastbare Bevölkerungszahlen erfordern die abgeschlossene Hauptstudie mit klinischer Überprüfung.
