en:
  title: Hyperbaric Oxygen Therapy (HBOT)
  subtitle: A living thread on hyperbaric oxygen therapy, clinical trials, prospective registries, neuroimaging findings, and safety signals in ME/CFS, Fibromyalgia, and Long COVID.
  evidence_label: early clinical and mechanistic validation
  plain_summary: This thread follows research on hyperbaric oxygen therapy (HBOT)—breathing pure oxygen inside a pressurized chamber—for ME/CFS, Long COVID, and fibromyalgia. Some open-label cohorts and registries report improvements in fatigue, pain, and brain connectivity on MRI scans, especially after 40 sessions, yet a real-world Dutch registry also documented significant worsening in 13–19% of Long COVID patients. Because almost no sham-controlled trials exist and daily chamber visits can exhaust patients prone to PEM, it remains unproven whether HBOT works beyond placebo or is safe for severely affected individuals.
  takeaway: |-
    Hyperbaric Oxygen Therapy (HBOT) is an intervention that involves breathing pure oxygen in a pressurized chamber, which increases blood oxygenation and tissue perfusion. In Myalgic Encephalomyelitis/Chronic Fatigue Syndrome (ME/CFS), Fibromyalgia, and Long COVID, clinical trials, prospective registries, and neuroimaging studies explore whether HBOT can alleviate core symptoms like fatigue, chronic pain, and cognitive dysfunction. The scientific rationale for HBOT centers on its potential to reverse tissue hypoxia, reduce neuroinflammation, and restore functional brain connectivity.

    Recent research has advanced the field by providing both larger real-world registry data and objective neuroimaging correlates. A systematic review in fibromyalgia confirmed pain-relief benefits from early trials, while a large-scale Long COVID registry reported quality-of-life improvements in about 60% of patients. Most recently, a prospective cohort study and conference updates in ME/CFS linked clinical improvements to the normalization of baseline thalamic functional hyperconnectivity using fMRI, suggesting a specific central nervous system mechanism and indicating that a 40-session protocol is superior to a 20-session protocol, though responses remain heterogeneous and physical gains declined for the overall cohort by month 11.

    However, the state of the evidence remains early and characterized by significant uncertainty. All major clinical findings are derived from systematic reviews of small trials, uncontrolled registries, or small prospective cohorts without a sham-control group. Because intensive daily protocols can be physically exhausting, there is a documented risk of clinical deterioration in a subset of patients, particularly those prone to post-exertional malaise (PEM). Large-scale, randomized, double-blind sham-controlled trials are urgently needed to establish true efficacy and standardized, safe protocols.
  why_it_matters: HBOT is a highly sought-after, expensive, and intensive intervention that is currently being accessed off-label by patients. Understanding the research helps balance potential clinical benefits—such as cognitive improvement and physical functional gains—against real-world safety signals of clinical worsening, which is particularly hazardous for patients with post-exertional malaise (PEM). Furthermore, functional MRI (fMRI) data provides a measurable biological marker (thalamic connectivity) that links patient-reported improvements to objective brain changes, moving the clinical conversation beyond subjective questionnaires.
  state_of_evidence:
  - status: established
    label: Established
    items:
    - Standard daily HBOT protocols carry a high patient burden, and mild barotrauma (ear pressure issues) is the most common reversible side effect across clinical cohorts.
  - status: plausible
    label: Plausible but early
    items:
    - HBOT may improve pain, fatigue, and cognitive function in fibromyalgia, Long COVID, and ME/CFS; a 40-session protocol appears superior to 20 sessions for physical functional gains and pain relief; clinical response is associated with fMRI normalization of baseline thalamic hyperconnectivity.
  - status: not_established
    label: Not established
    items:
    - True clinical efficacy of HBOT (differentiating active treatment from sham/placebo effects) in post-infectious cohorts; long-term durability of clinical benefit beyond 11 months.
  - status: limitations
    label: Key limitations
    items:
    - Most clinical studies are small, observational, and lack a sham-treatment control group, which is crucial due to high placebo susceptibility; prospective registries and off-label access exhibit selection bias due to self-funding; demanding protocols can trigger post-exertional malaise (PEM) or clinical worsening; severely affected, homebound patients are excluded from trial designs, limiting generalizability; clinical response is highly heterogeneous, with overall cohort physical function gains declining by month 11.
  open_questions: []
de:
  title: Hyperbare Sauerstofftherapie (HBOT)
  subtitle: Ein fortlaufender Überblick über hyperbare Sauerstofftherapie, klinische Studien, prospektive Register, Bildgebungsbefunde und Sicherheitssignale bei ME/CFS, Fibromyalgie und Long COVID.
  evidence_label: frühe klinische und mechanistische Hinweise
  plain_summary: Dieser Bereich untersucht die hyperbare Sauerstofftherapie (HBOT) – das Einatmen von reinem Sauerstoff in einer Druckkammer – bei ME/CFS, Long COVID und Fibromyalgie. Einzelne offene Studien und Register berichten Verbesserungen bei Fatigue, Schmerzen und Hirnvernetzung im MRT, vor allem nach 40 Sitzungen; gleichzeitig zeigte ein niederländisches Register bei 13–19 % der Long-COVID-Betroffenen eine deutliche Verschlechterung. Da belastbare schein-kontrollierte Studien fehlen und tägliche Druckkammertermine durch Anfahrt und Aufwand PEM auslösen können, sind Wirksamkeit und Sicherheit – gerade für schwer Betroffene – bislang nicht belegt.
  takeaway: |-
    Die hyperbare Sauerstofftherapie (HBOT) besteht im Einatmen von reinem Sauerstoff in einer Überdruckkammer, wodurch die Sauerstoffkonzentration im Blut und die Gewebedurchblutung erhöht werden. Bei Myalgischer Enzephalomyelitis/Chronischem Fatigue-Syndrom (ME/CFS), Fibromyalgie und Long COVID prüfen klinische Studien, prospektive Register und Bildgebungsarbeiten, ob HBOT Kernsymptome wie Fatigue, chronische Schmerzen und kognitive Störungen lindern kann. Wissenschaftlich gründet der Ansatz auf der Annahme, dass HBOT Gewebehypoxie ausgleicht, Neuroinflammation dämpft und die funktionelle Hirnkonnektivität normalisiert.

    Neuere Forschung lieferte sowohl größere Versorgungsdaten aus Registern als auch objektive MRT-Korrelate. Eine systematische Übersichtsarbeit zur Fibromyalgie bestätigte schmerzlindernde Effekte aus frühen Studien, während ein großes Long-COVID-Register bei rund 60 % der Behandelten Verbesserungen der Lebensqualität verzeichnete. Zuletzt verknüpften eine prospektive Kohortenstudie und Konferenzberichte bei ME/CFS klinische Besserungen mit der Normalisierung einer zuvor erhöhten thalamischen Konnektivität im funktionellen MRT (fMRT) – was auf einen spezifischen Mechanismus im zentralen Nervensystem hinweist und nahelegt, dass ein Protokoll mit 40 Sitzungen einem kürzeren mit 20 Sitzungen überlegen ist; allerdings blieben die Reaktionen heterogen, und körperliche Zugewinne nahmen bis Monat 11 in der Gesamtkohorte wieder ab.

    Dennoch bleibt die Evidenzlage früh und von erheblicher Unsicherheit geprägt. Alle größeren klinischen Befunde stammen aus Übersichtsarbeiten kleiner Studien, unkontrollierten Registern oder kleinen prospektiven Kohorten ohne schein-kontrollierte Vergleichsgruppe. Da intensive tägliche Sitzungen körperlich stark belasten können, ist zudem das Risiko einer klinischen Verschlechterung bei einem Teil der Betroffenen belegt, insbesondere bei Anfälligkeit für Post-Exertional Malaise (PEM). Große, randomisierte, doppelt verblindete und schein-kontrollierte Studien sind dringend nötig, um die tatsächliche Wirksamkeit sowie sichere, standardisierte Protokolle zu klären.
  why_it_matters: HBOT ist eine stark nachgefragte, kostspielige und zeitintensive Behandlung, die Betroffene zunehmend auf eigene Kosten Off-Label in Anspruch nehmen. Eine nüchterne Auswertung der Studien hilft, mögliche Vorteile – etwa bei Kognition oder körperlicher Belastbarkeit – gegen reale Sicherheitssignale einer Zustandsverschlechterung abzuwägen, die bei Post-Exertional Malaise (PEM) besonders riskant ist. Zudem liefern fMRT-Daten einen messbaren biologischen Marker (thalamische Konnektivität), der subjektive Berichte mit objektiven Hirnveränderungen verknüpft und die Diskussion über reine Fragebögen hinausführt.
  state_of_evidence:
  - status: established
    label: Gesichert
    items:
    - Standardisierte tägliche HBOT-Protokolle bedeuten eine hohe Belastung für Patientinnen und Patienten; ein leichtes, reversibles Barotrauma (Druckprobleme an den Ohren) ist in klinischen Kohorten die häufigste Nebenwirkung.
  - status: plausible
    label: Plausibel, aber früh
    items:
    - HBOT könnte Schmerzen, Fatigue und kognitive Funktionen bei Fibromyalgie, Long COVID und ME/CFS bessern; ein Protokoll mit 40 Sitzungen erscheint für anhaltende Verbesserungen von körperlicher Funktion und Schmerzen wirksamer als 20 Sitzungen; klinisches Ansprechen geht im fMRT mit einer Normalisierung erhöhter thalamischer Hyperkonnektivität einher.
  - status: not_established
    label: Nicht belegt
    items:
    - Tatsächliche klinische Wirksamkeit von HBOT (Abgrenzung eines echten Behandlungseffekts gegenüber Schein-/Placeboeffekten) in postinfektiösen Kohorten; langfristige Beständigkeit eines Nutzens über 11 Monate hinaus.
  - status: limitations
    label: Wesentliche Einschränkungen
    items:
    - Die meisten klinischen Studien sind klein, beobachtend und haben keine schein-kontrollierte Vergleichsgruppe, was angesichts hoher Placeboanfälligkeit entscheidend ist; Register- und Off-Label-Daten unterliegen durch Selbstfinanzierung einer starken Selektionsverzerrung; fordernde Protokolle können PEM oder eine Verschlechterung auslösen; schwer betroffene, hausgebundene Menschen sind ausgeschlossen, was die Übertragbarkeit begrenzt; das Ansprechen ist sehr heterogen, und körperliche Funktionsgewinne nahmen in der Gesamtkohorte bis Monat 11 wieder ab.
  open_questions: []
