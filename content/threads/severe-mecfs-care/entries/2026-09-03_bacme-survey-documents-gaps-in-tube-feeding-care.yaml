en:
  title: BACME survey documents gaps in tube-feeding care for ME/CFS
  plain_summary: A UK survey by BACME (up to 75 respondents) documented major gaps in tube-feeding care, including limited dietitian access and hospital discharge delays when setting up home feeding. As a small, self-selected survey without a control group, it highlights service shortcomings rather than testing which feeding strategies work best.
  detail: 'The British Association of Clinicians in ME/CFS (BACME), a UK professional body, published a non-peer-reviewed report on an online survey of patients, carers and clinicians about tube feeding. People with tube-feeding experience, including people with severe ME/CFS, helped design the questions alongside dietetic clinicians. The survey ran for 8 weeks in August–October 2025. Of 105 responses started, at most 75 had completed questions (28 patients, 21 carers, 26 clinicians), so results are given as counts. Only 7 of 20 patients had been under a dietitian''s care for more than 4 weeks before feeding began. Of 21, 15 started tube feeding in hospital and continued at home, and 9 of 20 said problems arranging home feeding delayed discharge. The report names ME/CFS-specific adaptations: orthostatic intolerance versus standard head-elevated positioning, hospital visits to change tubes, pump noise and alarms, and managing suppliers. The sample was self-selected and uncontrolled, and severity
    was not reported. The report documents care gaps and does not show that any feeding approach works. BACME plans ME/CFS nutrition guidance but gives no timeline.'
de:
  title: BACME-Umfrage dokumentiert Versorgungslücken bei Sondenernährung bei ME/CFS
  plain_summary: Eine britische Umfrage von BACME (bis zu 75 Ausfüllende) dokumentierte deutliche Lücken bei der Sondenernährung – etwa späte ernährungsmedizinische Begleitung und verzögerte Klinikentlassungen bei der Organisation zu Hause. Als kleine, selbstselektierte Befragung ohne Kontrollgruppe zeigt sie Versorgungsdefizite auf, belegt aber keine Überlegenheit bestimmter Ernährungsstrategien.
  detail: 'Die British Association of Clinicians in ME/CFS (BACME), ein britischer Fachverband, veröffentlichte einen nicht begutachteten Bericht über eine Online-Umfrage unter Betroffenen, Angehörigen und Fachkräften zum Thema Sondenernährung. Menschen mit Erfahrung in Sondenernährung – einschließlich schwer an ME/CFS Erkrankter – halfen gemeinsam mit Ernährungstherapeutinnen und -therapeuten bei der Gestaltung des Fragebogens. Die Umfrage lief acht Wochen lang von August bis Oktober 2025. Von 105 begonnenen Teilnahmen enthielten höchstens 75 vollständig beantwortete Fragen (28 Betroffene, 21 Angehörige, 26 Fachkräfte), sodass die Ergebnisse als absolute Zahlen angegeben werden. Nur 7 von 20 Patientinnen und Patienten wurden vor Beginn der Sondenernährung länger als vier Wochen ernährungstherapeutisch betreut. Von 21 Personen begannen 15 die Sondenernährung im Krankenhaus und führten sie zu Hause fort, und 9 von 20 gaben an, dass Probleme bei der Organisation der häuslichen Versorgung die
    Entlassung verzögerten. Der Bericht nennt ME/CFS-spezifische Anpassungsprobleme: orthostatische Intoleranz im Konflikt mit der üblichen Oberkörper-Hochlagerung, Klinikfahrten zum Sondenwechsel, Geräusche und Alarme der Pumpen sowie die Koordination von Lieferanten. Die Stichprobe war selbstselektiert und unkontrolliert, und der Krankheitsschweregrad wurde nicht erfasst. Der Bericht dokumentiert Versorgungslücken, zeigt aber nicht, welche Ernährungsform wirksam ist. BACME plant eine eigene Ernährungsleitlinie für ME/CFS, nennt dafür jedoch keinen Zeitplan.'
