en:
  title: 7T MRS study details divergent central metabolite signatures between ME/CFS and Long COVID
  plain_summary: Ultra-high-field brain scans of 73 people found higher resting lactate in a brain region in ME/CFS and lower choline in Long COVID, while resting calf-muscle energy markers looked normal in both. These group-level scan differences generate biological leads, not a diagnostic test.
  detail: A 7-Tesla magnetic resonance spectroscopy (MRS) study by Godlewska and colleagues evaluated resting neurochemistry and muscle metabolism across 24 individuals with ME/CFS, 25 with Long COVID, and 24 healthy controls. In the brain, ME/CFS participants demonstrated significantly elevated lactate concentrations in the pregenual and dorsal anterior cingulate cortex (pgACC and dACC), whereas Long COVID participants exhibited reduced choline in the dorsal anterior cingulate cortex, a neurochemical measure related to membrane turnover rather than energy supply. In contrast to these central alterations, resting calf muscle metabolite levels showed no significant differences among the three groups. These findings indicate distinct localized central metabolite profiles, but they reflect MRS differences rather than direct proof of neuroinflammation or primary mitochondrial causality. The resting cingulate lactate elevation is also anatomically distinct from a later visual-cortex study that
    found no baseline difference but a load-dependent rise during stimulation. Inclusion of severe or bedbound patients was not reported, and high-field 7T neuroimaging imposes substantial physical burdens, requiring travel to specialized scanning facilities and tolerance of supine scanner immobility. Consequently, these observations serve as hypothesis-generating mechanistic distinctions rather than validated diagnostic biomarkers.
de:
  title: 7T-MRS-Studie beschreibt unterschiedliche zentrale Metabolitensignaturen zwischen ME/CFS und Long COVID
  plain_summary: Ultrahochfeld-Hirnscans bei 73 Personen zeigten bei ME/CFS erhöhtes Ruhelaktat im vorderen Gyrus cinguli und bei Long COVID erniedrigtes Cholin, während ruhende Wadenmuskel-Metabolite unauffällig blieben. Diese Gruppenunterschiede liefern mechanistische Ansatzpunkte, aber keinen Diagnosetest.
  detail: Eine 7-Tesla-Magnetresonanzspektroskopie-(MRS-)Studie von Godlewska und Kolleginnen und Kollegen untersuchte die Neurochemie im Ruhezustand sowie den Muskelstoffwechsel bei 24 Personen mit ME/CFS, 25 mit Long COVID und 24 gesunden Kontrollen. Im Gehirn zeigten ME/CFS-Teilnehmende signifikant erhöhte Laktatkonzentrationen im prägenualen und dorsalen anterioren cingulären Kortex (pgACC und dACC), während Long-COVID-Teilnehmende ein verringertes Cholin im dorsalen anterioren cingulären Kortex aufwiesen – ein neurochemisches Maß, das eher mit Membranumsatz als mit Energieversorgung zusammenhängt. Im Gegensatz zu diesen zentralen Veränderungen zeigten die Metabolitenspiegel in der ruhenden Wadenmuskulatur keine signifikanten Unterschiede zwischen den drei Gruppen. Diese Befunde weisen auf unterschiedliche, regional begrenzte zentrale Metabolitenprofile hin, stellen jedoch MRS-Unterschiede dar und keinen direkten Beleg für Neuroinflammation oder eine primäre mitochondriale Kausalität.
    Die erhöhte Laktatkonzentration im Ruhecortex unterscheidet sich anatomisch auch von einer späteren Studie zum visuellen Kortex, die keinen Ausgangsunterschied, sondern einen belastungsabhängigen Anstieg unter Stimulation fand. Ein Einschluss schwer Betroffener oder Bettlägeriger wurde nicht berichtet, und die Hochfeld-7T-Bildgebung ist körperlich stark belastend, da sie die Anreise zu spezialisierten Zentren und ruhiges Liegen im Scanner erfordert. Folglich dienen diese Beobachtungen als hypothesengenerierende mechanistische Unterscheidungen und nicht als validierte diagnostische Biomarker.
