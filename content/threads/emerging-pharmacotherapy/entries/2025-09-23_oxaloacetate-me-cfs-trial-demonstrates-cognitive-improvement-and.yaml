en:
  title: Oxaloacetate ME/CFS trial demonstrates cognitive improvement and fatigue-cognition coupling
  plain_summary: In a 90-day placebo-controlled trial of 82 ME/CFS patients, 2,000 mg daily of oxaloacetate improved computerized cognitive test scores at day 60, though overall fatigue scores and responder rates did not beat placebo. This leaves oxaloacetate's usefulness for general ME/CFS fatigue unproven.
  detail: A 90-day, randomized, double-blind, placebo-controlled trial of 82 adults with ME/CFS demonstrated that a daily dose of 2,000 mg of oral oxaloacetate significantly improved objective cognitive performance (using DANA Brain Vital) at the 60-day mark compared to a placebo control. The study identified a strong "fatigue–cognition coupling" effect only in the oxaloacetate-treated group, where higher baseline fatigue was strongly associated with reduced cognitive gains, suggesting the drug acts on a biological pathway that links these two core symptoms. Upright activity time (UP Time) also showed a modest increase at the 30-day mark. However, the study did not find statistically significant differences in overall responder rates or general fatigue scores between the treatment and placebo groups. It remains unproven whether oxaloacetate can reliably reduce generalized fatigue or if it is only effective in a specific sub-phenotype of patients with coupled cognitive and metabolic dysfunction.
de:
  title: Oxaloacetat-Studie bei ME/CFS zeigt kognitive Verbesserung und Kopplung von Fatigue und Kognition
  plain_summary: In einer 90-tägigen placebokontrollierten Studie mit 82 ME/CFS-Betroffenen verbesserten täglich 2.000 mg Oxaloacetat an Tag 60 computergestützte Kognitionstests, übertrafen Placebo aber weder bei allgemeinen Fatigue-Scores noch bei den Ansprechraten. Der Nutzen von Oxaloacetat gegen allgemeine Fatigue bei ME/CFS bleibt damit unbewiesen.
  detail: Eine 90-tägige, randomisierte, doppelt verblindete, placebokontrollierte Studie an 82 Erwachsenen mit ME/CFS zeigte, dass eine tägliche Dosis von 2.000 mg oralem Oxaloacetat die objektive kognitive Leistung (gemessen mit DANA Brain Vital) nach 60 Tagen im Vergleich zu Placebo signifikant verbesserte. Die Untersuchung stellte zudem ausschließlich in der Oxaloacetat-Gruppe eine ausgeprägte „Fatigue-Kognitions-Kopplung“ fest, bei der höhere Ausgangs-Fatigue mit geringeren kognitiven Zugewinnen zusammenhing – ein Hinweis auf einen biologischen Signalweg, der beide Kernsymptome verbindet. Die aufrechte Aktivitätszeit (UP Time) stieg an Tag 30 leicht an. Allerdings fanden sich keine statistisch signifikanten Unterschiede zwischen Wirkstoff- und Placebogruppe bei allgemeinen Ansprechraten oder Gesamt-Fatigue-Scores; es bleibt unbewiesen, ob Oxaloacetat allgemeine Fatigue zuverlässig senkt oder nur einer spezifischen Untergruppe mit gekoppelter kognitiv-metabolischer Störung hilft.
