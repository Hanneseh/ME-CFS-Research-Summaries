en:
  title: Comparative analysis demonstrates a shared autonomic phenotype of preload failure, SFN, and cerebral hypoperfusion
  plain_summary: A retrospective study of 143 Long COVID and 170 ME/CFS patients found nearly identical rates of low brain blood flow (~90%), poor heart blood return (>92%), and small-fiber nerve damage. It reinforces strong overlap between both illnesses, though it cannot pinpoint the initial trigger.
  detail: A retrospective study comparing 143 Long COVID patients and 170 ME/CFS patients confirmed that the two conditions share a near-identical physiological autonomic phenotype. The researchers found reduced cerebral blood flow in approximately 90% of both groups, widespread autonomic failure in over 89%, small fiber neuropathy in a majority, and preload failure during exercise in over 92% of patients. This provides strong physiological evidence supporting the hypothesis that Long COVID and ME/CFS exist on the same disease spectrum. The findings indicate that standard blood panels cannot distinguish the conditions, necessitating functional autonomic and exercise testing. However, the retrospective design limits the ability to track the onset of these changes, and the study does not identify the primary molecular triggers driving the vascular and nerve damage.
de:
  title: Vergleichsanalyse belegt gemeinsames autonomes Profil aus Preload-Versagen, SFN und Hirnminderdurchblutung
  plain_summary: Eine Rückblick-Studie mit 143 Long-COVID- und 170 ME/CFS-Betroffenen fand nahezu identische Raten an verminderter Hirndurchblutung (~90 %), Preload-Versagen (>92 %) und Small-Fiber-Neuropathie. Was diese Gefäß- und Nervenschäden ursprünglich auslöst, bleibt noch offen.
  detail: Eine retrospektive Studie, die 143 Long-COVID- und 170 ME/CFS-Patientinnen und -Patienten verglich, bestätigte, dass beide Erkrankungen ein nahezu identisches physiologisches Autonomieprofil teilen. Die Forschenden fanden bei rund 90 % beider Gruppen eine verminderte Hirndurchblutung, bei über 89 % ausgeprägte autonome Störungen, bei der Mehrheit eine Small-Fiber-Neuropathie sowie bei über 92 % ein Preload-Versagen unter Belastung. Dies liefert starke physiologische Belege dafür, dass Long COVID und ME/CFS auf demselben Krankheitsspektrum liegen. Die Befunde zeigen zudem, dass übliche Standard-Blutwerte diese Störungen nicht erfassen, sodass funktionelle Autonomie- und Belastungstests nötig sind. Das retrospektive Design schränkt jedoch die zeitliche Rückverfolgung des Krankheitsbeginns ein, und die Studie identifiziert noch nicht die primären molekularen Auslöser der Gefäß- und Nervenschäden.
