en:
  title: Melbourne study finds slower processing speed and greater psychosocial burden in adolescents with mild-to-moderate ME/CFS
  plain_summary: In a small Melbourne study of 25 adolescents with mild-to-moderate ME/CFS and 25 healthy peers, the ME/CFS group had slower thinking speed, poorer sleep, and higher distress. Because severe and bedbound teens were excluded and in-person tests were required, the findings reflect only milder ambulatory youth.
  detail: Chau and colleagues compared 25 adolescents with mild-to-moderate ME/CFS with 25 healthy controls aged 10–19 years in Melbourne, using self-report questionnaires, caregiver ratings, and in-person cognitive testing. The ME/CFS group had significantly slower information processing speed, while other measures of intellectual functioning did not differ consistently. Adolescents with ME/CFS also reported poorer sleep and quality of life and more anxiety and depression; caregivers reported attention and working-memory concerns but no group difference in internalising behaviours, and adolescent and caregiver ratings did not always agree. The authors call for flexible, paced accommodations at school and in clinical care. This is a small, single-site, cross-sectional study, and the abstract does not report effect sizes, diagnostic criteria, or whether testing triggered PEM. Severe and bedbound adolescents were excluded by design, and an in-person test battery may be too demanding for them.
    The findings describe cognitive and psychosocial burden, not brain pathology.
de:
  title: Melbourner Studie findet langsamere Verarbeitungsgeschwindigkeit und höhere psychosoziale Belastung bei Jugendlichen mit mildem bis moderatem ME/CFS
  plain_summary: In einer kleinen Melbourner Studie mit 25 Jugendlichen mit mildem bis moderatem ME/CFS und 25 gesunden Gleichaltrigen zeigte die ME/CFS-Gruppe ein langsameres Denktempo, schlechteren Schlaf und höhere psychische Belastung. Da schwer kranke und bettlägerige Jugendliche wegen der Vor-Ort-Tests ausgeschlossen waren, gelten die Ergebnisse nur für mobilere Verläufe.
  detail: Chau und Kolleginnen und Kollegen verglichen in Melbourne 25 Jugendliche mit mildem bis moderatem ME/CFS mit 25 gesunden Gleichaltrigen im Alter von 10–19 Jahren anhand von Selbstberichts-Fragebögen, Einschätzungen der Bezugspersonen und kognitiven Präsenztests. Die ME/CFS-Gruppe wies eine signifikant langsamere Informationsverarbeitungsgeschwindigkeit auf, während andere Intelligenzmaße nicht konsistent abwichen. Jugendliche mit ME/CFS berichteten zudem schlechteren Schlaf, geringere Lebensqualität sowie mehr Angst und Depressivität; Bezugspersonen nannten Aufmerksamkeits- und Arbeitsgedächtnisprobleme, aber keinen Gruppenunterschied bei internalisierendem Verhalten, wobei sich Selbst- und Fremdeinschätzungen nicht immer deckten. Die Autorinnen und Autoren fordern flexible, gepacte Anpassungen in Schule und Versorgung. Die kleine monozentrische Querschnittsstudie nennt im Abstract weder Effektstärken noch Diagnosekriterien oder mögliche PEM-Auslösung durch die Tests; schwer Betroffene
    und Bettlägerige waren ausgeschlossen. Die Ergebnisse beschreiben kognitive und psychosoziale Belastung, keine Hirnpathologie.
